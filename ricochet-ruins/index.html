function offers(){let pool=[];R.orbs.filter(o=>o.l<5).forEach(o=>pool.push({kind:'orb',k:o.k,l:o.l+1}));if(R.orbs.length<4)for(let k=1;k<9;k++)if(!R.orbs.some(o=>o.k===k))pool.push({kind:'orb',k,l:1});pool.push({kind:'power'},{kind:'rate'},{kind:'heal'},{kind:'crit'},{kind:'speed'});const fs=fusionReady();const picks=fs.length?[{kind:'fusion',recipe:fs[0]}]:[];while(picks.length<3&&pool.length){const i=Math.floor(rnd()*pool.length);picks.push(pool.splice(i,1)[0])}return picks}
function showUpgrade(){choiceList=offers();R.phase='upgrade';R.choices=choiceList;save();upgradeScreen()}
function option(o){if(o.kind==='orb')return{title:ORB[o.k][0],desc:ORB[o.k][2]+(o.l>1?' Damage increases with level.':''),tag:o.l===1?'NEW ELEMENT':'LEVEL '+o.l,img:RuinsArt.orb(o.k)};if(o.kind==='fusion'){const [a,b,k]=o.recipe;return{title:ORB[k][0],desc:ORB[a][0]+' + '+ORB[b][0]+'. '+ORB[k][2],tag:'FUSION · FREES A SLOT',img:RuinsArt.orb(k)}}return{title:{power:'Heavy Impact',rate:'Rapid Fire',heal:'Restoration',crit:'Keen Edge',speed:'Swift Boots'}[o.kind],desc:{power:'+20% damage for every ball.',rate:'+16% firing speed.',heal:'Restore 35 health.',crit:'+10% critical hit chance.',speed:'+15% movement speed.'}[o.kind],tag:'PASSIVE',img:RuinsArt.building({power:0,rate:1,heal:3,crit:2,speed:1}[o.kind],1)}}
function upgradeScreen(){choiceList=R.choices;modal(`<div class="subtitle">LEVEL ${R.level}</div><h1>Choose your power</h1><div class="choices">${choiceList.map((o,i)=>{const p=option(o);return`<button class="choice" data-up="${i}"><img alt="" src="${RuinsArt.url(p.img)}"><h3>${p.title}</h3><p>${p.desc}</p><small>${p.tag}</small></button>`}).join('')}</div><div class="buttons"><button id="reroll" ${R.rerolls?'':'disabled'}>Reroll · ${R.rerolls}</button></div>`);document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>apply(choiceList[+b.dataset.up]));bind('#reroll',()=>{R.rerolls--;R.choices=offers();save();upgradeScreen()})}
function apply(o){if(o.kind==='orb'){const v=R.orbs.find(a=>a.k===o.k);if(v)v.l=o.l;else R.orbs.push({k:o.k,l:1})}else if(o.kind==='fusion'){const [a,b,k]=o.recipe;R.orbs=R.orbs.filter(o=>o.k!==a&&o.k!==b);R.orbs.push({k,l:1});R.fusions.push(k);banner(ORB[k][0].toUpperCase()+' FUSED!');sound(12,'level')}else if(o.kind==='power')R.power+=.2;else if(o.kind==='rate')R.rate+=.16;else if(o.kind==='crit')R.crit=Math.min(.8,R.crit+.1);else if(o.kind==='speed')R.speed+=.15;else R.hp=Math.min(R.maxhp,R.hp+35);R.phase='fight';delete R.choices;close();sound(5,'level');save();hud()}
function waveCleared(){const boss=R.wave%4===0;modal(`<div class="subtitle">${boss?'GUARDIAN VANQUISHED':'WAVE CLEARED'}</div><h1>${boss?'Deeper into the ruins':'A moment to breathe'}</h1><p>Wave ${R.wave} · ${R.kills} defeats · ◆ ${R.loot} recovered</p><div class="buttons"><button class="gold" id="deeper">${R.wave===12?'Enter Endless':'Next wave'} →</button><button id="extract">Return to town</button></div><p>${boss?'A new region awaits.':'Your rewards are safe when you return.'}</p>`);bind('#deeper',()=>{R.wave++;R.hp=Math.min(R.maxhp,R.hp+(boss?18:5));R.shots=[];R.balls=[];close();startWave();save()});bind('#extract',()=>endRun(true))}
function endRun(extracted){if(!R||R.paid)return;R.phase='over';M.coins+=R.loot;M.best=Math.max(M.best,R.cleared);R.paid=true;mode='result';save();resultScreen(extracted)}
function resultScreen(extracted=false){modal(`<div class="subtitle">${extracted?'EXPEDITION COMPLETE':'THE RUINS CLAIMED YOU'}</div><h1>◆ ${R.loot} recovered</h1><p>Cleared wave ${R.cleared} · ${R.kills} defeats · Level ${R.level}</p><div class="choices" style="margin:12px 0;grid-template-columns:repeat(${Math.max(1,R.orbs.length)},1fr)">${R.orbs.map(o=>`<div><img style="width:55px;image-rendering:pixelated" src="${RuinsArt.url(RuinsArt.orb(o.k))}"><p>${ORB[o.k][0]} · ${o.l}</p></div>`).join('')}</div><div class="buttons"><button class="gold" id="town">Build the town →</button></div><p>Spend your spoils on permanent upgrades.</p>`);bind('#town',()=>{mode='hub';R=null;save();hub()})}
function hub(){mode='hub';$('#status').textContent='CAMP OF THE FALLEN';modal(`<div class="subtitle">REBUILD · RETURN · RICOCHET</div><h1>RICOCHET RUINS</h1><div class="tag">◆ ${M.coins} · BEST WAVE ${M.best}</div><div class="town"><canvas id="townCanvas"></canvas></div><div class="buildings">${['Forge','Barracks','Observatory','Sanctuary'].map((n,i)=>`<div class="building"><img src="${RuinsArt.url(RuinsArt.building(i,M.build[i]))}" alt=""><div><h3>${n} · ${M.build[i]}</h3><p>${['+12% ball damage','+15 starting health','+12% experience','Heal every 3 seconds'][i]}</p></div><button data-build="${i}" ${M.coins<cost(i)||M.build[i]>=6?'disabled':''}>${M.build[i]>=6?'Max level':'Upgrade ◆ '+cost(i)}</button></div>`).join('')}</div><div class="characterbar" style="margin-top:14px">${CHARACTERS.map((n,i)=>`<button class="${i===M.char?'active':''}" data-char="${i}" ${i&&M.best<(i===1?2:4)?'disabled':''}>${n}${i&&M.best<(i===1?2:4)?' 🔒':''}</button>`).join('')}</div><p id="charDesc">${['Armoured survivor · +20 health','Swift hunter · faster movement and firing','Element master · +18% elemental damage'][M.char]}</p><div class="buttons"><button class="gold" id="dive">Enter the ruins</button><button id="help">How to play</button></div>`);document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{const i=+b.dataset.build;M.coins-=cost(i);M.build[i]++;sound(7,'level');save();hub()});document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{M.char=+b.dataset.char;save();hub()});bind('#dive',newRun);bind('#help',help);drawTown()}
function cost(i){return Math.floor(25*Math.pow(M.build[i]+1,1.55))}
function help(){modal(`<h1>One finger. Many ricochets.</h1><div class="helpgrid"><div><strong>Move & survive</strong><p>Drag your hunter. Balls fire automatically. Catch returning balls to rebound them.</p></div><div><strong>Grow your build</strong><p>Gather blue shards. Choose elements and upgrades when you level up.</p></div><div><strong>Fuse elements</strong><p>Raise both elements to level 3. A fusion choice appears at your next level up.</p></div><div><strong>Keep your rewards</strong><p>Return between waves or after defeat. Rebuild town for permanent bonuses.</p></div></div><p>BURST clears enemy shots and releases a lightning barrage.<br>Flame + Frost = Steam · Flame + Venom = Wildfire<br>Frost + Spark = Blizzard · Vampire + Phantom = Soul</p><div class="buttons"><button class="gold" id="helpBack">Got it</button></div><p>Inspired by BALL x PIT. Redrawn art and a smaller content set.</p>`);bind('#helpBack',()=>mode==='hub'?hub():resume())}
function pause(){if(mode!=='run'||overlay)return;paused=true;modal(`<h1>Paused</h1><p>Wave ${R.wave} · ◆ ${R.loot} · Level ${R.level}</p><div class="choices" style="margin:8px 0">${R.orbs.map(o=>`<div><img style="height:45px;image-rendering:pixelated" src="${RuinsArt.url(RuinsArt.orb(o.k))}"><p>${ORB[o.k][0]} · Level ${o.l}</p></div>`).join('')}</div><div class="buttons"><button class="gold" id="resume">Continue</button><button id="instructions">How to play</button><button id="leave">Return with loot</button></div>`);bind('#resume',resume);bind('#instructions',help);bind('#leave',()=>{paused=false;endRun(true)});save()}function resume(){paused=false;close()}
function hud(){if(!R)return;$('#status').textContent=BIOMES[R.biome];$('#hp').textContent=Math.ceil(R.hp)+' / '+R.maxhp;$('#hpFill').style.width=Math.max(0,R.hp/R.maxhp*100)+'%';$('#wave').textContent='WAVE '+R.wave+(R.wave<=12?' / 12':' · ENDLESS');$('#loot').textContent='◆ '+R.loot;$('#xpFill').style.width=Math.min(100,R.xp/R.nextXP*100)+'%';$('#level').textContent='LV '+R.level;$('#burst').disabled=R.burst>0||overlay;$('#burst small').textContent=R.burst>0?Math.ceil(R.burst)+'s':'BURST';const boss=R.enemies.find(e=>e.boss);$('#bossbar').hidden=!boss;if(boss){$('#bossFill').style.width=Math.max(0,boss.hp/boss.max*100)+'%';$('#bossName').textContent=['THE GATEKEEPER','THE FROST WARDEN','THE ASH KING'][R.biome]}const signature=R.orbs.map(o=>o.k+':'+o.l).join(',');if(signature===loadoutKey)return;loadoutKey=signature;$('#loadout').innerHTML=R.orbs.map(o=>`<button class="orbslot" data-orb="${o.k}" title="${ORB[o.k][0]}: ${ORB[o.k][2]}"><img alt="${ORB[o.k][0]}" src="${RuinsArt.url(RuinsArt.orb(o.k))}"><span>${o.l}</span></button>`).join('');document.querySelectorAll('[data-orb]').forEach(b=>b.onclick=()=>toast(ORB[+b.dataset.orb][0]+': '+ORB[+b.dataset.orb][2]))}
function drawTown(){const c=$('#townCanvas');if(!c)return;c.width=520;c.height=160;const t=c.getContext('2d');t.imageSmoothingEnabled=false;t.fillStyle='#172b30';t.fillRect(0,0,520,160);for(let y=45;y<160;y+=15){t.fillStyle=y%2?'#31473f':'#2b4039';t.fillRect(0,y,520,15)}t.fillStyle='#88917a';t.fillRect(0,117,520,12);for(let x=0;x<520;x+=25){t.fillStyle='#344a42';t.fillRect(x,121,21,1)}for(let i=0;i<4;i++){t.drawImage(RuinsArt.building(i,M.build[i]),40+i*112,44,86,86);t.fillStyle='#cbbb8f';t.font='10px monospace';t.textAlign='center';t.fillText(['FORGE','BARRACKS','OBSERVATORY','SANCTUARY'][i],82+i*112,145)}for(let i=0;i<7;i++){const x=i*79+3;t.fillStyle='#263d35';t.beginPath();t.moveTo(x-16,76);t.lineTo(x,18);t.lineTo(x+19,76);t.fill();t.fillStyle='#557459';for(let j=0;j<4;j++){t.beginPath();t.moveTo(x-12-j*2,36+j*11);t.lineTo(x,21+j*11);t.lineTo(x+13+j*2,36+j*11);t.fill()}t.fillStyle='#927f57';t.fillRect(x-2,66,4,25)}for(let i=0;i<130;i++){t.fillStyle=['#b4b99944','#3a5849','#738564'][i%3];t.fillRect((i*47)%520,90+(i*19)%67,2,1)}t.fillStyle='#b5c7b3';t.fillRect(20,15,2,2);t.fillRect(460,25,2,2)}
function draw(){if(!g)return;if(!bg){bg=document.createElement('canvas');bg.width=W;bg.height=H;RuinsArt.terrain(bg.getContext('2d'),W,H,R?.biome||0,proj)}g.drawImage(bg,0,0);if(!R)return;g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const sprites=[...R.enemies,{player:true,x:R.x,y:R.y}].sort((a,b)=>a.y-b.y);for(const e of sprites){const p=proj(e.x,e.y),size=(e.boss?112:e.player?64:60)*p.s;g.fillStyle='#04101b77';g.beginPath();g.ellipse(p.x,p.y+size*.22,size*.38,size*.12,0,0,7);g.fill();if(e.player){g.globalAlpha=R.inv>0&&Math.floor(R.time*15)%2?.4:1;g.drawImage(RuinsArt.player(M.char,Math.floor(R.time*5)%2),p.x-size/2,p.y-size*.7,size,size);g.globalAlpha=1;g.strokeStyle='#82d2c94d';g.beginPath();g.ellipse(p.x,p.y+8,32*p.s,7*p.s,0,0,7);g.stroke()}else{if(e.hit>0){g.filter='brightness(2.5)'}g.drawImage(RuinsArt.enemy(e.type,R.biome),p.x-size/2,p.y-size*.55,size,size);g.filter='none';if(e.slow>0){g.strokeStyle='#a3dce1';g.strokeRect(p.x-size*.42,p.y-size*.32,size*.83,size*.6)}if(e.burn>0){g.fillStyle='#ffb777';g.fillRect(p.x-4,p.y-10,4,7)}if(e.poison>0){g.fillStyle='#a8da71';g.fillRect(p.x+8,p.y-10,4,7)}if(!e.boss){g.font=`bold ${Math.max(9,Math.round(12*p.s))}px monospace`;g.textAlign='center';g.fillStyle='#edf0c9';g.strokeStyle='#101c22';g.lineWidth=3;g.strokeText(Math.ceil(e.hp),p.x,p.y+size*.23);g.fillText(Math.ceil(e.hp),p.x,p.y+size*.23)}}}for(const gem of R.gems){const p=proj(gem.x,gem.y);g.fillStyle='#a7ebee';g.fillRect(p.x-2,p.y-2,4,4);g.fillStyle='#5aa5bf55';g.fillRect(p.x-5,p.y-5,10,10)}for(const b of R.balls){const p=proj(b.x,b.y),col=ORB[b.k][1];g.strokeStyle=col+'70';g.lineWidth=Math.max(2,b.r*p.s*.8);g.beginPath();g.moveTo(p.x,p.y);const q=proj(b.x-b.vx*.028,b.y-b.vy*.028);g.lineTo(q.x,q.y);g.stroke();g.fillStyle=col;g.beginPath();g.arc(p.x,p.y,Math.max(2,b.r*p.s),0,7);g.fill();g.fillStyle='#fff7d9';g.fillRect(p.x-2,p.y-2,2,2)}for(const s of R.shots){const p=proj(s.x,s.y);g.fillStyle='#f5b282';g.beginPath();g.arc(p.x,p.y,Math.max(3,5*p.s),0,7);g.fill();g.fillStyle='#7d3e5155';g.fillRect(p.x-8,p.y-8,16,16)}for(const a of particles){const p=proj(a.x,a.y);g.globalAlpha=Math.min(1,a.life*3);g.fillStyle=g.strokeStyle=a.col;if(a.line){const q=proj(a.x2,a.y2);g.lineWidth=2;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke()}else if(a.ring){g.lineWidth=4;g.beginPath();g.ellipse(p.x,p.y,a.r*p.s*(1-a.life),a.r*p.s*.5*(1-a.life),0,0,7);g.stroke()}else g.fillRect(p.x,p.y,a.size,a.size)}g.globalAlpha=1;g.textAlign='center';for(const t of texts){const p=proj(t.x,t.y);g.globalAlpha=Math.min(1,t.life*3);g.font=`bold ${Math.max(10,Math.round(14*p.s))}px monospace`;g.fillStyle=t.col;g.strokeStyle='#132031';g.lineWidth=3;g.strokeText(t.t,p.x,p.y);g.fillText(t.t,p.x,p.y)}g.globalAlpha=1;g.restore()}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;if(document.hidden)return;if(!overlay&&!paused){acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}for(const p of particles){p.life-=dt;if(!p.line&&!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt}}particles=particles.filter(p=>p.life>0);for(const t of texts){t.life-=dt;t.y-=dt*27}texts=texts.filter(t=>t.life>0);shake=Math.max(0,shake-dt*12);bannerTimer-=dt;if(bannerTimer<=0)$('#banner').classList.remove('show')}draw()}
function coords(ev){const r=C.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H,sy=(H-92)/690,wy=(y-62)/sy,p=proj(210,wy);return{x:210+(x-W/2)/p.s,y:wy}}
C.addEventListener('pointerdown',e=>{if(overlay||mode!=='run')return;sound();pointer=e.pointerId;C.setPointerCapture(e.pointerId);const p=coords(e);R.tx=p.x;R.ty=p.y});C.addEventListener('pointermove',e=>{if(pointer!==e.pointerId||overlay)return;const p=coords(e);R.tx=p.x;R.ty=p.y});for(const name of ['pointerup','pointercancel','lostpointercapture'])C.addEventListener(name,()=>pointer=null);window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){e.preventDefault();burst()}if(e.code==='Escape')overlay&&paused?resume():pause()});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{keys={};pointer=null});document.addEventListener('visibilitychange',()=>{pointer=null;keys={};last=performance.now();if(document.hidden)save()});bind('#burst',burst);bind('#pause',pause);bind('#sound',()=>{M.muted=!M.muted;$('#sound').textContent=M.muted?'♩':'♪';save();sound()});new ResizeObserver(resize).observe($('#stage'));
try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved?.M){M=saved.M;R=saved.R;mode=saved.mode}}catch{}$('#sound').textContent=M.muted?'♩':'♪';if(R&&mode==='run'){hud();if(R.phase==='upgrade')upgradeScreen();else if(R.phase==='between')waveCleared();else{close();pause()}}else if(mode==='result'&&R)resultScreen();else hub();resize();requestAnimationFrame(frame);
window.Ricochet={state:()=>JSON.parse(JSON.stringify({M,R,mode,overlay,paused})),proj,step:dt=>{for(let i=0;i<Math.ceil(dt*120);i++)update(1/120);draw()},fusionReady};
</script></body></html>
