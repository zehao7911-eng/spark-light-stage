<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4eedc"><title>Pasture Club — A little nudge</title><link rel="stylesheet" href="style.css"></head><body>
<header><button id="album" aria-label="Pasture album">▦</button><div class="brand">PASTURE <b>CLUB</b><small id="title">A little nudge</small></div><button id="sound" aria-label="Toggle sound">♫</button><button id="pause" aria-label="Pause">Ⅱ</button></header>

<div id="overlay" role="dialog" aria-modal="true"><section id="panel"></section></div>
<script src="p5.min.js"></script><script src="engine.js"></script><script src="art.js"></script><script src="app.js"></script></body></html>
