<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#110e22">
  <meta name="description" content="Drop a star into a magical shrine, guide its fall, and discover your fortune. A mobile-ready arcade game.">
  <title>STARFALL SHRINE — A Little Luck, A Little Magic</title>
  <link rel="stylesheet" href="starfall-shrine.css">
</head>
<body>
  <main id="app" class="app" aria-label="Starfall Shrine game">
    <div class="art" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div id="petals" class="petals" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand"><div class="brand-overline">A LITTLE LUCK · A LITTLE MAGIC</div><h1>STARFALL <span>SHRINE</span></h1></div>
      <div class="top-right"><button id="sound" class="sound" aria-label="Toggle sound" title="Toggle sound">♪</button><div class="wallet"><span class="wallet-star">✦</span><span id="wallet">300</span></div></div>
    </header>
    <div class="hud"><span class="hud-pill">NIGHT <b id="night">01</b></span><span id="mood" class="mood">THE SKY IS OPEN</span><span class="hud-pill">BEST <b id="best">0</b></span></div>
    <section id="arena" class="arena" aria-label="Starfall playfield">
      <div class="arena-sheen" aria-hidden="true"></div>
      <canvas id="board" aria-label="Star drop board; tap to release, tap again left or right to nudge"></canvas>
      <div id="tip" class="tip">TAP A LANE TO DROP</div>
      <div id="result" class="result" aria-live="polite"><span id="resultLabel">LUCKY STAR</span><strong id="resultValue">+20</strong></div>
      <div id="nudge" class="nudge" aria-live="polite">NUDGE READY ◇</div>
    </section>
    <div class="mascot" aria-hidden="true"><img src="starfall-shrine-fox.webp" alt=""><div id="foxLine" class="fox-line">Make a wish ✦</div></div>
    <footer class="console">
      <div class="stake-row"><span class="stake-label">STAR COST</span><div id="stakes" class="stakes"><button type="button" data-stake="5">5</button><button type="button" data-stake="10" class="selected">10</button><button type="button" data-stake="25">25</button></div><span id="fever" class="fever">4 TO FEVER</span></div>
      <div class="action-row"><div class="last"><small>LAST DROP</small><strong id="last">—</strong></div><button id="drop" class="drop" type="button"><span id="dropText">DROP STAR</span><span class="drop-icon">✦</span></button></div>
      <div class="hint">TAP TO DROP · TAP AGAIN TO NUDGE</div>
    </footer>
    <div id="flash" class="flash" aria-hidden="true"></div>
    <div id="notice" class="notice" aria-live="polite"></div>
  </main>
  <script src="starfall-shrine.js" defer></script>
</body>
</html>
