function dome(x,z,y){let p=L.palette;block(x,z,y+.25,1.2,1.2,y+.1);for(let i=0;i<12;i++){let a=i*Math.PI/6,b=(i+1)*Math.PI/6;let profile=[[.49,0],[.43,.24],[.28,.48],[.12,.65],[0,.9]];for(let k=0;k<profile.length-1;k++){let [r,h]=profile[k],[rr,hh]=profile[k+1];poly([[x+r*Math.cos(a),z+r*Math.sin(a),y+.25+h],[x+r*Math.cos(b),z+r*Math.sin(b),y+.25+h],[x+rr*Math.cos(b),z+rr*Math.sin(b),y+.25+hh],[x+rr*Math.cos(a),z+rr*Math.sin(a),y+.25+hh]],i<6?p.trim:p.accent)}}}
function avatarFaces(){if(!avatar)return;let n=avatar,walk=anim?.kind==='walk',bob=walk?Math.sin(anim.t*18)*.025:Math.sin(time*2)*.012;let y=n.y+bob;let p1=projection(n.x,n.z,y+.05);faces.push({depth:p1.depth+.3,custom:()=>{ctx.save();ctx.translate(p1.x,p1.y);ctx.fillStyle='#534c652a';ctx.beginPath();ctx.ellipse(0,0,scale*.17,scale*.075,0,0,7);ctx.fill();ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.moveTo(-scale*.14,-scale*.02);ctx.lineTo(-scale*.07,-scale*.4);ctx.lineTo(scale*.07,-scale*.4);ctx.lineTo(scale*.15,-scale*.02);ctx.closePath();ctx.fill();ctx.fillStyle='#eee0d2';ctx.fillRect(-scale*.075,-scale*.5,scale*.15,scale*.1);ctx.fillStyle='#fff9ef';ctx.beginPath();ctx.moveTo(-scale*.18,-scale*.44);ctx.lineTo(0,-scale*.87);ctx.lineTo(scale*.18,-scale*.44);ctx.closePath();ctx.fill();ctx.fillStyle='#66607a';ctx.beginPath();ctx.ellipse(0,-scale*.49,scale*.066,scale*.063,0,0,7);ctx.fill();ctx.restore()}})}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);let p=L.palette;let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,p.bg);grad.addColorStop(1,p.water);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.save();ctx.fillStyle='#ffffff15';for(let i=0;i<7;i++){let y=H*.24+i*H*.12,x=W*.5+Math.sin(i*2.4)*W*.25;ctx.beginPath();ctx.ellipse(x,y,W*.35,H*.018,0,0,7);ctx.fill()}ctx.restore();let ns=M.positions(L,{...S,rot:visual.rot,lift:visual.lift});faces=[];clickAreas=[];
// Soft island shadows and architectural foundations.
ctx.fillStyle='#5e728824';for(let n of ns.filter(n=>n.bridge===undefined)){let s=projection(n.x,n.z,0);ctx.beginPath();ctx.ellipse(s.x+6,s.y+5,scale*.7,scale*.23,0,0,7);ctx.fill()}
for(let n of ns){if(n.bridge!==undefined){block(n.x,n.z,n.y,.97,.97,n.y-.18);trim(n.x,n.z,n.y,.98,.98);if(n.local===0){block(n.x,n.z,n.y-.2,.58,.58,0);door(n.x,n.z,n.y-.35)}}else{let width=n.goal?1.12:1;block(n.x,n.z,n.y,width,width,0);trim(n.x,n.z,n.y,width+.08,width+.08);if(n.y>1.5)door(n.x,n.z,n.y-.15);if(n.lift){for(let y=.25;y<3.8;y+=.35)block(n.x+.44,n.z+.43,y,.1,.1,y-.08,{...p,left:p.accent,right:p.accent,top:p.accent})}if(n.id==='start'){block(n.x,n.z,n.y+.7,1.05,.16,n.y);block(n.x-.46,n.z,n.y+.7,.13,.45,n.y);block(n.x+.46,n.z,n.y+.7,.13,.45,n.y)}if(n.goal){block(n.x-.48,n.z,n.y+.8,.13,.8,n.y);block(n.x+.48,n.z,n.y+.8,.13,.8,n.y);block(n.x,n.z,n.y+.85,1.1,.8,n.y+.7);dome(n.x,n.z,n.y+.9)}if(n.rune!==undefined&&!(S.mask&(1<<n.rune))){let q=projection(n.x,n.z,n.y+.35+Math.sin(time*2+n.rune)*.035);faces.push({depth:q.depth+.5,custom:()=>{ctx.save();ctx.translate(q.x,q.y);ctx.rotate(time*.4);ctx.fillStyle='#fff4b1';ctx.shadowColor='#fffbda';ctx.shadowBlur=15;ctx.beginPath();ctx.moveTo(0,-scale*.12);ctx.lineTo(scale*.08,0);ctx.lineTo(0,scale*.12);ctx.lineTo(-scale*.08,0);ctx.fill();ctx.restore()}})}}
let ps=[[-.48,-.48],[.48,-.48],[.48,.48],[-.48,.48]].map(([x,z])=>projection(n.x+x,n.z+z,n.y+.05));clickAreas.push({id:n.id,p:ps,depth:Math.max(...ps.map(s=>s.depth))});let q=projection(n.x,n.z,n.y+.06);let connected=M.route(L,S,n.id);if(n.id===hover){faces.push({depth:q.depth+.2,custom:()=>{ctx.strokeStyle='#fff8c8';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(q.x,q.y,scale*.3,scale*.15,0,0,7);ctx.stroke()}})}else if(connected&&n.id!==S.at){faces.push({depth:q.depth+.12,custom:()=>{ctx.fillStyle='#fff9';ctx.beginPath();ctx.ellipse(q.x,q.y,scale*.035,scale*.018,0,0,7);ctx.fill()}})}}
// Decorative distant towers, offset from the playable circulation.
for(let [x,z,y] of [[-4,-3,1.2],[-2,3,1.8],[6,0,2.3]]){block(x,z,y,.62,.62,0,{...p,left:p.accent,right:p.deep,top:p.trim});dome(x,z,y-.1)}avatarFaces();faces.sort((a,b)=>a.depth-b.depth);for(let f of faces){if(f.custom){f.custom();continue}ctx.fillStyle=f.color;ctx.beginPath();f.p.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));ctx.closePath();ctx.fill();if(f.stroke){ctx.strokeStyle=f.stroke;ctx.stroke()}}for(let o of controlButtons){let n=o.point(),q=projection(n.x,n.z,n.y);o.b.style.left=q.x+'px';o.b.style.top=q.y+'px';o.b.hidden=phase!=='play'||!modal.hidden;o.b.disabled=!!anim||path.length>0}for(let q of particles){ctx.globalAlpha=Math.max(0,q.life/1.4);ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,3,3)}ctx.globalAlpha=1;
}
function inside(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if((p[i].y>y)!==(p[j].y>y)&&x<(p[j].x-p[i].x)*(y-p[i].y)/(p[j].y-p[i].y)+p[i].x)c=!c}return c}
cv.addEventListener('pointerup',e=>{if(phase!=='play'||!modal.hidden||anim)return;let all=clickAreas.filter(a=>inside(e.clientX,e.clientY,a.p));if(!all.length)all=clickAreas.map(a=>({...a,d:Math.hypot(e.clientX-a.p.reduce((s,p)=>s+p.x,0)/4,e.clientY-a.p.reduce((s,p)=>s+p.y,0)/4)})).filter(a=>a.d<22).sort((a,b)=>a.d-b.d).slice(0,1);all.sort((a,b)=>b.depth-a.depth);if(all.length){let reachable=all.filter(a=>M.route(L,S,a.id)!==null),choice=reachable[0]||all[0];hover=null;act({type:'walk',id:choice.id})}});
function step(dt){time+=dt;if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('#toast').classList.remove('show')}particles=particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;return p.life>0});if(anim&&modal.hidden){anim.t+=dt;let k=Math.min(1,anim.t/anim.duration),ease=k*k*(3-2*k);if(anim.kind==='walk'){avatar={x:anim.from.x+(anim.to.x-anim.from.x)*ease,z:anim.from.z+(anim.to.z-anim.from.z)*ease,y:anim.from.y+(anim.to.y-anim.from.y)*ease};}else{visual.rot=anim.from.rot.map((v,i)=>{let target=anim.to.rot[i],delta=(target-v+4)%4;if(delta===3)delta=-1;return v+delta*ease});visual.lift=anim.from.lift+(anim.to.lift-anim.from.lift)*ease;let delta=(anim.to.view-anim.from.view+4)%4;visual.view=anim.from.view+delta*ease;if(anim.kind==='view')fit();avatar={...currentPosition(S.at)}}if(k>=1){let kind=anim.kind;anim=null;visual={rot:[...S.rot],lift:S.lift,view:S.view};avatar={...currentPosition(S.at)};if(kind==='walk'){let n=L.nodes.find(n=>n.id===S.at);if(n.rune!==undefined){burst(n);tone(660,.3);updateRunes()}else tone(280+Math.random()*30,.08,'sine',.015);walkNext()}else{fit();checkWin()}}}draw()}
addEventListener('resize',resize);addEventListener('keydown',e=>{if(!modal.hidden)return;if(e.code==='KeyZ')$('#undo').click();if(e.code==='KeyV')$('#view').click();if(e.code==='KeyR')act({type:'turn',i:0});if(e.code==='KeyT')act({type:'turn',i:1});if(e.code==='KeyL')act({type:'lift'})});resize();configure();phase='title';title();let last=performance.now();function frame(t){let dt=Math.min(.05,(t-last)/1000);last=t;if(!document.hidden)step(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.IvorySteps={state:()=>JSON.parse(JSON.stringify({index,S,phase,anim:anim?.kind,path,visual,unlocked:saved.unlocked,hints})),tiles:()=>clickAreas.map(a=>({id:a.id,x:a.p.reduce((s,p)=>s+p.x,0)/4,y:a.p.reduce((s,p)=>s+p.y,0)/4})),step:t=>{for(let i=0;i<Math.ceil(t*60);i++)step(1/60)}};
})();
