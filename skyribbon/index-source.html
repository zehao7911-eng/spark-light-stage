<main id="app" class="building"><header><div class="brand"><svg><use href="#i-ride"/></svg><div><span>DRAW A LITTLE WONDER</span><h1>SKYRIBBON</h1></div></div><button id="shop" class="icon" aria-label="Open depot"><svg><use href="#i-shop"/></svg></button><button id="sound" class="icon" aria-label="Mute sound"><svg><use href="#i-sound"/></svg></button><button id="pause" class="icon" aria-label="Pause game"><svg><use href="#i-pause"/></svg></button></header>
<section class="parkbar"><button id="map" class="icon" aria-label="Open park map"><svg><use href="#i-map"/></svg></button><div><small id="parkNo">ISLAND 01 / 06</small><h2 id="parkName">Papaya Pier</h2></div><div class="wallet"><svg><use href="#i-ticket"/></svg><strong id="coins">0</strong></div></section>
