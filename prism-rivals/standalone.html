</script><script>(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('board'),c=canvas.getContext('2d'),A=PrismArt,key='prism-rivals-v1',reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;let profile={best:[0,0,0,0,0,0],unlocked:0,sound:true,active:null};try{let p=JSON.parse(localStorage.getItem(key));if(p&&Array.isArray(p.best)&&p.best.length===6){profile.best=p.best.map(n=>Math.max(0,Math.min(3,Number(n)||0)));profile.unlocked=Math.min(5,Math.max(0,Number(p.unlocked)||0));profile.sound=p.sound!==false;profile.active=p.active;}}catch(e){}let game=new PR.Game(),mode='home',paused=true,time=0,hit=0,shake=0,flash=0,fx=[],bannerAge=0,last=0,repeat=null,audio=null,voices=[];

function message(s){$('banner').textContent=s;$('banner').classList.add('show');bannerAge=1.15;}
function particles(rows){for(let y of rows)for(let x=0;x<10;x++)for(let i=0;i<3;i++)fx.push({x:x*30+15,y:y*30+15,vx:(Math.random()-.5)*180,vy:-40-Math.random()*180,life:.6+Math.random()*.4,color:A.C[(x+y)%7]});if(fx.length>160)fx.splice(0,fx.length-160);}

function panel(html){$('panel').innerHTML=html;$('modal').hidden=false;}
function home(){mode='home';paused=true;repeat=null;game=new PR.Game(0);hud();panel('<div class="seal">◈</div><small>THE CRYSTAL CIRCUIT</small><h2>PRISM RIVALS</h2><p>Build a line. Break a spell.<br>Six rivals. One crystal crown.</p><button id="start" class="primary">'+(PR.Game.restore(profile.active)?'CONTINUE DUEL':'ENTER THE CIRCUIT')+' ↗</button><button id="select">CHOOSE A RIVAL</button><button id="how">HOW TO PLAY</button><p style="font-size:10px">'+profile.best.reduce((a,b)=>a+b,0)+' / 18 crests · Saved on this device</p>');$('start').onclick=()=>start(PR.Game.restore(profile.active)||new PR.Game(0));$('select').onclick=select;$('how').onclick=()=>rules(true);}

function draw(dt){time+=paused?0:dt;A.portrait($('portrait'),game.level,time,hit);c.clearRect(0,0,300,540);c.fillStyle='#0b1628';c.fillRect(0,0,300,540);c.strokeStyle='#b8d8e508';c.lineWidth=1;for(let x=0;x<=10;x++){c.beginPath();c.moveTo(x*30,0);c.lineTo(x*30,540);c.stroke();}for(let y=0;y<=18;y++){c.beginPath();c.moveTo(0,y*30);c.lineTo(300,y*30);c.stroke();}c.save();if(!paused&&shake)c.translate(Math.sin(time*90)*shake,Math.cos(time*60)*shake*.4);for(let y=0;y<18;y++)for(let x=0;x<10;x++)if(game.board[y][x])A.crystal(c,x*30,y*30,30,game.board[y][x]);if(!game.over){let gy=game.ghost();for(let [x,y]of game.cells)A.crystal(c,(game.x+x)*30,(gy+y)*30,30,game.type+1,true);for(let [x,y]of game.cells)A.crystal(c,(game.x+x)*30,(game.y+y)*30,30,game.type+1);}for(let f of fx){if(!paused){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=400*dt;f.life-=dt;}c.globalAlpha=Math.max(0,f.life);c.fillStyle=f.color;c.fillRect(f.x,f.y,4,4);}c.globalAlpha=1;c.restore();if(flash>0){c.fillStyle='rgba(210,244,255,'+flash+')';c.fillRect(0,0,300,540);}if(!paused){hit=Math.max(0,hit-dt*2);shake=Math.max(0,shake-dt*18);flash=Math.max(0,flash-dt);fx=fx.filter(f=>f.life>0);bannerAge-=dt;if(bannerAge<=0)$('banner').classList.remove('show');}}
