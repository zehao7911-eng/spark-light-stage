    <button class="btn" data-a="close">CLOSE</button></div>`,
    box=>box.addEventListener('click',e=>{
      const a=(e.target.closest('[data-a]')||{}).dataset;if(!a)return;
      if(a.a==='help')openHelp();
      else if(a.a==='stats')openStats();
      else if(a.a==='title'){closeModal();save();S=null;VIEW='title';UI.busy=false;FX.ghost=null;render()}
      else if(a.a==='quit')confirmBox('Abandon this expedition? Saved progress will be removed.',()=>{S.combat=null;S.screen='gameover';S.dead=1;recordBest(false);wipeSave();UI.busy=false;SFX.defeat();render()});
    }));
}

// ---------- Shop ----------
const gotToast=r=>{const n=IT[r.it.id].name+(r.it.u?'+':'');toast(r.where==='eq'?`${IT[r.it.id].icon} ${n} EQUIP!`:`🎒 ${n} → STORE IN BAG (Equipment slots are full)`);SFX.buy()};
function enterShop(){openShop();save();render()}
function renderShop(){
  const x=S.ctx;
  $('#screen').innerHTML=`<div class="page"><div class="panel">
    <div class="bigico">🛒</div><h2>Fortune Shop</h2>
    <div class="fortuna"><div class="face">🐱</div><div class="say">Welcome to my shop~ Only the finest goods in this little shop. <br>Gold owned: <b>🪙 ${S.gold}</b></div></div>
    <div class="shopgrid">${x.stock.map((it,k)=>`<div class="${it.sold?'sold':''}">${itemCardHTML(it,`<button class="btn sm" data-buy="${k}" ${canBuy(k)?'':'disabled'}>${it.sold?'Item sold':'🪙 '+price(it)}</button>`)}</div>`).join('')}</div>
    <div class="svc">
      <button class="btn alt" data-a="apple" ${canBuyApple()?'':'disabled'}>🍎 Apple (HP +${APPLE_HEAL}) 🪙${APPLE_COST} <small>Remaining ${x.apples}</small></button>
      <button class="btn alt" data-a="upg" ${canBuyUpgrade()?'':'disabled'}>🔨 UPGRADE EQUIPMENT 🪙${upPrice()}</button>
      <button class="btn alt" data-a="sell">💰 SELL EQUIPMENT</button>
    </div>
    <div class="row"><button class="btn" data-a="leave">LEAVE SHOP ▶</button></div></div></div>`;
  $('#screen .panel').onclick=e=>{
    const b=e.target.closest('[data-buy]');
    if(b&&!b.disabled){const r=buyItem(+b.dataset.buy);if(r){gotToast(r);save();render()}return}
    const a=e.target.closest('[data-a]');if(!a||a.disabled)return;
    if(a.dataset.a==='apple'){if(buyApple()){SFX.heal();save();render()}}
    else if(a.dataset.a==='upg')doUpgrade(`🔨 CHOOSE AN UPGRADE (🪙${upPrice()})`,buyUpgrade);
    else if(a.dataset.a==='sell')pickItem('💰 CHOOSE AN ITEM TO SELL',sellable(),r=>`🪙 ${sellPrice(r.it)} to sell`,r=>{if(sellItem(r)){SFX.coin();save();render()}});
    else if(a.dataset.a==='leave')afterNode();
  };
}

// ---------- TREASURE ----------
function enterTreasure(){
  const r=openTreasure();
  if(r.mimic){startCombat('normal','mimic',{hp:r.hp});setTimeout(()=>announce('The chest… moves?! It was a mimic! 🎁'),50);return}
  save();render();
}
function renderTreasure(){
  const x=S.ctx;
  $('#screen').innerHTML=`<div class="page"><div class="panel">
    <div class="bigico">${x.opened?'💰':'🧰'}</div><h2>TREASURE</h2>
    ${x.opened?`<p>Something sparkles inside the chest! Choose one.</p>
      <div class="cards">${x.items.map((it,k)=>itemCardHTML(it,`<button class="btn sm" data-pick="${k}">TAKE</button>`)).join('')}</div>
      <div class="row"><button class="btn alt" data-a="gold">Take gold instead 🪙 ${x.gold}</button></div>`
    :`<div class="fortuna"><div class="face">👸</div><div class="say">A chest at the center of the stage! Shall we open it? Surely it is not a trap… Heh.</div></div>
      <div class="row"><button class="btn glow" data-a="open">OPEN CHEST</button></div>`}</div></div>`;
  $('#screen .panel').onclick=e=>{
    const p=e.target.closest('[data-pick]');
    if(p){const r=treasurePick(+p.dataset.pick);if(r){gotToast(r);afterNode()}return}
    const a=e.target.closest('[data-a]');if(!a)return;
    if(a.dataset.a==='open'){treasureOpen();SFX.open();save();render()}
    else if(a.dataset.a==='gold'){if(treasureGold()){SFX.coin();afterNode()}}
  };
}

// ---------- Healing Apple ----------
function renderApple(){
  $('#screen').innerHTML=`<div class="page"><div class="panel">
    <div class="bigico">🌳</div><h2>The Lucky Apple Tree</h2>
    <div class="fortuna"><div class="face">👸</div><div class="say">Rest for a while. Only one apple per visitor!</div></div>
    <div class="shopgrid">
      <div class="card t-shield icard" style="width:230px"><div class="bigico" style="font-size:56px">🍎</div><b>Red Apple</b><div class="c-desc">HP ${appleHeal()} Heal (of maximum health 35%)</div><button class="btn" data-a="red">EAT</button></div>
      <div class="card t-utility icard" style="width:230px"><div class="bigico" style="font-size:56px">🍏</div><b>Golden Apple</b><div class="c-desc">Maximum health +6, HP 6 Heal</div><button class="btn" data-a="gold">EAT</button></div>
    </div></div></div>`;
  $('#screen .panel').onclick=e=>{
    const a=e.target.closest('[data-a]');if(!a)return;
    const n=eatApple(a.dataset.a);
    toast(a.dataset.a==='gold'?'🍏 Maximum health +6':`🍎 HP +${n}`);SFX.heal();afterNode();
  };
}

// ---------- Forge ----------
function renderForge(){
  const x=S.ctx,can=upgradable().length>0;
  $('#screen').innerHTML=`<div class="page"><div class="panel">
    <div class="bigico">⚒️</div><h2>Dwarven Forge</h2>
    <div class="fortuna"><div class="face">🧔</div><div class="say">${x.done?'A fine improvement! Put it to good use.':'One good hammer strike will do! One equipment upgrade, on the house. Or rest by the fire for a while.'}</div></div>
    <div class="row">${x.done?'<button class="btn" data-a="leave">LEAVE ▶</button>'
      :`<button class="btn glow" data-a="up" ${can?'':'disabled'}>🔨 UPGRADE EQUIPMENT (FREE)</button><button class="btn alt" data-a="rest">🔥 REST BY THE FIRE (HP +${FORGE_REST})</button>`}</div></div></div>`;
  $('#screen .panel').onclick=e=>{
    const a=e.target.closest('[data-a]');if(!a||a.disabled)return;
    if(a.dataset.a==='up')doUpgrade('🔨 CHOOSE AN UPGRADE',forgeUpgrade);
    else if(a.dataset.a==='rest'){const h=forgeRest();SFX.heal();toast(`🔥 HP +${h}`);afterNode()}
    else afterNode();
  };
}

// ---------- Fortune Event ----------
function enterEvent(){openEvent();save();render()}
function wheelFx(o){
  if(!o)return;
  if(o.it)gotToast(o);
  if(o.fallback)toast(`Nothing here needs an upgrade 🪙${o.fallback} instead!`);
  ['none','hurt','halve'].includes(o.k)?SFX.error():SFX.fanfare();
}
function renderEvent(){
  const x=S.ctx;let body='';
  if(x.type==='roulette'){
    if(x.res!=null&&!x.applied&&!x.spinning){wheelFx(applyWheel());save()}
    const rot=x.res!=null?360*6-(x.res*45+22.5):0;
    body=`<h2>🎡 Fortune Wheel</h2>
      <div class="fortuna"><div class="face">👸</div><div class="say">${x.res==null?'Care to take a spin? What will appear… Even I do not know♡':x.spinning?'BACK~ BACK~!':`the result… <b>${WHEEL[x.res].t}</b>!`}</div></div>
      <div class="wheel"><div class="ptr">🔻</div><div class="disc" style="background:conic-gradient(${WHEEL.map((w,k)=>`${w.c} ${k*45}deg ${(k+1)*45}deg`).join(',')});transform:rotate(${x.spinning?0:rot}deg)">
        ${WHEEL.map((w,k)=>`<div class="lbl" style="transform:rotate(${k*45+22.5}deg)"><span>${w.t}</span></div>`).join('')}</div><div class="hub">⭐</div></div>
      <div class="row">${x.res==null?'<button class="btn glow" data-a="spin">SPIN THE WHEEL!</button><button class="btn alt" data-a="leave">PASS BY</button>'
        :x.spinning?'':x.pendUp?'<button class="btn glow" data-a="up">🔨 CHOOSE AN ITEM TO UPGRADE</button>':'<button class="btn" data-a="leave">CONTINUE ▶</button>'}</div>`;
  }else if(x.type==='duel'){
    const du=x.duel;
    body=`<h2>🐰 DICE DUEL</h2>
      <div class="fortuna"><div class="face">🐰</div><div class="say">${du?(du.win>0?'Oh no, Defeated! Take the stake~':du.win<0?'Heh, I win! The stake is mine~':'Draw! Your stake is returned.'):'The host assistant challenges you to a dice duel! Dice 2 dice; the highest total wins the stake.'}</div></div>
      ${du?`<div class="duel"><div class="side2"><b>Challenger</b><div>${du.p.map(v=>`<img src="${dieURL(v,'p')}" alt="${v}">`).join('')}</div><div class="tot">${du.p[0]+du.p[1]}</div></div><div class="tot">VS</div>
        <div class="side2"><b>Rabbit</b><div>${du.h.map(v=>`<img src="${dieURL(v,'e')}" alt="${v}">`).join('')}</div><div class="tot">${du.h[0]+du.h[1]}</div></div></div>
        <div class="row"><button class="btn" data-a="leave">CONTINUE ▶</button></div>`
      :`<div class="row">${DUEL_BETS.map(b=>`<button class="btn" data-bet="${b}" ${S.gold<b?'disabled':''}>🪙 ${b} BET</button>`).join('')}<button class="btn alt" data-a="leave">DECLINE</button></div>`}`;
  }else{
    const msg=x.got?`Bargain sealed♡ ${IT[x.got.id].icon} ${IT[x.got.id].name}${x.got.u?'+':''} ( ) Received.`
      :x.upId?`${IT[x.upId].icon} ${IT[x.upId].name} ( ) Upgrade complete. Sparkling~`
      :x.done?'The trade is complete.':'Nothing comes for free. Offer something and, I will make it worth your while.';
    body=`<h2>🌙 Fortune Bargain</h2>
      <div class="fortuna"><div class="face">👸</div><div class="say">${msg}</div></div>
      <div class="row">${x.done?'<button class="btn" data-a="leave">CONTINUE ▶</button>'
        :`<button class="btn red" data-a="blood" ${canDealBlood()?'':'disabled'}>❤️ HP ${DEAL_HP} for a rare equipment item</button>
          <button class="btn" data-a="coin" ${canDealCoin()?'':'disabled'}>🪙 ${DEAL_GOLD} for a random equipment upgrade</button>
          <button class="btn alt" data-a="leave">DECLINE</button>`}</div>`;
  }
  $('#screen').innerHTML=`<div class="page"><div class="panel">${body}</div></div>`;
  $('#screen .panel').onclick=e=>{
    const bet=e.target.closest('[data-bet]');
    if(bet&&!bet.disabled){
      const du=duel(+bet.dataset.bet);if(!du)return;
      SFX.rattle();setTimeout(()=>du.win>0?SFX.coin():du.win<0?SFX.error():0,500);save();render();return;
    }
    const a=e.target.closest('[data-a]');if(!a||a.disabled)return;
    switch(a.dataset.a){
      case 'spin':{
        const res=spinWheel();save();x.spinning=1;render();SFX.select();
        const disc=$('.wheel .disc');requestAnimationFrame(()=>requestAnimationFrame(()=>{disc.style.transform=`rotate(${360*6-(res*45+22.5)}deg)`}));
        let t=0;const tk=()=>{if(t>4000)return;SFX.tick();t+=40+t*.12;setTimeout(tk,40+t*.12)};tk();
        const s0=S;setTimeout(()=>{if(S!==s0||S.ctx!==x)return;delete x.spinning;wheelFx(applyWheel());save();render()},4400);
        break;
      }
      case 'up':doUpgrade('🔨 CHOOSE AN UPGRADE',wheelUpgrade);break;
      case 'blood':{const r=dealBlood();if(r){gotToast(r);SFX.spell();save();render()}break}
      case 'coin':if(dealCoin()){SFX.levelup();save();render()}break;
      case 'leave':afterNode();break;
    }
  };
}

// ---------- 게임 오버 / VICTORY ----------
function renderEnd(win){
  const m=Math.max(1,Math.round((Date.now()-S.st.start)/60000));
  $('#screen').innerHTML=`<div class="page"><div class="panel">
    <div class="bigico">${win?'👑':'💀'}</div><h2>${win?'Tonight you are the star!':'The show is over'}</h2>
    <div class="fortuna"><div class="face">👸</div><div class="say">${win?'I cannot believe it… You beat me on my own stage! All the luck tonight is yours. Bravo!':'Heh, Fortune was not on your side. See you in the next show, Challenger~'}</div></div>
    <div class="stats"><div><b>${S.floor}F</b>Reached</div><div><b>${CL[S.cls].i} Lv${S.level}</b>${CL[S.cls].n}</div><div><b>${S.st.kills}</b>Defeat</div><div><b>${S.st.dmg}</b>Total damage</div><div><b>${S.st.maxHit}</b>Largest hit</div><div><b>${S.st.turns}</b>Turn</div><div><b>${S.st.gold}</b>Gold earned</div><div><b>${m} min</b>Play time</div></div>
    <h3>Final equipment</h3><div class="cards">${S.eq.map(it=>itemCardHTML(it)).join('')}</div>
    <div class="row"><button class="btn glow" data-a="title">TITLE SCREEN</button></div></div></div>`;
  $('[data-a="title"]').onclick=()=>{S=null;VIEW='title';render()};
}

// ---------- 툴팁 ----------
function itemTip(id,u){
  u=+u;const d=IT[id];if(!d)return '';const um=d.uses?d.uses(u):1,um1=d.uses?d.uses(1):1;
  return`<div class="tt-h">${d.icon} ${d.name}${u?'+':''}<span class="rr r${d.rar}">${RARN[d.rar]}</span></div>
    <div class="tt-t">${TYPEN[d.type]}${d.type==='spell'&&S&&S.cls==='mage'?' · Spellbook (Chain ready)':''}</div>
    <div>🎲 Requirement: <b>${d.slots(u).map(condText).join(' + ')}</b></div>
    <div>✨ Effect: ${descHTML(d.desc(u))}</div>
    ${um>1?`<div>🔁 ${d.perCombat?'per combat':'per turn'} ${um} uses</div>`:''}
    ${!u&&!d.mon?`<div class="tt-up">⬆ When upgraded: ${d.slots(1).map(condText).join(' + ')} · ${descHTML(d.desc(1))}${um1!==um?` · ${um1} times`:''}</div>`:''}`;
}
const tip=$('#tip');
function hideTip(){tip.style.display='none'}
function posTip(e){
  if(tip.style.display!=='block')return;
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+16,y=e.clientY+16;
  if(x+w>innerWidth-8)x=e.clientX-w-12;if(y+h>innerHeight-8)y=e.clientY-h-12;
  tip.style.left=Math.max(4,x)+'px';tip.style.top=Math.max(4,y)+'px';
}

// =====================================================================
//  초기화 & 메인 루프
// =====================================================================
let _last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-_last)/1000)*SET.speed;_last=now;
  try{Tray.step(dt);Tray.draw(now);FX.step(dt);FX.draw(now);TitleFx.draw(now)}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
function init(){
  FX.init();
  addEventListener('resize',()=>{FX.resize();Tray.resize()});
  document.addEventListener('pointerdown',()=>SFX.unlock());
  $('#top').addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='bag')openBag();
    else if(a==='snd'){SET.sound=!SET.sound;saveSet();renderTop();SFX.select()}
    else if(a==='spd'){SET.speed=SET.speed>=3?1:SET.speed+1;saveSet();renderTop()}
    else if(a==='menu')openMenu();
  });
  $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
  addEventListener('error',e=>onFatal(e.error||e.message));
  addEventListener('unhandledrejection',e=>onFatal(e.reason));
  document.addEventListener('mouseover',e=>{
    const t=e.target.closest&&e.target.closest('[data-tip],[data-item]');
    if(!t||(UI.drag&&UI.drag.moved)){hideTip();return}
    tip.innerHTML=t.dataset.tip!=null?t.dataset.tip:itemTip(...t.dataset.item.split(':'));
    tip.style.display='block';posTip(e);
  });
  document.addEventListener('mousemove',posTip);
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase(),a=document.activeElement;
    if($('#modal').classList.contains('show')){
      if(k==='escape')closeModal();
      else if((k==='enter'||k===' ')&&a&&a.matches&&a.matches('#modal [data-k]')){e.preventDefault();a.click()}
      return;
    }
    // 포커스된 Equipment 카드·맵 노드는 Enter/Space to activate (Keyboard 조작)
    if((k==='enter'||k===' ')&&a&&a.matches&&a.matches('#pcards .card[data-ci],.node.avail')){
      e.preventDefault();
      if(a.classList.contains('node'))enterNode(+a.dataset.r,+a.dataset.i);else a.click();
      return;
    }
    const C=S&&S.screen==='combat'&&S.combat;if(!C)return;
    if(k==='e'||(k==='enter'&&(!a||a===document.body))){e.preventDefault();endTurn()}
    else if(k==='escape'){UI.sel=null;UI.mode=null;render()}
    else if(k==='r'||k==='q')useSkill();
    else if(/^[1-9]$/.test(k)&&!UI.busy&&C.phase==='player'){
      const d=C.dice[+k-1];if(d)chooseDie(d.id);
    }
  });
  render();
  requestAnimationFrame(loop);
  // rAF가 멈춘 경우(비활성 탭, 가려진 창)에도 굴림 Effects이 끝나 Turn이 진행되도록 타이머 instead 진행
  setInterval(()=>{
    const now=performance.now(),gap=now-_last;if(gap<300)return;_last=now;
    let t=Math.min(gap/1000,3)*SET.speed;
    try{while(t>0){const dt=Math.min(.05,t);Tray.step(dt);FX.step(dt);t-=dt}}catch(e){console.error(e)}
  },250);
}
init();
</script>
