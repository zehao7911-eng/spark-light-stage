<script>
(()=>{

const GARDENS=[

const CHARMS=[{id:'brush',name:'Soft Brush',reach:190},{id:'leaf',name:'Longleaf',reach:230},{id:'bloom',name:'Petal Echo',reach:190},{id:'bell',name:'Kindbell',reach:190}];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const copy=a=>JSON.parse(JSON.stringify(a));
function seedNext(n){n=(n*1664525+1013904223)>>>0;return n;}
function walls(s){if(s.level<3)return [];return s.level%2?[{x:104,y:233,r:17},{x:266,y:304,r:15}]:[{x:257,y:215,r:17},{x:95,y:313,r:15}];}
function create(level=0,charm='brush',seed=1,remix=false){const s={version:1,level:clamp(Math.floor(level),0,7),charm:CHARMS.some(c=>c.id===charm)?charm:'brush',seed:seed>>>0,remix:!!remix,wave:0,lights:0,hero:{x:180,y:373},enemies:[],phase:'ready',clock:0,pending:null,turn:0,score:0,kills:0,streak:0,bestChain:0,bestBloom:0,bumps:0,blocks:0,shield:charm==='bell'?2:0,finished:false};spawn(s);return s;}
const layouts=[[[180,300],[180,245],[180,188]],[[105,250],[180,250],[254,250]],[[180,200],[128,257],[231,257]],[[85,185],[148,225],[210,265],[270,305]],[[110,310],[110,246],[110,180],[250,190],[250,260]],[[75,175],[145,175],[215,175],[285,175],[180,290]],[[80,180],[150,230],[230,180],[284,240],[180,308]],[[180,174],[95,235],[265,235],[125,300],[235,300]]];
function spawn(s){let index=(s.level+s.wave*2)%layouts.length;if(s.level===0)index=s.wave;let points=copy(layouts[index]);if(s.level>1)points=points.concat([[88,347],[276,345]].slice(0,Math.min(2,s.level-1)));if(s.remix){s.seed=seedNext(s.seed);if(s.seed&1)points=points.map(([x,y])=>[360-x,y]);points=points.map(([x,y],i)=>[clamp(x+((s.seed>>>(i%8))%17-8),52,308),clamp(y+((s.seed>>>(i%7))%13-6),138,350)]);}
 s.enemies=points.map(([x,y],i)=>{let type='wisp';if(s.level>=1&&i%3===1)type='skitter';if(s.level>=3&&i%3===2)type='guard';if(s.level>=4&&i===0)type='bell';if(s.level===7&&s.wave===2&&i===0)type='elder';const hp=type==='elder'?3:type==='bell'?2:1;return {id:i,x,y,originX:x,originY:y,type,hp,maxHp:hp,face:s.wave%2?Math.PI:0,r:type==='elder'?23:type==='bell'?18:14};});
 // Boulders never spawn over a creature; authored points are nudged clear once.
 for(const e of s.enemies)for(const w of walls(s))if(Math.hypot(e.x-w.x,e.y-w.y)<w.r+e.r+9){e.x=clamp(e.x<w.x?w.x-w.r-e.r-12:w.x+w.r+e.r+12,52,308);e.originX=e.x;}
 s.hero={x:180,y:373};s.pending=null;s.clock=0;s.phase='ready';
}
function pointSegment(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;return {t,d:Math.hypot(px-ax-t*dx,py-ay-t*dy)};}
function circleEntry(a,b,c,r){const dx=b.x-a.x,dy=b.y-a.y,ox=a.x-c.x,oy=a.y-c.y,A=dx*dx+dy*dy,B=2*(ox*dx+oy*dy),C=ox*ox+oy*oy-r*r;if(C<0)return 0;const disc=B*B-4*A*C;if(!A||disc<0)return Infinity;const t=(-B-Math.sqrt(disc))/(2*A);return t>=0&&t<=1?t:Infinity;}
function trace(s,target){if(!target||![target.x,target.y].every(Number.isFinite))return null;const start={...s.hero},raw={x:clamp(target.x,45,315),y:clamp(target.y,128,393)},dx=raw.x-start.x,dy=raw.y-start.y,d=Math.hypot(dx,dy);if(d<8)return null;const reach=CHARMS.find(c=>c.id===s.charm)?.reach||190,f=Math.min(1,reach/d);let end={x:start.x+dx*f,y:start.y+dy*f},block=1;for(const w of walls(s))block=Math.min(block,circleEntry(start,end,w,w.r+9));const wall=block<1;if(wall){block=Math.max(0,block-.007);end={x:start.x+(end.x-start.x)*block,y:start.y+(end.y-start.y)*block};}const len=Math.hypot(end.x-start.x,end.y-start.y),ux=len?(end.x-start.x)/len:0,uy=len?(end.y-start.y)/len:0;
 const hits=s.enemies.map(e=>{const q=pointSegment(e.x,e.y,start.x,start.y,end.x,end.y);return {...q,id:e.id,blocked:e.type==='guard'&&(ux*Math.cos(e.face)+uy*Math.sin(e.face))<-.22};}).filter(h=>h.d<=s.enemies.find(e=>e.id===h.id).r+10).sort((a,b)=>a.t-b.t);
 return {start,end,hits,wall,length:len};
}
function threatening(s,e){return (s.turn+1+e.id)%3===0;}
function danger(s,end,excluded=[]){return s.enemies.filter(e=>!excluded.includes(e.id)&&threatening(s,e)&&Math.hypot(end.x-e.x,end.y-e.y)<(e.type==='elder'?64:e.type==='bell'?54:43));}
function dash(s,target){if(s.phase!=='ready'||s.finished)return false;const tr=trace(s,target);if(!tr||tr.length<3)return false;const before=copy(s.enemies),killed=[],hit=[],blocked=[];for(const h of tr.hits){const e=s.enemies.find(e=>e.id===h.id);if(h.blocked){blocked.push(e.id);s.blocks++;}else{e.hp--;hit.push(e.id);if(e.hp<=0)killed.push(e.id);}}
 if(s.charm==='bloom'&&killed.length>=2){const seeds=s.enemies.filter(e=>killed.includes(e.id));for(const e of s.enemies)if(!killed.includes(e.id)&&seeds.some(p=>Math.hypot(p.x-e.x,p.y-e.y)<76)){e.hp--;hit.push(e.id);if(e.hp<=0)killed.push(e.id);}}
 const incoming=danger(s,tr.end,killed);let hurt=!!incoming.length,ward=false;if(hurt&&s.shield>0){s.shield--;hurt=false;ward=true;}if(hurt)s.bumps++;
 s.turn++;s.kills+=killed.length;s.streak=killed.length?Math.min(12,s.streak+killed.length):0;s.bestChain=Math.max(s.bestChain,s.streak);s.bestBloom=Math.max(s.bestBloom,killed.length);const gained=hit.length*25+killed.length*100+Math.max(0,killed.length-1)**2*70+(killed.length?s.streak*10:0);s.score+=gained;
 s.enemies=s.enemies.filter(e=>!killed.includes(e.id));for(const e of s.enemies)if(e.type==='skitter'){const dir=(s.turn+e.id)%2?1:-1;let nx=clamp(e.x+dir*19,52,308),ny=clamp(e.originY+Math.sin(s.turn+e.id)*14,140,350);if(walls(s).some(w=>Math.hypot(nx-w.x,ny-w.y)<w.r+e.r+12)){nx=e.x;ny=e.y;}e.x=nx;e.y=ny;}
 s.hero={...tr.end};s.phase='dash';s.clock=0;s.pending={...tr,before,killed,hit,blocked,hurt,ward,gained,chain:killed.length};return true;
}
function step(s,dt){if(!Number.isFinite(dt)||dt<=0||s.finished)return null;dt=Math.min(dt,.1);if(s.phase==='ready')return null;s.clock+=dt;if(s.phase==='dash'&&s.clock>=.58){if(s.enemies.length){s.phase='ready';s.pending=null;s.clock=0;return 'ready';}s.lights++;s.clock=0;if(s.wave===2){s.phase='win';s.finished=true;return 'win';}s.wave++;s.phase='between';return 'light';}if(s.phase==='between'&&s.clock>=.85){spawn(s);return 'spawn';}return null;}
function stars(s){return s.finished?1+(s.bestChain>=5?1:0)+(s.bumps<=2?1:0):0;}
function profile(){return {version:1,stars:Array(8).fill(0),scores:Array(8).fill(0),charm:'brush',wildBest:0};}
function award(s,p){if(!s.finished)return false;if(s.remix){p.wildBest=Math.max(p.wildBest,s.score);return true;}p.stars[s.level]=Math.max(p.stars[s.level]||0,stars(s));p.scores[s.level]=Math.max(p.scores[s.level]||0,s.score);return true;}
function unlocked(p,charm){const n=p.stars.filter(v=>v>0).length;return charm==='brush'||charm==='leaf'&&n>=2||charm==='bloom'&&n>=4||charm==='bell'&&n>=6;}
function suggest(s){if(s.phase!=='ready')return null;const candidates=[];for(const e of s.enemies){candidates.push({x:e.x,y:e.y});for(let k=0;k<8;k++){const a=k*Math.PI/4;candidates.push({x:e.x+Math.cos(a)*44,y:e.y+Math.sin(a)*44});}}let best=null,bestValue=-Infinity;for(const target of candidates){const tr=trace(s,target);if(!tr||tr.length<3)continue;const hit=tr.hits.filter(h=>!h.blocked);const kill=hit.filter(h=>s.enemies.find(e=>e.id===h.id).hp===1).map(h=>h.id);const val=kill.length*9+hit.length*3-danger(s,tr.end,kill).length*2-tr.length/1000;if(hit.length&&val>bestValue){bestValue=val;best=target;}}if(best)return {x:clamp(best.x,45,315),y:clamp(best.y,128,393)};
 // When a shield or boulder hides every strike, choose a genuine flank move.
 const grid=[];for(const x of [55,100,155,205,260,305])for(const y of [145,200,260,320,380])grid.push({x,y});let chosen=null,score=-Infinity;for(const target of grid){const tr=trace(s,target);if(!tr||tr.length<15)continue;const hypothetical={...s,hero:tr.end};let future=0;for(const e of s.enemies){const q=trace(hypothetical,{x:e.x,y:e.y});if(q)future=Math.max(future,q.hits.filter(h=>!h.blocked).length*5);}const val=future-danger(s,tr.end).length*2-Math.min(...s.enemies.map(e=>Math.hypot(e.x-tr.end.x,e.y-tr.end.y)))/100-tr.length/900;if(val>score){score=val;chosen=target;}}return chosen;
}
