<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#203d3b"><meta name="description" content="Draw a line. Release a little magic. A one-finger pixel-art dash adventure."><title>Brushbound</title><link rel="icon" href="assets/icon.webp"><link rel="apple-touch-icon" href="assets/icon.webp"><link rel="stylesheet" href="style.css"></head>
<body><main id="app"><header><div class="brand"><span>❧</span><div><h1>BRUSHBOUND</h1><small>DRAW. RELEASE. BLOOM.</small></div></div><button id="pause" aria-label="Pause and settings">Ⅱ</button></header>
<section id="workshop" aria-label="Pixel courtyard"><canvas id="game" width="720" height="900" tabindex="0" role="img" aria-label="Aim a dash through the three aligned ink wisps."></canvas>
<div class="location"><small id="chapter">GARDEN 01 / 08</small><strong id="garden">The First Stroke</strong></div><div class="score"><small>SCORE</small><b id="score">0</b></div>
<div id="lanterns" aria-label="Lanterns freed"><span>✦</span><span>✦</span><span>✦</span></div><div id="chain" aria-live="polite">A little line. A little magic.</div>
<div id="loading"><b>Opening the garden…</b><p id="loadingText">Unrolling the scenery</p><button id="retryArt" hidden>Retry artwork</button></div>
</section>
<section id="controls"><div id="objective" role="status" aria-live="polite"><b id="goal">Free the 3 lanterns</b><small id="hintText">Drag through the wisps. Let go to dash.</small></div><div class="actions"><button id="hint">Show a line</button><button id="dash" class="main" aria-label="Dash along the shown line">Dash ↑</button></div></section>
<footer><button id="book">Fieldbook <span id="bookCount">0 / 8</span></button><span id="charm">Soft Brush</span><button id="sound" aria-label="Toggle sound">Sound · On</button></footer>
<dialog id="modal"><div id="panel"></div></dialog></main><script type="module" src="game.mjs"></script></body></html>
