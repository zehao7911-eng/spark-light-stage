<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#30483c"><meta name="description" content="A little care. A lot of heart. A tactile pixel-art plush repair atelier."><title>Patch & Pals</title><link rel="icon" href="assets/icon.webp"><link rel="apple-touch-icon" href="assets/icon.webp"><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
 <header><div class="brand"><span class="heart">♥</span><div><h1>PATCH <i>&</i> PALS</h1><small>A LITTLE CARE. A LOT OF HEART.</small></div></div><button id="pause" aria-label="Pause and settings">Ⅱ</button></header>
 <section class="desk" aria-label="Plush repair workshop">
 <canvas id="game" width="720" height="900" role="img" aria-label="Pull the twig out of Poppy. Drag away from the glowing circle."></canvas>
 <div class="ticket"><span id="jobNumber">01 / 09</span><b id="name">Poppy</b><small id="story">The hedge explorer</small></div>
 <div id="status" role="status" aria-live="polite"><b id="task">Pull it out!</b><span id="detail">Drag the twig away</span></div>
 <div id="phases" aria-label="Repair progress"><span class="current">1 · PLUCK</span><span>2 · PUFF</span><span>3 · PATCH</span></div>
 <div id="load"><b>Opening the atelier…</b><span id="loadText">Unfolding the quilt</span><button id="retry" hidden>Try again</button></div>
 </section>
 <section class="tools" aria-label="Repair controls"><div id="toolHint">Grab a glowing snag, then pull.</div><div class="toolrow"><button id="assist" aria-label="Help with current repair">Helping hand</button><button id="action" class="primary" disabled>Pull the twig ↗</button></div></section>
 <footer><button id="shelf">Pals <span id="count">0 / 9</span></button><span id="hearts" aria-label="Earned hearts">♡ ♡ ♡</span><button id="sound" aria-label="Toggle sound">Sound · On</button></footer>
 <dialog id="modal"><div id="modalBody"></div></dialog>
 </main><script type="module" src="game.mjs"></script></body></html>
