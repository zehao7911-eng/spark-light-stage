<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b435a"><title>Ribbon Rush</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><button id="menu" aria-label="Open menu">☰</button><div class="logo">RIBBON RUSH<small>ONE TAP. BIG SNIP.</small></div><button id="sound" aria-label="Enable sound">♪<i></i></button></header><div id="hud"><span id="order">ORDER 01</span><div class="progress"><b id="fill"></b><span id="goal">0 / 4</span></div><button id="pause" aria-label="Pause game">Ⅱ</button></div><section id="scene"><canvas id="game" width="420" height="630" aria-label="Tap to snip through matching ribbon colors."></canvas><div id="message" role="status"></div><div class="rim"></div></section><footer><div class="metric"><b id="score">0</b><small>POINTS</small></div><button id="snip" aria-label="Snip ribbon"><span>SNIP!</span><small id="ready">tap anywhere</small></button><div class="metric"><b id="chain">✂</b><small>BEST CHAIN</small></div></footer><div id="modal" role="dialog" aria-modal="true"></div></main><script src="assets/art.js"></script><script src="source-game.js"></script><script src="game.js"></script></body></html>
