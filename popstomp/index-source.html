<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#292c2a"><title>POPSTOMP — A Soda Revue</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body>
<main id="app"><header><button id="book" class="round" aria-label="Show collection and acts">▦</button><div class="brand"><small>A SODA REVUE</small><h1>POPSTOMP<span>✦</span></h1></div><button id="sound" class="round" aria-label="Mute sound">♪</button><button id="pause" class="round" aria-label="Pause game">Ⅱ</button></header>
<div id="status"><span id="act">ACT 01</span><span id="name">Opening Pop</span><span id="stars">☆ 0</span></div>
<section id="stage"><canvas id="scene" width="840" height="1200" role="img" aria-label="A hand-drawn soda theatre. Tap fruit in the barrel to stomp and fill a soda bottle."></canvas><div id="callout" aria-live="polite"></div><div id="overlay" hidden></div></section>
<footer><div class="meter"><span id="stamps">◉ 10</span><small>STOMPS LEFT</small></div><div class="actions"><button id="mode" aria-label="Change stomp mode"><b>♧ STOMP</b><small id="modehint">TAP THE FRUIT</small></button><button id="retry" class="round" aria-label="Restart current act">↶</button></div><div class="meter right"><span id="juice">0 / 14</span><small>JUICED</small></div></footer><div id="hint">Tap a bunch. Make a splash.</div>
</main><script src="model.js"></script><script src="art.js"></script><script src="game.js"></script></body></html>
