<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14233b"><title>Palmline GT</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="game" aria-label="Palmline GT racing game"></canvas>
<header><a id="brand" href="#">PALMLINE <b>GT</b></a><div><button id="sound" aria-label="Toggle sound">♫ OFF</button><button id="pause" aria-label="Pause race">Ⅱ</button></div></header>
<div id="hud" hidden><div class="topstats"><span><small>FINISH LINE</small><b id="distance">0%</b></span><span><small>TIME LEFT</small><b id="timer">70</b></span><span><small>OVERTAKES</small><b id="passes">0</b></span></div><div class="progress"><i id="progress"></i><em></em><em></em></div><div id="callout"></div><div class="speed"><b id="speed">0</b><small>KM/H</small></div><div class="boostbar"><i id="charge"></i><span id="boostlabel">TURBO</span></div></div>
<section id="menu" class="panel"><div class="eyebrow">THE LONG WAY HOME</div><h1>PALMLINE<span>GT</span></h1><p class="intro">Chase the sunset.<br>Thread the traffic. Find your flow.</p><div class="routes" id="routes"></div><div class="garage"><span id="wallet">0 CREDITS</span><div id="paints"></div></div><button id="start" class="primary">DRIVE THE COAST <span>↗</span></button><div class="hint">← → steer · Space turbo · ↓ brake<br>On mobile: hold the road controls</div><a class="credits" href="credits.html" target="_blank">Credits &amp; source</a></section>
<section id="overlay" class="panel modal" hidden><div class="eyebrow" id="resulttag">TAKE A BREATHER</div><h2 id="resulttitle">Paused</h2><p id="resultcopy"></p><div id="resultstats"></div><button id="resume" class="primary">KEEP DRIVING</button><button id="retry">RETRY ROUTE</button><button id="home">ROUTE SELECT</button></section>
<nav id="controls" hidden aria-label="Driving controls"><div class="steering"><button data-key="left" aria-label="Steer left">◀</button><button data-key="right" aria-label="Steer right">▶</button></div><div class="pedals"><button data-key="brake" class="brake" aria-label="Brake">BRAKE</button><button data-key="boost" class="turbo" aria-label="Turbo">TURBO <span>↗</span></button></div></nav>
<script type="module" src="game.js"></script></body></html>
