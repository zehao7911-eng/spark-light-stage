</style></head><body><div id="app"><header><button id="library" aria-label="Open film library" class="brand">B<span>STUDIO</span></button><div><b>BONK! STUDIO</b><small id="filmname">LITTLE MOVIES. BIG NOISES.</small></div><button id="pause" aria-label="Pause">Ⅱ</button></header><main id="stage"><canvas id="scene" role="img" aria-label="An illustrated movie set"></canvas><div id="slate"><span id="setname">STAGE 01 · THE KITCHEN</span><span id="take">TAKE 01 / 06</span></div><div id="instruction"><small>YOU MAKE THE SOUND EFFECTS</small><h1>MAKE SOME <br><em>GOOD NOISE.</em></h1><p>Watch the movie. Tap the matching prop.</p><button id="start" class="primary">ROLL CAMERA ↗</button></div><div id="cue" hidden><span id="cueIcon"></span><b id="cueWord"></b><small>TAP THE MATCHING PROP</small><div class="timer"><i id="timer"></i></div></div><div id="feedback" aria-live="polite"></div><div id="moviecaption">AN ORIGINAL BONK! PRODUCTION</div><div id="steps"></div></main><section id="desk"><div id="desklabel"><span>FOLEY DESK</span><span id="score">0 APPLAUSE</span></div><div id="pads"></div></section><footer><button id="sound">SOUND ON</button><span id="progress">FILM 01 / 09</span><button id="films">FILM LIBRARY ↗</button></footer><dialog id="modal"><div id="body"></div></dialog><div id="toast" role="status"></div></div><script>(()=>{const TOOLS=[{name:'BONK',word:'BONK!',color:'#ef795b',glyph:'✦'},{name:'SPLASH',word:'SPLASH!',color:'#75bac7',glyph:'≈'},{name:'DING',word:'DING!',color:'#e8bd61',glyph:'♧'},{name:'WHOOSH',word:'WHOOSH!',color:'#a6bea2',glyph:'≋'}];
const FILMS=[
 {name:'A Very Bad Breakfast',set:0,seq:[0,1,0,1,1,0],tools:2,tag:'A saucepan. A puddle. A promising career.'},
 {name:'Soup, There It Goes',set:0,seq:[1,0,1,0,0,1,0,1],tools:2,tag:'The soup has other plans.'},
 {name:'The Doorbell Detective',set:1,seq:[2,0,2,1,2,0,1,2],tools:3,tag:'Every great mystery begins with a ding.'},
 {name:'Rain Check',set:1,seq:[1,2,0,1,2,1,0,2,1],tools:3,tag:'One umbrella. Entirely too much weather.'},
 {name:'Special Air Delivery',set:2,seq:[3,0,3,2,1,3,0,2],tools:4,tag:'Postage may vary with gravity.'},
 {name:'Lunar Laundry',set:2,seq:[1,3,2,0,3,1,0,2,3],tools:4,tag:'Even astronauts have laundry day.'},
 {name:'Midnight Catering',set:0,seq:[2,0,3,1,0,2,1,3,0,1],tools:4,tag:'Tonight, the kitchen gets the last laugh.'},
 {name:'The Grand Chase',set:1,seq:[3,2,1,0,3,1,2,0,1,3],tools:4,tag:'Catch the hat. Try to keep the dignity.'},
 {name:'One Giant Bonk',set:2,seq:[0,3,1,2,3,0,2,1,3,0,1,2],tools:4,tag:'A small step. A spectacular sound effect.'}
];
function profile(v={}){return {stars:FILMS.map((_,i)=>Math.max(0,Math.min(3,Math.floor(+v.stars?.[i]||0)))),best:FILMS.map((_,i)=>Math.max(0,+v.best?.[i]||0)),rewards:{gold:!!v.rewards?.gold,confetti:!!v.rewards?.confetti},sound:v.sound!==false,gentle:!!v.gentle,cozy:!!v.cozy};}
function merge(a,b){const p=profile(a),q=profile(b);p.stars=p.stars.map((n,i)=>Math.max(n,q.stars[i]));p.best=p.best.map((n,i)=>Math.max(n,q.best[i]));for(const k of ['gold','confetti'])p.rewards[k]||=q.rewards[k];return p;}
function unlocked(p){let i=0;while(i<8&&p.stars[i]>0)i++;return i;}
function makeRun(film=0){return {film:Math.max(0,Math.min(8,film|0)),phase:'ready',at:0,elapsed:0,cueTime:0,total:0,matched:0,perfect:0,misses:0,wrong:0,combo:0,maxCombo:0,score:0,history:[],eventId:0,event:null};}
function emit(s,type,extra={}){s.event={id:++s.eventId,type,...extra};}
function begin(s){if(s.phase!=='ready')return false;s.phase='intro';s.elapsed=0;emit(s,'start');return true;}
function expected(s){return FILMS[s.film].seq[s.at]??0;}
function windowSize(s){return s.film<2?2.5:s.film<6?2.25:2;}
function finishCue(s,ok,perfect=false){let tool=expected(s);s.history.push({tool,ok,perfect});if(ok){s.matched++;s.combo++;s.maxCombo=Math.max(s.maxCombo,s.combo);if(perfect)s.perfect++;s.score+=(perfect?160:100)+Math.min(5,s.combo-1)*20;emit(s,'hit',{tool,perfect,combo:s.combo});}else{s.misses++;s.combo=0;emit(s,'miss',{tool});}s.phase='payoff';s.elapsed=0;}
function choose(s,tool){if(s.phase!=='cue'||!Number.isInteger(tool)||tool<0||tool>=FILMS[s.film].tools)return false;if(tool!==expected(s)){if(s.cueTime<s.nextWrongAt)return false;s.wrong++;s.combo=0;s.nextWrongAt=s.cueTime+.5;emit(s,'wrong',{tool});return true;}finishCue(s,true,Math.abs(s.cueTime-.55)<.65);return true;}
function tick(s,dt,cozy=false){if(!Number.isFinite(dt)||dt<=0||s.phase==='ready'||s.phase==='end')return;dt=Math.min(.1,dt);s.total+=dt;s.elapsed+=dt;
 if(s.phase==='intro'&&s.elapsed>=2.4){s.phase='windup';s.elapsed=0;emit(s,'take');}
 else if(s.phase==='windup'&&s.elapsed>=1.6){s.phase='cue';s.elapsed=0;s.cueTime=0;s.nextWrongAt=0;emit(s,'cue',{tool:expected(s)});}
 else if(s.phase==='cue'){s.cueTime+=dt;if(!cozy&&!(s.film===0&&s.at===0)&&s.cueTime>windowSize(s))finishCue(s,false);}
 else if(s.phase==='payoff'&&s.elapsed>=1.55){s.at++;if(s.at>=FILMS[s.film].seq.length){s.phase='end';s.elapsed=0;emit(s,'end',{won:won(s)});}else{s.phase='windup';s.elapsed=0;emit(s,'take');}}
}
function won(s){return s.matched>=Math.ceil(FILMS[s.film].seq.length*.55);}
function stars(s){if(!won(s))return 0;return 1+(s.misses<=1?1:0)+(s.misses===0&&s.wrong===0?1:0);}
function record(p,s){if(s.phase!=='end')return false;p.stars[s.film]=Math.max(p.stars[s.film],stars(s));p.best[s.film]=Math.max(p.best[s.film],s.score);return true;}
function claim(p,key){if(!['gold','confetti'].includes(key)||p.rewards[key])return false;p.rewards[key]=true;return true;}
function restore(v){if(!v||!Number.isInteger(v.film)||v.film<0||v.film>8||!['ready','intro','windup','cue','payoff','end'].includes(v.phase)||!Number.isInteger(v.at)||v.at<0||v.at>FILMS[v.film].seq.length)return null;let s={...makeRun(v.film),...v};if(!['elapsed','cueTime','total','matched','perfect','misses','wrong','combo','maxCombo','score','eventId'].every(k=>Number.isFinite(s[k])&&s[k]>=0))return null;if(!Array.isArray(s.history))return null;s.event=null;s.nextWrongAt=s.cueTime;return s;}

const INK='#294447',CREAM='#f8e2b7';
function propSVG(i){let shapes=[`<path d="M26 35Q28 11 47 16Q56 23 51 42L32 46Z" fill="#a6714e"/><path d="M35 17Q37 29 31 42M41 20L37 42" stroke="#d3a17a"/><path d="M72 39Q65 15 84 14Q99 18 92 39L81 46Z" fill="#b67f55"/><path d="M81 17L79 39M88 21L86 38" stroke="#e4b38a"/><path d="M19 51L42 48M78 50L100 54M55 12L57 3M63 15L71 5" stroke="#e7b75c" stroke-width="3"/>`,`<ellipse cx="60" cy="44" rx="36" ry="9" fill="#416d74"/><path d="M24 43Q28 67 59 67Q90 67 96 43Z" fill="#6ca5b0"/><ellipse cx="60" cy="42" rx="34" ry="7" fill="#c1e5d8"/><path d="M48 42Q42 25 51 19M64 39Q67 19 63 12M76 40L83 28" fill="none" stroke="#6cb9c6" stroke-width="4"/><path d="M50 17Q44 10 51 5Q59 13 50 17ZM83 24Q78 18 85 12Q90 20 83 24Z" fill="#89d3d4"/>`,`<ellipse cx="60" cy="61" rx="35" ry="6" fill="#3e5551"/><path d="M32 54Q34 26 59 24Q84 24 88 54Z" fill="#d8aa51"/><path d="M40 47Q43 31 55 30" stroke="#ffe5a3" fill="none" stroke-width="5"/><rect x="52" y="16" width="16" height="9" rx="3" fill="#ad753d"/><ellipse cx="60" cy="16" rx="13" ry="4" fill="#f3d58e"/><path d="M19 26L12 22M99 26L106 22M28 16L24 9M92 16L96 9" stroke="#d4a459" stroke-width="3"/>`,`<path d="M50 43L45 64L76 64L69 43" fill="#ceaa7a"/><circle cx="59" cy="29" r="26" fill="#7eaaa1"/><circle cx="59" cy="29" r="21" fill="#b7c9aa"/><path d="M60 29Q43 9 48 15Q34 29 55 30M61 29Q77 12 73 17Q88 33 64 33M60 31Q66 54 61 49Q40 52 56 33" fill="#426d66"/><circle cx="60" cy="30" r="5" fill="#e9c879"/><circle cx="59" cy="29" r="23" fill="none" stroke="#e0d9ab" stroke-width="2"/>`];return `<svg viewBox="0 0 120 78" aria-hidden="true"><g stroke="${INK}" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round">${shapes[i]}</g></svg>`;}
class StudioArt{
 constructor(canvas){this.canvas=canvas;this.c=canvas.getContext('2d');this.W=0;this.H=0;this.time=0;this.fx=[];this.kick=0;this.flash=0;this.cache=null;this.resize();}
 resize(){const r=this.canvas.getBoundingClientRect();this.W=Math.max(1,r.width);this.H=Math.max(1,r.height);let d=Math.min(1.5,globalThis.devicePixelRatio||1);this.canvas.width=Math.round(this.W*d);this.canvas.height=Math.round(this.H*d);this.d=d;this.cache=null;}
 path(points,fill,stroke=INK,lw=2){let c=this.c;c.beginPath();for(const p of points){let [k,...a]=p;c[k](...a)}if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.lineJoin='round';c.lineCap='round';c.stroke()}}
 poly(p,f,s=INK,lw=2){this.path([['moveTo',...p[0]],...p.slice(1).map(a=>['lineTo',...a]),['closePath']],f,s,lw)}
 ell(x,y,rx,ry,f,s=null,lw=2){let c=this.c;c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);c.fillStyle=f;c.fill();if(s){c.strokeStyle=s;c.lineWidth=lw;c.stroke()}}
 rect(x,y,w,h,f,s=null,lw=2){let c=this.c;c.fillStyle=f;c.fillRect(x,y,w,h);if(s){c.strokeStyle=s;c.lineWidth=lw;c.strokeRect(x,y,w,h)}}
 line(x,y,X,Y,col=INK,lw=2){this.path([['moveTo',x,y],['lineTo',X,Y]],null,col,lw)}
 text(t,x,y,size=14,col=CREAM,font='Arial',align='center'){let c=this.c;c.fillStyle=col;c.font=`bold ${size}px ${font}`;c.textAlign=align;c.fillText(t,x,y)}

function library(){let total=p.stars.reduce((a,b)=>a+b,0);dialog(`<div class="eyebrow">NINE SHORT FILMS · THREE LITTLE WORLDS</div><h2>THE BONK! COLLECTION</h2><p>${total} / 27 premiere stars. Clear a film to open the next.</p><div class="films" id="filmList"></div><p>★ Premiere · ★ Miss at most one moment · ★ No misses or wrong props.</p><div class="actions" id="options"></div><p class="note">Relaxed mode waits for your sound. You can earn the same stars. Keys 1–4 play props; Escape pauses.</p><div id="social"></div><div class="actions" id="back"></div>`,'library');FILMS.forEach((f,i)=>{let b=btn('',()=>{if(i===s.film){if(s.phase==='end')reset(i);else resume()}else if(s.phase!=='ready'&&s.phase!=='end'){confirmSwitch(i)}else reset(i)},'film');b.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span><b>${i>unlocked(p)?'LOCKED':f.name}</b><small>${'★'.repeat(p.stars[i])}${'☆'.repeat(3-p.stars[i])}</small>`;b.disabled=i>unlocked(p);$('#filmList').appendChild(b)});$('#options').appendChild(btn(p.cozy?'RELAXED MODE: ON':'RELAXED MODE: OFF',()=>{p.cozy=!p.cozy;save(true);library()}));$('#options').appendChild(btn(p.gentle?'GENTLE FX: ON':'GENTLE FX: OFF',()=>{p.gentle=!p.gentle;save();library()}));$('#back').appendChild(btn('BACK TO STUDIO ↗',()=>{if(s.phase==='end')showResult();else resume()},'primary'));if(hostSupport.gold||hostSupport.confetti)$('#social').innerHTML='<p class="note">Optional GameWave extras: like this game for gold-edged Foley props; leave a direct comment for premiere confetti. These cosmetic rewards are saved for this game. Every film is playable without them.</p>'}
function confirmSwitch(i){dialog('<div class="eyebrow">CHANGE THE REEL?</div><h2>LEAVE THIS TAKE?</h2><p>Your stars and records stay. This unfinished film will restart when you return.</p><div class="actions" id="confirm"></div>','switch');$('#confirm').appendChild(btn('CHANGE FILM',()=>reset(i),'primary'));$('#confirm').appendChild(btn('KEEP THIS TAKE',library))}
function pause(){if(paused)return;dialog('<div class="eyebrow">INTERMISSION</div><h1>LET’S TAKE<br>FIVE.</h1><p>Watch the action. When a sound cue appears, tap the matching lit prop. Your first moment waits for you. Turn on Relaxed mode in the collection for a timer-free show.</p><div class="actions" id="pauseActions"></div>','pause');$('#pauseActions').appendChild(btn('BACK TO IT ↗',resume,'primary'));$('#pauseActions').appendChild(btn('FILM LIBRARY',library));$('#pauseActions').appendChild(btn('RESTART THIS FILM',()=>confirmRestart()))}
function confirmRestart(){dialog('<div class="eyebrow">FRESH REEL</div><h2>RESTART THIS FILM?</h2><p>Previously earned stars stay. This take starts over.</p><div class="actions" id="restart"></div>','restart');$('#restart').appendChild(btn('RESTART',()=>reset(),'primary'));$('#restart').appendChild(btn('KEEP THIS TAKE',resume))}
$('#start').onclick=start;$('#library').onclick=library;$('#films').onclick=library;$('#pause').onclick=pause;$('#sound').onclick=()=>{wake();p.sound=!p.sound;if(!p.sound)audio?.stop();save();hud()};$('#modal').addEventListener('cancel',e=>{e.preventDefault();if(s.phase==='end')showResult();else resume()});window.addEventListener('keydown',e=>{if(['1','2','3','4','Escape',' '].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='Escape'){if(!paused)pause();else if(s.phase!=='end')resume()}else if(!paused){if(e.key===' '&&s.phase==='ready')start();if(/^[1-4]$/.test(e.key))input(Number(e.key)-1)}});
function interrupt(){audio?.stop();if(s.phase!=='ready'&&s.phase!=='end'&&!paused)pause();save(true)}document.addEventListener('visibilitychange',()=>{if(document.hidden)interrupt();last=performance.now()});window.addEventListener('blur',interrupt);window.addEventListener('pagehide',()=>{interrupt();host.stop()});window.addEventListener('pageshow',e=>{if(e.persisted){attachHost();interrupt()}});new ResizeObserver(()=>{art.resize();art.render(s,0,p)}).observe($('#stage'));
buildPads();hud();if(resumeSaved)pause();
// Keep the game clock independent from compositor RAF throttling in embedded hosts.
let drawAt=0,logicAt=performance.now();
function advance(){let now=performance.now(),dt=Math.min(.1,Math.max(0,(now-logicAt)/1000));logicAt=now;if(document.hidden||paused)return;tick(s,dt,p.cozy);processEvent();if(s.phase==='end'&&finished&&resultDelay>0){resultDelay-=dt;if(resultDelay<=0)showResult()}if(feedbackTime>0){feedbackTime-=dt;if(feedbackTime<=0)$('#feedback').hidden=true}if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('#toast').style.opacity=0}saveTime+=dt;if(saveTime>2){saveTime=0;save()}hud()}
const logicTimer=setInterval(advance,25);
function frame(now){let dt=Math.min(.1,Math.max(0,(now-drawAt)/1000));if(!document.hidden&&(!paused||drawAt===0)&&now-drawAt>24){art.render(s,paused?0:dt,p);drawAt=now}requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();</script></body></html>
