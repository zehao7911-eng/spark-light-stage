<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BONK! STUDIO — Artbook</title><style>body{background:#233e40;color:#f7e4bd;margin:28px;font:14px Arial}h1{font-style:italic}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}canvas{display:block;width:100%;height:480px;border:2px solid #d4bc8d}p{font-size:12px;line-height:1.6;color:#bccbb8}</style><h1>BONK! STUDIO — THE THREE LITTLE WORLDS</h1><p>Original path-drawn characters, scenery, props and material colors. These are live renderer samples; play the complete game in index.html.</p><section><canvas id="a"></canvas><canvas id="b"></canvas><canvas id="c"></canvas></section><script type="module">import{StudioArt}from'./art.mjs';import{makeRun}from'./engine.mjs';for(let[id,i]of[['a',0],['b',2],['c',4]]){let a=new StudioArt(document.getElementById(id)),s=makeRun(i);s.phase='windup';s.elapsed=1;a.render(s,0,{gentle:true});}</script></html>
