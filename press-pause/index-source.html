<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#254f68"><meta name="description" content="Circle a knot. Let the whole day go. A one-finger 3D wind-down."><meta property="og:title" content="Press Pause"><meta property="og:image" content="https://zehao7911-eng.github.io/spark-light-stage/press-pause/assets/cover.jpg"><title>Press Pause — Let it go.</title><link rel="icon" href="./assets/icon.svg"><link rel="stylesheet" href="./style.css"></head><body><main id="app"><canvas id="view" aria-label="A clothed guest in a relaxation chair. Circle the glowing shoulder or forearm spot."></canvas><div id="vignette"></div><div id="flash"></div>
<header><a id="home" href="#" aria-label="Press Pause home"><img src="./assets/icon.svg" width="39" height="39" alt=""><span>PRESS<br>PAUSE</span></a><span id="stars">✦ 0</span><button id="pause" aria-label="Pause and settings">Ⅱ</button></header>
<section id="title"><div class="headline"><small>A LITTLE LESS HUSTLE.</small><h1>Press<br><i>pause.</i></h1><p>Circle a knot.<br>Let the whole day go.</p></div><div class="title-actions"><button id="play" class="big coral">LET IT GO <span>↗</span></button><div class="row"><button id="visits">GUEST BOOK</button><button id="collection">YOUR STUDIO</button></div></div></section>
<section id="hud" hidden><div><small id="visitLabel"></small><h1 id="guestName"></h1><p id="guestLine"></p></div><div class="count"><b id="count">0/3</b><small>KNOTS GONE</small></div></section>
<div id="ring" hidden aria-hidden="true"><div class="arc"></div><div class="orbit-dot"></div><span>↻</span></div><div id="echo" hidden><b id="reaction"></b><small id="cue"></small></div>
<section id="dock" hidden><div class="instruction"><b id="instruction">Circle the glowing spot.</b><small id="spotName"></small></div><button id="roll" class="big coral" aria-label="Hold to roll automatically">HOLD TO ROLL <span>↻</span></button><small class="assist">Or trace the circle yourself for a third star.</small></section>
<section id="overlay" role="dialog" aria-modal="true" aria-labelledby="panelTitle" hidden><div id="sheet"><small id="panelTag"></small><h2 id="panelTitle"></h2><div id="panelBody"></div><div id="actions"></div></div></section>
<section id="error" hidden><div><h2>A little extra breathing room?</h2><p>This browser could not start the 3D scene. Please try with WebGL enabled.</p><button id="reload" class="big coral">RELOAD</button></div></section>
</main><script src="./vendor/three.min.js"></script><script type="module" src="./game.mjs"></script></body></html>
