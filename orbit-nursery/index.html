</style></head><body><main><header><div class="brand"><span class="orb">◉</span><div>ORBIT NURSERY<small>LITTLE LIFE. INFINITE SPACE.</small></div></div><div class="bank"><b id="energy">0</b><small>ENERGY</small><button id="sound" aria-label="Toggle sound">♪</button><button id="album" aria-label="Creature collection">▦</button></div></header><div class="strip"><button id="planet">◈ MOON MEADOW</button><span id="rate">0 / sec</span><span id="slots">2 / 6</span></div><section id="view"><canvas id="game" aria-label="Space nursery with growing alien companions"></canvas><div id="cue">HOLD FEED. WATCH THEM GROW.</div><div id="selected" hidden><span id="selected-name"></span><button id="keep">♡ Keep</button></div><div id="income"></div></section><div class="stats"><span id="grown">0 grown</span><span id="discovered">0 / 12 discovered</span><span id="sent">0 sent home</span></div><footer><button id="hatch"><b>◉ Hatch 3</b><small id="eggcost">40 ENERGY</small></button><button id="feed" class="feed"><b>✦ Feed</b><small>HOLD TO FEED</small></button><button id="dispatch"><b>↗ Send home</b><small id="salevalue">0 ENERGY</small></button></footer><div class="tools"><button data-up="food"><b>✧ Superfood</b><small id="food-info"></small><strong id="food-cost"></strong></button><button data-up="auto"><b>⌁ Feeder bot</b><small id="auto-info"></small><strong id="auto-cost"></strong></button><button data-up="space"><b>⊞ Expand</b><small id="space-info"></small><strong id="space-cost"></strong></button></div><p class="hint">Keep grown companions for income · Send them home for a quick boost</p><dialog id="modal"><button id="close" aria-label="Close">×</button><div id="content"></div></dialog><div id="toast" role="status"></div></main><script>'use strict';
const $=s=>document.querySelector(s),cv=$('#game'),c=cv.getContext('2d'),W=600,H=420;
const worlds=[{name:'MOON MEADOW',color:'#8e9cf1',cost:40},{name:'CORAL NEBULA',color:'#e894b1',cost:95},{name:'JADE ORBIT',color:'#84d7ba',cost:190},{name:'SOLAR NEST',color:'#e6bd78',cost:360}];
const species=[['Bloop','#97d6e5',0,24,.6],['Moonbun','#b7adea',1,34,.8],['Starwing','#b8e7d3',2,55,1.2],['Rosie','#efa9bd',3,65,1.5],['Velvet','#d3abeb',4,80,1.8],['Comet','#f1c6b1',5,120,2.4],['Sprig','#a2dfb3',0,130,2.7],['Pebble','#9bd3ce',3,160,3.2],['Aurora','#c5ecc7',2,230,4.5],['Solaris','#f0cc8a',4,270,5.5],['Noodle','#e4b99d',5,330,6.5],['Nova','#e8d7b0',1,470,9]].map(([name,col,shape,value,rate])=>({name,col,shape,value,rate}));
let book={energy:0,food:0,auto:0,space:0,world:0,found:Array(12).fill(0),sent:0,hatched:0,creatures:[],sound:true},beasts=[],food=[],effects=[],floats=[],rockets=[],time=0,last=0,held=false,feedClock=0,autoClock=0,saveClock=0,uiClock=0,Vw=600,Vh=420,offX=0,offY=0,selected=null,ac,toastId,uid=1,income=0;
try{book={...book,...JSON.parse(localStorage.getItem('orbit-nursery-v1')||'{}')}}catch{}
const capacity=()=>6+book.space*4,cost=k=>Math.round(({food:35,auto:65,space:100}[k])*Math.pow(1.8,book[k])),fmt=n=>n>=1e4?(n/1000).toFixed(1)+'k':Math.floor(n).toLocaleString('en-US'),adult=a=>a.growth>=100,value=a=>Math.round(species[a.id].value*(a.shiny?2.5:1)),rate=a=>species[a.id].rate*(a.shiny?2:1);
function round(ctx,x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function ell(ctx,x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function line(ctx,pts,col,width=2){ctx.strokeStyle=col;ctx.lineWidth=width;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}function poly(ctx,pts,col){ctx.fillStyle=col;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}
function critter(ctx,id,x,y,size=1,t=0,shiny=false){const s=species[id],co=shiny?'#ffe5a2':s.col;ctx.save();ctx.translate(x,y);ctx.scale(size,size);ell(ctx,0,15,23,6,'#070e2840');const wiggle=Math.sin(t*5+id)*3;if(s.shape===0){line(ctx,[[-12,-8],[-23,-22],[-27,-18]],co,5);line(ctx,[[12,-8],[20,-25],[27,-21]],co,5);ell(ctx,0,0,23,20,'#283456');ell(ctx,0,-2,21,18,co);ell(ctx,-8,-9,7,5,'#ffffff35');ell(ctx,-13,15,8,5,co);ell(ctx,12,15,8,5,co)}else if(s.shape===1){ell(ctx,-12,-23,7,19,'#283456');ell(ctx,11,-24,7,19,'#283456');ell(ctx,-12,-24,5,17,co);ell(ctx,11,-25,5,17,co);ell(ctx,-12,-24,2,11,'#f7d4e5');ell(ctx,11,-25,2,11,'#f7d4e5');ell(ctx,0,2,23,21,'#283456');ell(ctx,0,0,21,19,co);ell(ctx,-13,17,8,4,co);ell(ctx,13,17,8,4,co)}else if(s.shape===2){poly(ctx,[[-10,5],[-43,-17-wiggle],[-33,10],[-14,15]],'#283456');poly(ctx,[[10,5],[43,-17-wiggle],[33,10],[14,15]],'#283456');poly(ctx,[[-11,4],[-39,-13-wiggle],[-30,8],[-12,12]],co);poly(ctx,[[11,4],[39,-13-wiggle],[30,8],[12,12]],co);ell(ctx,0,0,17,21,co);line(ctx,[[0,15],[0,25],[5,29]],co,4)}else if(s.shape===3){for(const side of[-1,1])for(let j=0;j<3;j++)line(ctx,[[side*14,-7+j*8],[side*26,-14+j*10+wiggle]],co,4);ell(ctx,0,0,23,21,'#283456');ell(ctx,0,-2,21,19,co);ell(ctx,0,-14,19,13,co);line(ctx,[[0,-30],[0,-6]],'#ffffff45',2);ell(ctx,-7,-22,3,3,'#ffffff55')}else if(s.shape===4){const pts=[];for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?16:30;pts.push([Math.cos(a)*r,Math.sin(a)*r])}poly(ctx,pts,'#283456');ctx.scale(.92,.92);poly(ctx,pts,co);ell(ctx,-8,-9,7,5,'#ffffff35')}else{for(let j=0;j<5;j++)line(ctx,[[-17+j*8,9],[-18+j*9+wiggle,23],[-21+j*10,29]],co,5);ell(ctx,0,-5,24,23,'#283456');ell(ctx,0,-7,22,21,co);ell(ctx,-9,-17,7,4,'#ffffff35')}
ell(ctx,-7,-2,4,6,'#263654');ell(ctx,7,-2,4,6,'#263654');ell(ctx,-8,-4,1.5,2,'#ffffff');ell(ctx,6,-4,1.5,2,'#ffffff');ell(ctx,-15,6,4,2,'#f2a6b780');ell(ctx,15,6,4,2,'#f2a6b780');line(ctx,[[-3,6],[0,8],[3,6]],'#4d5f78',1.7);if(shiny){line(ctx,[[-29,-30],[-29,-23]],'#ffe8b3',2);line(ctx,[[-33,-26],[-25,-26]],'#ffe8b3',2);ell(ctx,13,-15,2,2,'#ffffff');ell(ctx,-15,0,1.5,1.5,'#ffffff')}ctx.restore()}
const sprites=species.map((_,id)=>{const v=document.createElement('canvas');v.width=v.height=120;critter(v.getContext('2d'),id,60,66,1.3);return v.toDataURL()});
function sound(kind){if(!book.sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();const seq={feed:[520,650],eat:[880],grow:[540,720,1080],hatch:[420,680,960],send:[650,850,1200],up:[500,750,1000]}[kind]||[440];seq.forEach((f,i)=>{const t=ac.currentTime+i*.07,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.85,t+.12);g.gain.setValueAtTime(kind==='eat'?.015:.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.18)})}catch{}}
function save(){book.creatures=beasts;try{localStorage.setItem('orbit-nursery-v1',JSON.stringify(book))}catch{}}
function spawn(id,shiny=false){const a={uid:uid++,id,shiny,x:90+Math.random()*420,y:150+Math.random()*140,growth:0,face:1,phase:Math.random()*7,hatch:1.5,glow:0,keep:false,target:{x:90+Math.random()*420,y:155+Math.random()*145}};beasts.push(a);book.found[id]++;book.hatched++;return a}
if(book.creatures?.length){beasts=book.creatures;uid=Math.max(...beasts.map(a=>a.uid))+1}else if(book.hatched===0){spawn(0);spawn(1);save()}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('on');clearTimeout(toastId);toastId=setTimeout(()=>$('#toast').classList.remove('on'),2400)}
function burst(x,y,col,n=20){for(let i=0;i<n;i++)effects.push({x,y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*100,life:.4+Math.random()*.6,col});if(effects.length>250)effects.splice(0,effects.length-250)}
function hatch(){const w=worlds[book.world];if(!beasts.length&&book.energy<w.cost){const a=spawn(0);burst(a.x,a.y,'#b7bafa',20);sound('hatch');save();ui();toast('A rescue capsule arrived · one free Bloop');return}if(book.energy<w.cost||beasts.length+3>capacity())return;book.energy-=w.cost;const ids=[];for(let j=0;j<3;j++){const r=Math.random(),id=book.world*3+(r<.62?0:r<.91?1:2),shiny=Math.random()<.06,a=spawn(id,shiny);ids.push(species[id].name+(shiny?' ✧':''));burst(a.x,a.y,'#b7bafa',18)}sound('hatch');save();ui();toast('Hatching · '+ids.join(' · '))}
function pellet(manual=true){if(food.length>=50)return;const babies=beasts.filter(a=>!adult(a)),who=(babies.length?babies:beasts)[Math.floor(Math.random()*(babies.length||beasts.length))];if(!who)return;food.push({x:Math.max(65,Math.min(535,who.x+(Math.random()-.5)*60)),y:Math.max(140,Math.min(320,who.y+(Math.random()-.5)*40)),life:5,scale:1});if(manual&&Math.floor(time*5)%3===0)sound('feed')}
function grow(a){a.growth=100;a.glow=2;burst(a.x,a.y,species[a.id].col,28);floats.push({s:'GROWN! ✦',x:a.x,y:a.y-45,life:1.6});sound('grow');navigator.vibrate?.(12)}
function dispatch(){const send=beasts.filter(a=>adult(a)&&!a.keep);if(!send.length)return;let total=0;for(const a of send){total+=value(a);rockets.push({...a,t:0});burst(a.x,a.y,'#d7d4fc',12)}const ids=new Set(send.map(a=>a.uid));beasts=beasts.filter(a=>!ids.has(a.uid));book.energy+=total;book.sent+=send.length;selected=null;sound('send');save();ui();toast(send.length+' companions sent home · +'+fmt(total)+' energy')}
function upgrade(k){const price=cost(k);if(book.energy<price||book[k]>=8)return;book.energy-=price;book[k]++;sound('up');save();ui();toast(k==='space'?'Habitat expanded · new worlds unlocked':k==='auto'?'Feeder bot upgraded · meals on their way':'Superfood upgraded · faster growth')}
function show(h){held=false;$('#feed').classList.remove('active');$('#content').innerHTML=h;if(!$('#modal').open)$('#modal').showModal()}
function worldsMenu(){show('<div class="eyebrow">NEW SIGNALS. NEW LITTLE FRIENDS.</div><h1>Choose an egg signal</h1><div class="planet-cards">'+worlds.map((w,i)=>'<button data-world="'+i+'" '+(book.space<i?'disabled':'')+'><b>'+w.name+'</b><small>'+w.cost+' energy / 3 eggs<br>'+(book.space<i?'Expand to level '+i:'Three species to discover')+'</small></button>').join('')+'</div>');document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{book.world=+b.dataset.world;$('#modal').close();save();ui()})}
function album(){show('<div class="eyebrow">LIFE FINDS A WAY. EVEN OUT HERE.</div><h1>Your cosmic companions</h1><div class="cards">'+species.map((s,i)=>'<div class="card '+(!book.found[i]?'locked':'')+'"><img src="'+sprites[i]+'" alt="'+(book.found[i]?s.name:'Undiscovered')+'"><b>'+(book.found[i]?s.name:'???')+'</b><small>'+book.found[i]+' hatched · '+s.rate+' energy/sec</small></div>').join('')+'</div>')}
function tick(dt){time+=dt;income=beasts.filter(adult).reduce((n,a)=>n+rate(a),0);book.energy+=income*dt;if(held){feedClock-=dt;if(feedClock<=0){pellet();feedClock=.2}}else feedClock=0;if(book.auto>0){autoClock-=dt;if(autoClock<=0){for(let i=0;i<Math.min(4,book.auto);i++)pellet(false);autoClock=1.6/(1+book.auto*.25)}}for(const a of beasts){a.hatch=Math.max(0,a.hatch-dt);a.glow=Math.max(0,a.glow-dt);a.phase+=dt;const was=adult(a);if(!was){a.growth+=dt*(.35+book.food*.1);if(a.growth>=100)grow(a)}let target=a.target,best=90;for(const f of food){if(f.life<=0)continue;const d=Math.hypot(f.x-a.x,f.y-a.y);if(d<best){best=d;target=f}}if(target){const dx=target.x-a.x,dy=target.y-a.y,d=Math.hypot(dx,dy),speed=target.life?70:18;if(d>5){a.x+=dx/d*Math.min(speed,d*3)*dt;a.y+=dy/d*Math.min(speed,d*3)*dt;a.face=dx<0?-1:1}else if(target.life){target.life=0;if(!adult(a)){a.growth+=16+book.food*5;if(a.growth>=100)grow(a)}a.glow=Math.max(a.glow,.22);burst(a.x,a.y-15,'#b0f0d1',4);sound('eat')}else a.target={x:80+Math.random()*440,y:145+Math.random()*165}}}food.forEach(f=>f.life-=dt);food=food.filter(f=>f.life>0);for(const q of effects){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.exp(-dt*2);q.vy*=Math.exp(-dt*2)}effects=effects.filter(q=>q.life>0);for(const f of floats){f.life-=dt;f.y-=13*dt}floats=floats.filter(f=>f.life>0);rockets.forEach(a=>a.t+=dt*.55);rockets=rockets.filter(a=>a.t<1);saveClock+=dt;if(saveClock>1){saveClock=0;save()}}
function background(){const world=worlds[book.world];const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111b3d');g.addColorStop(1,'#253153');c.fillStyle=g;c.fillRect(0,0,W,H);for(let i=0;i<90;i++){const x=(i*71+23)%600,y=(i*53+11)%260;c.globalAlpha=.35+.35*Math.sin(time*.4+i);ell(c,x,y,i%7===0?1.8:.8,i%7===0?1.8:.8,'#d2dfff')}c.globalAlpha=1;const ng=c.createRadialGradient(485,92,5,485,92,140);ng.addColorStop(0,world.color+'45');ng.addColorStop(1,world.color+'00');c.fillStyle=ng;c.fillRect(320,0,280,245);ell(c,485,78,51,51,'#3e496c');ell(c,479,72,48,47,world.color+'80');ell(c,459,54,13,9,'#dde3e330');ell(c,497,84,11,7,'#c8dece20');c.save();c.translate(483,77);c.rotate(-.3);c.strokeStyle='#b9bfe277';c.lineWidth=5;c.beginPath();c.ellipse(0,0,79,16,0,0,7);c.stroke();c.restore();round(c,35,95,530,270,24,'#09112d');round(c,40,101,520,257,21,'#64708a');round(c,46,108,508,243,18,'#1c2c49');const floor=c.createLinearGradient(0,130,0,355);floor.addColorStop(0,'#233754');floor.addColorStop(1,'#334762');round(c,53,118,494,225,14,floor);c.strokeStyle='#85adba22';c.lineWidth=1;for(let y=159;y<340;y+=36){c.beginPath();c.moveTo(58,y);c.lineTo(543,y);c.stroke()}for(let x=84;x<535;x+=48){c.beginPath();c.moveTo(x,124);c.lineTo(x,339);c.stroke()}for(const x of[64,536]){round(c,x-3,133,6,180,3,'#698ba9');round(c,x-1,136,2,174,2,'#b2d9dd')}round(c,230,332,140,11,5,'#556e81');round(c,257,333,86,3,1,'#a2dae0');for(const x of[118,480]){ell(c,x,338,27,6,'#121f35');round(c,x-16,311,32,26,6,'#607c84');ell(c,x,312,16,6,'#a2c9bc');line(c,[[x,311],[x-6,283],[x-13,276]],'#97cbb7',3);line(c,[[x,311],[x+8,287],[x+15,284]],'#97cbb7',3);ell(c,x-11,283,8,4,'#94c8b4');ell(c,x+12,290,7,4,world.color)}round(c,215,365,170,31,10,'#263c59');round(c,230,374,140,12,5,'#445976');for(let j=0;j<5;j++)round(c,245+j*23,377,14,6,2,j<book.space+1?'#a5dfc4':'#677e99');if(book.auto){round(c,285,107,30,11,4,'#bac9d6');ell(c,300,111,3,3,'#9ce6cf');line(c,[[300,115],[300,128]],'#bcc7d7',2)}}
function render(){offX=(Vw-W)/2;offY=(Vh-H)/2;c.fillStyle='#192641';c.fillRect(0,0,Vw,Vh);c.save();c.translate(offX,offY);background();for(const f of food){ell(c,f.x,f.y+3,4,1.5,'#0e233a55');ell(c,f.x,f.y,3,3,'#d3efb4');ell(c,f.x-1,f.y-1,1,1,'#ffffff')}const actors=beasts.slice().sort((a,b)=>a.y-b.y);for(const a of actors){const size=adult(a)?1:.5+a.growth/200,y=a.y+Math.sin(a.phase*2)*4;if(a.glow>0){const g=c.createRadialGradient(a.x,y,5,a.x,y,48);g.addColorStop(0,species[a.id].col+'66');g.addColorStop(1,species[a.id].col+'00');c.fillStyle=g;c.fillRect(a.x-48,y-48,96,96)}if(a.hatch>0){c.save();c.translate(a.x,y);c.rotate(Math.sin(time*16)*.1);ell(c,0,-8,17,23,'#e8d9f2');ell(c,-5,-18,5,7,'#ffffff88');ell(c,4,-2,4,3,worlds[Math.floor(a.id/3)].color);line(c,[[-8,-9],[-2,-5],[2,-10],[9,-7]],'#958ab4',2);c.restore()}else{critter(c,a.id,a.x,y,size,a.phase,a.shiny);if(!adult(a)){round(c,a.x-15,y+31,30,3,2,'#142742');round(c,a.x-15,y+31,30*a.growth/100,3,2,'#b6d4b5')}else{ell(c,a.x+24,y-22,3,3,a.keep?'#f0d49e':'#a4e7c9');if(a.keep){c.font='10px system-ui';c.textAlign='center';c.fillStyle='#f6dda4';c.fillText('♥',a.x,y-45)}}if(adult(a)&&Math.sin(time*1.5+a.uid)>.35){const f=(time*.4+a.uid*.19)%1,x=a.x+(300-a.x)*f,yy=y+(370-y)*f;ell(c,x,yy,2,2,'#b4f0d399')}if(a.uid===selected){c.strokeStyle='#cbd5f188';c.lineWidth=1;c.beginPath();c.ellipse(a.x,y+19,29,8,0,0,7);c.stroke()}}}for(const a of rockets){const y=a.y-a.t*400,x=a.x+Math.sin(a.t*5)*12;critter(c,a.id,x,y,1-a.t*.4,time,a.shiny);line(c,[[x,y+30],[x,y+60]],'#b7e4e388',3)}for(const q of effects){c.globalAlpha=Math.min(1,q.life);ell(c,q.x,q.y,2,2,q.col)}for(const f of floats){c.globalAlpha=Math.min(1,f.life);c.font='bold 10px system-ui';c.textAlign='center';c.fillStyle='#e3e9ba';c.fillText(f.s,f.x,f.y)}c.globalAlpha=1;c.restore()}
function ui(){const adults=beasts.filter(adult),sum=adults.filter(a=>!a.keep).reduce((n,a)=>n+value(a),0);$('#energy').textContent=fmt(book.energy);$('#planet').textContent='◈ '+worlds[book.world].name+' ▾';$('#rate').textContent=income.toFixed(1)+' / sec';$('#slots').textContent=beasts.length+' / '+capacity();$('#grown').textContent=adults.length+' grown';$('#discovered').textContent=book.found.filter(n=>n>0).length+' / 12 discovered';$('#sent').textContent=book.sent+' sent home';$('#salevalue').textContent=fmt(sum)+' ENERGY';$('#dispatch').disabled=!sum;const rescue=!beasts.length&&book.energy<worlds[book.world].cost;$('#hatch').disabled=!rescue&&(book.energy<worlds[book.world].cost||beasts.length+3>capacity());$('#hatch b').textContent=rescue?'◉ Rescue egg':'◉ Hatch 3';$('#eggcost').textContent=rescue?'FREE CAPSULE':worlds[book.world].cost+' ENERGY';$('#income').textContent=income>0?'+'+income.toFixed(1)+' ENERGY / SEC':'';for(const k of['food','auto','space']){$('[data-up="'+k+'"]').disabled=book.energy<cost(k)||book[k]>=8;$('#'+k+'-cost').textContent=book[k]>=8?'MAX':fmt(cost(k))+' ✦';$('#'+k+'-info').textContent=k==='food'?'Growth boost · Lv '+book.food:k==='auto'?'Automatic meals · Lv '+book.auto:capacity()+' → '+(capacity()+4)+' companions'}const a=beasts.find(a=>a.uid===selected);$('#selected').hidden=!a;if(a){$('#selected-name').textContent=species[a.id].name+(a.shiny?' ✧':'')+' · '+(adult(a)?rate(a)+' / sec':Math.floor(a.growth)+'% grown');$('#keep').textContent=a.keep?'♥ Kept':'♡ Keep'}$('#cue').textContent=beasts.length?'HOLD FEED. WATCH THEM GROW.':'HATCH A NEW LITTLE UNIVERSE.'}
$('#hatch').onclick=hatch;$('#dispatch').onclick=dispatch;$('#planet').onclick=worldsMenu;$('#album').onclick=album;$('#close').onclick=()=>{$('#modal').close();held=false};$('#sound').onclick=()=>{book.sound=!book.sound;$('#sound').style.opacity=book.sound?1:.4;save()};$('#keep').onclick=()=>{const a=beasts.find(a=>a.uid===selected);if(a){a.keep=!a.keep;save();ui()}};document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>upgrade(b.dataset.up));$('#feed').onpointerdown=e=>{e.preventDefault();if($('#modal').open)return;$('#feed').setPointerCapture(e.pointerId);held=true;$('#feed').classList.add('active');pellet();sound('feed')};$('#feed').onpointerup=$('#feed').onpointercancel=()=>{held=false;$('#feed').classList.remove('active');save()};cv.onpointerdown=e=>{if($('#modal').open)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*Vw/r.width-offX,y=(e.clientY-r.top)*Vh/r.height-offY;let chosen=null,dist=42;for(const a of beasts){const d=Math.hypot(a.x-x,a.y-y);if(d<dist){dist=d;chosen=a}}selected=chosen?.uid||null;ui()};window.addEventListener('blur',()=>{held=false;$('#feed').classList.remove('active');save()});document.addEventListener('visibilitychange',()=>{held=false;$('#feed').classList.remove('active');save()});function resize(){const r=cv.getBoundingClientRect();Vw=Math.max(600,r.width/r.height*420);Vh=Vw*r.height/r.width;const d=Math.min(1.5,devicePixelRatio||1);cv.width=Math.round(Vw*d);cv.height=Math.round(Vh*d);c.setTransform(d,0,0,d,0,0);render()}window.addEventListener('resize',resize);ui();resize();function frame(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(!document.hidden&&!$('#modal').open){tick(dt);uiClock+=dt;if(uiClock>.15){uiClock=0;ui()}render()}requestAnimationFrame(frame)}requestAnimationFrame(frame);window.__orbit={get book(){return book},get beasts(){return beasts},get layout(){return{Vw,Vh,offX,offY}},advance(seconds){for(let i=0;i<Math.ceil(seconds*60);i++){if(document.hidden||$('#modal').open)break;tick(1/60)}ui();render()}};
