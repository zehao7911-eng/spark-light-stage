<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#134e64"><title>Pearl Post · Special little deliveries</title><link rel="stylesheet" href="pearl-post.css"></head><body>
<canvas id="sea" aria-label="Otter and pearl sliding puzzle"></canvas>
<header><div class="brand"><span>✉</span><div>PEARL POST<small>SPECIAL LITTLE DELIVERIES</small></div></div><div class="toptools"><button id="restart" aria-label="Restart this puzzle" title="Restart">↶</button><button id="sound" aria-label="Toggle sound" aria-pressed="true">♪</button></div></header>
<div class="hud"><div><small>DELIVERY</small><b id="level">01</b></div><div id="goals" aria-label="Pearl deliveries"></div><div><small>SLIDES</small><b id="moves">0</b></div></div>
<p id="tip">Swipe. Slide. Send the pearls home.</p><div id="toast" role="status"></div>
<div id="playfield" role="application" aria-label="Swipe to slide every piece. Match pearls to shells. Arrow keys also work." tabindex="0"></div>
<footer><nav aria-label="Slide direction"><button data-dir="3" aria-label="Slide left">←</button><button data-dir="0" aria-label="Slide up">↑</button><button data-dir="2" aria-label="Slide down">↓</button><button data-dir="1" aria-label="Slide right">→</button></nav><div class="extras"><button id="undo" aria-label="Undo last slide">↩<small>UNDO</small></button><button id="hint" aria-label="Show next useful direction">✦<small>HINT</small></button><button id="book"><span>✉</span><div><small>POSTCARDS</small><b><span id="stamps">0</span><i> / 4</i></b><div class="meter"><em id="meter"></em></div></div><span>↗</span></button></div></footer>
<section id="win" hidden><div class="winpanel"><small>SIGNED, SEALED, DELIVERED</small><h1>Special delivery!</h1><div id="winbadges"></div><p id="reward"></p><button id="next">NEXT DELIVERY <span>→</span></button></div></section>
<section id="album" hidden><div class="albumpanel"><button id="closealbum" aria-label="Close postcard book">×</button><small>LITTLE PLACES. HAPPY MEMORIES.</small><h2>Wish you were here.</h2><p id="albumtext"></p><div id="cards"></div></div></section>
<script src="pearl-post-engine.js"></script><script src="pearl-post-levels.js"></script><script src="pearl-post.js"></script></body></html>
