function interact(x,y){if(paused)return;let result=E.interact(state,x,y,Math.max(30,22/cam.z));if(!result){fx.push({kind:'poke',text:'…',x,y,life:.65});return}for(let e of state.events){if(e.type==='found'){$('clue').style.display='none';voice('found');fx.push({kind:'found',x:e.x,y:e.y,life:1});toast(state.targets[e.index].name+'!');E.reward(state,profile);update();save();if(state.complete&&!state.completeNotified){state.completeNotified=true;milestone(true)}else if(state.unlocked&&!state.notified){state.notified=true;milestone(false)}}else{voice(e.kind);fx.push({kind:'poke',text:words[e.kind]||'BOOP!',x:e.x,y:e.y,life:1})}}if(fx.length>24)fx.splice(0,fx.length-24);save()}
function bind(id,fn){let el=$(id);el.addEventListener('pointerup',e=>{e.preventDefault();lastPointer=performance.now();fn()});el.addEventListener('click',e=>{if(e.detail===0||performance.now()-lastPointer>600)fn()})}document.addEventListener('click',e=>{if(e.isTrusted&&e.detail>0&&performance.now()-lastPointer<600){e.preventDefault();e.stopImmediatePropagation()}},true);
function overlay(html,type){mode=type;paused=true;pointers.clear();gesture=null;hush();$('overlay').classList.remove('hidden');$('card').className=type;$('card').innerHTML=html;save()}
function play(){mode='play';paused=false;$('overlay').classList.add('hidden');ensureAudio();save()}
function intro(){overlay('<canvas id="hero" width="80" height="80"></canvas><h2>Whispering Folks</h2><p>Find the faces below.<br>Poke everything. Every corner has a secret.</p><button id="go">'+(loaded?'CONTINUE':'LET’S LOOK')+'</button>','intro');A.icon($('hero').getContext('2d'),0);bind('go',play)}
function milestone(full){overlay('<div class="badge">'+(full?'✦':'✓')+'</div><h2>'+(full?'Every little secret!':state.level===2?'Two secrets to go':'A new place awaits')+'</h2><p>'+state.found+' / 8 found'+(full?' · postcard earned':'')+'</p><button id="stay">KEEP LOOKING</button>'+(state.level<2?'<button id="travel">NEXT PLACE →</button>':'<button id="collection">ALBUM</button>'),'milestone');bind('stay',play);if(state.level<2)bind('travel',()=>start(state.level+1,state.day));else bind('collection',album)}
function start(level,day=0){toastTime=0;if($('toast'))$('toast').textContent='';state=E.create(level,day);cam={x:620,y:470,z:innerWidth<600?.9:.8};fx=[];hint=null;$('clue').style.display='none';rebuild();clamp();play()}
function pause(){if(mode==='play'){overlay('<div class="badge">Ⅱ</div><h2>A little breather</h2><p>Drag to explore. Pinch to zoom.<br>Tap a portrait for a clue.</p><button id="resume">KEEP LOOKING</button><div class="row"><button id="collection">ALBUM</button><button id="retry">RESTART PLACE</button></div>','pause');bind('resume',play);bind('collection',album);bind('retry',()=>confirmStart(state.level,state.day))}else if(mode==='pause')play()}
function confirmStart(level,day){overlay('<h2>A fresh look?</h2><p>Restart this place.<br>Your collected postcards stay.</p><button id="yes">START</button><button id="no">BACK</button>','confirm');bind('yes',()=>start(level,day));bind('no',album)}
function postcard(level){let c=document.createElement('canvas');c.width=1240;c.height=940;let a=c.getContext('2d'),s=E.create(level,0);for(let p of s.props)if(p.id.startsWith('cover'))p.progress=p.needed;for(let t of s.targets)t.found=true;A.base(a,s,profile.paper);A.draw(a,s,profile.paper,[],null);return c}
function downloadCard(){let c=postcard(state.level),a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='Whispering-Folks-'+(state.level+1)+'.png';a.click()}
function album(){overlay('<div class="badge">▤</div><h2>Little Discoveries</h2><p>'+Object.keys(profile.seen).length+' / 24 found · '+profile.coins+' stamps</p><div class="row">'+E.info.map((i,n)=>'<button id="scene'+n+'" '+(n>profile.unlocked?'disabled':'')+'>'+(profile.stamps[n]?'<canvas id="postcard'+n+'" width="124" height="94"></canvas>':'')+['Camp','Market','Harbour'][n]+'<br>'+(profile.stamps[n]?'✦ 8 / 8':Object.keys(profile.seen).filter(k=>k.startsWith(n+'-')).length+' / 8')+'</button>').join('')+'</div><p>Change the paper</p><div class="row">'+['Ivory','Sepia','Night'].map((n,i)=>'<button id="paper'+i+'">'+n+' '+(profile.owned.includes(i)?profile.paper===i?'✓':'':[0,14,22][i]+' ◇')+'</button>').join('')+'</div>'+(Object.keys(profile.stamps).length===3?'<button id="newday">ANOTHER DAY</button>':'')+(profile.stamps[state.level]?'<button id="download">SAVE POSTCARD</button>':'')+'<button id="back">BACK</button>','album');if($('download'))bind('download',downloadCard);for(let i=0;i<3;i++){if($('postcard'+i))$('postcard'+i).getContext('2d').drawImage(postcard(i),0,0,124,94);bind('scene'+i,()=>confirmStart(i,state.day));bind('paper'+i,()=>{let cost=[0,14,22][i];if(profile.owned.includes(i))profile.paper=i;else if(profile.coins>=cost){profile.coins-=cost;profile.owned.push(i);profile.paper=i}rebuild();save();album()})}if($('newday'))bind('newday',()=>confirmStart(0,state.day+1));bind('back',play)}
function zoom(f,x=rect.left+w/2,y=rect.top+h/2){let old=worldAt(x,y);cam.z=Math.max(.25,Math.min(2,cam.z*f));let now=worldAt(x,y);cam.x+=old.x-now.x;cam.y+=old.y-now.y;clamp();draw();save()}
bind('minus',()=>{if(mode==='play')zoom(1/1.25)});bind('plus',()=>{if(mode==='play')zoom(1.25)});bind('home',()=>{if(mode!=='play')return;cam.z=Math.min(w/E.W,h/E.H)*.96;cam.x=620;cam.y=470;clamp();draw();save()});bind('pause',pause);bind('album',album);bind('next',()=>{if(state.unlocked&&mode==='play')start(state.level+1,state.day)});bind('sound',()=>{muted=!muted;$('sound').textContent=muted?'♫×':'♪';if(master)master.gain.setTargetAtTime(muted||paused?0:.12,audio.currentTime,.01);save()});bind('hint',()=>{if(paused||state.selected<0)return;let t=state.targets[state.selected];if(t.found)return;state.hints++;let x=Math.floor(t.x/310)*310+155,y=Math.floor(t.y/235)*235+117;hint={x,y,life:5};cam.x=x;cam.y=y;cam.z=Math.max(cam.z,Math.min(1.4,w/330));clamp();draw();save()});$('sound').textContent=muted?'♫×':'♪';
canvas.addEventListener('pointerdown',e=>{if(paused)return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){gesture={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y,moved:false};suppressTap=false}else if(pointers.size===2){let q=[...pointers.values()];gesture={pinch:true,d:Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),z:cam.z,cx:cam.x,cy:cam.y,mid:{x:(q[0].x+q[1].x)/2,y:(q[0].y+q[1].y)/2}};gesture.anchor=worldAt(gesture.mid.x,gesture.mid.y);suppressTap=true}});
canvas.addEventListener('pointermove',e=>{if(paused||!pointers.has(e.pointerId)||!gesture)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(gesture.pinch&&pointers.size>=2){let q=[...pointers.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),mid={x:(q[0].x+q[1].x)/2,y:(q[0].y+q[1].y)/2};cam.z=Math.max(.25,Math.min(2,gesture.z*d/Math.max(gesture.d,5)));cam.x=gesture.anchor.x-(mid.x-rect.left-w/2)/cam.z;cam.y=gesture.anchor.y-(mid.y-rect.top-h/2)/cam.z;clamp()}else if(!gesture.pinch){let dx=e.clientX-gesture.sx,dy=e.clientY-gesture.sy;if(Math.hypot(dx,dy)>7)gesture.moved=true;if(gesture.moved){cam.x=gesture.cx-dx/cam.z;cam.y=gesture.cy-dy/cam.z;clamp()}}draw()});
function release(e,cancel=false){if(!pointers.has(e.pointerId))return;let g=gesture;pointers.delete(e.pointerId);if(!pointers.size){if(!cancel&&!suppressTap&&g&&!g.moved&&!g.pinch&&mode==='play'){let q=worldAt(e.clientX,e.clientY);interact(q.x,q.y)}gesture=null;suppressTap=false;save()}else{suppressTap=true;let p=[...pointers.values()][0];gesture={sx:p.x,sy:p.y,cx:cam.x,cy:cam.y,moved:true}}}canvas.addEventListener('pointerup',e=>release(e));canvas.addEventListener('pointercancel',e=>release(e,true));canvas.addEventListener('wheel',e=>{e.preventDefault();if(mode==='play')zoom(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='Enter'&&mode==='intro')play();if(e.key==='Escape')pause();if(paused)return;let step=80/cam.z;if(e.key==='ArrowLeft'||e.key==='a')cam.x-=step;if(e.key==='ArrowRight'||e.key==='d')cam.x+=step;if(e.key==='ArrowUp'||e.key==='w')cam.y-=step;if(e.key==='ArrowDown'||e.key==='s')cam.y+=step;if(e.key==='+'||e.key==='=')zoom(1.25);if(e.key==='-')zoom(1/1.25);if(e.key==='h'&&state.selected>=0)$('hint').click();clamp();draw();save()});window.addEventListener('blur',()=>{if(mode==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});
function draw(){if(!rect)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=A.palettes[profile.paper][1];ctx.fillRect(0,0,w,h);ctx.translate(w/2,h/2);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);ctx.drawImage(base,0,0);A.draw(ctx,state,profile.paper,fx,hint)}
function resize(){rect=canvas.getBoundingClientRect();w=rect.width;h=rect.height;dpr=Math.min(1.5,devicePixelRatio);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);clamp();draw()}window.addEventListener('resize',resize);let last=performance.now(),paint=0,store=0;function loop(now){requestAnimationFrame(loop);let dt=Math.min(.1,(now-last)/1000);last=now;if(paused)return;E.step(state,dt);for(let f of fx)f.life-=dt;fx=fx.filter(f=>f.life>0);if(hint){hint.life-=dt;if(hint.life<=0)hint=null}if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').textContent=''}paint+=dt;store+=dt;if(paint>1/30){draw();paint=0}if(store>1){save();store=0}}
window.__folks={get state(){return JSON.parse(JSON.stringify(state))},get profile(){return JSON.parse(JSON.stringify(profile))},get cam(){return{...cam}},get mode(){return mode},project,get view(){return{x:rect.left,y:rect.top,w,h}},get feedback(){return fx.filter(f=>f.kind==='poke').map(f=>f.text)},get audioGain(){return master?.gain.value||0}};resize();rebuild();intro();requestAnimationFrame(loop);window.addEventListener('pagehide',save);
})();</script></body></html>
