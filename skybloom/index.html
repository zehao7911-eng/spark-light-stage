<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15233a"><meta name="description" content="Hold to rise. Release to bloom. One little firework lights a whole night."><meta property="og:image" content="https://zehao7911-eng.github.io/spark-light-stage/skybloom/cover.webp"><title>Skybloom — A little light goes a long way</title><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="style.css?v=1"></head>
<body><main><canvas id="scene" aria-label="Hold anywhere in the sky to lift a firework. Drag left or right to steer. Release near an unlit lantern to start a chain."></canvas><div id="boot">Opening the night…</div>
<header><div class="wordmark"><img src="assets/icon.svg" alt=""><div><b>SKYBLOOM</b><small id="nightName">01 · LANTERN LANE</small></div></div><button id="sound" class="icon-button" aria-label="Mute sound" aria-pressed="true"></button><button id="pause" class="icon-button" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button></header>
<div class="hud"><div class="goal"><span class="lantern-symbol" aria-hidden="true">✦</span><div><small>LIGHT EVERY LANTERN</small><strong id="progress">0 <span>/ 7</span></strong></div><div class="shot-count"><small>ROCKETS</small><b id="shots">0</b></div></div><div class="progress-track" role="progressbar" aria-label="Lanterns lit" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"><i id="bar"></i></div><div class="ribbon"><span id="par">GOLD: 1 ROCKET</span><span id="message" aria-live="polite">A little light goes a long way.</span></div></div>
<footer><div class="gesture"><span id="hint">HOLD TO LIFT</span><small id="subhint">DRAG TO AIM · RELEASE TO BLOOM</small></div><button id="nights" class="dock-button" aria-label="Open nights and rewards"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM8 4v16M8 9h12M8 15h12"/></svg><span>NIGHTS</span></button></footer>
<section id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" hidden><article><div class="ticket-top"><span>✦</span><small id="eyebrow">TAKE A BREATHER</small><span>✦</span></div><h1 id="dialogTitle">A quiet moment</h1><div id="stars" hidden></div><p id="description"></p><div id="content"></div><div class="actions"><button id="primary" class="primary">KEEP PLAYING</button><button id="secondary" class="secondary" hidden></button></div><p id="social" hidden></p></article></section>
</main><script src="model.js?v=1"></script><script src="sdk.js?v=1"></script><script src="art.js?v=1"></script><script src="game.js?v=1"></script></body></html>
