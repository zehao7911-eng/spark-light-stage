function preview(){if(busy)return;const cards=S.hand.filter(c=>chosen.has(c.id)),e=evaluate(cards),b=cards.length?base(e.type):{chips:0,mult:0};$('#handName').textContent=cards.length?HANDS[e.type][0]:'Select cards';$('#chips').textContent=num(b.chips);$('#mult').textContent=num(b.mult);$('#level').textContent=cards.length?`Level ${S.levels[e.type]} · base score`:'Tap up to 5 cards'}
function render(){if(!S)return;$('#blindName').textContent=blindTitle();$('#blindName').style.background=S.blind===2?'#9a547e':S.blind===1?'#3c788e':'#9b833a';$('#blindChip').textContent=S.blind===2?'✥':S.blind===1?'◉':'◎';$('#target').textContent=num(target());$('#prize').textContent=`Reward $${3+S.blind}`;$('#bossRule').textContent=S.blind===2?BOSSES[S.boss][1]:'';$('#total').textContent=num(S.total);$('#hands').textContent=S.hands;$('#discards').textContent=S.discards;$('#money').textContent='$'+S.money;$('#ante').textContent=S.ante+' / 8';$('#round').textContent=S.round;$('#jokerCount').textContent=S.jokers.length+' / 5';$('#seedLabel').textContent=`SEED ${S.initialSeed.toString(36).toUpperCase()}`;$('#sound').textContent=muted?'Sound off':'Sound on';const j=$('#jokers');j.innerHTML='';S.jokers.forEach((v,i)=>{const b=document.createElement('button');b.className='joker';b.style.setProperty('--tilt',((i%3)-1)*2+'deg');b.innerHTML=`<img alt="${JOKERS[v.k][0]}" src="${Art.joker(v.k)}"><label>${v.ed?v.ed.toUpperCase():JOKERS[v.k][0]}</label>`;b.onclick=()=>{if(!busy)jokerDetail(i)};j.appendChild(b)});if(!S.jokers.length)j.innerHTML='<span style="opacity:.35;font-size:12px">Joker slots · buy in the shop</span>';renderHand();preview()}
async function play(){if(busy||!chosen.size||S.phase!=='play')return;beep();busy=true;const g=generation,cards=S.hand.filter(c=>chosen.has(c.id)),result=calc(cards);S.hands--;$('#hands').textContent=S.hands;$('#message').textContent='';$('#floatScore').textContent='';$('#played').innerHTML='';cards.forEach(c=>$('#played').appendChild(cardEl(c)));S.hand=S.hand.filter(c=>!chosen.has(c.id));chosen.clear();renderHand();$('#handName').textContent=HANDS[result.type][0];for(let i=0;i<result.steps.length;i++){await wait(i===0?220:170);if(g!==generation)return;const step=result.steps[i];$('#chips').textContent=num(step.chips);$('#mult').textContent=(Math.round(step.mult*100)/100).toLocaleString('en-US');$('#level').textContent=step.label;let el=step.kind==='card'?$('#played').querySelector(`[data-id="${step.id}"]`):step.kind==='joker'?$('#jokers').children[step.index]:null;if(el){el.classList.remove('score','trigger');void el.offsetWidth;el.classList.add(step.kind==='joker'?'trigger':'score')}beep(i,'score')}lastScore=result;S.lastHand=result.type;S.played[result.type]++;S.roundTypes.push(result.type);S.total+=result.score;S.best=Math.max(S.best,result.score);$('#floatScore').classList.remove('burst');void $('#floatScore').offsetWidth;$('#floatScore').classList.add('burst');$('#floatScore').textContent='+'+num(result.score);$('#total').textContent=num(S.total);beep(12,'win');if(navigator.vibrate)navigator.vibrate(30);for(const c of cards.filter(c=>c.e==='glass'))if(rng()<.25){S.deck=S.deck.filter(p=>p.id!==c.id);toast('Glass card shattered!')}await wait(580);if(g!==generation)return;busy=false;if(S.total>=target()){roundWin();return}if(!S.hands){S.phase='lost';save();endScreen(false);return}if(S.blind===2&&S.boss===0){shuffle(S.hand);const lost=S.hand.splice(0,2);toast(`The Hook discarded ${lost.length} cards`)}drawCards(8-S.hand.length);$('#played').innerHTML='';$('#floatScore').textContent='';render();save()}
async function discard(){if(busy||!S.discards||!chosen.size)return;beep(0,'discard');S.hand=S.hand.filter(c=>!chosen.has(c.id));S.discards--;chosen.clear();drawCards(8-S.hand.length);render();save()}
function roundWin(){let basePay=3+S.blind,remaining=S.hands,interest=Math.min(5,Math.floor(S.money/5)),gold=S.hand.filter(c=>c.e==='gold'&&!debuff(c)).length*3;S.payout={basePay,remaining,interest,gold};S.money+=basePay+remaining+interest+gold;S.phase='reward';S.wins++;save();render();rewardScreen()}
function rewardScreen(){const p=S.payout;modal(`<h1>Blind defeated!</h1><p>${HANDS[S.lastHand||0][0]} · Best hand ${num(S.best)}</p><div class="payout"><div>Blind reward<b>$${p.basePay}</b></div><div>Hands left<b>$${p.remaining}</b></div><div>Interest<b>$${p.interest}</b></div>${p.gold?`<div>Gold cards<b>$${p.gold}</b></div>`:''}<div>Total earned<b>$${p.basePay+p.remaining+p.interest+p.gold}</b></div></div><h2 style="color:#ffdc7a">$${S.money}</h2><div class="buttons"><button class="gold" id="toShop">Cash out → Shop</button></div>`);bind('#toShop',()=>{makeShop();shopScreen()})}
function randomJoker(){const owned=new Set(S.jokers.map(j=>j.k)),pool=JOKERS.map((_,k)=>k).filter(k=>!owned.has(k));const k=choose(pool),n=rng(),ed=n<.025?'poly':n<.07?'holo':n<.13?'foil':null;return{kind:'joker',k,ed,price:JOKERS[k][1]+(ed==='poly'?5:ed==='holo'?3:ed?2:0)}}
function makeShop(){S.phase='shop';S.reroll=5;S.offers=[randomJoker(),randomJoker(),{kind:'planet',k:choose(HANDS.map((_,i)=>i).filter(i=>i<9||S.played[i]>0)),price:3},{kind:'tarot',k:Math.floor(rng()*TAROTS.length),price:3}];S.packs=[{kind:'buffoon',price:4},{kind:'celestial',price:4},{kind:'standard',price:4}];save()}
function describe(o){if(o.kind==='joker')return JOKERS[o.k][2]+(o.ed?` ${o.ed==='foil'?'+50 Chips':o.ed==='holo'?'+10 Mult':'×1.5 Mult'}.`:'');if(o.kind==='planet')return`Level up ${HANDS[o.k][0]}. +${HANDS[o.k][3]} Chips, +${HANDS[o.k][4]} Mult.`;if(o.kind==='card')return 'Add this card to your deck.';return TAROTS[o.k][1]}
function offerName(o){if(o.kind==='card')return `${o.card.r===14?'Ace':o.card.r} of ${SUITS[o.card.s]}`;return o.kind==='joker'?JOKERS[o.k][0]:o.kind==='planet'?HANDS[o.k][5]:TAROTS[o.k][0]}function image(o){if(o.kind==='card')return Art.card(o.card);return o.kind==='joker'?Art.joker(o.k):o.kind==='planet'?Art.planet(o.k):Art.tarot(o.k)}
function offerHTML(o,i,pack=false){return `<div class="offer${o.sold?' sold':''}"><img alt="${offerName(o)}" src="${image(o)}"><h3>${offerName(o)}</h3>${o.ed?`<span class="tag edition">${o.ed.toUpperCase()}</span>`:''}<p>${describe(o)}</p><button class="${o.kind==='joker'?'green':o.kind==='planet'?'blue':'red'}" data-offer="${i}" ${o.sold||(!pack&&S.money<o.price)?'disabled':''}>${pack?'Choose':o.sold?'Sold':'Buy $'+o.price}</button></div>`}
function shopScreen(){S.phase='shop';render();modal(`<h1>SHOP <span style="color:#f9d473">$${S.money}</span></h1><p>Build your Jokers. Level your favourite hand.</p><div class="shopGrid">${S.offers.map((o,i)=>offerHTML(o,i)).join('')}</div><div class="row">${S.packs.map((p,i)=>`<button class="${i?'blue':'gold'}" data-pack="${i}" ${p.sold||S.money<p.price?'disabled':''}>${['Buffoon','Celestial','Standard'][i]} Pack · ${p.sold?'Sold':'$'+p.price}</button>`).join('')}</div><div class="buttons"><button class="red" id="reroll" ${S.money<S.reroll?'disabled':''}>Reroll $${S.reroll}</button>${!S.voucher?`<button id="voucher" ${S.money<10?'disabled':''}>Wasteful · $10</button>`:''}<button class="gold" id="next">Next blind →</button></div>`);document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>buy(+b.dataset.offer));document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>pack(+b.dataset.pack));bind('#reroll',()=>{S.money-=S.reroll;S.reroll++;S.offers=[randomJoker(),randomJoker(),{kind:'planet',k:choose(HANDS.map((_,i)=>i).filter(i=>i<9||S.played[i]>0)),price:3},{kind:'tarot',k:Math.floor(rng()*TAROTS.length),price:3}];save();beep();shopScreen()});if($('#voucher'))bind('#voucher',()=>{S.money-=10;S.voucher=1;save();toast('+1 discard each round');shopScreen()});bind('#next',()=>{if(S.pendingTarot!==undefined){tarotScreen(S.pendingTarot);return}S.blind++;if(S.blind===3){S.blind=0;S.ante++;S.boss=Math.floor(rng()*BOSSES.length);if(S.ante===9){S.phase='won';save();endScreen(true);return}}blindScreen();save()})}
function acquire(o){if(o.kind==='card'){S.deck.push({...o.card,id:Math.max(...S.deck.map(c=>c.id))+1});S.added++;beep(8);toast('Card added to deck');return true}if(o.kind==='joker'){if(S.jokers.length>=5){toast('5 Joker slots full. Sell one first.');return false}S.jokers.push({k:o.k,ed:o.ed});beep(5);return true}if(o.kind==='planet'){S.levels[o.k]++;beep(9);toast(`${HANDS[o.k][0]} → Level ${S.levels[o.k]}`);return true}return true}
function buy(i){const o=S.offers[i];if(o.kind==='tarot'&&S.pendingTarot!==undefined){tarotScreen(S.pendingTarot);return}if(o.sold||S.money<o.price)return;if(!acquire(o))return;S.money-=o.price;o.sold=true;if(o.kind==='tarot'){S.pendingTarot=o.k;save();tarotScreen(o.k)}else{save();shopScreen()}}
function pack(i){const p=S.packs[i];if(p.sold||S.money<p.price)return;if(i===0&&S.jokers.length>=5)return toast('Sell a Joker to open a slot');S.money-=p.price;p.sold=true;S.pendingPack=i===0?[randomJoker(),randomJoker(),randomJoker()]:i===1?shuffle(HANDS.map((_,k)=>({kind:'planet',k})).filter(o=>o.k<9||S.played[o.k]>0)).slice(0,3):Array.from({length:3},()=>({kind:'card',card:{r:2+Math.floor(rng()*13),s:Math.floor(rng()*4),e:rng()<.3?choose(['bonus','mult','glass','steel','gold']):undefined}}));save();packScreen()}
function packScreen(){modal(`<h1>Choose one</h1><div class="shopGrid" style="grid-template-columns:repeat(3,1fr)">${S.pendingPack.map((o,i)=>offerHTML(o,i,true)).join('')}</div><div class="buttons"><button id="skipPack">Skip</button></div>`);document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>{if(acquire(S.pendingPack[+b.dataset.offer])){delete S.pendingPack;save();shopScreen()}});bind('#skipPack',()=>{delete S.pendingPack;save();shopScreen()})}
function tarotScreen(k){const t=TAROTS[k];let ids=[];const view=()=>{modal(`<h1>${t[0]}</h1><p>${t[1]} ${t[2]==='copy'?'First card becomes a copy of the second.':''}</p><div id="tarotCards" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:48vh;overflow:auto;padding:12px">${S.deck.map(c=>`<button class="card${ids.includes(c.id)?' selected':''}" data-tcard="${c.id}" style="width:51px;margin:8px 0"><img alt="${c.r} ${SUITS[c.s]}" src="${Art.card(c)}"></button>`).join('')}</div><div class="buttons"><button class="red" id="applyTarot" ${!ids.length||(t[2]==='copy'&&ids.length!==2)?'disabled':''}>Use ${ids.length} / ${t[3]}</button><button id="cancelTarot">Save for later</button></div>`);document.querySelectorAll('[data-tcard]').forEach(b=>b.onclick=()=>{const id=+b.dataset.tcard;if(ids.includes(id))ids=ids.filter(v=>v!==id);else if(ids.length<t[3])ids.push(id);view()});bind('#cancelTarot',()=>{shopScreen();toast('Tarot saved. Use it before leaving the shop.');const b=document.createElement('button');b.textContent='Use '+t[0];b.className='red';b.onclick=()=>tarotScreen(k);$('#modal .buttons').prepend(b)});bind('#applyTarot',()=>{const cards=ids.map(id=>S.deck.find(c=>c.id===id));if(t[2]==='copy'){Object.assign(cards[0],{r:cards[1].r,s:cards[1].s,e:cards[1].e});}else if(t[2].startsWith('suit'))cards.forEach(c=>c.s=+t[2].slice(-1));else if(t[2]==='rank')cards.forEach(c=>c.r=c.r===14?2:c.r+1);else cards.forEach(c=>c.e=t[2]);S.tarots++;delete S.pendingTarot;beep(10);save();shopScreen()})};view()}
function jokerDetail(i){const j=S.jokers[i];if(!j)return;modal(`<h1>${JOKERS[j.k][0]}</h1><img class="bigCard" alt="${JOKERS[j.k][0]}" src="${Art.joker(j.k)}"><p>${describe({kind:'joker',k:j.k,ed:j.ed})}</p><div class="buttons"><button id="leftJ" ${!i?'disabled':''}>← Move</button><button id="rightJ" ${i===S.jokers.length-1?'disabled':''}>Move →</button><button class="red" id="sellJ">Sell $${Math.max(1,Math.floor(JOKERS[j.k][1]/2))}</button><button class="gold" id="closeJ">Back</button></div><p>Jokers trigger from left to right.</p>`);const move=d=>{[S.jokers[i],S.jokers[i+d]]=[S.jokers[i+d],S.jokers[i]];save();render();jokerDetail(i+d)};bind('#leftJ',()=>move(-1));bind('#rightJ',()=>move(1));bind('#sellJ',()=>{S.money+=Math.max(1,Math.floor(JOKERS[j.k][1]/2));S.jokers.splice(i,1);save();render();returnPhase()});bind('#closeJ',returnPhase)}
function returnPhase(){if(S.phase==='shop'){if(S.pendingPack)packScreen();else if(S.pendingTarot!==undefined)tarotScreen(S.pendingTarot);else shopScreen()}else if(S.phase==='blind')blindScreen();else if(S.phase==='reward')rewardScreen();else if(S.phase==='lost'||S.phase==='won')endScreen(S.phase==='won');else hide()}
function endScreen(win){modal(`<h1>${win?'YOU WIN!':'Run over'}</h1><p>${win?'Eight antes conquered. Keep going in Endless Mode.':'Every run is a new build. Try a different Joker combination.'}</p><div class="payout"><div>Ante<b>${S.ante}</b></div><div>Blinds beaten<b>${S.wins}</b></div><div>Best hand<b>${num(S.best)}</b></div><div>Most played<b>${HANDS[S.played.indexOf(Math.max(...S.played))][0]}</b></div></div><div class="buttons">${win?'<button class="gold" id="endless">Endless →</button>':''}<button class="green" id="retry">New run</button></div>`);if(win)bind('#endless',()=>{blindScreen();save()});bind('#retry',newRun)}
function handInfo(){modal(`<h1>Poker hands</h1><div class="handlist">${HANDS.map((h,i)=>{const b=base(i);return`<div>${h[0]} <span>${b.chips} × ${b.mult}</span><small>${h[6]} · Level ${S.levels[i]}</small></div>`}).reverse().join('')}</div><div class="buttons"><button class="gold" id="closeInfo">Back</button></div>`);bind('#closeInfo',returnPhase)}
function menu(){modal(`<h1>JOKER TABLE</h1><p>Play poker hands. Build powerful Joker combinations.<br>Beat eight antes, then play endlessly.</p><div class="buttons"><button class="gold" id="resume">Continue</button><button class="red" id="newConfirm">New run</button><button id="how">How to play</button></div><p>Inspired by Balatro · independent browser adaptation<br>24 Jokers · 12 hand types · 11 Tarots · 8 Bosses<br>All art is redrawn. Not the complete original game.</p>`);bind('#resume',returnPhase);bind('#newConfirm',()=>{modal('<h1>Start over?</h1><p>This replaces your current run.</p><div class="buttons"><button class="red" id="yesNew">New run</button><button id="noNew">Back</button></div>');bind('#yesNew',newRun);bind('#noNew',menu)});bind('#how',how)}
function how(){modal(`<h1>Make your score grow</h1><div class="handlist"><div>1. Select up to 5 cards<small>Pairs, flushes and straights score more.</small></div><div>2. Play or discard<small>Meet the target before your hands run out.</small></div><div>3. Buy Jokers & Planets<small>Jokers add effects. Planets level up hands.</small></div><div>4. Build a combination<small>Chips × Mult = score. Put ×Mult Jokers last.</small></div></div><p>Blue = Chips · Red = Mult · Gold = Money<br>Tap any Joker to inspect, rearrange or sell it.<br>Interest: $1 per $5 held, up to $5 each round.</p><div class="buttons"><button class="gold" id="howBack">Got it</button></div>`);bind('#howBack',returnPhase)}
bind('#play',play);bind('#discard',discard);bind('#sort',()=>{sortSuit=!sortSuit;$('#sort').textContent='Sort: '+(sortSuit?'suit':'rank');sortHand();renderHand();beep()});bind('#info',()=>{if(!busy)handInfo()});bind('#menu',()=>{if(!busy)menu()});bind('#help',()=>{if(!busy)how()});bind('#sound',()=>{muted=!muted;localStorage.setItem('joker-table-muted',muted?'1':'0');$('#sound').textContent=muted?'Sound off':'Sound on';beep()});document.addEventListener('keydown',e=>{if(!$('#overlay').hidden||busy)return;if(e.code==='Enter')play();if(e.code==='Backspace'){e.preventDefault();discard()}if(e.key>='1'&&e.key<='8')$('#hand').children[+e.key-1]?.click()});
try{S=JSON.parse(localStorage.getItem(KEY));if(S?.version!==1)S=null}catch{}if(S){render();if(S.phase==='play'){$('#message').textContent='Your run is saved. Pick your next hand.';hide()}else returnPhase()}else{newRun();how()}
window.JokerTable={evaluate,calc,base,state:()=>JSON.parse(JSON.stringify(S)),lastScore:()=>lastScore};
</script></body></html>
