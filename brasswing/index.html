function home(){show('home',`<div class="eyebrow">FLY. FIGHT. VANISH.</div><h1>BRASSWING</h1>${hero()}<p>One plane. A sky full of trouble.<br>Drag to fly and fire. Let go to repair.</p>`);if(!game.r)add('Take off',()=>start(Math.min(9,game.p.unlocked),false),'primary');if(game.r)add(game.r.mode==='play'?'Continue flight':'Flight results',()=>game.r.mode==='play'?close():results(),'primary');add('Open hangar',()=>game.r?.mode==='play'?confirmLeave():hangar(),'primary');add('Pilot notes',()=>help(home));$('#card').insertAdjacentHTML('beforeend',`<p class="fine">NO CLOCK. NO ADS. JUST AIR & EMBER.</p>`)}

function map(){show('map',`<div class="eyebrow">FLIGHT LOG · BEST ${String(game.p.score).padStart(6,'0')}</div><h2>Choose your sky.</h2><div class="chapters" id="chapters"></div>`);for(let i=1;i<=9;i++)add('',()=>{selection=i;endless=false;brief()},'',i>game.p.unlocked,$('#chapters'));$('#chapters').querySelectorAll('button').forEach((b,i)=>{b.innerHTML=`${String(i+1).padStart(2,'0')} ${i%3===2?'◆':'✦'}<small>${game.p.best[i]?'★'.repeat(game.p.best[i])+'☆'.repeat(3-game.p.best[i]):i+1>game.p.unlocked?'LOCKED':'READY'}</small>`;b.setAttribute('aria-label','Flight '+(i+1))});add('Endless / best '+game.p.endless,()=>{selection=1;endless=true;brief()},'primary',game.p.unlocked<10);add('Hangar',hangar);add('Back',home)}
function brief(){show('brief',`<div class="eyebrow">${endless?'ENDLESS WING':`SORTIE ${String(selection).padStart(2,'0')}`}</div><h2>${selection%3===0?'Hunt the dreadnought.':'Own the sky.'}</h2>${hero()}<p>${selection%3===0?'A dreadnought arrives halfway through. Bring it down.':'Drag in any direction to fly and fire. Release to drift and repair.'}</p><div class="stat">${8+Math.min(selection,9)*2} TARGETS${selection%3===0?' + DREADNOUGHT':''}</div>`);add('Launch',()=>start(selection,endless),'primary');add('Hangar',hangar)}
function start(n=selection,e=endless){if(!game.start(n,e))return;art.reset(game.r);art.message='DRAG TO FLY';art.msgtime=1.8;close();finishDelay=0;save()}
function pause(){if(paused)return;show('pause',`<div class="eyebrow">RADIO SILENCE</div><h2>Take a breath.</h2>`);add('Continue',close,'primary');add(sound.mute?'Sound · Off':'Sound · On',()=>{sound.mute=!sound.mute;game.p.mute=sound.mute;save();pauseMenu()});add('Pilot notes',()=>help(pauseMenu));add('Restart flight',()=>confirmRestart());add('Flight log',()=>confirmLeave())}
function pauseMenu(){paused=false;pause()}
function confirmRestart(){show('confirm','<h2>Restart this flight?</h2><p>Your cleared flights and parts stay.</p>');add('Restart',()=>start(game.r.stage,game.r.endless),'primary');add('Cancel',pauseMenu)}
function confirmLeave(){show('confirm','<h2>Return to hangar?</h2><p>This flight will be retired. Your cleared flights and parts stay.</p>');add('Return to hangar',()=>{game.r=null;save();hangar()},'primary');add('Cancel',pauseMenu)}
function help(back){show('help',`<div class="eyebrow">PILOT NOTES</div><h2>Three things.</h2><div class="rule"><b>↗</b><span><strong>Drag to fly & fire.</strong><br>Your plane turns toward your finger. Nearby targets get gentle aim assistance.</span></div><div class="rule"><b>+</b><span><strong>Release to repair.</strong><br>Coast for a moment to restore hull. The sea still hurts.</span></div><div class="rule"><b>↻</b><span><strong>Roll through trouble.</strong><br>Clear nearby bullets and ram enemies safely. Recharges in 4 seconds.</span></div><p>Keep kills close together for a bigger score. Clear targets to land. Every third flight has a dreadnought.</p><p class="fine">MOUSE: DRAG · WASD / ARROWS: FLY & FIRE<br>SPACE: ROLL · P / ESC: PAUSE<br>MEDALS: CLEAR / DAMAGE ≤ 35 / CHAIN ≥ 6</p>`);add('Got it',back,'primary')}
function results(){let r=game.r,win=r.mode==='win';show('result',`<div class="eyebrow">${r.endless?'ENDLESS · WAVE '+r.stage:'SORTIE '+String(r.stage).padStart(2,'0')}</div><h2>${win?'Clear skies.':'One more flight?'}</h2>${win?`<div class="rating">${'★'.repeat(r.medal)+'☆'.repeat(3-r.medal)}</div>`:hero()}<div class="stat">SCORE ${String(r.score).padStart(6,'0')}<br>${r.kills} DOWN · BEST CHAIN ${r.bestCombo}<br>${Math.round(r.damage)} DAMAGE · ${Math.round(r.healed)} REPAIRED</div>`);if(win&&!r.endless){const found=[];for(const k in unlocks)unlocks[k].forEach((n,i)=>{if(n===r.stage+1)found.push(parts[k][i].name)});if(found.length)$('#card').insertAdjacentHTML('beforeend',`<div class="unlock">NEW PART · ${found.join(' + ')}</div>`)}if(win)add(r.stage<9&&!r.endless?'Next flight':r.endless?'Next wave':'Endless skies',()=>{selection=r.endless?r.stage+1:r.stage<9?r.stage+1:1;endless=r.endless||r.stage===9;brief()},'primary');add('Fly again',()=>start(r.stage,r.endless),win?'':'primary');add('Hangar',()=>{game.r=null;save();hangar()});add('Save flight card',saveCard)}
function saveCard(){const c=document.createElement('canvas');c.width=900;c.height=650;const t=c.getContext('2d'),p=palettes[game.p.palette];t.fillStyle=p.paper;t.fillRect(0,0,900,650);art.draw(game.r,game.p.palette,{});let image=$('#world'),ratio=Math.min(850/image.width,460/image.height);t.drawImage(image,(900-image.width*ratio)/2,100,image.width*ratio,image.height*ratio);t.fillStyle=p.ink;t.font='900 38px Arial';t.fillText('BRASSWING',30,55);t.font='16px monospace';t.fillText(`FLIGHT ${game.r.stage}  /  ${game.r.score} PTS  /  CHAIN ${game.r.bestCombo}`,30,607);const a=document.createElement('a');a.download='BRASSWING-flight.png';a.href=c.toDataURL();a.click()}
function updateHud(){let r=game.r;if(!r)return;$('#sortie').textContent=(r.endless?'ENDLESS ':'SORTIE ')+String(r.stage).padStart(2,'0');$('#score').textContent=String(r.score).padStart(6,'0');$('#hull i').style.width=r.player.hp/r.player.maxhp*100+'%';$('#repair').textContent=r.player.hp<r.player.maxhp?(r.player.quiet>.7?'REPAIRING +':'RELEASE TO REPAIR'):'HULL '+Math.ceil(r.player.hp);$('#combo').innerHTML=r.combo>=2?`×${Math.min(5,r.combo)}<small>CHAIN ${r.combo}</small>`:'';$('#mission b').textContent=`${Math.min(r.kills,r.goal)} / ${r.goal} DOWN`;$('#mission em').style.width=Math.min(100,r.kills/r.goal*100)+'%';let boss=r.enemies.find(e=>e.type==='boss');$('#boss').hidden=!boss;if(boss)$('#boss em').style.width=boss.hp/boss.maxhp*100+'%';$('#kitname').textContent=`${parts.weapon[r.kit.weapon].name} / ${parts.engine[r.kit.engine].name}`;$('#roll i').style.width=(1-r.player.rollCool/4.2)*100+'%';$('#roll').disabled=paused||r.player.rollCool>0;$('#message').textContent=art.message;$('#message').style.opacity=art.msgtime>0?'1':'0';$('#radar').innerHTML=r.enemies.map(e=>`<i style="left:${e.x/1800*95}%;top:${e.y/900*90}%"></i>`).join('')+`<i class="me" style="left:${r.player.x/1800*95}%;top:${r.player.y/900*90}%"></i>`}
const canvas=$('#world');canvas.addEventListener('pointerdown',e=>{if(paused||pointer!==null)return;sound.init();pointer=e.pointerId;canvas.setPointerCapture(pointer);input.active=true;const b=canvas.getBoundingClientRect();input.point={x:e.clientX-b.x,y:e.clientY-b.y};e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(pointer!==e.pointerId)return;const b=canvas.getBoundingClientRect();input.point={x:e.clientX-b.x,y:e.clientY-b.y};e.preventDefault()});function up(e){if(pointer===e.pointerId){pointer=null;input.active=false;input.point=null}}canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);canvas.addEventListener('lostpointercapture',up);
$('#roll').addEventListener('pointerdown',e=>{if(paused)return;sound.init();input.roll=true;e.preventDefault()});$('#pause').onclick=()=>{sound.init();pause()};window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d','W','A','S','D'].includes(e.key))e.preventDefault();if(e.key==='Escape'||e.key.toLowerCase()==='p'){if(screen==='pause')close();else pause();return}if(!paused){keys.add(e.key.toLowerCase());sound.init();if(e.key===' ')input.roll=true}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function stop(){if(!paused&&game.r?.mode==='play')pause();save();sound.stop()}document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('blur',stop);window.addEventListener('pagehide',()=>{release();save();sound.stop()});const resize=()=>{art.resize();if(game.r)art.draw(game.r,game.p.palette,input)};window.addEventListener('resize',resize);new ResizeObserver(resize).observe($('#arena'));
if(game.r)art.reset(game.r);home();
function loop(now){let dt=Math.min(.1,(now-(last||now))/1000);last=now;if(!paused&&game.r?.mode==='play'){let horizontal=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),vertical=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);let actual={active:input.active||horizontal!==0||vertical!==0,roll:input.roll};if(horizontal||vertical)actual.angle=Math.atan2(vertical,horizontal);else if(input.active&&input.point){let target=art.world(input.point.x,input.point.y);actual.angle=Math.atan2(target.y-game.r.player.y,dx(target.x,game.r.player.x))}acc+=dt;while(acc>=1/60){game.step(1/60,actual);actual.roll=false;acc-=1/60}input.roll=false;for(const e of game.events){art.event(e);sound.event(e)}game.events=[];art.update(dt,game.r,actual);sound.tick(dt,game.r);saveAt+=dt;if(saveAt>1.5){saveAt=0;save()}if(game.r.mode!=='play'){finishDelay=.65;release();save()}}
else if(!paused&&game.r&&finishDelay>0){finishDelay-=dt;art.update(dt,game.r,{});if(finishDelay<=0)results()}
else acc=0;
if(now-drawAt>25){drawAt=now;art.draw(game.r,game.p.palette,input);updateHud()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.BrassDebug={snapshot:()=>game.snapshot(),stats:()=>({paused,screen,voices:sound.voices.size,fx:art.fx.length,trail:art.trail.length,active:input.active}),screen:o=>art.screen(o),camera:()=>({...art.cam,scale:art.scale}),input:()=>copy(input)};
})();
</script></body></html>
