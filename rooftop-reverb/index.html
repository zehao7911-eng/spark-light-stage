<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202232"><meta name="description" content="A little pixel quartet. Play the falling notes and bring the city to life."><meta property="og:title" content="ROOFTOP REVERB"><meta property="og:image" content="cover.jpg"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=2"><title>ROOFTOP REVERB</title></head><body><main id="app"><header><div><small>AN AFTER-HOURS PIXEL SESSION</small><h1>ROOFTOP REVERB<span>●</span></h1></div><nav><button id="records" aria-label="Open records">▤</button><button id="pause" aria-label="Pause">Ⅱ</button></nav></header><section id="stage"><canvas id="world" aria-label="Four falling note lanes. Tap the matching pad when a note reaches the bright line."></canvas><div id="hud"><div><small id="place"></small><h2 id="track"></h2></div><div><b id="score">0</b><small id="combo">READY</small></div></div><div id="progress"><span></span></div><div id="toast" hidden></div><section id="panel" hidden></section></section><footer><div id="pads"><button data-lane="0" aria-label="Play bass"><span class="pad-icon bass"></span><b>D</b></button><button data-lane="1" aria-label="Play keys"><span class="pad-icon keys"></span><b>F</b></button><button data-lane="2" aria-label="Play drums"><span class="pad-icon drums"></span><b>J</b></button><button data-lane="3" aria-label="Play horn"><span class="pad-icon horn"></span><b>K</b></button></div><small id="cue">TAP A PAD TO START · THEN FOLLOW THE NOTES</small></footer></main><script type="module" src="app.js?v=4"></script></body></html>
