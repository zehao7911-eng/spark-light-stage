})();
</script><script>(function(){'use strict';const M=Cutout,$=s=>document.getElementById(s),key='cutout-club-v1',names=['Jun','Sol','Nori'];let raw={};try{raw=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(_){}
let p=M.profile(raw.profile),s=M.state(p,raw.draft),view='play',paused=false,busy=0,shutterAt=0,prize=null,toastLife=0,last=0,lastDraw=0,drag=null,hinted=null,lastHUD='';if(matchMedia('(prefers-reduced-motion: reduce)').matches)p.gentle=true;
const art=new CutArt($('scene')),overlay=$('overlay');
class Audio{constructor(){this.ctx=null;this.voices=new Set();this.clock=0;this.note=0}unlock(){if(!p.sound)return;try{if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state!=='running')this.ctx.resume().catch(()=>{})}catch(_){}}tone(f,d=.18,v=.035,type='sine',end=0){let c=this.ctx;if(!p.sound||!c||c.state!=='running'||this.voices.size>=12)return;try{let o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime);if(end)o.frequency.exponentialRampToValueAtTime(end,c.currentTime+d);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(v,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d+.02);this.voices.add(o);o.onended=()=>{o.disconnect();g.disconnect();this.voices.delete(o)}}catch(_){}}wear(){this.tone(660,.06,.024,'triangle',330);this.tone(1320,.09,.012,'sine',880)}ready(){this.tone(523,.3,.025);this.tone(659,.4,.018);this.tone(784,.5,.012)}camera(){this.tone(1000,.035,.04,'triangle',100);this.tone(160,.08,.04,'triangle',70)}step(dt){this.clock+=dt;if(this.clock>1.4){this.clock-=1.4;let n=[261.63,392,329.63,440,349.23,392,293.66,329.63][this.note++%8];this.tone(n,.7,.008,'sine');}}stop(){for(const o of this.voices)try{o.stop()}catch(_){}this.voices.clear()}}
const audio=new Audio();
function save(){try{localStorage.setItem(key,JSON.stringify({profile:p,draft:{level:s.level,look:s.look,category:s.category}}))}catch(_){}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');toastLife=2.3;}
function cancelDrag(){drag=null;$('dragGhost').hidden=true;}
function setHUD(){let sig=[s.level,p.cleared,p.char,p.sound,...Object.values(s.look),s.category,paused,busy>0,s.undo.length,hinted].join('|');if(sig===lastHUD)return;lastHUD=sig;$('number').textContent='BRIEF '+String(s.level+1).padStart(2,'0')+' / 10';$('brief').textContent=M.briefs[s.level][0];$('count').textContent=p.cleared+' LOOK'+(p.cleared===1?'':'S');let checks=M.assess(s.level,s.look);$('wishes').innerHTML=checks.map(g=>'<div class="wish '+(g.done?'met':'')+'" aria-label="'+g.tag+' '+(g.done?'matched':'needed')+'">'+CutGlyph(g.tag)+'<span>'+g.tag[0].toUpperCase()+g.tag.slice(1)+'</span><b>'+(g.done?'✓':'○')+'</b></div>').join('');$('shoot').disabled=paused||busy>0||!M.ready(s);$('shoot').innerHTML='<span>●</span> '+(p.album[s.level]?'REMAKE THE POSTCARD':'MAKE THE POSTCARD')+'<small>'+checks.filter(g=>g.done).length+' / 3 WISHES</small>';$('undo').disabled=paused||busy>0||!s.undo.length;$('hint').disabled=paused||busy>0;$('character').textContent='◎ '+names[p.char].toUpperCase();$('sound').setAttribute('aria-label',p.sound?'Mute sound':'Enable sound');$('sound').textContent=p.sound?'♪':'♩';}
function showWardrobe(){
 $('tabs').innerHTML=M.categories.map(cat=>'<button data-category="'+cat+'" aria-pressed="'+(s.category===cat)+'">'+CutGlyph(cat)+({look:'LOOK',head:'HEAD',carry:'CARRY',feet:'FEET'}[cat])+'</button>').join('');for(const b of $('tabs').children)b.addEventListener('click',()=>{audio.unlock();if(paused||busy)return;s.category=b.dataset.category;hinted=null;showWardrobe();save();setHUD()});
 $('wardrobe').innerHTML=M.items.filter(i=>i.cat===s.category).map(i=>'<button class="piece '+(hinted===i.id?'hinted':'')+'" data-id="'+i.id+'" aria-label="'+i.name+'; '+i.tags.join(', ')+(i.unlock>p.cleared?'; unlocks after '+i.unlock+' postcards':'')+'" aria-pressed="'+(s.look[i.cat]===i.id)+'" '+(i.unlock>p.cleared?'disabled':'')+'><canvas width="158" height="164" aria-hidden="true"></canvas><span class="label">'+i.name+'</span><span class="tags">'+i.tags.map(CutGlyph).join('')+'</span>'+(i.unlock>p.cleared?'<span class="lock">LOOK '+i.unlock+'</span>':'')+'</button>').join('');
 for(const b of $('wardrobe').children){let id=+b.dataset.id;art.icon(b.querySelector('canvas'),id);if(b.disabled)continue;
  b.addEventListener('pointerdown',e=>{if(paused||busy||drag)return;audio.unlock();drag={id,pid:e.pointerId,x:e.clientX,y:e.clientY,moved:false,button:b};b.setPointerCapture(e.pointerId)});
  b.addEventListener('pointermove',e=>{if(!drag||drag.pid!==e.pointerId)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(dy< -12||drag.moved){drag.moved=true;let ghost=$('dragGhost');if(ghost.hidden){ghost.innerHTML='<canvas width="158" height="210"></canvas>';art.icon(ghost.querySelector('canvas'),id);ghost.hidden=false;}ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';}});
  b.addEventListener('pointerup',e=>{if(!drag||drag.pid!==e.pointerId)return;let d=drag,r=$('stage').getBoundingClientRect(),inside=e.clientX>=r.x&&e.clientX<=r.right&&e.clientY>=r.y&&e.clientY<=r.bottom,valid=d.moved?inside:Math.hypot(e.clientX-d.x,e.clientY-d.y)<12;cancelDrag();if(valid){e.preventDefault();requestAnimationFrame(()=>wear(id));}});
  b.addEventListener('pointercancel',cancelDrag);b.addEventListener('lostpointercapture',()=>{if(drag?.button===b)cancelDrag()});b.addEventListener('click',e=>{if(e.detail===0)wear(id)});
 }
}
function wear(id){if(paused||busy)return;let before=M.assess(s.level,s.look).filter(g=>g.done).length;if(!M.equip(s,p,id))return;hinted=null;audio.wear();art.pop(M.items[id].cat);showWardrobe();setHUD();save();let after=M.assess(s.level,s.look).filter(g=>g.done).length;if(after===3&&before<3){toast('All three wishes. Picture time.');audio.ready()}else toast(M.items[id].name);}
function bind(id,fn){$(id)?.addEventListener('click',()=>{audio.unlock();fn()})}
function panel(html){overlay.innerHTML='<div class="panel">'+html+'</div>';overlay.hidden=false;paused=true;cancelDrag();audio.stop();setHUD()}
function close(){overlay.hidden=true;overlay.innerHTML='';view='play';paused=false;last=0;showWardrobe();setHUD();}
function pause(){if(view!=='play')return;view='pause';save();panel('<span class="eyebrow">PINS DOWN</span><h2>A little breather.</h2><p>Tap a piece to wear it, or drag it onto the figure.<br>Match the three wishes, then make a postcard.</p><button id="resume" class="primary full">BACK TO THE WARDROBE</button><button id="gentle" class="full">'+(p.gentle?'✓':'○')+' Gentle motion</button><button id="openbook" class="full">LOOKBOOK</button>');bind('resume',close);bind('gentle',()=>{p.gentle=!p.gentle;save();$('gentle').textContent=(p.gentle?'✓':'○')+' Gentle motion';resize()});bind('openbook',book)}
function begin(level,entry){if(level>p.cleared||level>9||level<0)return;s.level=level;s.look=M.cleanLook(entry?.look||s.look,p);if(entry)p.char=entry.char;s.undo=[];hinted=null;busy=0;prize=null;close();showWardrobe();setHUD();save();toast('Three little wishes. Your own way.')}
function photoCanvas(parent,level,entry,w=420,h=600){let c=document.createElement('canvas');c.width=w;c.height=h;c.className='snapshot';c.setAttribute('aria-label','Original postcard: '+M.briefs[level][0]);parent.append(c);art.photo(c,level,entry);return c}
function snap(){if(paused||busy||!M.ready(s))return;audio.unlock();audio.camera();prize=M.capture(s,p);busy=.55;shutterAt=performance.now()+550;art.flash=p.gentle?.22:1;cancelDrag();save();setHUD()}
function reward(){busy=0;view='reward';let first=prize?.first,newIds=prize?.unlocked||[];panel('<span class="eyebrow">POSTCARD '+String(s.level+1).padStart(2,'0')+' · ALL THREE WISHES</span><h2>'+M.briefs[s.level][0]+'</h2><div id="photo"></div>'+(newIds.length?'<p style="margin-bottom:5px">New pieces, just for you.</p><div class="rewards" id="rewards"></div>':'')+(prize?.newModel?'<div class="note">A new paper model joined the studio.</div>':'')+'<button id="next" class="primary full">'+(s.level===9?'THE COMPLETE LOOKBOOK':'NEXT INVITATION →')+'</button><div class="row"><button id="download">SAVE PNG ↓</button><button id="remake">KEEP STYLING</button></div>');photoCanvas($('photo'),s.level,p.album[s.level]);for(const id of newIds){let c=document.createElement('canvas');c.width=94;c.height=124;$('rewards').append(c);art.icon(c,id)}bind('next',()=>s.level===9?book():begin(s.level+1));bind('download',()=>download(s.level));bind('remake',close);}
function download(level){let entry=p.album[level];if(!entry)return;let c=document.createElement('canvas');c.width=840;c.height=1200;art.photo(c,level,entry);let url=c.toDataURL('image/png');view='export';panel('<span class="eyebrow">YOUR PRINT · 840 × 1200</span><h2>A little keepsake.</h2><img id="exportImage" class="snapshot" alt="Downloadable postcard: '+M.briefs[level][0]+'"><p>Hold the picture to save it on your phone.</p><a id="savefile" class="exportlink">DOWNLOAD PNG ↓</a><button id="backphoto" class="full">BACK TO THE POSTCARD</button>');$('exportImage').src=url;let a=$('savefile');a.href=url;a.download='CUTOUT-CLUB-'+String(level+1).padStart(2,'0')+'.png';bind('backphoto',()=>viewPhoto(level));}
function book(){view='book';save();panel('<span class="eyebrow">THE PAPER WARDROBE</span><h2>Your little worlds.</h2><p>'+p.cleared+' / 10 postcards made</p><div id="albumgrid" class="albumgrid"></div><button id="back" class="primary full">BACK TO THE STUDIO</button>');for(let n=0;n<10;n++){let b=document.createElement('button');b.className='albumcard';b.disabled=n>p.cleared;b.setAttribute('aria-label',(p.album[n]?'View ':'Open brief ')+M.briefs[n][0]);let holder=document.createElement('div');b.append(holder);if(p.album[n]){let c=document.createElement('canvas');c.width=140;c.height=200;holder.append(c);art.photo(c,n,p.album[n]);}else{let mark=document.createElement('div');mark.style.cssText='height:145px;display:grid;place-items:center;font:italic 34px Georgia;color:#a5907c';mark.textContent=n<=p.cleared?'✳':'—';holder.append(mark);}let label=document.createElement('small');label.textContent=String(n+1).padStart(2,'0')+' · '+M.briefs[n][0];b.append(label);b.addEventListener('click',()=>{audio.unlock();if(p.album[n])viewPhoto(n);else begin(n)});$('albumgrid').append(b)}bind('back',close)}
function viewPhoto(level){view='photo';panel('<span class="eyebrow">YOUR LOOK · '+String(level+1).padStart(2,'0')+'</span><h2>'+M.briefs[level][0]+'</h2><div id="photo"></div><button id="edit" class="primary full">RESTYLE THIS LOOK</button><div class="row"><button id="download">SAVE PNG ↓</button><button id="backbook">LOOKBOOK</button></div>');photoCanvas($('photo'),level,p.album[level]);bind('edit',()=>begin(level,p.album[level]));bind('download',()=>download(level));bind('backbook',book)}
$('shoot').addEventListener('click',snap);$('album').addEventListener('click',()=>{audio.unlock();book()});$('pause').addEventListener('click',()=>{audio.unlock();if(view==='play')pause();else if(view==='pause')close()});$('sound').addEventListener('click',()=>{p.sound=!p.sound;if(p.sound)audio.unlock();else audio.stop();save();setHUD()});$('character').addEventListener('click',()=>{audio.unlock();if(paused||busy)return;let n=p.cleared>=5?3:p.cleared>=2?2:1;if(n===1){toast('A new paper model joins after 2 postcards.');return}p.char=(p.char+1)%n;art.pop('head');audio.wear();save();setHUD();toast('Hello, '+names[p.char]+'.')});$('undo').addEventListener('click',()=>{audio.unlock();if(paused||busy)return;if(M.undo(s)){showWardrobe();setHUD();save();toast('One piece back.')}});$('hint').addEventListener('click',()=>{audio.unlock();if(paused||busy)return;let id=M.hint(s,p);if(id===null){toast('All three wishes are ready.');return}hinted=id;s.category=M.items[id].cat;showWardrobe();setHUD();let b=$('wardrobe').querySelector('[data-id="'+id+'"]');b?.scrollIntoView({block:'nearest',inline:'center',behavior:p.gentle?'instant':'smooth'});toast('A little nudge: '+M.items[id].name+'.')});
function interrupt(){cancelDrag();if(view==='play')pause();else audio.stop();save()}
window.addEventListener('blur',interrupt);document.addEventListener('visibilitychange',()=>{if(document.hidden)interrupt()});window.addEventListener('pagehide',save);document.addEventListener('keydown',e=>{if(e.code==='KeyP'){e.preventDefault();if(view==='play')pause();else if(view==='pause')close()}if(e.code==='KeyZ'&&view==='play'&&!busy){e.preventDefault();$('undo').click()}});
function resize(){let r=$('scene').getBoundingClientRect(),scale=Math.min(r.width/420,r.height/600),d=Math.min(devicePixelRatio||1,p.gentle?1:1.7);$('scene').width=Math.max(1,Math.round(scale*420*d));$('scene').height=Math.max(1,Math.round(scale*600*d));art.draw(s,p)}
window.addEventListener('resize',()=>{cancelDrag();if(view==='play')pause();resize()});
function frame(now){requestAnimationFrame(frame);if(!last){last=now;return}let dt=Math.min(.05,(now-last)/1000);last=now;if(paused)return;if(busy&&now>=shutterAt){reward();return}art.update(p.gentle?dt*.35:dt);audio.step(dt);if(toastLife>0){toastLife-=dt;if(toastLife<=0)$('toast').classList.remove('on')}if(now-lastDraw>(p.gentle?50:33)){art.draw(s,p);lastDraw=now;}}
showWardrobe();setHUD();resize();toast(p.cleared?'Your studio is just as you left it.':'Tap a piece. Make this rainy little look.');requestAnimationFrame(frame);
})();
</script></body></html>
