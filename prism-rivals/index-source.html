<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111526"><title>PRISM RIVALS · The Crystal Circuit</title><link rel="stylesheet" href="style.css"></head><body>
<div class="sky"></div><header><div class="logo"><b>◈</b><span>PRISM RIVALS<small>THE CRYSTAL CIRCUIT</small></span></div><nav><button id="sound" aria-label="Toggle sound">♫</button><button id="pause" aria-label="Pause game">Ⅱ</button></nav></header>
<main><section class="rival"><div class="rivalTitle"><small id="round">DUEL 01 / 06</small><h1 id="name">Moss Sentinel</h1></div><canvas id="portrait" width="240" height="240" aria-label="Animated rival portrait"></canvas><div class="health"><i id="hp"></i></div><div class="healthText"><span>RIVAL</span><b id="hpText">12 / 12</b></div><p id="rivalNote">Clear lines. Break the spell.</p><div class="medals"><small>CIRCUIT CRESTS</small><span id="crests">◇ ◇ ◇ ◇ ◇ ◇</span></div></section>
<section class="playfield"><div class="boardTop"><span id="status">READY TO DUEL</span><b id="score">000000</b></div><div class="boardFrame"><canvas id="board" width="300" height="540" aria-label="Ten-column falling crystal board"></canvas><div id="banner" aria-live="polite"></div></div><div class="boardBottom"><span id="shield">♥ ♥ ♥ ♥ ♥ ♥</span><span id="lines">0 LINES</span></div></section>
<aside><section class="preview"><small>NEXT</small><canvas id="next" width="120" height="160" aria-label="Next three crystal pieces"></canvas></section><section class="preview hold"><small>HOLD</small><canvas id="held" width="120" height="65" aria-label="Held crystal piece"></canvas><button id="swap" aria-label="Hold or swap piece">⇄ <span>HOLD</span></button></section><button id="skill" disabled aria-label="Prism burst: clear a row when charged"><b>✦</b><span>PRISM BURST</span><small id="charge">0 / 5</small></button><button id="guide" class="help" aria-label="How to play">?</button></aside>
</main><footer><div class="input"><button data-act="left" aria-label="Move left">←</button><button data-act="rotate" aria-label="Rotate piece">↻</button><button data-act="right" aria-label="Move right">→</button><button data-act="down" aria-label="Soft drop">↓</button><button data-act="drop" class="drop" aria-label="Drop crystal">⤓ <span>DROP</span></button></div><small>MOVE · ROTATE · DROP</small></footer>
<section id="modal" role="dialog" aria-modal="true" aria-label="Game menu"><div id="panel"></div></section><script src="model.js"></script><script src="art.js"></script><script src="game.js"></script></body></html>
