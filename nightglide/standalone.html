<dialog id="panel"><button id="close" aria-label="Close menu">×</button><div id="panelBody"></div></dialog><script>
(()=>{

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const finite=(v,d=0)=>Number.isFinite(v)?v:d;
function create(court=0,sigil='spark',seed=1){

 return {version:1,court,seed:seed>>>0,sigil:SIGILS.some(s=>s.id===sigil)?sigil:'spark',phase:'ready',time:0,t:0,score:[0,0],target:3,points:[],hits:0,banks:0,rally:0,bestRally:0,charge:0,pulseTime:0,pulseX:180,pulseHit:false,shield:base.shield||0,ward:sigil==='mercy'?1:0,puck:{x:180,y:397,vx:0,vy:0,r:11,bank:0,boost:false,pierced:0,portal:0,last:0},player:{x:180,y:459,tx:180,ty:459,vx:0,vy:0,r:24},enemy:{x:88,y:126,vx:0,vy:0,r:23},ghost:{x:270,y:202,vx:0,vy:0,r:20},cool:{p:0,e:0,g:0,b:0},goalX:180,events:[],config:{...base,speed:Math.min(220,base.speed+(remix?10:0))},countdown:0,everStarted:false,serveNumber:0};

function emit(s,type,x,y,extra={}){s.events.push({type,x,y,...extra});if(s.events.length>60)s.events.shift()}
function aim(s,x,y){if(['win','loss'].includes(s.phase))return;let p=s.player;p.tx=clamp(finite(x,p.x),49,311);p.ty=clamp(finite(y,p.y),282,462);if(s.phase==='ready'){s.phase='play';s.everStarted=true;emit(s,'start',p.x,p.y)}}
function pulse(s){if(s.phase!=='play'||s.charge<100||s.pulseTime>0)return false;s.charge=0;s.pulseTime=.52;s.pulseX=s.player.x;s.pulseHit=false;emit(s,'pulse',s.player.x,s.player.y);return true}

function move(body,tx,ty,speed,dt){let dx=tx-body.x,dy=ty-body.y,len=Math.hypot(dx,dy),f=Math.min(1,speed*dt/(len||1)),ox=body.x,oy=body.y;body.x+=dx*f;body.y+=dy*f;body.vx=(body.x-ox)/dt;body.vy=(body.y-oy)/dt}
function impact(s,b,kind){let p=s.puck,dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy),rr=p.r+b.r;if(d>=rr)return;
 if((kind==='e'||kind==='g')&&p.boost&&p.vy<0){let bit=kind==='e'?1:2;if(!((p.pierced||0)&bit)){p.pierced=(p.pierced||0)|bit;emit(s,'guardbreak',b.x,b.y)}return}
 let nx=d>1e-6?dx/d:0,ny=d>1e-6?dy/d:(kind==='p'?-1:1);p.x=b.x+nx*(rr+.2);p.y=b.y+ny*(rr+.2);

 if(kind!=='b'&&(p.x<43||p.x>317)){p.x=clamp(p.x,43,317);let xx=p.x-b.x;p.y=b.y+(kind==='p'?-1:1)*Math.sqrt(Math.max(0,(rr+.3)**2-xx*xx));dx=p.x-b.x;dy=p.y-b.y;d=Math.hypot(dx,dy);nx=dx/d;ny=dy/d;}
 let rel=(p.vx-(b.vx||0))*nx+(p.vy-(b.vy||0))*ny;
 if(rel<0){p.vx-=1.7*rel*nx;p.vy-=1.7*rel*ny;}
 if(kind==='p'&&s.cool.p<=0){let speed=Math.max(330,Math.hypot(b.vx,b.vy)*.75,Math.hypot(p.vx,p.vy));let dirx=nx*.64+b.vx/1800,diry=Math.min(-.32,ny);let n=Math.hypot(dirx,diry);p.vx=dirx/n*speed;p.vy=diry/n*speed;p.last=1;s.hits++;s.rally++;s.bestRally=Math.max(s.rally,s.bestRally);s.charge=clamp(s.charge+(s.sigil==='ember'?50:38),0,100);s.cool.p=.12;emit(s,'hit',p.x,p.y,{rally:s.rally});}
 else if((kind==='e'||kind==='g')&&s.cool[kind]<=0){let speed=Math.max(285,Math.min(520,Math.hypot(p.vx,p.vy)*.86)),dx=(s.player.x<180?.24:-.24)+(s.court>1?Math.sin(s.time*2)*.22:0),dy=Math.max(.4,ny);let n=Math.hypot(dx,dy);p.vx=dx/n*speed;p.vy=dy/n*speed;p.last=2;s.cool[kind]=.16;emit(s,'return',p.x,p.y);}
 else if(kind==='b'&&s.cool.b<=0){let speed=Math.max(300,Math.hypot(p.vx,p.vy));p.vx=nx*speed;p.vy=ny*speed;s.cool.b=.1;s.charge=clamp(s.charge+10,0,100);emit(s,'bumper',p.x,p.y)}
}
function point(s,who){let p=s.puck;if(who===0&&s.shield>0){s.shield--;emit(s,'crack',p.x,50);if(!(p.boost&&s.sigil==='ember')){p.y=63;p.vy=Math.max(350,Math.abs(p.vy)*.68);p.vx+=(p.x-180)*.8;s.charge=clamp(s.charge+35,0,100);return}}

 if(s.phase==='win')emit(s,'win',180,230,{stars:stars(s)});if(s.phase==='loss')emit(s,'loss',180,240);
}
function stars(s){return s.phase==='win'?1+(s.score[1]<=1?1:0)+(s.points.some(p=>p.who===0&&(p.bank>0||p.boost))?1:0):0}
function serve(s){let n=++s.serveNumber;s.phase='ready';s.rally=0;s.puck={x:n%3===1?132:n%3===2?228:180,y:397,vx:0,vy:0,r:11,bank:0,boost:false,pierced:0,portal:0,last:0};Object.assign(s.player,{x:s.puck.x,y:459,tx:s.puck.x,ty:459,vx:0,vy:0});Object.assign(s.enemy,{x:s.puck.x,y:126,vx:0,vy:0});s.shield=s.config.shield||0;s.pulseTime=0;s.pulseHit=false;emit(s,'serve',s.puck.x,s.puck.y)}
function tick(s,dt=STEP){dt=clamp(finite(dt),0,.025);s.events=s.events||[];if(['ready','win','loss'].includes(s.phase))return;
 if(s.phase==='point'){s.countdown-=dt;if(s.countdown<=0)serve(s);return}
 s.time+=dt;s.t+=dt;let q=s.config,p=s.puck,b=s.player;s.goalX=180+Math.sin(s.time*.75)*(q.moving||0);for(let k in s.cool)s.cool[k]=Math.max(0,s.cool[k]-dt);p.portal=Math.max(0,p.portal-dt);
 move(b,b.tx,b.ty,1050,dt);let prediction=p.x+(p.vx*clamp((p.y-125)/Math.max(100,-p.vy),0,.3));let ex=clamp(prediction,57,303),ey=p.y<225?clamp(p.y-30,90,207):128;
 move(s.enemy,ex,ey,s.court===0&&s.serveNumber===0&&s.time<1?0:q.speed,dt);if(q.double)move(s.ghost,clamp(360-p.x*.85,58,302),216,q.speed*.68,dt);

 if(q.current)p.vx+=Math.sin(p.y/105+s.time*.4)*q.current*dt;
 const drag=q.ice?.045:.17;p.vx*=Math.exp(-drag*dt);p.vy*=Math.exp(-drag*dt);let sp=Math.hypot(p.vx,p.vy);if(sp>880){p.vx*=880/sp;p.vy*=880/sp}
 p.x+=p.vx*dt;p.y+=p.vy*dt;impact(s,b,'p');impact(s,s.enemy,'e');if(q.double)impact(s,s.ghost,'g');for(let o of bumps(s))impact(s,o,'b');
 let side=p.x<32+p.r?-1:p.x>328-p.r?1:0;if(side){if(q.portals&&p.y>160&&p.y<227&&p.portal<=0){p.x=side<0?328-p.r-1:32+p.r+1;p.portal=.35;s.charge=clamp(s.charge+15,0,100);emit(s,'portal',p.x,p.y)}else{p.x=clamp(p.x,32+p.r,328-p.r);p.vx=side<0?Math.abs(p.vx)*.98:-Math.abs(p.vx)*.98;p.bank++;s.banks++;s.charge=clamp(s.charge+(s.sigil==='mirror'?30:15),0,100);emit(s,'bank',p.x,p.y)}}
 if(p.y<50+p.r){if(Math.abs(p.x-s.goalX)<q.goal/2-p.r){point(s,0);return}p.y=50+p.r;p.vy=Math.abs(p.vy)*.97;emit(s,'rail',p.x,p.y)}

function drain(s){return s.events.splice(0)}

function cup(){open(`<h2>The Midnight Cup</h2><p>${cleared()} / 9 courts · ${total()} / 27 seals</p><div class="cupGrid">${COURTS.map((q,i)=>`<button data-court="${i}" ${i>cleared()?'disabled':''}>${String(i+1).padStart(2,'0')}<b>${prefs.best[i]?'✦'.repeat(prefs.best[i]):'◇'}</b><small>${q.name}</small></button>`).join('')}</div>${cleared()===9?'<button class="wide" data-do="wild">After Hours · rotating rule cup</button>':''}<button data-do="sigils">Sigils · ${SIGILS.filter(x=>cleared()>=x.need).length} / 4</button><button data-do="resume">Back to the table</button><p class="note">Three seals: win · concede at most one · score a bank or Pulse goal. Replays keep your best. No duplicate rewards.</p>`)}
function sigils(){open(`<h2>A little unfair magic</h2><p>Choose one for your next match. Your current match keeps ${SIGILS.find(x=>x.id===state.sigil).name}.</p>${SIGILS.map(x=>`<div class="chip ${x.id===prefs.sigil?'selected':''}"><b>${x.name}</b><p>${x.detail}</p><button data-sigil="${x.id}" ${cleared()<x.need?'disabled':''}>${cleared()<x.need?'Clear '+x.need+' courts':prefs.sigil===x.id?'Selected':'Equip '+x.name}</button></div>`).join('')}<button data-do="cup">The Cup</button><button data-do="resume">Back to the table</button>`)}
$('panelBody').addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;prime();if(b.dataset.court!==undefined){let n=Number(b.dataset.court);open(`<h2>${COURTS[n].name}</h2><p>${COURTS[n].rule}</p><button data-begin="${n}">Start this court</button><button data-do="cup">Back to the Cup</button><p class="note">Starting replaces only the current match. Earned seals stay.</p>`);return}if(b.dataset.begin!==undefined){start(Number(b.dataset.begin));return}if(b.dataset.sigil){prefs.sigil=b.dataset.sigil;save();sigils();return}switch(b.dataset.do){case'resume':close();break;case'cup':cup();break;case'sigils':sigils();break;case'gentle':prefs.gentle=!prefs.gentle;save();menu();break;case'sound':prefs.sound=!prefs.sound;save();menu();break;case'calm':prefs.calm=!prefs.calm;config();save();menu();break;case'wild':start(Math.max(9,prefs.wildBest+9));break;case'rules':open('<h2>One finger. A wicked table.</h2><p>Drag your ivory mallet anywhere in the lower half. Push the green orb through the upper gate. Keep it out of your gate. First to three wins.</p><p>Banks and hits fill Pulse. Press a full Pulse to aim a powerful piercing shot at the upper gate. It cannot be wasted on an out-of-range orb. A pale lock over a gate must be hit once before a goal counts.</p><p>Moving gates, bone bumpers, currents and side portals arrive one at a time. Nothing is purchased. Missed matches can be retried freely.</p><p>Keyboard: arrows or WASD move · Enter serves · Space pulses · P/Escape pauses.</p><button data-do="resume">Back to the table</button>');break;case'credits':open('<h2>Artwork at midnight</h2><p>Original Nightglide game code, physics, interface and synthesized audio.</p><p>Selected public artwork is directly reused from Sweet Rot on Rezona at the user’s request: chamber, keeper portraits, relics and ornamental frame. Its authorship is not claimed here. See ART-SOURCES.json for exact source URLs and file hashes.</p><p>The reference is a match-three game. Nightglide independently replaces those rules with a one-finger physical air-hockey cup. No reference code, logo, fonts or recorded audio are included.</p><button data-do="resume">Back to the table</button>');break}});
$('pause').onclick=menu;$('close').onclick=close;$('panel').addEventListener('cancel',e=>{e.preventDefault();close()});$('cup').onclick=cup;$('sound').onclick=()=>{prefs.sound=!prefs.sound;prime();if(master)master.gain.value=prefs.sound?.25:0;save();update()};$('next').onclick=()=>{prime();start(state.phase==='loss'?state.court:state.court+1)};$('pulse').onclick=()=>{prime();if(pulse(state)){drain(state).forEach(event);update();save()}};
function serve(){prime();if(state.phase==='ready'&&!paused){aim(state,state.puck.x,state.puck.y-25);update();save()}}$('serve').onclick=serve;
function map(e){let r=canvas.getBoundingClientRect(),z=Math.min(r.width/W,r.height/H);return {x:(e.clientX-r.left-(r.width-W*z)/2)/z,y:(e.clientY-r.top-(r.height-H*z)/2)/z}}
canvas.addEventListener('pointerdown',e=>{if(paused||!readyArt||['win','loss','point'].includes(state.phase)||input!==null)return;let p=map(e);if(p.x<30||p.x>330||p.y<270||p.y>500)return;e.preventDefault();prime();canvas.focus({preventScroll:true});input=e.pointerId;canvas.setPointerCapture(input);aim(state,p.x,p.y);update()});canvas.addEventListener('pointermove',e=>{if(e.pointerId!==input||paused)return;e.preventDefault();let p=map(e);aim(state,p.x,p.y)});function release(e){if(e.pointerId!==input)return;input=null;state.player.tx=state.player.x;state.player.ty=state.player.y;save()}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',e=>{if(input===e.pointerId)release(e)});
window.addEventListener('keydown',e=>{if(e.repeat||e.target.closest('button,input,select'))return;let k=e.key.toLowerCase();if(k==='escape'||k==='p'){e.preventDefault();$('panel').open?close():menu();return}if(paused||!readyArt)return;if(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d',' ','enter'].includes(k)){e.preventDefault();prime();if(k==='enter')serve();else if(k===' ')$('pulse').click();else{keys.add(k);if(state.phase==='ready')aim(state,state.player.x,state.player.y)}}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();input=null;muted=true;if(master)master.gain.value=0;save()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&readyArt)menu()});window.addEventListener('pagehide',save);window.addEventListener('orientationchange',()=>{if(readyArt&&!paused)menu()});
async function load(){let generation=Date.now();$('loading').hidden=false;$('retry').hidden=true;let timeout=setTimeout(()=>{if(!readyArt){$('loading').querySelector('span').textContent='Artwork is taking longer. You can retry.';$('retry').hidden=false}},12000);await Promise.all(['chamber','keeper','keeper-laugh','ivory','bones','soul','nova','frame'].map(n=>new Promise(res=>{let im=new Image();im.onload=()=>{art[n]=im;res()};im.onerror=res;im.src='assets/'+n+'.webp'})));clearTimeout(timeout);if(['chamber','ivory','soul','nova'].every(n=>art[n])){readyArt=true;$('loading').hidden=true;update();arena();if(paused)menu()}else{$('loading').querySelector('span').textContent='Some artwork could not load. Please retry.';$('retry').hidden=false}}$('retry').onclick=load;
let last=performance.now(),acc=0;function frame(now){let elapsed=Math.min(.18,Math.max(0,(now-last)/1000));last=now;if(readyArt&&!paused){clock+=elapsed;acc+=elapsed;while(acc>=STEP){let dx=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0),dy=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('w')?1:0);if(dx||dy)aim(state,state.player.x+dx*5,state.player.y+dy*5);tick(state,STEP);drain(state).forEach(event);acc-=STEP;}for(let a of fx){a.life-=elapsed;a.x+=a.vx*elapsed;a.y+=a.vy*elapsed;a.vy+=80*elapsed}fx=fx.filter(x=>x.life>0);for(let a of toast)a.life-=elapsed;toast=toast.filter(x=>x.life>0);shake=Math.max(0,shake-elapsed*14);flash=Math.max(0,flash-elapsed);saveClock+=elapsed;renderClock+=elapsed;if(saveClock>3){saveClock=0;save()}if(renderClock>1/(prefs.gentle?25:40)){renderClock=0;if(state.phase==='play'){trail.push({x:state.puck.x,y:state.puck.y});if(trail.length>12)trail.shift()}else trail=[];update();arena()}}else acc=0;requestAnimationFrame(frame)}
update();load();requestAnimationFrame(frame);

})();
</script></body></html>
