<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#131a24"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E◈%3C/text%3E%3C/svg%3E"><title>Liquid Atelier</title><link rel="stylesheet" href="style.css"></head><body><main id="canvas"></main><header><div class="mark">◈</div><div><h1>LIQUID ATELIER</h1><span>MAKE SOMETHING MESMERIZING</span></div><button id="sound" aria-label="Enable sound" title="Sound">♫</button><button id="pause" aria-label="Pause" title="Pause">Ⅱ</button></header><div id="hint">Drag to stir. Tap to pour.</div><aside id="panel"><nav aria-label="Brush tools"><button data-tool="stir" class="active"><b>◎</b>Stir</button><button data-tool="pour"><b>◕</b>Pour</button><button data-tool="comb"><b>≋</b>Comb</button><button data-tool="ripple"><b>◉</b>Ripple</button></nav><div class="settings"><div class="colors" aria-label="Pigment colors"></div><label class="size" aria-label="Brush size"><span>◌</span><input id="size" type="range" min="12" max="72" value="36" aria-label="Brush size"></label></div><footer><button id="palette">Aurora <span>⌄</span></button><button id="mirror" aria-label="Mirror strokes" title="Mirror strokes">⋈</button><button id="motion" aria-label="Enable tilt" title="Tilt">↔</button><button id="new" aria-label="New canvas" title="New canvas">↻</button><button id="save" aria-label="Save image" title="Save image">↓</button></footer></aside><div id="palettes" hidden></div><div id="toast" role="status"></div><div id="error" hidden><h2>Canvas unavailable</h2><p>This artwork needs WebGL. Try opening it in Chrome or Safari.</p><button onclick="location.reload()">Retry</button></div><script src="p5.min.js"></script><script src="app.js"></script></body></html>
