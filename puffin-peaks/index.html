<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9eee3"><meta name="description" content="One little puffin. One more lovely line through the snow. A cozy pixel skiing adventure."><title>Puffin Peaks · One More Run</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><div class="brand">PUFFIN PEAKS<small>ONE MORE RUN</small></div><div class="head-actions"><button id="sound" aria-label="Enable sound">♩</button><button id="pause" aria-label="Open mountain lodge">☰</button></div></header><div class="layout"><section class="slope"><div class="trail-title"><span id="trail-name">BELLWOOD RUN</span><span id="bank">◈ 0</span></div><div class="skiwindow" id="skiwindow"><canvas id="ski" width="360" height="520" role="img" aria-label="Snowy ski slope. Drag to steer the puffin between flags."></canvas><div class="hud"><div><small>TRAIL SCORE</small><strong id="score">0</strong></div><div class="combo"><small id="combo-label">FIND YOUR FLOW</small><strong id="combo">✦</strong></div></div><div class="progress"><i id="progress"></i></div><div class="distance" id="distance">0 m</div><div class="floating" id="floating" role="status" aria-live="polite"></div><div class="next" id="next" aria-live="polite">NEXT · CENTRE ↓</div></div><div class="run-stats"><span id="flags">⚑ 0 / 6</span><span id="tokens">✦ 0</span><span id="bumps">0 BUMPS</span></div></section><aside class="controls"><div class="steer"><button data-lane="-160" aria-label="Aim left">←<span>LEFT</span></button><button data-lane="0" aria-label="Aim centre">↓<span>CENTRE</span></button><button data-lane="160" aria-label="Aim right">→<span>RIGHT</span></button></div><div class="actions"><button id="hop">⌁ HOP<small>3 STARS</small></button><button id="boost">↠ BOOST<small>7 STARS</small></button><button id="brake">≋ BRAKE<small>HOLD</small></button></div><p id="cue">
