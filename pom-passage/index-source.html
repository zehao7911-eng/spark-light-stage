<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8efdc"><title>POM PASSAGE — A little shape goes a long way.</title><meta name="description" content="Stretch, squash and slip through a sunlit city. A gentle shape-changing delivery adventure."><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><button id="album" aria-label="Open the travel book">▦</button><div class="brand"><span>THE LITTLE SHAPE POST</span><h1>POM PASSAGE</h1></div><button id="sound" aria-label="Mute sound">♪</button><button id="pause" aria-label="Pause game">Ⅱ</button></header><section class="route"><span id="routeNumber"></span><h2 id="routeName"></h2><span id="totalStars"></span></section><section id="stage"><canvas id="world" role="img" aria-label="Pom, a shape-changing courier, and a doorway in a sunlit illustrated city"></canvas><div id="topCue"><span id="district"></span><strong id="cue">FIT THE OPENING</strong><div id="stamps" aria-label="Letters delivered"></div></div><div id="status" role="status" aria-live="polite"></div><div id="overlay" hidden></div></section><footer><div class="shapeControl"><span aria-hidden="true" class="flatIcon">━</span><input id="shape" type="range" min="0" max="1000" value="500" step="1" aria-label="Shape: flat to tall"><span aria-hidden="true" class="tallIcon">┃</span></div><div class="actions"><span id="shapeCue">DRAG TO SHAPE</span><button id="send" class="primary">SEND POM <span>↗</span></button></div><div class="sub"><span id="counter">LETTER 1 / 3</span><span>NO RUSH. ALL SHAPES WELCOME.</span></div></footer></main><script src="model.js"></script><script src="art.js"></script><script src="game.js"></script></body></html>
