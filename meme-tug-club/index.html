<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#092b37"><meta name="description" content="A one-finger meme tug-of-war showdown."><meta property="og:title" content="Meme Tug Club"><meta property="og:description" content="One finger. Big meme energy."><meta property="og:image" content="assets/cover.webp"><title>Meme Tug Club</title><link rel="icon" href="assets/icon.png"><link rel="stylesheet" href="style.css"></head>
<body><main id="shell"><div class="top"><div class="brand"><span class="eyebrow">THE INTERNET'S STRONGEST</span><h1>MEME <em>TUG</em> CLUB</h1></div><button id="sound" class="small" aria-label="Toggle sound">♫</button></div><div class="status"><span id="round">ROUND 1</span><div class="progress"><i id="progress"></i></div><span id="money">✦ 0</span></div><div id="arena"><div id="loading"><b>GETTING READY...</b><button id="reloadArt" hidden>RETRY</button></div><canvas id="scene" width="720" height="780" aria-label="Tug-of-war arena"></canvas><div id="rivalTag"><small>VS</small> <strong id="rival">SIDE-EYE CAT</strong></div><div class="match-meter"><span>YOU</span><div><i id="flagMarker">⚑</i></div><span>RIVAL</span></div><div id="float" aria-live="polite"></div><div id="instruction"><b>DRAG LEFT!</b><span>Pull the flag to your side</span></div><div id="result" hidden><div class="result-card"><div id="resultMark">★</div><h2 id="resultTitle">YOU WIN!</h2><p id="resultDesc"></p><button id="next" class="action">NEXT MATCH <span>➜</span></button><button id="upgrade" class="upgrade">⚡ POWER UP · 50</button></div></div><div id="paused" hidden><div class="result-card"><h2>PAUSED</h2><button id="resume" class="action">RESUME</button><button id="reset" class="upgrade">RESET PROGRESS</button></div></div></div><div class="controls"><div class="energyrow"><span>⚡ ENERGY</span><div class="energy"><i id="energyBar"></i></div><button id="pause" aria-label="Pause">Ⅱ</button></div><button id="pull" class="pull"><span class="arrow">❮❮</span><span><b>PULL!</b><small>DRAG LEFT OR TAP</small></span><span class="arrow">❮❮</span></button><div class="hype"><span>🔥 HYPE</span><div><i id="hypeBar"></i></div></div><div class="foot"><span id="tip">RELEASE TO REST</span><span>🏆 <b id="wins">0</b> WINS</span></div></div></main><script src="model.js"></script><script src="game.js"></script></body></html>
