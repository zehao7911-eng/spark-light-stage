<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c30"><title>Orebound · Keep the Light</title><link rel="stylesheet" href="style.css"></head><body><main><canvas id="world" aria-label="Mining caverns and defending a lighthouse"></canvas><header><b>OREBOUND</b><span id="bank"></span><button id="sound" aria-label="Toggle audio">♫</button><button id="pause" aria-label="Pause game">Ⅱ</button></header><div id="hud"><div><span id="wave"></span><strong id="clock"></strong></div><div class="bar"><i id="health"></i></div><span id="cargo"></span></div><div id="message" role="status"></div><div id="controls"><div id="pad"><button data-dir="up" aria-label="Move up">▲</button><button data-dir="left" aria-label="Move left">◀</button><button data-dir="down" aria-label="Move down">▼</button><button data-dir="right" aria-label="Move right">▶</button></div><button id="action">Lift ↑</button></div><section id="screen"><article><small>THE LAST LIGHT ON A LONELY MOON</small><h1>ORE<span>BOUND</span></h1><div class="symbol">✦</div><p>Dig deep. Bring the crystals home.<br>Keep your lighthouse alive.</p><button id="start">Begin expedition</button><p class="help">Hold arrows to move & drill.<br>Return for upgrades. Aim & fire during attacks.</p></article></section><section id="shop" hidden><article><small id="shop-title">WORKSHOP</small><h2>Make it stronger.</h2><div id="upgrades"></div><button id="close">Back to the mine</button></article></section></main><script src="game.js"></script></body></html>
