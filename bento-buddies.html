<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4eadb"><title>Bento Buddies · A little box of happy</title><link rel="stylesheet" href="bento-buddies.css"></head><body>
<div class="tablecloth" aria-hidden="true"></div><div class="shell">
<header><div class="brand"><span class="brandmark">▦</span><div>BENTO BUDDIES<small>A LITTLE BOX OF HAPPY</small></div></div><div class="tools"><button id="restart" aria-label="Unpack this lunchbox" title="Unpack">↶</button><button id="sound" aria-label="Toggle sound" aria-pressed="true">♪</button></div></header>
<div class="hud"><div><small>LUNCHBOX</small><b id="level">01</b></div><div class="dots" id="dots" aria-label="Packing progress"></div><div class="packed"><b id="packed">0 / 3</b><small>FRIENDS INSIDE</small></div></div>
<p id="tip">Drag the buddies. Fill the box.</p><div id="stage" role="group" aria-label="Lunchbox packing puzzle"><canvas id="art" aria-hidden="true"></canvas><div id="targets"></div><div id="tray"></div></div>
<footer><button id="hint"><span>✦</span><small>HINT</small></button><button id="styles"><span>▦</span><div><small>PICNIC STYLES</small><b id="stylecount">1 / 6</b></div><span class="arrow">↗</span></button><div class="lunchcount"><b id="clears">0</b><small>HAPPY LUNCHES</small></div></footer>
</div><div id="toast" role="status"></div>
<section id="win" hidden role="dialog" aria-modal="true" aria-labelledby="wintitle"><div class="winpanel"><div class="celebrate">✦</div><small>EVERY BUDDY HAS A SPOT</small><h1 id="wintitle">Packed with love!</h1><p id="reward">One more happy lunch.</p><button id="next">NEXT LUNCHBOX <span>→</span></button></div></section>
<section id="collection" hidden role="dialog" aria-modal="true" aria-labelledby="styletitle"><div class="stylepanel"><button id="closecollection" aria-label="Close picnic styles">×</button><small>YOUR LITTLE PICNIC COLLECTION</small><h2 id="styletitle">Pick your mood.</h2><p id="unlocktip">A new style every 3 lunches.</p><div id="stylecards"></div></div></section>
<script src="bento-buddies-engine.js?v=2"></script><script src="bento-buddies-levels.js?v=2"></script><script src="bento-buddies.js"></script></body></html>
