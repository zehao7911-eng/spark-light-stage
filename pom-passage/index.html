const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),copy=o=>JSON.parse(JSON.stringify(o));

}

});

class PomArt{constructor(canvas){this.c=canvas;this.ctx=canvas.getContext('2d');this.time=0;this.q=.5;this.vel=0;this.fx=[];this.w=1;this.h=1;this.gentle=false;this.layout={};}
 resize(w,h){this.w=w;this.h=h;let d=Math.min(1.5,devicePixelRatio||1);this.c.width=Math.round(w*d);this.c.height=Math.round(h*d);this.d=d;this.ctx.setTransform(d,0,0,d,0,0);this.wide=w/h>1.6;this.lw=this.wide?960:600;this.lh=this.wide?460:800;this.scale=Math.min(w/this.lw,h/this.lh);this.ox=(w-this.lw*this.scale)/2;this.oy=(h-this.lh*this.scale)/2;this.layout=this.wide?{gx:635,gy:214,bx:300,by:300}:{gx:300,gy:275,bx:300,by:607};}

 events(events){for(let e of events){if(e.type==='pass'){let p=this.layout;for(let i=0;i<30;i++)this.fx.push({x:p.gx,y:p.gy,vx:Math.cos(i*2.4)*70+(i%3-1)*15,vy:-80-Math.sin(i*1.7)*55,t:0,max:.8+(i%7)*.1,r:3+i%4,k:i%4})}if(e.type==='bonk'){let p=this.layout;for(let i=0;i<12;i++)this.fx.push({x:p.gx,y:p.gy,vx:(i-5.5)*20,vy:-50-i%3*20,t:0,max:.65,r:3+i%3,k:3})}}if(this.fx.length>80)this.fx.splice(0,this.fx.length-80)}

function reward(){view='reward';let stars=M.stars(s),final=s.level===8;panel('<span class="eyebrow">ROUTE '+String(s.level+1).padStart(2,'0')+' · DELIVERED</span><h2>'+(final?'The city says thank you.':'A very good delivery.')+'</h2><div class="stars" aria-label="'+stars+' stars">'+'✦'.repeat(stars)+'<span style="opacity:.2">'+'✦'.repeat(3-stars)+'</span></div><div class="postmark" aria-label="Travel stamp">'+marks[s.level]+'</div><p>3 letters delivered · '+s.perfect+' perfect fits<br>'+s.bonks+' gentle bump'+(s.bonks===1?'':'s')+'</p>'+(newly&&(s.level===2||s.level===5)?'<div class="note">'+(s.level===2?'THE PETAL DISTRICT IS OPEN<br>Oval and diamond windows await.':'THE EVENING EMBASSY IS OPEN<br>Double frames, one lovely fit.')+'</div>':'')+'<button id="next" class="primary full">'+(final?'OPEN THE TRAVEL BOOK':'NEXT DELIVERY →')+'</button><div class="row"><button id="replay" class="full">REPLAY</button><button id="bookWin" class="full">TRAVEL BOOK</button></div>');bind('next',()=>final?book():begin(s.level+1));bind('replay',()=>begin(s.level));bind('bookWin',book)}
function pause(){if(view!=='play')return;view='pause';art.draw(s,p,0);save();panel('<span class="eyebrow">THE LETTERS CAN WAIT</span><h2>A little breather.</h2><button id="resume" class="primary full">BACK TO POM</button><button id="gentle" class="setting full">Gentle motion <span>'+(p.gentle?'ON':'OFF')+'</span></button><button id="help" class="full">HOW TO PLAY</button><button id="bookPause" class="full">TRAVEL BOOK</button>');bind('resume',close);bind('gentle',()=>{p.gentle=!p.gentle;save();$('gentle').innerHTML='Gentle motion <span>'+(p.gentle?'ON':'OFF')+'</span>'});bind('help',help);bind('bookPause',book)}
function help(){view='help';panel('<span class="eyebrow">ONE LITTLE SHAPE</span><h2>Make room for Pom.</h2><div class="legend"><b>↕</b>Drag Pom up to stretch, down to squash. The slider works too.</div><div class="legend"><b>◇</b>The faint silhouette shows your shape in the doorway. Make it fit.</div><div class="legend"><b>↗</b>Tap Send Pom. A bump just brings you back. Try a new shape.</div><p>One star for the delivery.<br>One for two bumps or fewer.<br>One for three perfect fits.</p><p class="small">Nothing is timed. Bumps never cost a life.<br>Keyboard: ← / → shape · Space sends · P pauses.</p><button id="helpBack" class="primary full">BACK TO POM</button>');bind('helpBack',close)}
function book(){view='book';art.draw(s,p,0);save();let total=p.best.reduce((a,b)=>a+b,0);panel('<span class="eyebrow">LETTERS TO EVERYWHERE</span><h2>A pocketful of places.</h2><span class="mini-route">'+p.cleared+' / 9 routes · '+total+' / 27 stars</span><button id="bookBack" class="primary full">BACK TO POM</button><div class="bookgrid" id="bookgrid"></div><div class="skins" id="skins"></div><p class="small">Mint paper at 6 stars · Lilac paper at 18 stars.<br>Keep your best stamp. Replay for a perfect fit.</p>');for(let i=0;i<9;i++){let b=document.createElement('button');b.className='trip';b.disabled=i>p.cleared;b.setAttribute('aria-label',(p.best[i]?'Replay ':'Open ')+M.levels[i].name+(i>p.cleared?'; locked':''));b.innerHTML='<b>'+marks[i]+'</b>'+M.levels[i].name+'<i>'+'✦'.repeat(p.best[i])+'·'.repeat(3-p.best[i])+'</i>';b.addEventListener('click',()=>{audio.unlock();begin(i)});$('bookgrid').append(b)}['Cream paper','Mint paper','Lilac paper'].forEach((name,i)=>{let b=document.createElement('button');b.innerHTML='<span class="skin-dot" style="background:'+['#e6bd70','#a2c7ae','#c5a5d3'][i]+'"></span>';b.disabled=i>(total>=18?2:total>=6?1:0);b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',String(i===p.skin));b.addEventListener('click',()=>{p.skin=i;save();book()});$('skins').append(b)});bind('bookBack',()=>s.phase==='won'?reward():close())}
function emit(){art.events(s.events);for(let e of s.events){audio.event(e);if(e.type==='pass')toast(e.perfect?'PERFECT FIT!':'THROUGH, WITH LOVE.');if(e.type==='retry')toast(e.text);if(e.type==='next')save();if(e.type==='won'&&!rewarded){newly=M.award(p,s);rewarded=true;save();reward()}}}
function reshape(q){if(paused)return;if(M.shape(s,q)){if(s.last?.success===false)s.last=null;save();update()}}
function send(){if(paused)return;audio.unlock();if(M.send(s)){gesture=null;emit();save();update()}}
bind('send',send);bind('pause',()=>view==='pause'?close():pause());bind('album',book);bind('sound',()=>{p.sound=!p.sound;if(p.sound)audio.unlock();else audio.stop();save();hud='';update()});$('shape').addEventListener('input',e=>{audio.unlock();reshape(Number(e.target.value)/1000)});
let canvas=$('world');canvas.addEventListener('pointerdown',e=>{if(paused||s.phase!=='shape'||gesture)return;audio.unlock();gesture={id:e.pointerId,y:e.clientY,q:s.q};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;reshape(gesture.q+(gesture.y-e.clientY)/Math.max(110,art.h*.42))});canvas.addEventListener('pointerup',()=>{gesture=null});canvas.addEventListener('pointercancel',()=>{gesture=null});canvas.addEventListener('lostpointercapture',()=>{gesture=null});
document.addEventListener('keydown',e=>{if(e.target?.id==='shape'&&e.code.startsWith('Arrow'))return;if(e.code==='ArrowLeft'||e.code==='ArrowRight'||e.code==='ArrowUp'||e.code==='ArrowDown'){e.preventDefault();reshape(s.q+(['ArrowRight','ArrowUp'].includes(e.code)?.025:-.025))}if(e.code==='Space'){e.preventDefault();if(!e.repeat)send()}if(e.code==='KeyP'||e.code==='Escape'){e.preventDefault();view==='pause'?close():pause()}});
function interrupt(){gesture=null;if(view==='play')pause();else audio.stop();save()}window.addEventListener('blur',interrupt);document.addEventListener('visibilitychange',()=>{if(document.hidden)interrupt()});window.addEventListener('pagehide',save);
function resize(){let r=$('stage').getBoundingClientRect();art.resize(r.width,r.height);art.draw(s,p,0)}window.addEventListener('resize',()=>{gesture=null;if(view==='play')pause();resize()});
function frame(now){requestAnimationFrame(frame);if(!last){last=now;return}let dt=Math.min(.07,(now-last)/1000);last=now;if(paused)return;acc+=dt;let steps=0;while(acc>=1/60&&steps++<6){M.step(s,1/60);emit();acc-=1/60;if(paused)break}if(paused){art.draw(s,p,0);return}audio.step(dt);if(now-drawAt>25){art.draw(s,p,dt);drawAt=now}if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('status').classList.remove('on')}update();pendingSave+=dt;if(s.pending&&pendingSave>.15){pendingSave=0;save()}}
art.time=Number.isFinite(raw.artTime)?raw.artTime:0;resize();update();if(s.phase==='won')reward();else if(raw.draft)pause();else toast('Stretch or squash. Then send Pom.');requestAnimationFrame(frame);
})();
</script></body></html>
