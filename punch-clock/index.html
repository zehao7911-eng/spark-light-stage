</style></head><body><main id="game"><header><div class="brand"><b>PUNCH<span>CLOCK</span></b><small>BAD HOURS. GOOD HANDS.</small></div><button id="card" aria-label="Open bout card">▤</button><button id="pause" aria-label="Pause game">Ⅱ</button></header><section id="world"><canvas id="scene" role="img" aria-label="Robot boxing ring"></canvas><div class="rival"><div><span id="bout">BOUT 01 / 09</span><b id="name">TIN CAN TERRY</b></div><span id="enemyNumber">4 / 4</span><div class="battery"><i id="enemyBar"></i></div></div><div id="cue" aria-live="polite" hidden></div><div class="round-sign"><b id="phase">HOLD TO GUARD</b><span id="sequence">THEN LET GO TO HIT BACK</span></div><div id="error" hidden>Graphics are unavailable.<button onclick="location.reload()">RELOAD</button></div></section><footer><div class="systems"><div class="health"><span>YOUR HULL</span><b id="hearts">▰ ▰ ▰ ▰ ▰ ▰</b></div><div class="temperature"><span id="heatLabel">GUARD HEAT</span><div><i id="heatBar"></i></div></div><button id="sound" aria-label="Toggle sound">♪</button></div><button id="guard"><b id="action">HOLD TO GUARD</b><span id="subaction">RELEASE TO COUNTER</span><i>↗</i></button><div class="footnote"><span id="tip">HOLD. BLOCK. LET GO.</span><b id="score">0000</b></div></footer></main><dialog id="modal"><div id="modalBody"></div></dialog><script>(()=>{const C=(()=>{const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const clone=x=>JSON.parse(JSON.stringify(x));
const BOUTS=[
 {name:'TIN CAN TERRY',title:'THE WELCOME COMMITTEE',type:0,venue:0,hp:4,wind:1.05,pattern:[1],line:'PLEASE REMOVE ALL FEELINGS.'},

 {name:'TAX-O-TRON',title:'UNEXPECTED EXPENSES',type:2,venue:0,hp:8,wind:1.0,pattern:[2,1,2],line:'YOUR FISTS ARE NOT DEDUCTIBLE.'},
 {name:'SODA POPPA',title:'CARBONATED VIOLENCE',type:3,venue:1,hp:8,wind:.98,pattern:[1,2,1],line:'SHAKE WELL. APOLOGISE LATER.'},
 {name:'DIAL TONE',title:'PLEASE HOLD',type:4,venue:1,hp:10,wind:1.02,pattern:[2,2,1],line:'YOUR PUNCH IS IMPORTANT TO US.'},

 {name:'OVERTIME TERRY',title:'UNPAID EMOTIONAL DAMAGE',type:0,venue:2,hp:12,wind:.93,pattern:[2,3,1],line:'THIS COULD HAVE BEEN AN EMAIL.'},
 {name:'MIX MASTER DELUXE',title:'FULLY WHISKED',type:1,venue:2,hp:14,wind:.90,pattern:[3,2,2],line:'LET HIM COOK.'},

];

function makeRun(bout=0){bout=clamp(Math.floor(+bout||0),0,BOUTS.length-1);let b=BOUTS[bout];return {v:1,bout,mode:'ready',phase:'windup',left:b.wind,duration:b.wind,t:0,held:false,heat:0,hp:6,enemy:b.hp,turn:0,burst:b.pattern[0],index:0,side:0,energy:0,blocks:0,perfect:0,punches:0,hurt:0,whiffs:0,score:0,lastAttack:-10,lastBlock:-10,lastPunch:-10,lastHurt:-10,lastImpact:-10,pendingDamage:0,pendingPerfect:false,events:[]};}

function impact(s){let perfect=s.pendingPerfect,damage=s.pendingDamage;s.enemy=Math.max(0,s.enemy-damage);s.pendingDamage=0;s.punches++;s.perfect+=perfect?1:0;s.score+=100+(perfect?60:0)+Math.min(100,s.perfect*8);s.lastImpact=s.t;s.events.push({type:'punch',perfect,damage,side:s.punches%2});if(s.enemy<=0){s.mode='won';s.held=false;phase(s,'finish',1);s.events.push({type:'win'});}else phase(s,'stagger',perfect?.60:.46);}

function hold(s,down,p,fire=true){if(!s||!['ready','playing'].includes(s.mode)||s.held===!!down)return false;s.events=[];if(down){if(s.mode==='ready'){s.mode='playing';s.events.push({type:'start'});}s.held=true;s.events.push({type:'guard'});}else{s.held=false;if(fire)counter(s,p);}return true;}
function tick(s,dt,p){if(!s||!Number.isFinite(dt)||dt<=0)return;s.events=[];if(s.mode!=='playing')return;dt=Math.min(dt,1/30);s.t+=dt;s.heat=clamp(s.heat+(s.held?.18*Math.pow(.82,p.upgrades[1]):-.62)*dt,0,1);s.left-=dt;if(s.left>0)return;
 if(s.phase==='windup'){s.lastAttack=s.t;let blocked=s.held&&s.heat<.999;if(blocked){s.blocks++;s.heat=clamp(s.heat+.14,0,1);s.energy=1;s.lastBlock=s.t;s.score+=20;s.events.push({type:'block',side:s.side,last:s.index===s.burst-1});}else{s.hp--;s.hurt++;s.lastHurt=s.t;s.events.push({type:'hurt',side:s.side,overheat:s.heat>=.999});if(s.hp<=0){s.mode='lost';s.held=false;phase(s,'finish',1);s.events.push({type:'lose'});return;}}
  s.index++;if(s.index<s.burst){s.side=1-s.side;phase(s,'windup',p.comfort?.56:.42);}else phase(s,'counter',(p.comfort?1.20:.80)+p.upgrades[2]*.14);
 }else if(s.phase==='strike')impact(s);else if(s.phase==='counter'||s.phase==='stagger')beginTurn(s);
}
function stars(s){return s.mode==='won'?1+(s.hurt<=1?1:0)+(s.perfect>=Math.ceil(s.punches/2)?1:0):0;}
function bank(p,s){if(s.mode!=='won')return false;let before=earned(p);p.stars[s.bout]=Math.max(p.stars[s.bout],stars(s));p.best[s.bout]=Math.max(p.best[s.bout],s.score);return earned(p)-before;}
function restore(v){try{if(v?.v!==1||!Number.isInteger(v.bout)||!BOUTS[v.bout]||!['ready','playing','won','lost'].includes(v.mode)||!['windup','counter','strike','stagger','finish'].includes(v.phase))return null;let s=clone(v);if(!['left','duration','t','heat','hp','enemy','turn','burst','index','side','energy','blocks','perfect','punches','hurt','whiffs','score','lastAttack','lastBlock','lastPunch','lastHurt','lastImpact','pendingDamage'].every(k=>Number.isFinite(s[k])))return null;if(s.hp<0||s.hp>6||s.enemy<0||s.enemy>BOUTS[s.bout].hp||s.heat<0||s.heat>1||s.left<-.04||s.duration<=0||s.duration>3||s.index<0||s.index>3||s.burst<1||s.burst>3||s.score<0)return null;s.held=false;s.events=[];return s;}catch{return null;}}
;return {clamp,clone,BOUTS,COSTS,earned,spent,wallet,profile,mergeProfile,unlocked,buy,makeRun,hold,tick,stars,bank,restore};})();const A=(()=>{const {BOUTS}=C;const INK='#101b27',PAPER='#f2e8c9',GOLD='#f1c14b',BLUE='#58d8da',RED='#ed6548';
const PAL=[['#d79442','#533e37'],['#7ca4aa','#243f51'],['#769477','#273d36'],['#c1655b','#492c40'],['#7f7ba9','#35304e'],['#bba151','#403e36']];
function mix(c,k){let n=parseInt(c.slice(1),16),f=x=>Math.max(0,Math.min(255,Math.round(x*k)));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`;}
function path(q,points,close=false){q.beginPath();q.moveTo(...points[0]);for(let p of points.slice(1))q.lineTo(...p);if(close)q.closePath();}
