</main><dialog id="panel"><button id="close" aria-label="Close menu">×</button><div id="panelBody"></div></dialog><script>

 for(let tries=0;tries<500;tries++){s.board=[];for(let i=0;i<36;i++){let choices=kinds.filter(k=>!(i%6>=2&&s.board[i-1].kind===k&&s.board[i-2].kind===k)&&!(i>=12&&s.board[i-6].kind===k&&s.board[i-12].kind===k));s.board.push(seed(s,pick(s,choices)))}s.board[25].kind=0;s.board[26].kind=kinds[1];s.board[27].kind=0;s.board[28].kind=0;s.board[24].kind=kinds[2];s.board[29].kind=kinds[2];if(!groups(s.board).length&&legal(s).some(m=>m.a===25&&m.b===26))break}return s}

function grow(s,gs,preferred,chain){for(let g of gs){let anchor=g.includes(preferred)?preferred:g.reduce((a,b)=>s.board[a].level>=s.board[b].level?a:b),kind=s.board[anchor].kind,old=g.map(i=>({i,...s.board[i]})),max=Math.max(...g.map(i=>s.board[i].level)),level=Math.min(4,max?max+1:g.length>=5?3:g.length>=4?2:1);for(let i of g)s.board[i]=null;s.board[anchor]={id:s.nextId++,kind,level,hp:KINDS[kind].health*(1+.65*(level-1)),cd:.08,flash:0};s.highest[kind]=Math.max(s.highest[kind],level);s.stats.level=Math.max(s.stats.level,level);s.score+=g.length*30*chain*(1+level*.1);s.charge=clamp(s.charge+9+g.length*2+(level>1?12:0),0,100);emit(s,'grow',{anchor,kind,level,chain,old});}settle(s)}
function swap(s,a,b){if(!['ready','fight'].includes(s.phase)||!Number.isInteger(a)||!Number.isInteger(b)||a<0||a>35||b<0||b>35||Math.abs(a%6-b%6)+Math.abs(Math.floor(a/6)-Math.floor(b/6))!==1)return false;[s.board[a],s.board[b]]=[s.board[b],s.board[a]];let gs=groups(s.board);if(!gs.length){[s.board[a],s.board[b]]=[s.board[b],s.board[a]];emit(s,'invalid',{a,b});return false}if(s.phase==='ready'){begin(s);s.checkpoint=checkpoint(s)}s.stats.matches++;emit(s,'swap',{a,b});let chain=1;while(gs.length&&chain<=8){grow(s,gs,b,chain);s.stats.combo=Math.max(s.stats.combo,chain);gs=groups(s.board);chain++}if(gs.length||!legal(s).length)reshuffle(s);s.phase='resolving';s.resolveLeft=Math.min(1.15,.28+(chain-2)*.16);return true}

function wavePlan(s){let w=s.wave;if(w===1)return [{type:0,col:2,delay:0},{type:0,col:2,delay:.75},{type:0,col:2,delay:1.5}];let count=w===2?6:w===3?8:w===4?9:w===5?11:Math.min(14,8+Math.floor((w-6)/2)),out=[];if(w>=6)out.push({type:3,col:2,delay:1.5});for(let i=0;i<count;i++){let type=w===2?(i%3===2?1:0):w===3?(i%4===3?2:i%3===1?1:0):i%5===3?2:i%3===1?1:0;let cols=w===2?[2,3,1,4]:[0,2,4,1,3,5];out.push({type,col:cols[(i+w)%cols.length],delay:i*(w<4?1.1:.9)})}return out}

function nextWave(s){if(!['between','victory'].includes(s.phase))return false;s.wave=Math.min(999,s.wave+1);s.enemies=[];s.shots=[];s.pendingGift=null;begin(s);s.checkpoint=checkpoint(s);return true}

function resume(){if($('panel').close)$('panel').close();else $('panel').removeAttribute('open');paused=false;muted=false;prime();pointer=null;update()}
function menu(){show(`<h2>A little garden break</h2><button class="wide" data-do="resume">Back to the garden</button><div class="settings"><button data-do="sound">Sound · ${prefs.sound?'On':'Off'}</button><button data-do="gentle">Gentle motion · ${prefs.gentle?'On':'Off'}</button><button data-do="slow">Slow foes · ${prefs.slow?'On':'Off'}</button></div><button data-do="rack">Seed rack · ${profile.unlocked.filter(Boolean).length} / 7</button><button data-do="rules">How to play</button><button data-do="fresh">New garden</button><button data-do="credits">Art & credits</button><p class="note">Best wave ${profile.bestWave} · best score ${profile.bestScore.toLocaleString('en-US')}. ${storageOK?'Your garden is saved on this device.':'Storage is unavailable; this session still plays.'}</p>`)}
function rack(){let desc=['Fast peas · nearby lanes','Chilling shots · slower foes','Piercing puffs · groups','Splash melons · whole lawn','Healing + Sunburst charge','Tough roots · contact spikes','A big bite · close foes'];show(`<h2>Your seed rack</h2><p>Lime always joins. Choose two companions for a new garden. Your current plants stay.</p><div class="seedCards">${KINDS.map((k,i)=>`<div class="seedCard ${profile.unlocked[i]?'':'locked'} ${i===0||prefs.starters.includes(i)?'selected':''}"><img src="assets/${k.art}.webp" alt=""><b>${profile.unlocked[i]?k.name:'A new friend'}</b><small>${profile.unlocked[i]?desc[i]:'Keep defending to discover this seed.'}<br>${profile.highest[i]?'Best level '+profile.highest[i]:'Not grown yet'}</small><button data-pick="${i}" ${!profile.unlocked[i]||i===0?'disabled':''}>${i===0?'Always joins':!profile.unlocked[i]?'Locked':prefs.starters.includes(i)?'In your next garden':'Start with this seed'}</button></div>`).join('')}</div><h2>The uninvited guests</h2><div class="enemyCards">${ENEMIES.map((n,i)=>`<div><img style="${profile.seen[i]?'':'opacity:.15;filter:brightness(0)'}" src="assets/${['zombie_basic','zombie_cone','zombie_bucket','zombie_boss'][i]}.webp" alt=""><span>${profile.seen[i]?n:'?'}</span></div>`).join('')}</div><button data-do="fresh">Start a new garden</button><button data-do="resume">Back to the garden</button>`)}
function fresh(){show('<h2>Grow a fresh garden?</h2><p>Your seed rack and best records stay. This replaces the current defense.</p><button class="wide" data-do="start">Start fresh</button><button data-do="resume">Keep this garden</button>')}
function start(){s=create({seed:Date.now(),starters:prefs.starters,slowMode:prefs.slow});fx=[];floats=[];selected=-1;shownHint=[25,26];lastPhase='';resume();save();draw()}
$('panelBody').addEventListener('click',e=>{let btn=e.target.closest('button');if(!btn||btn.disabled)return;prime();if(btn.dataset.pick!==undefined){let k=Number(btn.dataset.pick);if(profile.unlocked[k]&&k!==0&&!prefs.starters.includes(k)){prefs.starters=[prefs.starters[1],k];save();rack()}return}switch(btn.dataset.do){case'resume':resume();break;case'rack':rack();break;case'fresh':fresh();break;case'start':start();break;case'sound':prefs.sound=!prefs.sound;save();menu();break;case'gentle':prefs.gentle=!prefs.gentle;save();menu();break;case'slow':prefs.slow=!prefs.slow;s.slowMode=prefs.slow;s.assisted ||=prefs.slow;save();menu();break;case'rules':show('<h2>Seeds become your defense</h2><p>Swap two neighbours to line up three of the same seed family. The matched seeds grow into a fighting plant. Match a grown plant with its family to level it up.</p><p>Plants fire automatically into their own and nearby lanes. Melons reach the whole lawn. Match while they fight. A full Sunburst damages the horde and heals your plants.</p><p>Clear six waves to save the garden. New seeds join after early waves. If the fence falls, Restore this wave brings back its starting plants with breathing room.</p><p>Keyboard: arrows move the focused cell · Enter/Space select · H hint · B Sunburst · P/Escape pause.</p><button data-do="resume">Back to the garden</button>');break;case'credits':show('<h2>Built from one garden</h2><p>Seedstrike has original game code, board logic, combat, interface and synthesized sound.</p><p>Its matching scene, seven seed and plant families, four enemy designs and four-frame walk sheets are directly reused from the public Rezona reference Crush Plant Battle Undead, at the user’s request. Original image files and exact source URLs are in ART-SOURCES.json. Their authorship and an open-media license are not claimed.</p><p>No reference game scripts, logo, recorded audio or fonts are included.</p><button data-do="resume">Back to the garden</button>');break}});
$('pause').onclick=menu;$('close').onclick=resume;$('panel').addEventListener('cancel',e=>{e.preventDefault();resume()});$('book').onclick=rack;$('hint').onclick=()=>{prime();let h=hint(s);if(h){shownHint=[h.a,h.b];selected=-1;text('TRY THIS SWAP',at(h.a).x,at(h.a).y-28,'#fff9c6',12);update();draw()}};$('burst').onclick=()=>{prime();if(sunburst(s)){drain(s).forEach(event);update();draw();save()}};$('next').onclick=()=>{prime();if(s.phase==='lost'){retryWave(s);fx=[];floats=[]}else nextWave(s);drain(s).forEach(event);selected=-1;shownHint=[];update();save();draw()};
$('grid').addEventListener('keydown',e=>{let i=Number(e.target.dataset.index);if(!Number.isInteger(i))return;let j=i;if(e.key==='ArrowRight'&&i%6<5)j++;if(e.key==='ArrowLeft'&&i%6>0)j--;if(e.key==='ArrowUp'&&i>=6)j-=6;if(e.key==='ArrowDown'&&i<30)j+=6;if(j!==i){e.preventDefault();$('grid').children[i].tabIndex=-1;$('grid').children[j].tabIndex=0;$('grid').children[j].focus({preventScroll:true})}});window.addEventListener('keydown',e=>{if(e.repeat)return;let k=e.key.toLowerCase();if(k==='escape'||k==='p'){e.preventDefault();$('panel').open?resume():menu();return}if(paused||e.target.closest('button,input,select'))return;if(k==='h'){$('hint').click();e.preventDefault()}if(k==='b'){$('burst').click();e.preventDefault()}});
window.addEventListener('blur',()=>{pointer=null;muted=true;if(master)master.gain.value=0;save()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&ready&&!paused)menu()});window.addEventListener('pagehide',save);window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>{pointer=null;if(ready&&!paused)menu();fit()});
async function load(){ready=false;$('loading').hidden=false;$('retryArt').hidden=true;let timeout=setTimeout(()=>{if(!ready){$('loading').querySelector('span').textContent='A few garden pictures are taking longer. You can retry.';$('retryArt').hidden=false}},14000);await Promise.all(Object.keys(ATLAS).map(name=>new Promise(resolve=>{let im=new Image();im.onload=()=>{images[name]=im;resolve()};im.onerror=resolve;im.src='assets/'+name+'.webp'})));clearTimeout(timeout);if(Object.keys(ATLAS).every(n=>images[n])){ready=true;$('loading').hidden=true;fit();update();draw();if(paused)menu()}else{$('loading').querySelector('span').textContent='Some artwork could not load. Please retry.';$('retryArt').hidden=false}}$('retryArt').onclick=load;
let last=performance.now(),acc=0,paint=0;function frame(now){let dt=Math.min(.18,Math.max(0,(now-last)/1000));last=now;if(ready&&!paused){clock+=dt;acc+=dt;while(acc>=1/60){tick(s,1/60);drain(s).forEach(event);acc-=1/60}for(let e of fx){e.life-=dt;if(e.vx!==undefined){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=95*dt}}fx=fx.filter(e=>e.life>0);for(let f of floats)f.life-=dt;floats=floats.filter(f=>f.life>0);shake=Math.max(0,shake-dt*14);sunFlash=Math.max(0,sunFlash-dt*1.7);paint+=dt;saveTime+=dt;if(saveTime>3){saveTime=0;save()}if(paint>=1/(prefs.gentle?25:40)){paint=0;update();draw()}}else acc=0;requestAnimationFrame(frame)}
records();fit();update();load();requestAnimationFrame(frame);

})();
</script></body></html>
