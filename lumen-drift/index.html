<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c18"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E✧%3C/text%3E%3C/svg%3E"><title>Lumen Drift</title><link rel="stylesheet" href="style.css"></head><body><main id="field"></main><header><div class="logo">✧</div><div><h1>LUMEN DRIFT</h1><small>A LITTLE UNIVERSE IN YOUR HANDS</small></div><button id="sound" aria-label="Enable sound" title="Sound">♫</button><button id="pause" aria-label="Pause" title="Pause">Ⅱ</button></header><div id="hint">Touch the stars. Pull them closer.</div><button id="burst" aria-label="Starburst" title="Starburst"><span>✺</span></button><div id="caption"><span id="sceneName">HALO</span><i></i><span id="count">STARDUST</span></div><aside id="dock"><nav aria-label="Forces"><button class="active" data-tool="pull"><span>◉</span>Pull</button><button data-tool="orbit"><span>◎</span>Orbit</button><button data-tool="push"><span>✳</span>Push</button><button data-tool="seed"><span>✧</span>Seed</button></nav><footer><button id="scenes">Halo <span>⌄</span></button><button id="pin" aria-label="Pin a force" title="Pin a force">⌖</button><button id="color" aria-label="Change colors" title="Change colors"><i></i></button><button id="export" aria-label="Save PNG" title="Save PNG">↓</button><button id="settings" aria-label="Settings" title="Settings">⚙</button></footer></aside><section id="sceneMenu" class="glass" hidden><div class="modalHead"><h2>NEW UNIVERSE</h2><button data-close="sceneMenu" aria-label="Close scenes">×</button></div><div id="sceneGrid"></div></section><section id="settingsPanel" class="glass" hidden><div class="modalHead"><h2>FINE TUNE</h2><button data-close="settingsPanel" aria-label="Close settings">×</button></div><label>Force<input id="strength" type="range" min="20" max="180" value="90"></label><label>Reach<input id="radius" type="range" min="20" max="140" value="70"></label><label>Afterglow<input id="trail" type="range" min="0" max="95" value="65"></label><div class="toggles"><button id="spin" class="active">Drift · On</button><button id="clearPins">Clear pins</button></div><div class="toggles"><button id="bookmark">Bookmark</button><button id="restore">Restore</button></div><p>Drag a pinned force to move it. Tap it to remove.</p></section><div id="toast" role="status"></div><section id="error" hidden><h2>The stars could not open</h2><p>This canvas needs WebGL. Try Chrome, Edge or Safari.</p><button onclick="location.reload()">Retry</button></section><script src="p5.min.js"></script><script src="engine.js"></script><script src="app.js"></script></body></html>
