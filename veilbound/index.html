<section id="overlay"><div id="panel"></div></section><div id="flash"></div></main><script>/* All artwork is drawn locally. No downloaded sprites, fonts or network assets. */
const Art=(()=>{
const themes=[{sky:'#091925',mist:'#426781',light:'#9dccdf',stone:'#273b4a',ink:'#080f1a',leaf:'#243e48',accent:'#90bacd',name:'Forgotten Crossing'}, {sky:'#071e22',mist:'#257b72',light:'#9deacb',stone:'#244846',ink:'#071b1f',leaf:'#375e49',accent:'#b0d398',name:'The Verdant Cloister'}, {sky:'#1b172c',mist:'#645883',light:'#c9b5e5',stone:'#40374d',ink:'#100d1d',leaf:'#524361',accent:'#dec4ed',name:'The Violet Archive'}];
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function path(c,d,fill,stroke='#07131d',lw=2){const p=new Path2D(d);if(fill){c.fillStyle=fill;c.fill(p)}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke(p)}}
function ellipse(c,x,y,rx,ry,fill,stroke=null,lw=2){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}}
function line(c,x1,y1,x2,y2,col,w=1){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=w;c.stroke()}
function glow(c,x,y,r,col,a=.3){c.save();c.globalAlpha=a;let g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore()}
function leaves(c,x,y,size,col,seed){let r=rng(seed);c.save();c.translate(x,y);for(let i=0;i<7;i++){let a=-2.8+i*.45;c.save();c.rotate(a);path(c,`M0 0Q${size*.3} ${-size*.5} ${size*(.7+r()*.5)} 0Q${size*.5} ${size*.25} 0 0`,col,'#07151c',1);c.restore()}c.restore()}
function arch(c,x,y,w,h,col){c.save();c.translate(x,y);c.fillStyle=col;c.fillRect(-w/2-18,0,18,h);c.fillRect(w/2,0,18,h);path(c,`M${-w/2-18} 10Q${-w/2-18} ${-h*.5} 0 ${-h*.6}Q${w/2+18} ${-h*.5} ${w/2+18} 10L${w/2} 10Q${w/2} ${-h*.4} 0 ${-h*.5}Q${-w/2} ${-h*.4} ${-w/2} 10Z`,col,null);c.restore()}
function bake(theme,seed,platforms,length){const t=themes[theme],rnd=rng(seed);let back=document.createElement('canvas'),terrain=document.createElement('canvas');back.width=terrain.width=length;back.height=terrain.height=600;let c=back.getContext('2d');let g=c.createLinearGradient(0,0,0,600);g.addColorStop(0,t.sky);g.addColorStop(.65,t.mist);g.addColorStop(1,t.sky);c.fillStyle=g;c.fillRect(0,0,length,600);
for(let i=0;i<13;i++){let x=i*165+30+rnd()*65;c.globalAlpha=.14+rnd()*.12;arch(c,x,210,95+rnd()*70,320,t.ink);c.globalAlpha=.07;glow(c,x,270,190,t.light,.8)}c.globalAlpha=1;
// Distant windows, wandering carved ribs and hanging lanterns.
for(let x=30;x<length;x+=285){c.save();c.translate(x,0);c.globalAlpha=.2;path(c,'M-40 0Q60 120 0 260Q-30 380 12 470L60 470Q15 290 75 190Q150 100 115 0Z',t.ink,null);c.globalAlpha=.15;for(let j=0;j<6;j++)path(c,`M0 ${160+j*34}Q38 ${175+j*34} 50 ${205+j*34}`,null,t.light,1);c.globalAlpha=.3;path(c,'M135 318L135 212Q170 143 204 212L204 318Z',t.sky,t.light,2);line(c,169,179,169,318,t.light);line(c,135,262,204,262,t.light);c.restore()}
for(let i=0;i<55;i++){let x=rnd()*length,y=170+rnd()*280;c.globalAlpha=.12;ellipse(c,x,y,3+rnd()*6,3+rnd()*6,t.light)}c.globalAlpha=1;
// Soft, stippled surface variation is cached, never regenerated per frame.
for(let i=0;i<9500;i++){let x=rnd()*length,y=rnd()*600;c.globalAlpha=.018+rnd()*.025;c.fillStyle=rnd()>.5?t.light:t.ink;c.fillRect(x,y,1+rnd()*2,1+rnd()*2)}c.globalAlpha=1;
// Greenpath-like curling roots and overlapping fern canopies have a separate silhouette layer.
if(theme===1){for(let x=80;x<length;x+=300){c.save();c.translate(x,0);c.globalAlpha=.38;path(c,'M-50-20Q130 55 37 220Q-8 292 55 444Q-60 344-10 225Q75 98-72 37Z','#0b3333','#082225',4);for(let j=0;j<9;j++){let yy=30+j*24,xx=Math.sin(j*.8)*36;leaves(c,xx,yy,22+rnd()*24,t.leaf,j+x);path(c,`M${xx} ${yy}Q${xx+54} ${yy+14} ${xx+80} ${yy+51}`,null,'#356356',2)}c.restore()}for(let x=0;x<length;x+=75){c.globalAlpha=.25;leaves(c,x,8,40+rnd()*55,t.leaf,x+99)}c.globalAlpha=1}
if(theme===2){for(let x=80;x<length;x+=250){c.save();c.translate(x,290);c.globalAlpha=.23;path(c,'M-68 75L-64-40Q0-128 64-40L70 75Z',t.sky,t.light,2);for(let j=-2;j<=2;j++)path(c,`M${j*21} 70L${j*21} -24Q${j*18} -57 0-80`,null,t.light,1);for(let j=0;j<4;j++){line(c,-65,-10+j*21,67,-10+j*21,t.light,1)}c.restore()}}
// Suspended dust/light shafts, drawn softly instead of full-screen blur.
for(let x=200;x<length;x+=510){c.save();c.globalAlpha=.075;c.fillStyle=t.light;c.beginPath();c.moveTo(x-55,0);c.lineTo(x+30,0);c.lineTo(x+230,470);c.lineTo(x+100,470);c.fill();c.restore();glow(c,x+100,260,190,t.light,.15)}
c=terrain.getContext('2d');
// Long scrollable hand-inked ground, with chipped masonry, moss and iron tracery.
let gg=c.createLinearGradient(0,460,0,600);gg.addColorStop(0,t.stone);gg.addColorStop(1,t.ink);c.fillStyle=gg;c.fillRect(0,470,length,130);line(c,0,471,length,471,t.accent,3);line(c,0,482,length,482,t.ink,3);
for(let x=0;x<length;x+=48){path(c,`M${x} 482Q${x+16} 495 ${x+8} 517L${x+39} 517Q${x+34} 495 ${x+48} 482`,null,t.ink,3);path(c,`M${x+13} 492Q${x+26} 514 ${x+36} 492`,null,t.accent,1);line(c,x+24,520,x+24,563,t.ink,2);line(c,x+4,554,x+44,554,t.ink,2);c.globalAlpha=.25;line(c,x+4,550,x+44,550,t.accent,1);c.globalAlpha=1}
for(let i=0;i<85;i++){let x=rnd()*length;ellipse(c,x,471,4+rnd()*10,1.3+rnd()*2,t.leaf);if(theme===1)leaves(c,x,470,8+rnd()*10,t.leaf,i+9)}
for(let p of platforms){c.fillStyle=t.stone;c.fillRect(p.x,p.y,p.w,16);line(c,p.x,p.y,p.x+p.w,p.y,t.accent,2);path(c,`M${p.x} ${p.y+14}Q${p.x+p.w*.5} ${p.y+55} ${p.x+p.w} ${p.y+14}`,t.ink,t.accent,1);for(let x=p.x+12;x<p.x+p.w;x+=26){path(c,`M${x} ${p.y+1}Q${x+9} ${p.y+19} ${x+18} ${p.y+1}`,null,t.ink,2)}if(theme===1)for(let x=p.x+5;x<p.x+p.w;x+=30)leaves(c,x,p.y,9,t.leaf,x)}
for(let x=230;x<length-180;x+=370){c.save();c.translate(x,470);c.globalAlpha=.72;path(c,'M-20 0L-18-170Q-45-216-10-259Q12-225 5-174L16 0Z',t.stone,t.ink,3);for(let j=0;j<7;j++)path(c,`M-18 ${-25-j*21}Q0 ${-15-j*21} 7 ${-34-j*21}`,null,t.ink,2);path(c,'M-35-165Q-8-200 18-170L17-158-35-152Z',t.stone,t.ink,3);if(theme===1){path(c,'M-50 0Q-90-130-32-240Q-9-290-80-345Q5-306-15-223Q-58-145-27 0Z',t.leaf,t.ink,3);for(let i=0;i<5;i++)leaves(c,-30+i*4,-70-i*42,18,t.leaf,i+x)}c.restore()}
// Lanterns hang from ornate curving posts.
for(let x=150;x<length;x+=480){c.save();c.translate(x,470);path(c,'M0 0L0-108Q0-154 34-157Q66-159 61-129',null,t.ink,7);path(c,'M0-110Q0-150 36-154Q64-154 60-130',null,t.accent,1);path(c,'M49-124Q60-147 72-124L74-100Q60-88 47-100Z',t.sky,t.accent,2);ellipse(c,60,-112,6,10,t.light);c.restore()}
// Foreground shell, low ferns, broken pottery; none obscures player collision silhouettes.
for(let x=80;x<length;x+=245){c.save();c.translate(x,530);c.globalAlpha=.82;path(c,'M-55 20Q-48-38-12-49Q40-73 61-15L54 20Z',t.ink,null);for(let i=0;i<4;i++)path(c,`M${-30+i*15} 20Q${-37+i*16} ${-20-i*3} ${-15+i*13} ${-43+i*9}`,null,t.stone,2);leaves(c,40,15,29,t.ink,x);for(let j=0;j<5;j++){let xx=55+j*12,yy=8-j*5;path(c,`M${xx} 50Q${xx-5} ${yy-60} ${xx+28} ${yy-66}Q${xx+50} ${yy-50} ${xx+28} ${yy-42}Q${xx+17} ${yy-52} ${xx+28} ${yy-55}`,null,t.ink,3);for(let k=0;k<4;k++)path(c,`M${xx} ${yy+k*12}L${xx-15} ${yy+k*12-10}M${xx+1} ${yy+k*12}L${xx+13} ${yy+k*12-11}`,null,t.ink,2)}c.restore()}
// Small bevels and fracture lines break the regularity of the carved stone.
