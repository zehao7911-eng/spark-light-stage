</style></head><body><main id="game"><header><div class="brand"><b>CLICKVAULT<span>✦</span></b><small>LITTLE LOCKS. LOVELY THINGS.</small></div><button id="collection" aria-label="Open the curio cabinet">▦</button><button id="pause" aria-label="Pause game">Ⅱ</button></header><div class="info"><span id="level">01 / 12</span><h1 id="title">A LITTLE CLICK</h1><span id="moves">0 TURNS</span></div><section id="world"><canvas id="scene" tabindex="0" role="img" aria-label="A clockwork cabinet. Line up every ring gap at the top."></canvas><div class="aim-label" id="objective">LINE UP THE GAPS ↑</div><div id="toast" aria-live="polite" hidden></div><div id="error" hidden>The cabinet could not open.<button onclick="location.reload()">RELOAD</button></div></section><footer><div id="playControls"><div id="dials" class="dials"></div><div class="tools"><button id="undo" aria-label="Undo last turn">↶ <span>UNDO</span></button><p id="tip">TAP A RING. FOLLOW THE CLICK.</p><button id="hint" aria-label="Show one next turn">✧ <span>HINT</span></button></div></div><div id="receipt" hidden><div><small id="rewardStars"></small><b id="treasureName"></b><span id="resultNote"></span></div><div class="reward-actions"><button id="replay">REPLAY</button><button id="next">NEXT CABINET →</button></div></div></footer></main><dialog id="modal"><div id="modalBody"></div></dialog><script>(()=>{const C=(()=>{const mod=(n,m)=>(n%m+m)%m;

function result(s){let b=LOCKS[s.level];return{stars:s.phase==='won'?1+(s.moves<=b.par?1:0)+(s.hints===0?1:0):0,moves:s.moves,par:b.par,hints:s.hints,undos:s.undos};}

function restore(v){try{if(v?.v!==1||!Number.isInteger(v.level)||!LOCKS[v.level]||!['ready','turning','opening','won'].includes(v.phase))return null;let b=LOCKS[v.level],s=clone(v),n=b.ops.length;for(let k of['pos','from'])if(!Array.isArray(s[k])||s[k].length!==n||!s[k].every(x=>Number.isInteger(x)&&x>=0&&x<b.N))return null;if(!Array.isArray(s.spin)||s.spin.length!==n||!s.spin.every(x=>[-1,0,1].includes(x)))return null;if(!['elapsed','time','moves','hints','undos'].every(k=>Number.isFinite(s[k])&&s[k]>=0)||s.elapsed>1.81)return null;if(![s.moves,s.hints,s.undos].every(Number.isInteger)||s.moves>999)return null;if(!Array.isArray(s.history)||s.history.length>80||!s.history.every(a=>Array.isArray(a)&&a.length===n&&a.every(x=>Number.isInteger(x)&&x>=0&&x<b.N)))return null;if(['opening','won'].includes(s.phase)&&!s.pos.every(x=>x===0))return null;s.events=[];return s;}catch{return null;}}
;return {mod,clone,apply,LOCKS,solve,makeProfile,mergeProfile,unlocked,total,count,lookAllowed,makeRun,turn,undo,hint,tick,result,award,restore};})();const A=(()=>{const {LOCKS}=C;const TAU=Math.PI*2,INK='#173c3b',GOLD='#dca95a',CREAM='#fff0ce',PINK='#df8b7a',JADE='#4e9583';
const RADII=[116,82,48];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};

function gallery(){let u=C.unlocked(p);open('gallery',`<p class="eyebrow">CLICKVAULT / ${C.count(p)} OF 12 DISCOVERED</p><h2>The curio<br>collection.</h2><p>${C.total(p)} / 36 stars. Twelve locks. Twelve lovely little things.</p><div class="gallery">${C.LOCKS.map((b,i)=>`<button data-cabinet="${i}" class="${p.stars[i]?'':'locked'}" ${i>u?'disabled':''}><canvas data-thumb="${i}" width="180" height="130"></canvas><b>${String(i+1).padStart(2,'0')} · ${p.stars[i]?b.treasure:i<=u?'NEXT LITTLE MYSTERY':'STILL A SECRET'}</b><small>${p.stars[i]?'★'.repeat(p.stars[i])+'☆'.repeat(3-p.stars[i]):i<=u?'OPEN →':'⌑'}</small></button>`).join('')}</div><p class="eyebrow">THE CABINET FINISH</p><div class="looks">${['JADE','MOONSTONE','MARQUETRY'].map((n,i)=>`<button data-look="${i}" aria-pressed="${p.look===i}" ${C.lookAllowed(p,i)?'':'disabled'}>${n}<small>${i===0?'YOURS':`OPEN ${[0,4,8][i]} LOCKS`}</small></button>`).join('')}</div><p class="note">Earn finishes by opening cabinets. Every keepsake can be admired and wound again. Replays keep your best stars and fewest turns.</p>${btn('BACK TO THE CABINET','close','wide primary sticky')}`);for(let el of document.querySelectorAll('[data-thumb]')){let i=+el.dataset.thumb,q=el.getContext('2d');if(p.stars[i])drawCurio(q,i,90,65,.72,1,true);else{q.fillStyle='#799183';q.font='italic 42px Georgia';q.textAlign='center';q.fillText('?',90,85);}}}
function toy(i){toyId=i;toyWind=0;toyT=1;open('toy',`<p class="eyebrow">CURIO Nº ${String(i+1).padStart(2,'0')}</p><h2>${C.LOCKS[i].treasure.toLowerCase()}.</h2><canvas id="toy" class="toy-view" width="600" height="460" aria-label="Animated ${C.LOCKS[i].treasure.toLowerCase()}"></canvas>${btn('WIND IT UP ✧','wind','wide primary')}${btn('REPLAY ITS LOCK','replayToy')}${btn('THE COLLECTION','gallery')}`);paintToy(0);}
function paintToy(dt){let c=$('toy');if(!c)return;let q=c.getContext('2d');q.clearRect(0,0,c.width,c.height);if(toyWind>0){toyWind=Math.max(0,toyWind-dt);toyT+=dt*2;}drawCurio(q,toyId,300,240,2.3,toyT,false);}
$('modalBody').addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;audio.wake();audio.play({type:'ui'});let a=b.dataset.action;if(a==='close')close();if(a==='gallery')gallery();if(a==='restart')begin(s.level);if(a==='wind'){toyWind=4;audio.play({type:'wind'});}if(a==='replayToy')begin(toyId);if(b.dataset.setting){let k=b.dataset.setting;p[k]=!p[k];if(!p.sound)audio.stop();save(true);pauseMenu();render();}if(b.dataset.look!==undefined){let n=+b.dataset.look;if(C.lookAllowed(p,n)){p.look=n;save(true);gallery();render();}}if(b.dataset.cabinet!==undefined){let i=+b.dataset.cabinet;p.stars[i]?toy(i):begin(i);}});
$('collection').onclick=gallery;$('pause').onclick=pauseMenu;$('replay').onclick=()=>begin(s.level);$('next').onclick=()=>s.level<11?begin(s.level+1):gallery();$('modal').addEventListener('cancel',e=>{e.preventDefault();close();});
function suspend(){if(!modalKind&&(s.moves||['opening','turning'].includes(s.phase)))pauseMenu();else{cancel();audio.stop();save();}last=performance.now();}
window.addEventListener('blur',suspend);document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend();});window.addEventListener('pagehide',()=>{save(true);sdk.end();sdk.stop();audio.stop();});window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
function size(){let vp=sdk?.viewport(),fits=vp&&vp.width>=280&&vp.height>=240&&vp.width<=innerWidth+2&&vp.height<=innerHeight+2,main=$('game');main.style.width=fits?vp.width+'px':'';main.style.height=fits?vp.height+'px':'';document.documentElement.dataset.viewport=fits?'host':'browser';let rect=$('scene').getBoundingClientRect();if(view&&(Math.abs(view.w-rect.width)>.01||Math.abs(view.h-rect.height)>.01)){cancel();view.resize();}render();hud();}new ResizeObserver(size).observe($('world'));
function frame(now){let f=clock.sample(now,p.light?30:45,paused&&modalKind!=='toy');advance(now);if(f.draw){if(!paused)render(f.draw);else if(modalKind==='toy'&&toyWind>0)paintToy(f.draw);}if(!paused&&now-uiTime>70){uiTime=now;hud();}if(!paused&&now-saveTime>2500){saveTime=now;save();}requestAnimationFrame(frame);}
hud();render();requestAnimationFrame(frame);if(raw?.active&&(s.moves||s.phase!=='ready')){if(s.phase==='won'){C.award(p,s);save();}else pauseMenu();}
})();</script></body></html>
