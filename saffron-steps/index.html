<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#222438"><title>Saffron Steps — A Little Tea Quarter</title><link rel="stylesheet" href="game.css"></head><body><main>
<header><div><small>SAFFRON STEPS</small><div class="stats"><span id="coins">● 0</span><span id="day">Day 1</span><span id="stamps">☆ 0</span></div></div><div class="tools"><button id="sound" aria-label="Toggle sound">♫</button><button id="pause" aria-label="Pause game">Ⅱ</button><button id="help" aria-label="How to play">?</button></div></header>
<div id="orders" aria-label="Tea orders"></div><div id="scene"><canvas width="480" height="280" id="world" aria-label="Interactive tea quarter. Tap glowing garden markers, the kettle, or guests. Use the buttons below for the same actions."></canvas><div id="loading">Opening the tea quarter…</div><div id="float" aria-live="polite"></div></div>
<div class="status"><span id="hint">Pick herbs → Brew → Serve</span><span id="chain"></span></div>
<nav id="actions" aria-label="Tea actions"><button id="pick"><span class="glyph">✿</span><span id="pickLabel">Pick herbs</span></button><button id="brew"><span class="icon pot"></span><span id="brewLabel">Brew</span></button><button id="serve"><span class="icon cup"></span><span id="serveLabel">Serve</span></button></nav>
<div class="pocket"><div id="inventory" aria-label="Herb inventory"></div><button id="shop">✧ Upgrade <b id="shopBadge"></b></button><button id="album">▧ Teas <span id="albumCount">0/6</span></button></div>
<div class="progress"><div id="progressBar"></div></div><div class="next"><span id="nextUnlock">✧ Saffron garden at 4 teas</span><span id="dayProgress">0/6</span></div>
<footer><span id="saveState">Saved on this device</span><button id="photo">▣ Photo</button></footer>
</main><dialog id="modal"><div id="modalBody"></div><button id="close">Continue</button></dialog><script src="engine.js"></script><script src="game.js"></script></body></html>
