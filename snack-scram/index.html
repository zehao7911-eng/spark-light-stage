const buildUrl="Build",loader=document.createElement('script');loader.src=buildUrl+"/snack-scram-web.loader.js";loader.onload=()=>{createUnityInstance(document.querySelector('#unity-canvas'),{dataUrl:buildUrl+"/snack-scram-web.data.unityweb",frameworkUrl:buildUrl+"/snack-scram-web.framework.js.unityweb",codeUrl:buildUrl+"/snack-scram-web.wasm.unityweb",streamingAssetsUrl:"StreamingAssets",companyName:"Little Trouble Studio",productName:"Snack & Scram",productVersion:"1.0",devicePixelRatio:Math.min(devicePixelRatio,1.5)},p=>{document.querySelector('#loadbar').style.width=(p*100)+'%';document.querySelector('#loadlabel').textContent='Preparing the picnic · '+Math.round(p*100)+'%'}).then(u=>{window.snackUnity=u;window.ssBoot&&window.ssBoot()}).catch(e=>{document.querySelector('#loadlabel').textContent='Could not open the picnic. This game needs WebGL 2.';const a=document.createElement('a');a.textContent='Try again';a.href='?retry='+Date.now();document.querySelector('.loadcard').append(a);console.error(e)})};loader.onerror=()=>{document.querySelector('#loadlabel').textContent='The picnic could not download. Please reload.'};document.body.append(loader);
