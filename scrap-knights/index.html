try{const d=JSON.parse(localStorage.getItem('scrap-knights-v1'));if(d&&d.run?.index>=0&&d.run?.index<8&&Array.isArray(d.bp)&&Array.isArray(d.profile?.best)&&S.valid(d.run.bp)){bp=d.bp;profile=d.profile;muted=!!d.muted;savedMode=d.mode;run=new S.Run(d.run.index,d.run.bp,d.run);saveExists=true}}catch(e){run=null;bp=S.clone(S.starter);profile={best:[],unlocked:0,paint:0};saveExists=false}if(!run)run=new S.Run(0,bp);art.paint=profile.paint;
function total(){return profile.best.reduce((n,x)=>n+(x||0),0)}
function save(){try{localStorage.setItem('scrap-knights-v1',JSON.stringify({bp,profile,muted,mode:building?'build':'play',run:run.snapshot()}))}catch(e){}}
function stopInput(){held.clear();input={drive:0,fire:false,lift:false};for(const id of ['left','right','fire','lift'])$(id).classList.remove('held')}
function silence(){for(const o of voices){try{o.stop()}catch(e){}}voices.clear()}
function sound(type){if(muted||paused||document.hidden)return;try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.22;master.connect(ac.destination)}ac.resume();const f=type==='blast'?[95,60]:type==='bell'?[523,659,784]:type==='coin'?[880,1175]:type==='fire'?[160,90]:type==='snap'?[110]:type==='win'?[392,494,587,784]:[330];f.forEach((v,i)=>{if(voices.size>18)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.06;o.type=['fire','blast','snap'].includes(type)?'triangle':'sine';o.frequency.setValueAtTime(v,t);o.frequency.exponentialRampToValueAtTime(v*.55,t+.16);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(type==='blast'?.3:.16,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+.25);voices.add(o);o.onended=()=>{voices.delete(o);o.disconnect();g.disconnect()}})}catch(e){}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');toaster=clock+2.7}
function refresh(){const cleared=run.bells.filter(b=>b.plugin.cleared).length;const str=[run.index,cleared,run.collected,run.angle,muted,run.status].join(',');if(str===hud)return;hud=str;$('contract').textContent=`CONTRACT ${String(run.index+1).padStart(2,'0')} / ${run.level.name.toUpperCase()}`;$('progress').textContent='◆'.repeat(cleared)+'◇'.repeat(run.bells.length-cleared);$('status').textContent=cleared<run.bells.length?`${run.bells.length-cleared} bell ${run.bells.length-cleared===1?'tower':'towers'} left`:'Head for the green flag';$('keepsakes').textContent=(run.coins[0].taken?'✦':'✧')+' '+(run.coins[1].taken?'✦':'✧');$('angle').textContent=run.angle+'°';$('sound').textContent=muted?'♫̸':'♪';$('fire').disabled=!run.bp.some(p=>p.type==='cannon');$('lift').disabled=!run.bp.some(p=>['spring','balloon'].includes(p.type));$('instruction').textContent=run.index===0&&run.time<6?'Hold ▶ to drive · Hold ✦ to fire':'';}
function modal(html,m,css=''){paused=true;stopInput();silence();mode=m;$('modal').classList.remove('hidden');$('panel').className=css;$('panel').innerHTML=html;$('panel').scrollTop=0;refresh()}
function close(){paused=false;building=false;mode='play';$('modal').classList.add('hidden');stopInput();if(ac&&!muted)ac.resume();refresh()}
function intro(){modal(`<small>A LITTLE PHYSICS WORKSHOP</small><h2>Scrap Knights</h2><div class="mark">⚒</div><p>Build a tiny machine. Knock down the bell towers.<br>Bring your contraption to the green flag.<br><br>Try a different build whenever things go sideways.</p><button class="primary" data-action="continue">${saveExists?'Continue':'Enter the workshop'}</button><div class="row"><button data-action="help">How to play</button></div>`,'intro')}
function workshop(){building=true;history=[];drawWorkshop();save()}
function drawWorkshop(){const l=run.level,valid=S.valid(bp),cost=S.cost(bp);modal(`<small>CONTRACT ${run.index+1} · ${l.name}</small><h2>The little workshop</h2><div class="build-meta">${cost} / 22 brass · ★ Lean build: ${l.budget} or less</div><div class="grid">${Array.from({length:15},(_,i)=>{const x=i%5,y=Math.floor(i/5),p=bp.find(p=>p.x===x&&p.y===y);return `<button class="cell ${p?.type==='core'?'core':''}" data-cell="${x},${y}" aria-label="Build cell ${x+1}, ${y+1}: ${p?.type||'empty'}">${p?ScrapIcon(p.type):''}</button>`}).join('')}</div><div class="parts">${Object.entries(S.parts).map(([type,p])=>`<button data-part="${type}" class="${type===selected?'selected':''}" aria-label="Select ${p.name}">${ScrapIcon(type)}${p.name}${p.cost?' · '+p.cost:''}</button>`).join('')}</div><p>${valid?(l.arches?'Low arch ahead: keep your machine short.':l.gates?'High gate ahead: try a spring or balloon.':'Tap a part, then a square. All pieces must connect.'):'Connect every part to the cabin. Wheels need a block above.'}</p><div class="row"><button data-action="build-undo" ${history.length?'':'disabled'} aria-label="Undo build">↶</button><button data-action="blueprint">Blueprint</button><button class="primary" data-action="launch" ${valid?'':'disabled'}>Launch ▶</button></div><p>Blueprints: Scout → Low Rider → Hopper · Six parts to experiment with.</p>`,'build','workshop');building=true;}
let template=0;function blueprint(){history.push(S.clone(bp));template=(template+1)%3;bp=S.clone(S.starter);if(template){bp=bp.filter(p=>!['ram','cannon'].includes(p.type));bp.push({x:3,y:1,type:'cannon'})}if(template===2)bp.push({x:4,y:1,type:'spring'});drawWorkshop();save()}
function launch(){if(!S.valid(bp))return;const idx=run.index;run.dispose();run=new S.Run(idx,bp);art.camera=0;art.fx=[];winDelay=null;close();save();toast(run.level.arches?'Low arches need a low profile.':run.level.gates?'A spring can hop the garden gate.':'Build something wonderfully unreasonable.');}
function pause(){if(paused)return;modal('<small>THE WORLD CAN WAIT</small><h2>Tools down.</h2><p>Your machine and its mischief are saved.</p><button class="primary" data-action="resume">Continue</button><div class="row"><button data-action="help">How to play</button><button data-action="book">Field journal</button></div>','pause');save()}
function result(){const rating=S.rating(run),old=profile.best[run.index]||0;profile.best[run.index]=Math.max(old,rating);profile.unlocked=Math.max(profile.unlocked,Math.min(7,run.index+1));save();modal(`<small>CONTRACT ${run.index+1} · COMPLETE</small><h2>Beautifully unruly.</h2><div class="stars">${'★'.repeat(rating)}${'☆'.repeat(3-rating)}</div><p>${run.collected}/2 keepsakes · ${S.cost(run.bp)} brass build<br>${run.fired} cannon volleys · ${run.broken?'A few bolts went wandering.':'Every bolt made it home.'}</p><button class="primary" data-action="next">${run.index<7?'Next contract':'Field journal'}</button><div class="row"><button data-action="rebuild">Tinker again</button><button data-action="photo">Save postcard</button></div>${run.index<7?'<div class="row"><button data-action="book">Field journal</button></div>':''}`,'win')}
function book(){modal(`<small>YOUR CURIOUS CONTRAPTIONS</small><h2>Field journal</h2><div>${total()} / 24 ★</div><div class="book-grid">${S.levels.map((l,i)=>`<button data-level="${i}" ${i>profile.unlocked?'disabled':''} aria-label="Contract ${i+1}: ${l.name}">${i+1}<small>${'★'.repeat(profile.best[i]||0)}${'☆'.repeat(3-(profile.best[i]||0))}</small></button>`).join('')}</div><div class="looks">Cabin paint<br>${[0,6,12].map((n,i)=>`<button data-paint="${i}" ${total()<n?'disabled':''} aria-label="${['Fern','Slate','Copper'][i]} paint">${total()<n?n+'★':['Fern','Slate','Copper'][i]}</button>`).join('')}</div><button class="primary" data-action="resume">Back</button>`,'book')}
function newCase(i){run.dispose();run=new S.Run(i,S.valid(bp)?bp:S.starter);art.camera=0;art.fx=[];winDelay=null;workshop()}
function help(){modal('<small>MAKE IT YOURS</small><h2>A tinkerer’s guide</h2><p>In the workshop, tap a part and then a square. Remove or replace any part except the cabin. Wheels need a block above. Every piece must connect; the brass limit is 22.<br><br>Hold ◀ ▶ to drive. Hold ✦ to fire. Change 35° / 55° / 75° to arc over walls. ↑ compresses springs for a hop or opens balloon lift. Springs and balloons only work while attached near your cabin.<br><br>Knock marked bell towers off their foundations, collect the two optional ✦, then drive to the green flag. The cannon blast can trigger nearby barrels. A tall build catches on low arches. A lighter build earns a star.<br><br>WASD / arrows: drive. Space: fire. Shift: hop. Q: angle. Escape: pause. Workshop resets the current outing, keeping your design and stars.</p><button class="primary" data-action="resume">Got it</button>','help')}
function resume(){if(run.status==='win'){result();return}if(run.status==='lost'){lost();return}if(building){drawWorkshop();return}close()}
function lost(){modal('<small>A PERFECTLY GOOD EXPERIMENT</small><h2>Back to the bench?</h2><p>The machine took a swim.<br>Your blueprint and stars are safe.</p><button class="primary" data-action="rebuild">Tinker & retry</button>','lost');save()}
function confirmBuild(){modal('<small>A NEW EXPERIMENT</small><h2>Return to the workshop?</h2><p>This outing restarts. Keep your machine design and stars.</p><button class="primary" data-action="rebuild">To the workbench</button><div class="row"><button data-action="resume">Back</button></div>','confirm')}
$('panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='continue'){if(saveExists){if(savedMode==='build'){workshop();return}resume()}else workshop();return}if(a==='resume')resume();if(a==='help')help();if(a==='book')book();if(a==='launch')launch();if(a==='build-undo'&&history.length){bp=history.pop();drawWorkshop();save()}if(a==='blueprint')blueprint();if(a==='rebuild')workshop();if(a==='next'){if(run.index<7)newCase(run.index+1);else book()}if(a==='photo'){art.draw(run,0);const link=document.createElement('a');link.href=canvas.toDataURL('image/png');link.download=`Scrap-Knights-${run.index+1}.png`;link.click()}if(b.dataset.part){selected=b.dataset.part;drawWorkshop()}if(b.dataset.cell){const [x,y]=b.dataset.cell.split(',').map(Number),next=S.edit(bp,x,y,selected);if(next){history.push(S.clone(bp));if(history.length>60)history.shift();bp=next;drawWorkshop();save()}}if(b.dataset.level!==undefined){const i=Number(b.dataset.level);modal(`<small>CONTRACT ${i+1}</small><h2>${S.levels[i].name}</h2><p>Open this outing from the workshop?<br>Your design and stars stay safe.</p><button class="primary" data-open="${i}">Open contract</button><div class="row"><button data-action="book">Back</button></div>`,'confirm')}if(b.dataset.open!==undefined)newCase(Number(b.dataset.open));if(b.dataset.paint!==undefined){profile.paint=Number(b.dataset.paint);art.paint=profile.paint;art.draw(run,0);save();book()}});
function controls(){input.drive=(Array.from(held.values()).includes('right')?1:0)-(Array.from(held.values()).includes('left')?1:0);input.fire=Array.from(held.values()).includes('fire');input.lift=Array.from(held.values()).includes('lift')}
for(const id of ['left','right','fire','lift']){const b=$(id);b.addEventListener('pointerdown',e=>{if(paused||b.disabled)return;e.preventDefault();held.set(e.pointerId,id);b.setPointerCapture(e.pointerId);b.classList.add('held');controls()});const release=e=>{held.delete(e.pointerId);b.classList.remove('held');controls()};b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release)}
$('angle').onclick=()=>{run.angle=run.angle===35?55:run.angle===55?75:35;refresh();save()};$('build').onclick=confirmBuild;$('pause').onclick=pause;$('book').onclick=book;$('sound').onclick=()=>{muted=!muted;if(muted)silence();else sound('coin');hud='';refresh();save()};
const keys={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',' ':'fire',Shift:'lift',ArrowUp:'lift',w:'lift'};addEventListener('keydown',e=>{if(keys[e.key])e.preventDefault();if(e.key==='Escape'){if(paused)resume();else pause();return}if(paused)return;if(e.key==='q'){run.angle=run.angle===35?55:run.angle===55?75:35;refresh();return}const v=keys[e.key];if(v){held.set('key'+e.key,v);$(v).classList.add('held');controls()}});addEventListener('keyup',e=>{const v=keys[e.key];if(v){held.delete('key'+e.key);$(v).classList.remove('held');controls()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopInput();pause();silence()}});addEventListener('blur',()=>{stopInput();pause();silence()});addEventListener('resize',()=>{stopInput();art.resize();art.draw(run,0)});
refresh();art.draw(run,0);intro();let last=performance.now(),acc=0,drawAcc=0;function frame(now){const dt=Math.min(.06,(now-last)/1000);last=now;if(!paused){clock+=dt;acc+=dt;while(acc>=1/60){run.update(input);for(const e of run.events){art.event(e);sound(e.type);if(e.type==='bell')toast('Bell down!');if(e.type==='snap')toast('A bolt snapped — keep going or rebuild.')}run.events=[];acc-=1/60;if(run.status!=='play')break}if(clock>toaster)$('toast').classList.remove('show');drawAcc+=dt;if(drawAcc>=1/30){art.draw(run,drawAcc);drawAcc=0}refresh();saveClock+=dt;if(saveClock>1){saveClock=0;save()}if(run.status==='win'){if(winDelay===null){winDelay=.85;sound('win')}winDelay-=dt;if(winDelay<=0){art.draw(run,0);result()}}if(run.status==='lost')lost()}else acc=0;requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.ScrapDebug={snapshot:()=>S.clone({run:run.snapshot(),bp,profile,paused,building,mode,input,voices:voices.size}),stats:()=>({bodies:run.bodies.length,activeShots:run.shots.filter(b=>!b.plugin.removed).length,fx:art.fx.length}),worldToScreen:(x,y)=>({x:(x-art.camera)*art.scale,y:y*art.scale+art.oy})};
})();
</script></body></html>
