</style></head><body><div class="backdrop"></div><div class="app"><header><div><b>CAPY COURT</b><small>HOT SPRING RALLY</small></div><nav><button id="sound" aria-label="Toggle sound">♫</button><button id="pause" aria-label="Pause match">Ⅱ</button></nav></header><section class="scoreboard"><div><small>YOU</small><strong id="you">0</strong></div><span id="cup">GARDEN CUP</span><div><small>MAPLE</small><strong id="ai">0</strong></div></section><main><canvas id="court" width="512" height="768" aria-label="Illustrated forest badminton court"></canvas><button id="landing" aria-label="Move to landing ring" hidden>⌖</button><div id="call" aria-live="polite"></div><div id="tip">Serve when you are ready.</div></main><div class="status"><span id="rally">RALLY 0</span><span id="power">○ ○ ○</span><span id="best">BEST 0</span></div><footer><button id="left" aria-label="Move left">←</button><button id="swing" aria-label="Swing racket">SERVE <b>🏸</b></button><button id="right" aria-label="Move right">→</button></footer><small class="hint">TAP THE RING · SWING AS IT GLOWS</small></div><section id="modal" role="dialog" aria-modal="true" aria-label="Match menu"><div id="panel"><h1>Preparing the garden…</h1></div></section><script>(function(root){'use strict';class Match{
 constructor(cup=0){this.cup=Math.max(0,Math.min(2,cup));this.player=.5;this.opponent=.5;this.goal=.5;this.score=[0,0];this.phase='serve';this.ball=null;this.rally=0;this.bestRally=0;this.perfects=0;this.charge=0;this.swingAge=0;this.aiSwing=0;this.wait=0;this.over=false;this.seed=34017+cup*99;this.events=[];this.time=0;}

 swing(){if(this.over||this.swingAge>0)return false;this.swingAge=.25;if(this.phase==='serve'){this.rally=0;this.launch('ai',.18+.64*this.player);this.events.push({type:'serve'});return true;}let b=this.ball;if(!b||b.to!=='player'){this.events.push({type:'whiff'});return false;}let p=b.age/b.duration;if(p<.70||p>1.06||Math.abs(this.player-b.target)>.19){this.events.push({type:'whiff'});return false;}let perfect=p>=.88&&p<=1.015&&Math.abs(this.player-b.target)<.115;this.rally++;this.bestRally=Math.max(this.bestRally,this.rally);if(perfect){this.perfects++;this.charge=Math.min(3,this.charge+1);}let smash=this.charge===3;if(smash)this.charge=0;let target=this.player<.5?.85:.15;this.launch('ai',target,smash?1.65:perfect?1.20:1);this.events.push({type:smash?'smash':perfect?'perfect':'hit'});return true;}
 point(who){if(this.over)return;this.score[who]++;this.ball=null;this.phase='point';this.wait=1.6;this.events.push({type:'point',who});if(this.score[who]>=7){this.phase='end';this.over=true;this.events.push({type:'end',won:who===0});}}
 tick(dt){if(this.over)return;dt=Math.min(.05,Math.max(0,dt));this.time+=dt;this.swingAge=Math.max(0,this.swingAge-dt);this.aiSwing=Math.max(0,this.aiSwing-dt);this.player+=Math.sign(this.goal-this.player)*Math.min(Math.abs(this.goal-this.player),dt*1.25);if(this.phase==='point'){this.wait-=dt;if(this.wait<=0){this.phase='serve';this.player=.5;this.goal=.5;this.opponent=.5;}return;}let b=this.ball;if(!b)return;b.age+=dt;let p=b.age/b.duration;if(b.to==='ai'){let speed=.22+this.cup*.055;this.opponent+=Math.sign(b.target-this.opponent)*Math.min(Math.abs(b.target-this.opponent),speed*dt);if(p>=1){let miss=Math.abs(this.opponent-b.target)>.13||(this.rally>=2&&this.cup===0)||(this.rally>=4&&this.cup===1)||(this.rally>=6);if(miss){this.point(0);return;}this.aiSwing=.28;this.launch('player',.16+this.random()*.68);this.events.push({type:'return'});}}else if(p>1.08)this.point(1);}

</script><script>(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('court'),c=canvas.getContext('2d'),cups=['GARDEN CUP','LANTERN CUP','ORCHARD CUP'],key='capy-court-v1';let profile={wins:[0,0,0],best:0,unlocked:0,sound:true,active:null};try{let p=JSON.parse(localStorage.getItem(key));if(p&&Array.isArray(p.wins)&&p.wins.length===3){profile.wins=p.wins.map(n=>Math.min(99,Math.max(0,Number(n)||0)));profile.best=Math.max(0,Number(p.best)||0);profile.unlocked=Math.min(2,Math.max(0,Math.floor(Number(p.unlocked)||0)));profile.sound=p.sound!==false;profile.active=p.active;}}catch(e){}let game=new CapyMatch(),mode='home',paused=true,ready=false,last=0,time=0,callAge=0,glow=0,fx=[],trail=[],held=0,audio=null,voices=[],saveAge=0,keys=new Set();const bg=new Image(),sprites=new Image();bg.src='assets/garden.png';sprites.src='assets/players.png';

function say(text,age=1.1){$('call').textContent=text;$('call').classList.add('on');callAge=age;}
function panel(html){$('panel').innerHTML=html;$('modal').hidden=false;}
function hud(){$('you').textContent=game.score[0];$('ai').textContent=game.score[1];$('cup').textContent=cups[game.cup];$('rally').textContent='RALLY '+game.rally;$('best').textContent='BEST '+Math.max(profile.best,game.bestRally);$('power').textContent='● '.repeat(game.charge)+'○ '.repeat(3-game.charge);$('swing').innerHTML=(game.phase==='serve'?'SERVE':'SWING')+' <b>🏸</b>';$('sound').textContent=profile.sound?'♫':'♩';let b=game.ball;$('tip').textContent=game.phase==='serve'?'Serve when you are ready.':game.phase==='point'?'A little breath between rallies.':b?.to==='player'?(b.age/b.duration>.70?'Swing now — meet the glowing ring!':'Move toward the landing ring.'):'Watch Maple’s return.';}
function events(){for(let e of game.drain()){if(['serve','hit','return'].includes(e.type))tone(e.type==='return'?390:540,.075,'triangle');if(e.type==='perfect'||e.type==='smash'){say(e.type==='smash'?'ORANGE BLOSSOM!':'SWEET SPOT!');glow=.6;[660,880,1100].forEach(f=>tone(f,.18));let p=project(game.player,.82);for(let i=0;i<28;i++)fx.push({x:p.x,y:p.y-60,vx:(Math.random()-.5)*170,vy:-40-Math.random()*100,life:1});}if(e.type==='whiff')tone(160,.05,'triangle',.035);if(e.type==='point'){say(e.who===0?'YOUR POINT!':'MAPLE’S POINT',1.4);tone(e.who===0?660:220,.25);trail=[];save();}if(e.type==='end')finish(e.won);}hud();}
function start(g){game=g;mode='play';paused=false;keys.clear();held=0;trail=[];fx=[];$('modal').hidden=true;$('call').classList.remove('on');wake();hud();save();}
function home(){mode='home';paused=true;game=new CapyMatch();hud();panel('<div class="portraitPeek"></div><small>AN AFTERNOON AT THE HOT SPRINGS</small><h1>CAPY COURT</h1><p>A little rally. A lovely afternoon.<br>Move, swing, and be first to seven.</p><button id="start" class="primary">'+(CapyMatch.restore(profile.active)?'CONTINUE MATCH':'LET’S PLAY')+' ↗</button><button id="cups">CHOOSE A CUP</button><button id="how">HOW TO PLAY</button><p style="font-size:10px">'+profile.wins.reduce((a,b)=>a+b,0)+' wins · Longest rally '+profile.best+'</p>');$('start').onclick=()=>start(CapyMatch.restore(profile.active)||new CapyMatch());$('cups').onclick=choose;$('how').onclick=()=>rules(true);}
function choose(){panel('<small>THE GARDEN CIRCUIT</small><h2>Pick your afternoon.</h2>'+cups.map((n,i)=>'<button data-cup="'+i+'" '+(i>profile.unlocked?'disabled':'')+'>'+n+(i>profile.unlocked?' · LOCKED':' · '+profile.wins[i]+' WINS')+'</button>').join('')+'<button id="back">BACK</button>');$('panel').querySelectorAll('[data-cup]').forEach(b=>b.onclick=()=>start(new CapyMatch(+b.dataset.cup)));$('back').onclick=home;}
function finish(won){mode='result';paused=true;held=0;keys.clear();profile.best=Math.max(profile.best,game.bestRally);if(won){profile.wins[game.cup]++;profile.unlocked=Math.max(profile.unlocked,Math.min(2,game.cup+1));}profile.active=null;persist();panel('<div class="seal">'+(won?'✦':'❧')+'</div><small>'+cups[game.cup]+'</small><h2>'+(won?'A lovely victory.':'Tea, then a rematch?')+'</h2><p>'+game.score[0]+' — '+game.score[1]+'<br>'+game.perfects+' sweet spots · Best rally '+game.bestRally+'</p><p>'+(won&&game.cup<2?'A new cup is ready.':'Every rally is a fresh start.')+'</p><button id="again" class="primary">'+(won&&game.cup<2?'NEXT CUP':'PLAY AGAIN')+' ↗</button><button id="hall">BACK TO THE GARDEN</button>');$('again').onclick=()=>start(new CapyMatch(won&&game.cup<2?game.cup+1:game.cup));$('hall').onclick=home;}
function pause(){if(mode!=='play'||paused)return;paused=true;held=0;keys.clear();save();audio?.suspend();panel('<small>THE GARDEN CAN WAIT</small><h2>A tea break.</h2><p>Your match is saved.</p><button id="resume" class="primary">BACK TO THE RALLY ↗</button><button id="how">HOW TO PLAY</button><button id="hall">BACK TO THE GARDEN</button>');$('resume').onclick=resume;$('how').onclick=()=>rules(false);$('hall').onclick=home;}

function rules(fromHome){paused=true;held=0;keys.clear();panel('<small>A GENTLE GAME OF BADMINTON</small><h2>Follow the ring.</h2><div class="rules"><b>↔</b><span>Move left and right toward the landing ring.</span><b>🏸</b><span>Swing as the shuttle reaches you and the ring glows.</span><b>✦</b><span>A well-timed, well-positioned return is a sweet spot. Three charge a fast blossom shot.</span><b>7</b><span>First to seven wins. Win cups to unlock stronger opponents.</span></div><p>Arrow keys or A/D move · Space swings<br>Tap your side of the court to move there.<br>Escape pauses. No payments or lives.</p><button id="back" class="primary">GOT IT ↗</button>');$('back').onclick=fromHome?home:resume;}
function project(x,z){let w=160+z*255;return{x:256+(x-.5)*w,y:235+z*430};}

const crops=[[0,0,548,512],[548,0,586,512],[1134,0,402,512],[0,512,512,512],[512,512,574,512],[1086,512,450,512]];
function capy(x,z,side,pose){let p=project(x,z),h=side?125:174,rect=crops[side*3+pose],w=h*rect[2]/rect[3];c.save();c.fillStyle='#493a2550';c.beginPath();c.ellipse(p.x,p.y+2,side?25:36,side?7:10,0,0,Math.PI*2);c.fill();let bob=Math.sin(time*4)*(paused?0:1.2);c.drawImage(sprites,...rect,p.x-w*.5,p.y-h*.94+bob,w,h);c.restore();}
function ballPosition(){let b=game.ball;if(!b)return null;let t=Math.min(1,b.age/b.duration),z=b.to==='ai'?.82-.64*t:.18+.64*t,x=b.from+(b.target-b.from)*t,p=project(x,z);return{...p,ground:p.y,y:p.y-20-Math.sin(t*Math.PI)*115,z};}
function shuttle(p){c.save();c.fillStyle='#3a3c3338';c.beginPath();c.ellipse(p.x,p.ground,9,3,0,0,Math.PI*2);c.fill();for(let i=0;i<trail.length;i++){c.globalAlpha=i/trail.length*.4;c.fillStyle='#fff1c9';c.beginPath();c.arc(trail[i].x,trail[i].y,2+i*.18,0,Math.PI*2);c.fill();}c.globalAlpha=1;c.translate(p.x,p.y);c.rotate(game.ball.to==='ai'?-.6:.55);c.fillStyle='#fff9e2';c.strokeStyle='#bdc3ae';c.lineWidth=.7;for(let i=-2;i<=2;i++){c.save();c.rotate(i*.24);c.beginPath();c.ellipse(0,-6,2.4,7,0,0,Math.PI*2);c.fill();c.stroke();c.restore();}c.fillStyle='#a47849';c.beginPath();c.arc(0,3,3.6,0,Math.PI*2);c.fill();c.restore();}
function draw(dt){if(!ready)return;if(!paused)time+=dt;c.clearRect(0,0,512,768);c.drawImage(bg,0,0,512,768);if(game.cup===1){c.fillStyle='#283d601b';c.fillRect(0,0,512,768);}if(game.cup===2){c.fillStyle='#e6b04d0e';c.fillRect(0,0,512,768);}path([project(.02,0),project(.98,0),project(.98,1),project(.02,1)],'#e6c98e0a','#fff2c5d9',2);for(let z of [.16,.5,.84])path([project(.02,z),project(.98,z)],null,'#fff2c5b0',1.3);path([project(.5,0),project(.5,1)],null,'#fff2c577',1);
let b=game.ball;if(b?.to==='player'){let p=project(b.target,.82),active=b.age/b.duration>=.70;c.strokeStyle=active?'#faffc8':'#fff3c388';c.lineWidth=active?3:1.5;c.beginPath();c.ellipse(p.x,p.y,active?24:20,active?8:6,0,0,Math.PI*2);c.stroke();if(active){c.fillStyle='#e1ffe73b';c.fill();}}
