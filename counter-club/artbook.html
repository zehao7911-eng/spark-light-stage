<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Counter Club · Cast and venue artbook</title><style>*{box-sizing:border-box}body{margin:0;background:#203741;color:#f3dfb5;font:14px Arial;padding:20px}h1{font-size:28px;font-style:italic;margin:0 0 10px}p{color:#bdc8b8;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid #b8ad8a;padding:8px;background:#2a4650}.card>b{display:block;padding:8px;font-size:12px;letter-spacing:1px}canvas{display:block;width:100%;height:310px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}canvas{height:280px}}</style></head><body><h1>COUNTER CLUB · THE CAST</h1><p>Original code-drawn characters and venues · Visual direction follows NOPE! FC · Not a gameplay screenshot.</p><div class="grid"></div><script type="module">import {RIVALS,makeRun,profile}from './engine.mjs';import{RingArt}from './art.mjs';for(let i=0;i<6;i++){let div=document.createElement('div');div.className='card';let b=document.createElement('b');b.textContent=RIVALS[i].name;let c=document.createElement('canvas');div.append(b,c);document.querySelector('.grid').append(div);let a=new RingArt(c),s=makeRun(i);s.phase='open';a.render(s,.016,profile());}</script></body></html>
