function start(){if(!S.team.length)return;S.checkpoint=clone({...S,checkpoint:undefined});S.phase='play';close();head={x:worldW/2,y:worldH/2,a:-Math.PI/2};path=Array.from({length:700},(_,i)=>({x:head.x,y:head.y+i*2,a:head.a}));enemies=[];bullets=[];sparks=[];rings=[];portals=[];lasers=[];numbers=[];timers=S.team.map((_,i)=>i*.15);healTimer=0;shieldTimer=0;shield=S.team.some(u=>u.k===11)?1:0;revived=false;spawnTime=0;spawned=0;cleared=0;arenaTime=0;quota=Math.min(100,10+S.stage*3);bossSpawned=false;pulseCD=0;invul=1;call('arena '+S.stage);hud();save()}

function makeEnemy(x,y,type=0,small=false,boss=false){const hp=boss?115+S.stage*19:small?7+S.stage*1.5:12+S.stage*3.5;return{id:enemyId++,x,y,type,r:boss?32:small?9:type===2?17:13,hp,max:hp,speed:boss?37:small?95:type===1?45:65,fire:1+rnd(),flash:0,boss,charge:0}}
function portal(){const side=Math.floor(rnd()*4),x=side===0?24:side===1?worldW-24:40+rnd()*(worldW-80),y=side===2?24:side===3?worldH-24:40+rnd()*(worldH-80);portals.push({x,y,time:.75,type:S.stage>=3&&rnd()<.25?1:S.stage>=5&&rnd()<.22?2:0})}

function fireHero(u,i){const h=HERO[u.k],pos=heroPos(i),near=enemies.filter(e=>e.hp>0&&dist(e,pos)<h[5]*(has(0)?1.25:1)).sort((a,b)=>dist(a,pos)-dist(b,pos)),target=near[0];if(!target)return false;const classes=counts(),color=COLORS[h[1]],bard=S.team.filter(t=>t.k===10).reduce((n,t)=>n+.1*t.l,0),mage=classes[2]>=3?.4:classes[2]>=2?.2:0,n=h[3]*(1+(u.l-1)*.7)*(1+bard+(h[1]===2?mage:0)),a=Math.atan2(target.y-pos.y,target.x-pos.x);if(u.k===3||u.k===5){damage(target,n,color);lasers.push({x:pos.x,y:pos.y,x2:target.x,y2:target.y,color,life:.12});addRing(pos.x,pos.y,65,color,.18);if(u.k===5)S.hp=Math.min(S.maxhp,S.hp+u.l)}else if(u.k===4){near.forEach(e=>damage(e,n,color));addRing(pos.x,pos.y,110,color,.3)}else if(u.k===7){let last=pos;for(const e of near.slice(0,4)){lasers.push({x:last.x,y:last.y,x2:e.x,y2:e.y,color,life:.18});damage(e,n,color);last=e}}else if(u.k===1){for(const spread of[-.15,0,.15])shoot(pos,a+spread,n,color)}else shoot(pos,a,n,color,{pierce:u.k===2?3:1,splash:u.k===6?65:u.k===8?105:0,speed:u.k===8?260:420});return true}

function winArena(){if(S.phase!=='play')return;S.lastClear=S.stage;S.gold+=5+Math.floor(S.stage/2)+(has(3)?3:0)+Math.min(5,Math.floor(S.gold/10));S.hp=Math.min(S.maxhp,S.hp+(has(2)?16:8));S.stage++;delete S.checkpoint;if(S.lastClear===12&&!S.endless){S.phase='won';save();end(true);return}if(S.lastClear%4===0&&S.perks.length<6){S.phase='perk';const pool=PERKS.map((_,i)=>i).filter(i=>!has(i));S.choices=[];while(S.choices.length<Math.min(3,pool.length)){const v=pick(pool.filter(i=>!S.choices.includes(i)));S.choices.push(v)}save();perkScreen()}else{S.phase='shop';roll(true);shop()}sound('win')}

function menu(){if(S.phase==='shop'){shop();return}if(S.phase==='lost'||S.phase==='won'){end(S.phase==='won');return}if(S.phase==='perk'){perkScreen();return}modal(`<h1>paused</h1><div class="buttons"><button class="gold" id="resume">resume</button><button id="mute">sound ${muted?'off':'on'}</button><button id="help">controls</button><button id="new">new run</button></div>`);bind('#resume',()=>{close();hud()});bind('#mute',()=>{muted=!muted;save();$('#mute').textContent='sound '+(muted?'off':'on');sound()});bind('#help',help);bind('#new',()=>{modal('<h1>replace this run?</h1><div class="buttons"><button class="gold" id="confirm">start over</button><button id="back">back</button></div>');bind('#confirm',newRun);bind('#back',menu)})}
function step(dt){time+=dt;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').style.opacity=0}if(paused||document.hidden||S.phase!=='play')return;arenaTime+=dt;callTime-=dt;if(callTime<=0)$('#callout').textContent='';pulseCD=Math.max(0,pulseCD-dt);invul=Math.max(0,invul-dt);shake=Math.max(0,shake-dt*20);const direction=(turnR||keys.ArrowRight||keys.KeyD?1:0)-(turnL||keys.ArrowLeft||keys.KeyA?1:0);head.a+=direction*3.35*dt;head.x+=Math.cos(head.a)*135*dt;head.y+=Math.sin(head.a)*135*dt;if(head.x<22||head.x>worldW-22){head.x=clamp(head.x,22,worldW-22);head.a=Math.PI-head.a}if(head.y<22||head.y>worldH-22){head.y=clamp(head.y,22,worldH-22);head.a=-head.a}path.unshift({...head});if(path.length>700)path.pop();spawnTime-=dt;if(spawnTime<=0&&enemies.length+portals.length<60&&spawned<quota-(S.stage%4===0?1:0)){spawnTime=Math.max(.36,.95-S.stage*.025);portal();spawned++}for(const p of portals){p.time-=dt;if(p.time<=0){enemies.push(makeEnemy(p.x,p.y,p.type));p.time=999;p.done=true;particles(p.x,p.y,'#e45b60',6)}}portals=portals.filter(p=>!p.done);if(S.stage%4===0&&!bossSpawned&&spawned>=quota-1&&cleared>=Math.floor(quota*.45)){const e=makeEnemy(worldW/2,70,1,false,true);enemies.push(e);bossSpawned=true;spawned++;call('boss incoming',1.4);sound('boom')}
const cls=counts();for(let i=0;i<S.team.length;i++){const u=S.team[i],h=HERO[u.k];timers[i]-=dt;if(timers[i]<=0&&fireHero(u,i)){const speed=(has(1)?1.2:1)*(h[1]===0?(cls[0]>=3?1.4:cls[0]>=2?1.2:1):1);timers[i]=h[4]/speed/(1+(u.l-1)*.1)}}healTimer+=dt;if(healTimer>=5){healTimer=0;const heal=S.team.filter(u=>u.k===9).reduce((n,u)=>n+3*u.l,0)*(cls[3]>=3?1.5:cls[3]>=2?1.25:1);if(heal&&S.hp<S.maxhp){S.hp=Math.min(S.maxhp,S.hp+heal);addRing(head.x,head.y,70,'#46a3d6');sound('heal')}}shieldTimer+=dt;if(shieldTimer>=8){shieldTimer=0;if(S.team.some(u=>u.k===11))shield=1}

function draw(){g.fillStyle='#303030';g.fillRect(0,0,W,H);g.save();g.scale(scale,scale);if(shake>0)g.translate(Math.sin(time*93)*shake,Math.cos(time*76)*shake);for(const p of portals){g.strokeStyle='#e45b60';g.lineWidth=2;g.globalAlpha=.3+(1-p.time)*.6;g.strokeRect(p.x-18,p.y-18,36,36);g.beginPath();g.moveTo(p.x-8,p.y);g.lineTo(p.x+8,p.y);g.moveTo(p.x,p.y-8);g.lineTo(p.x,p.y+8);g.stroke()}g.globalAlpha=1;for(const r of rings){const q=1-r.life/r.max;g.globalAlpha=(1-q)*.75;g.strokeStyle=r.color;g.lineWidth=4;g.beginPath();g.arc(r.x,r.y,r.r*q,0,7);g.stroke()}g.globalAlpha=1;for(const l of lasers){g.strokeStyle=l.color;g.lineWidth=5;g.beginPath();g.moveTo(l.x,l.y);g.lineTo(l.x2,l.y2);g.stroke()}for(const b of bullets){g.fillStyle=b.color;if(b.enemy){g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill()}else{g.save();g.translate(b.x,b.y);g.rotate(Math.atan2(b.vy,b.vx));g.fillRect(-9,-2,18,4);g.restore()}}for(const e of enemies){g.save();g.translate(Math.round(e.x),Math.round(e.y));g.rotate(time*(e.boss?.4:e.type===2?.9:.3));g.fillStyle=e.flash>0?'#fff':e.boss?'#e45b60':e.type===1?'#e58535':e.type===2?'#a982b8':'#d4d4ca';if(e.boss){g.fillRect(-e.r,-e.r,e.r*2,e.r*2);g.fillStyle='#303030';g.fillRect(-e.r+8,-e.r+8,e.r*2-16,e.r*2-16);g.fillStyle='#e45b60';g.fillRect(-8,-8,16,16)}else if(e.type===2){g.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;i?g.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r):g.moveTo(Math.cos(a)*e.r,Math.sin(a)*e.r)}g.closePath();g.fill()}else g.fillRect(-e.r,-e.r,e.r*2,e.r*2);g.restore();if(e.hp<e.max){g.fillStyle='#444';g.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,3);g.fillStyle='#d4d4ca';g.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*e.hp/e.max,3)}}if(S.phase==='play'){g.strokeStyle='#77776a';g.lineWidth=5;g.beginPath();S.team.forEach((u,i)=>{const p=heroPos(i);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)});g.stroke();for(let i=S.team.length-1;i>=0;i--){const u=S.team[i],p=heroPos(i),color=COLORS[HERO[u.k][1]];g.save();g.translate(Math.round(p.x),Math.round(p.y));g.rotate(p.a);g.globalAlph function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,Math.floor(r.width));H=Math.max(1,Math.floor(r.height));canvas.width=W;canvas.height=H;scale=W/720;const oldH=worldH;worldH=H/scale;head.y=clamp(head.y,25,worldH-25);path.forEach(p=>p.y=clamp(p.y/oldH*worldH,20,worldH-20));enemies.forEach(e=>e.y=clamp(e.y/oldH*worldH,15,worldH-15));draw()}
function releaseControls(){turnL=false;turnR=false;keys={};$('#left').classList.remove('held');$('#right').classList.remove('held')}function control(id,side){const b=$(id);b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);if(side<0)turnL=true;else turnR=true;b.classList.add('held');sound('tap')});for(const t of['pointerup','pointercancel','lostpointercapture'])b.addEventListener(t,()=>{if(side<0)turnL=false;else turnR=false;b.classList.remove('held')})}control('#left',-1);control('#right',1);bind('#pulse',pulse);bind('#menu',menu);window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='Space')pulse();if(e.code==='Escape')menu()});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',releaseControls);document.addEventListener('visibilitychange',()=>{releaseControls();if(document.hidden){save();if(S.phase==='play')menu()}last=performance.now()});new ResizeObserver(resize).observe($('#arena'));function tick(now){requestAnimationFrame(tick);const dt=Math.min(.05,(now-last)/1000||0);last=now;if(document.hidden)return;acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60}draw()}
