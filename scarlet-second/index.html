function sheet(html,type){screen=type;paused=true;moving=false;pointer=null;$('overlay').innerHTML='<div class="sheet">'+html+'</div>';$('overlay').hidden=false;}
function close(){screen='play';paused=false;moving=false;$('overlay').hidden=true;update();}
function start(room=0,saved=null){g=new Game(room,p.gift,saved);render.fx=[];render.rings=[];winDelay=0;moving=false;pointer=null;close();if(g.status!=='play')result();save();}
function text(id,value){if($(id).textContent!==String(value))$(id).textContent=value;}
function update(){text('room-name',ROOMS[g.room][0]);text('room-count',`ACT ${['I','II','III'][ROOMS[g.room][1]]} · ${String(g.room+1).padStart(2,'0')} / 12`);text('time-state',paused?'INTERMISSION':moving?'TIME IS MOVING':'TIME IS STILL');$('time-state').style.color=moving?'#e28e75':'#e4c579';text('life','◆ '.repeat(g.life)+'◇ '.repeat(3-g.life));$('life').setAttribute('aria-label',g.life+' of 3 hearts');text('stats',g.returns+' RETURNS · '+total()+' / 36 STARS'+(g.room>=3?' · SET '+(g.wave+1)+'/2':''));text('hint',g.room===0?'Tap the red shot.':ROOMS[g.room][5]);$('sweep').hidden=g.room<7;$('sweep').disabled=g.sweep===0||paused||g.status!=='play';text('sweep',g.sweep?'✦ SWEEP':'✦ SPENT');text('sound',p.sound?'♪':'♩');$('sound').setAttribute('aria-label',p.sound?'Mute sound':'Enable sound');render.gentle=p.gentle;}
function result(){let won=g.status==='won';if(won){p.best[g.room]=Math.max(p.best[g.room],g.stars);save();}let giftNew=won&&[2,6].includes(g.room),end=won&&g.room===11;sheet(`<span class="eyebrow">${won?'CURTAIN CALL':'A SECOND CHANCE'}</span><h2>${won?(end?'Time is<br><em>yours.</em>':'Beautiful<br><em>return.</em>'):'Take a<br><em>breath.</em>'}</h2>${won?`<div class="stars" aria-label="${g.stars} stars">${'✦'.repeat(g.stars)}${'·'.repeat(3-g.stars)}</div>`:''}<p>${won?`${g.returns} return${g.returns===1?'':'s'} · ${g.hits} hits · ${g.maxChain} best chain`:'Lift to freeze. Tap red shots before they reach you.'}</p>${giftNew?`<p class="badge">${g.room===2?'NEW RETURN GIFTS UNLOCKED':'SWEEP UNLOCKED · TURN EVERY SHOT GOLD'}</p>`:''}${end?`<p>All twelve performances complete.<br>Replay for 36 stars and every costume.</p>`:''}<button class="primary" id="next">${won?(end?'PERFORMANCE BOOK →':giftNew?'CHOOSE YOUR GIFT →':'NEXT PERFORMANCE →'):'TRY AGAIN →'}</button><button id="replay">${won?'REPLAY THIS ROOM':'PERFORMANCE BOOK'}</button>`, 'result');$('next').onclick=()=>{tone(440);if(!won)start(g.room);else if(end)book();else if(giftNew)gifts(()=>start(g.room+1));else start(g.room+1);};$('replay').onclick=()=>won?start(g.room):book();update();}
function gifts(next){sheet(`<span class="eyebrow">ONE GIFT · A DIFFERENT RETURN</span><h2>Choose your<br><em>signature.</em></h2><div class="gift-grid">${GIFTS.map((f,i)=>`<button class="gift" data-gift="${f.id}"><span class="sigil">${['⌁','♧','⋈'][i]}</span><span><strong>${f.name}</strong><small>${f.desc}</small></span></button>`).join('')}</div><small>Change your gift in the performance book.</small>`,'gift');document.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{p.gift=b.dataset.gift;save();tone(659);next();});}
function book(){save();let open=unlocked();sheet(`<span class="eyebrow">THE CLOCKLESS THEATRE</span><h2>Performance<br><em>book.</em></h2><div class="badge">${total()} / 36 STARS · ${p.best.filter(Boolean).length} / 12 ROOMS</div><div class="book-grid">${ROOMS.map((r,i)=>`<button data-room="${i}" ${i>open?'disabled':''} aria-label="${r[0]}${i>open?', locked':''}">${String(i+1).padStart(2,'0')}<span>${i>open?'LOCKED':'✦'.repeat(p.best[i])+'·'.repeat(3-p.best[i])}</span></button>`).join('')}</div><div class="inline-options"><button id="costume">COAT · ${['SAGE','COPPER','DUSK'][p.coat]}</button><button id="gift">GIFT · ${GIFTS.find(f=>f.id===p.gift).name.toUpperCase()}</button></div><small>6 stars: Copper coat · 18 stars: Dusk coat<br>Room 3: Return gifts · Room 7: Sweep</small><button class="primary" id="back">BACK TO STAGE →</button>`,'book');document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>start(+b.dataset.room));$('back').onclick=()=>{if(g.status==='play')close();else result();};$('costume').onclick=()=>{let max=total()>=18?2:total()>=6?1:0;if(!max){toast('Earn 6 stars for the Copper coat.');return;}p.coat=(p.coat+1)%(max+1);save();book();tone(330);};$('gift').onclick=()=>{if(p.best[2])gifts(()=>book());else toast('Complete room 3 to unlock return gifts.');};update();}
function pause(){if(paused&&screen!=='intro')return;save();sheet(`<span class="eyebrow">INTERMISSION</span><h2>No rush.<br><em>Stay a while.</em></h2><button class="primary" id="resume">RESUME →</button><button id="gentle">GENTLE EFFECTS · ${p.gentle?'ON':'OFF'}</button><button id="help">HOW TO PLAY</button><button id="rooms">PERFORMANCE BOOK</button>`,'pause');$('resume').onclick=()=>close();$('gentle').onclick=()=>{p.gentle=!p.gentle;save();$('gentle').textContent='GENTLE EFFECTS · '+(p.gentle?'ON':'OFF');render.gentle=p.gentle;};$('rooms').onclick=book;$('help').onclick=()=>{sheet(`<span class="eyebrow">THREE LITTLE RULES</span><h2>Make time<br><em>your ally.</em></h2><div class="rules"><span><b>01</b> Drag empty floor to move and advance time.</span><span><b>02</b> Lift your finger. Red shots freeze.</span><span><b>03</b> Tap a red shot. It returns to its sender.</span></div><p>Gold returns keep flying while time is frozen.<br>Gold bells hit nearby enemies. Stone blocks shots.<br>Return gifts arrive after room 3. Sweep after room 7.</p><button class="primary" id="resume">BACK TO STAGE →</button>`,'help');$('resume').onclick=close;};update();}
function pos(e){let r=$('scene').getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*400,y:(e.clientY-r.top)/r.height*560};}
$('scene').addEventListener('pointerdown',e=>{if(paused||g.status!=='play'||pointer!==null)return;e.preventDefault();tone(80,'sine',.025,.005);let q=pos(e);if(g.catchAt(q.x,q.y,22*400/$('scene').getBoundingClientRect().width)){moving=false;pointer=null;save();return;}pointer=e.pointerId;downAt=q;moving=true;g.aim(q.x,q.y);$('scene').setPointerCapture(e.pointerId);update();});$('scene').addEventListener('pointermove',e=>{if(e.pointerId!==pointer||paused)return;let q=pos(e);g.aim(q.x,q.y);});
function release(){if(pointer===null&&!moving)return;pointer=null;moving=false;save();update();}for(const ev of ['pointerup','pointercancel','lostpointercapture'])$('scene').addEventListener(ev,release);window.addEventListener('blur',()=>{moving=false;pointer=null;if(!paused&&g.status==='play')pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden){moving=false;pointer=null;if(!paused&&g.status==='play')pause();save();}});window.addEventListener('pagehide',save);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!paused)pause();else if(screen==='pause')close();}if(e.key===' '&&!e.repeat&&g.room>=7&&!paused){e.preventDefault();g.pulse();}});
$('pause').onclick=()=>{if(screen==='intro')return;if(paused&&screen==='pause')close();else if(!paused)pause();};$('book').onclick=()=>{if(screen!=='intro')book();};$('retry').onclick=()=>{if(screen!=='intro')start(g.room);};$('sweep').onclick=()=>{if(!paused&&g.pulse()){tone(260,'triangle',.35);save();update();}};$('sound').onclick=()=>{p.sound=!p.sound;save();update();if(p.sound)tone(420);};$('start').onclick=()=>{tone(330);start(0);};if(p.current){$('continue').hidden=false;$('continue').onclick=()=>{tone(330);start(p.current.room,p.current);};}
function frame(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;if(!paused){g.step(dt,moving);saveClock+=dt;if(saveClock>2){saveClock=0;save();}for(const f of g.fx.splice(0)){render.event(f);if(f.type==='wave'){toast('ENCORE · A NEW ENTRANCE');tone(350,'triangle',.3); }if(f.type==='return'){tone(540+Math.min(f.n,8)*65,'triangle',.18);chainTime=1;$('chain').textContent=f.n>1?f.n+' × RETURN':'RETURN';}if(f.type==='break'){tone(110,'sawtooth',.12,.035);setTimeout(()=>tone(830,'sine',.25,.025),35);}if(f.type==='armour')tone(210,'square',.08,.02);if(f.type==='bell')tone(1060,'sine',.6,.06);if(f.type==='hurt')tone(95,'sawtooth',.25);if(f.type==='win'){moving=false;tone(523,'triangle',.3);setTimeout(()=>tone(784,'sine',.45),110);winDelay=.75;}}if(g.status!=='play'){moving=false;if(winDelay>0){winDelay-=dt;if(winDelay<=0)result();}else result();}update();}if(chainTime>0){chainTime-=dt;if(chainTime<=0)$('chain').textContent='';}if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').classList.remove('show');}render.draw(g,dt,moving,p.coat,paused);requestAnimationFrame(frame);}update();requestAnimationFrame(frame);
})();
</script></body></html>
