<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061923">
  <link rel="icon" href="data:,">
  <title>Mermaid Stage</title>
  <link rel="stylesheet" href="mermaid-tide.css?v=2">
</head>
<body>
  <main id="world" aria-label="Interactive 3D mermaid stage"></main>
  <div class="vignette" aria-hidden="true"></div>
  <header class="topbar"><span>MERMAID STAGE</span><button id="reset" type="button">RESET VIEW</button></header>
  <footer class="bottom"><span>DRAG TO ROTATE · PINCH TO ZOOM</span><button id="motion" type="button" aria-label="Pause animation">PAUSE</button></footer>
  <section id="loading" class="loading" aria-live="polite">
    <strong>MERMAID STAGE</strong>
    <div class="load-track"><i id="load-bar"></i></div>
    <span id="load-status">Loading the stage…</span>
    <button id="retry" type="button" hidden>RETRY</button>
  </section>
  <script src="mermaid-three.min.js"></script>
  <script src="mermaid-GLTFLoader.js"></script>
  <script src="mermaid-tide.js?v=2"></script>
</body>
</html>
