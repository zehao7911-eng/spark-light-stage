function tone(f=300,d=.12,type='sine',vol=.07){if(!save.sound)return;try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate);let out=buffer.getChannelData(0);for(let i=0;i<out.length;i++)out[i]=Math.random()*2-1;noise=audio.createBufferSource();noise.buffer=buffer;noise.loop=true;let filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=480;crackle=audio.createGain();crackle.gain.value=0;noise.connect(filter).connect(crackle).connect(audio.destination);noise.start();}audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.55),audio.currentTime+d);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}catch{}}

function purchase(id,e){const t=TOYS.find(t=>t.id===id);if(!t||save.coins<t.cost||t.page>save.unlocked||bodies.length>=22)return;save.coins-=t.cost;const pos=e?point(e):{x:400,y:120};const b={uid:nextID++,id,x:clamp(pos.x,90,710),y:clamp(pos.y,90,360),vx:0,vy:0,r:t.r,angle:rnd(-.15,.15),spin:0,heat:0,burn:0,age:0,event:false,paid:false};bodies.push(b);if(e){ptr={id:e.pointerId,x:b.x,y:b.y,fire:false,lastX:b.x,lastY:b.y};drag=b;try{canvas.setPointerCapture(e.pointerId);}catch{} }tone(210,.08,'triangle');persist();updateUI();$('notice').style.opacity=0;}

canvas.onpointerdown=e=>{if(paused)return;e.preventDefault();tone(120,.02,'triangle',.01);const p=point(e);ptr={id:e.pointerId,...p,lastX:p.x,lastY:p.y,fire:false};drag=[...bodies].reverse().find(b=>Math.hypot(b.x-p.x,b.y-p.y)<b.r+13)||null;if(!drag)ptr.fire=true;canvas.setPointerCapture(e.pointerId);$('notice').style.opacity=0;};
function move(e){if(!ptr||ptr.id!==e.pointerId)return;const p=point(e);ptr.x=clamp(p.x,75,725);ptr.y=clamp(p.y,75,380);if(drag){drag.vx=clamp((ptr.x-ptr.lastX)*15,-450,450);drag.vy=clamp((ptr.y-ptr.lastY)*15,-450,450);drag.x=ptr.x;drag.y=ptr.y;}ptr.lastX=ptr.x;ptr.lastY=ptr.y;}
window.addEventListener('pointermove',move,{passive:false});function release(e){if(ptr&&ptr.id===e.pointerId){ptr=null;drag=null;}}window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
$('sweep').onclick=()=>{ash=[];burst(400,390,25,'#bca693',100,'smoke');tone(140,.25,'triangle');};$('sound').onclick=()=>{save.sound=!save.sound;if(crackle)crackle.gain.value=0;persist();updateUI();tone();};function pause(v){paused=v;ptr=null;drag=null;$('paused').hidden=!v;if(crackle)crackle.gain.value=0;persist();}$('pause').onclick=()=>pause(true);$('resume').onclick=()=>pause(false);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true);});
$('recipes').onclick=()=>{pause(true);$('paused').hidden=true;$('list').innerHTML=COMBOS.map((r,i)=>`<article class="${save.found.includes(i)?'found':''}"><img src="${SVG[r[1]]}" alt="${TOYS.find(t=>t.id===r[1]).name}"><img src="${SVG[r[2]]}" alt="${TOYS.find(t=>t.id===r[2]).name}"><span>${r[0]}<br>${save.found.includes(i)?'✓ Discovered':'? · +20'}</span></article>`).join('');$('book').showModal();};$('close').onclick=()=>{$('book').close();pause(false);};$('book').addEventListener('cancel',()=>pause(false));
function reaction(b){const id=b.id;b.event=true;let color=TOYS.find(t=>t.id===id).color;burst(b.x,b.y,20,color,140);tone(id==='battery'?850:170,.22,id==='robot'?'square':'triangle');if(['balloon','battery','corn','cake','planet','star','rocket'].includes(id)){shake=8;flash=.25;for(const other of bodies){if(other===b)continue;let dx=other.x-b.x,dy=other.y-b.y,d=Math.hypot(dx,dy);if(d<180){other.vx+=dx/(d||1)*180;other.vy-=180;other.heat+=.35;}}}
if(id==='rocket'){b.vy=-470;b.rocket=1;burst(b.x,b.y,35,'#fca448',210);}if(id==='corn'){for(let i=0;i<20;i++)particles.push({x:b.x,y:b.y,vx:rnd(-210,210),vy:rnd(-350,-80),life:2.7,max:3,r:rnd(4,8),color:'#ffe3a6',kind:'pop'});}if(id==='globe'){burst(b.x,b.y,45,'#d9f6ef',110,'snow');for(const other of bodies)if(other!==b&&Math.hypot(other.x-b.x,other.y-b.y)<100)other.heat=Math.max(0,other.heat-.2);}if(id==='camera')flash=.85;if(id==='planet'){for(let i=0;i<40;i++)burst(b.x,b.y,1,['#b9a1ef','#91c4e6','#ffda8d'][i%3],220,'star');}if(['radio','music'].includes(id)){for(let i=0;i<5;i++)setTimeout(()=>{if(!paused)tone(261.6*Math.pow(2,[0,4,7,12,7][i]/12),.25,'triangle');},i*170);}if(id==='ghost'){burst(b.x,b.y,20,'#b8d4c9',70,'smoke');b.vy=-190;}if(id==='crystal')burst(b.x,b.y,35,'#c4a9f1',190,'star');if(id==='train'){b.vx=220;burst(b.x,b.y,20,'#cdc2ad',100,'smoke');}}
function step(dt){time+=dt;shake=Math.max(0,shake-dt*15);flash=Math.max(0,flash-dt*2);toastTime-=dt;if(toastTime<=0)$('toast').style.opacity=0;
for(let b of bodies){b.age+=dt;if(b!==drag){b.vy+=350*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle+=b.vx*.003*dt;b.vx*=Math.pow(.35,dt);if(b.x<b.r+66){b.x=b.r+66;b.vx=Math.abs(b.vx)*.4;}if(b.x>734-b.r){b.x=734-b.r;b.vx=-Math.abs(b.vx)*.4;}if(b.y>398-b.r){b.y=398-b.r;if(b.vy>70)tone(90+b.r,.055,'triangle',.012);b.vy=-Math.abs(b.vy)*.23;b.angle*=.985;}if(b.y<55+b.r&&!b.rocket){b.y=55+b.r;b.vy=Math.abs(b.vy)*.3;}}
let heat=0;if(ptr?.fire&&Math.hypot(ptr.x-b.x,ptr.y-b.y)<b.r+39)heat=1.2;for(let o of bodies)if(o!==b&&o.burn>0&&Math.hypot(o.x-b.x,o.y-b.y)<b.r+o.r+32)heat+=.65;b.heat=clamp(b.heat+dt*(heat-.12),0,1);if(b.heat>.72&&b.burn===0){b.burn=.001;tone(280,.06,'sawtooth',.018);}if(b.burn>0){b.burn+=dt/(b.id==='log'?10:6.5);if(Math.random()<dt*45){particles.push({x:b.x+rnd(-b.r*.7,b.r*.7),y:b.y+rnd(-b.r*.5,b.r*.5),vx:rnd(-18,18),vy:rnd(-95,-35),life:rnd(.3,.8),max:.8,r:rnd(7,15),color:'#ffad4e',kind:'fire'});}if(!b.event&&b.burn>.36)reaction(b);if(b.burn>=1||b.rocket&&b.y<0){b.paid=true;save.burned++;reward(clamp(b.x,90,710),clamp(b.y,70,350),TOYS.find(t=>t.id===b.id).value);ash.push({x:clamp(b.x,90,710),r:b.r,rot:rnd(-.3,.3)});if(ash.length>30)ash.shift();}}
}
for(let pass=0;pass<3;pass++)for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){let a=bodies[i],b=bodies[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),rr=(a.r+b.r)*.82;if(d<rr&&d>0){let nx=dx/d,ny=dy/d,k=(rr-d)*.5;if(a!==drag){a.x-=nx*k;a.y-=ny*k;}if(b!==drag){b.x+=nx*k;b.y+=ny*k;}let rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){if(a!==drag){a.vx+=rv*nx*.6;a.vy+=rv*ny*.6;}if(b!==drag){b.vx-=rv*nx*.6;b.vy-=rv*ny*.6;}}}}
COMBOS.forEach((r,i)=>{const a=bodies.find(b=>b.id===r[1]&&b.burn>0&&!b.paid),b=bodies.find(b=>b.id===r[2]&&b.burn>0&&!b.paid);if(a&&b){if(!save.found.includes(i)){save.found.push(i);reward(400,190,20);toast(r[0]+' · COMBO!');burst(400,230,55,'#f5d29c',240,'star');shake=5;updateUI();}if(i===orderIndex&&!a.orderPaid&&!b.orderPaid){a.orderPaid=b.orderPaid=true;reward(400,160,25+save.orders*3);save.orders++;orderIndex=save.orders%COMBOS.length;toast(r[0]+' · Order complete!');updateOrder();persist();}}});const removed=bodies.some(b=>b.paid);bodies=bodies.filter(b=>!b.paid);if(removed){persist();updateUI();}
if(ptr?.fire){burst(ptr.x,ptr.y,2,'#ffbf67',25,'fire');}particles=particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(['coin','pop','spark'].includes(p.kind))p.vy+=240*dt;else p.vx+=Math.sin(time*3+p.y)*dt*15;return p.life>0;});for(let l of labels){l.life-=dt;l.y-=32*dt;}labels=labels.filter(l=>l.life>0);if(crackle)crackle.gain.setTargetAtTime(save.sound?Math.min(.035,bodies.filter(b=>b.burn>0).length*.008+(ptr?.fire?.012:0)):0,audio.currentTime,.1);
}
function buildBackground(){background=document.createElement('canvas');background.width=800;background.height=450;let c=background.getContext('2d');let g=c.createLinearGradient(0,0,0,450);g.addColorStop(0,'#493439');g.addColorStop(1,'#2a1c22');c.fillStyle=g;c.fillRect(0,0,800,450);for(let row=0;row<9;row++)for(let col=-1;col<11;col++){let x=col*86+(row%2)*43,y=row*48;c.fillStyle=['#493137','#50383b','#453037'][(row+col+30)%3];c.fillRect(x+3,y+3,80,41);c.fillStyle='#72504b';c.fillRect(x+6,y+4,74,2);}c.fillStyle='#a16e51';c.beginPath();c.roundRect(42,19,716,406,[160,160,17,17]);c.fill();c.fillStyle='#5b3b34';c.beginPath();c.roundRect(61,35,678,375,[150,150,9,9]);c.fill();c.fillStyle='#18151a';c.beginPath();c.roundRect(75,48,650,350,[143,143,3,3]);c.fill();c.save();c.clip();for(let row=0;row<9;row++)for(let col=-1;col<12;col++){let x=col*71+(row%2)*35,y=45+row*43;c.fillStyle=['#30252b','#2c2329','#35282e'][(row+col+30)%3];c.fillRect(x+2,y+2,67,39);c.fillStyle='#403037';c.fillRect(x+4,y+3,63,1);}let soot=c.createRadialGradient(400,120,40,400,230,360);soot.addColorStop(0,'#0d1018e8');soot.addColorStop(1,'#17101400');c.fillStyle=soot;c.fillRect(60,40,680,370);c.restore();c.fillStyle='#76513e';c.fillRect(36,402,728,12);c.fillStyle='#b58359';c.fillRect(30,414,740,8);c.fillStyle='#38262a';c.fillRect(23,422,754,28);for(let x=74;x<750;x+=54){c.strokeStyle='#4f3532';c.beginPath();c.moveTo(x,424);c.lineTo(x-9,450);c.stroke();}for(let i=0;i<160;i++){let x=rnd(42,750),y=rnd(25,420);c.fillStyle='#e7b8840a';c.fillRect(x,y,rnd(1,3),1);} }
function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;const dpr=Math.min(devicePixelRatio||1,1.6);canvas.width=w*dpr;canvas.height=h*dpr;scale=Math.min(w/800,h/450);ox=(w-800*scale)/2;oy=(h-450*scale)/2;ctx.setTransform(dpr,0,0,dpr,0,0);}new ResizeObserver(resize).observe(canvas);
function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#21181d';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(ox+rnd(-shake,shake)*scale,oy+rnd(-shake,shake)*scale);ctx.scale(scale,scale);ctx.drawImage(background,0,0);const burning=bodies.filter(b=>b.burn>0).length;if(burning||ptr?.fire){let g=ctx.createRadialGradient(400,330,20,400,330,370);g.addColorStop(0,'#ff893e'+Math.round(clamp(.08+burning*.035,0,.35)*255).toString(16).padStart(2,'0'));g.addColorStop(1,'#ff843000');ctx.fillStyle=g;ctx.fillRect(0,0,800,450);}for(const a of ash){ctx.fillStyle='#82706a';ctx.beginPath();ctx.ellipse(a.x,395,a.r,4,0,0,6.29);ctx.fill();for(let j=0;j<4;j++){ctx.fillStyle=j%2?'#51474c':'#a5907e';ctx.fillRect(a.x-a.r+j*a.r*.55,390+(j%2)*3,7,4);}}
for(let b of bodies){ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle='#08091155';ctx.beginPath();ctx.ellipse(0,Math.min(398-b.y,b.r),b.r*.9,6,0,0,6.29);ctx.fill();ctx.rotate(b.angle);let sz=b.r*2.2;ctx.globalAlpha=1-b.burn*.45;ctx.drawImage(ART[b.id],-sz/2,-sz/2,sz,sz);if(b.burn>0){ctx.globalCompositeOperation='source-atop';ctx.fillStyle=`rgba(75,30,23,${b.burn*.5})`;ctx.fillRect(-sz/2,-sz/2,sz,sz);ctx.globalCompositeOperation='source-over';}ctx.restore();}
ctx.save();ctx.globalCompositeOperation='screen';for(const p of particles){const a=clamp(p.life/(p.kind==='fire'?.6:.8),0,1);ctx.globalAlpha=a;if(p.kind==='fire'){let g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2);g.addColorStop(0,'#fff0a3');g.addColorStop(.25,'#ffc65e');g.addColorStop(.55,'#f16728');g.addColorStop(1,'#9b271000');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.1,p.r*1.8,Math.sin(time*5)*.2,0,6.29);ctx.fill();}else{ctx.fillStyle=p.color;ctx.beginPath();if(p.kind==='star'){ctx.moveTo(p.x,p.y-p.r);ctx.lineTo(p.x+p.r*.35,p.y);ctx.lineTo(p.x,p.y+p.r);ctx.lineTo(p.x-p.r*.35,p.y);}else ctx.ellipse(p.x,p.y,p.r,p.kind==='coin'?p.r*.8:p.r,0,0,6.29);ctx.fill();}}ctx.restore();for(const l of labels){ctx.globalAlpha=clamp(l.life,0,1);ctx.fillStyle='#ffe3a2';ctx.textAlign='center';ctx.font='bold 24px Georgia';ctx.shadowColor='#47251a';ctx.shadowBlur=5;ctx.fillText(l.text,l.x,l.y);ctx.shadowBlur=0;}ctx.globalAlpha=1;if(flash>0){ctx.fillStyle=`rgba(255,225,174,${flash*.45})`;ctx.fillRect(0,0,800,450);}if(ptr?.fire){ctx.strokeStyle='#ffd395';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ptr.x,ptr.y,17+Math.sin(time*8)*2,0,6.29);ctx.stroke();}ctx.restore();}
function frame(ts){let dt=Math.min((ts-last)/1000,.05);last=ts;if(!paused){acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60;}}draw();requestAnimationFrame(frame);}if(fresh){bodies.push({uid:nextID++,id:'log',x:400,y:360,vx:0,vy:0,r:34,angle:0,heat:1,burn:.001,age:0,event:false,paid:false});}buildBackground();updateUI();resize();requestAnimationFrame(frame);
window.__ember={state:()=>({save:{...save},bodies:bodies.map(b=>({...b})),particles:particles.length,paused,orderIndex}),advance:s=>{for(let i=0;i<s*60;i++)if(!paused)step(1/60);draw();},coords:(x,y)=>{let r=canvas.getBoundingClientRect();return{x:r.left+ox+x*scale,y:r.top+oy+y*scale};}};
</script></body></html>
