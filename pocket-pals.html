<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e4efe4"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%23fff6e5' stroke='%23436161' stroke-width='4'/%3E%3Cpath d='M6 31a26 26 0 0152 0' fill='%23e67869'/%3E%3Cpath d='M6 32h52' stroke='%23436161' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23fff6e5' stroke='%23436161' stroke-width='4'/%3E%3C/svg%3E"><title>Pocket Pals · Pokémon Fan Puzzle</title><link rel="stylesheet" href="pocket-pals.css"></head><body>
<canvas id="world" aria-hidden="true"></canvas><main class="shell"><header><div class="brand"><span class="ball" aria-hidden="true"></span><div>POCKET PALS<small>POKÉMON FAN PUZZLE</small></div></div><div class="toptools"><button id="direction" aria-label="Rotation direction: clockwise" aria-pressed="false">↻</button><button id="sound" aria-label="Toggle sound" aria-pressed="true">♪</button></div></header>
<div class="hud"><div><small>MEETUP</small><b id="level">01</b></div><div class="progress"><span id="matched">0 / 9</span><div class="bar"><i id="progress"></i></div></div><div class="turns"><small>TURNS</small><b id="moves">0</b></div></div><p id="tip">Tap ↻. Match every buddy to its habitat.</p>
<div id="field" role="group" aria-label="Rotate four Pokémon together to match their habitat colors"><div id="turnbuttons"></div><div id="boardlabels" class="sr-only" aria-live="polite"></div></div>
<footer><div class="tools"><button id="undo" aria-label="Undo last rotation">↩<small>UNDO</small></button><button id="hint" aria-label="Show the next useful rotation">✦<small>HINT</small></button><button id="reset" aria-label="Restart this meetup">↶<small>RESET</small></button></div><button id="album"><span class="mini-ball" aria-hidden="true">●</span><div><small>BUDDY COLLECTION</small><b><span id="total">0</span> <i>★</i></b><div class="bar"><i id="collectionbar"></i></div></div><span>↗</span></button></footer><p class="fan-note">UNOFFICIAL FAN GAME</p></main>
<div id="toast" role="status"></div><section id="win" hidden role="dialog" aria-modal="true" aria-labelledby="wintitle"><div class="winpanel"><div class="win-art" id="winart"></div><small>NINE BUDDIES. ONE HAPPY PLACE.</small><h1 id="wintitle">Perfect little meetup!</h1><div id="winstars">★ ★ ★</div><p id="reward"></p><button id="next">NEXT MEETUP <span>→</span></button></div></section>
<section id="collection" hidden role="dialog" aria-modal="true" aria-labelledby="albumtitle"><div class="album-panel"><button id="close" aria-label="Close buddy collection">×</button><small>A LITTLE FRIENDSHIP GOES A LONG WAY</small><h2 id="albumtitle">Growing together.</h2><p id="albumtip">Earn stars. Unlock evolved buddies.</p><div id="cards"></div></div></section>
<script src="pocket-pals-engine.js"></script><script src="pocket-pals-levels.js"></script><script src="pocket-pals.js"></script></body></html>
