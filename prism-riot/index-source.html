<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b22"><meta name="description" content="An original playable neon concert. Three pads. Six tracks. One room that comes alive with your rhythm."><title>PRISM RIOT — Play the light</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body>
