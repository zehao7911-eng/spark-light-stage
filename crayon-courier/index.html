function finish(){const gain=E.award(s,p);mode='result';art.draw(s,w,p,null,tool,ghost,fx,trail);p.cards[s.level]=thumb();[392,494,587,784].forEach((f,i)=>note(f,.24,'sine',i*.1));result(gain);save()}
function failure(){modal('<div class="eyebrow">EVERY GOOD IDEA STARTS WITH A DOODLE</div><div class="hero">↶</div><h2>A tiny adjustment?</h2><p>Your sketch is still here. Change a line, try a weight, or give the ball a gentle nudge.</p><div class="row"><button id="revise" class="primary">Back to drawing</button><button id="help">How to draw</button></div>','failed')}
function book(){const unlock=Math.min(11,Math.max(0,p.best.findLastIndex(x=>x>0)+1));modal('<div class="eyebrow">YOUR LITTLE BOOK OF POSSIBILITIES</div><h2>Sketchbook</h2><div class="subtitle">'+p.best.reduce((a,b)=>a+b,0)+' / 36 ★ · '+p.tokens+' pencils</div><div class="journal">'+E.levels.map((l,i)=>'<button id="page'+i+'" aria-label="Page '+(i+1)+': '+l.name+'" '+(i>unlock?'disabled':'')+'>'+String(i+1).padStart(2,'0')+'<small>'+(p.best[i]?'★'.repeat(p.best[i]):'·')+'</small></button>').join('')+'</div><div class="row palette">'+['Coral','Sage','Blue','Lilac'].map((n,i)=>'<button id="color'+i+'" style="border-color:'+CrayonArt.PENS[i]+';background:'+(p.palette===i?'#e2e8ce':'')+'">'+n+(p.owned.includes(i)?' ✓':' · '+[0,12,18,24][i])+'</button>').join('')+'</div><div class="row"><button id="back" class="primary">Back</button><button id="help">How to draw</button></div>','book')}
function help(){returnMode=mode;modal('<div class="eyebrow">YOU ARE THE INVENTOR</div><h2>Draw. Roll. Smile.</h2><div class="tutorial"><b>Bridge</b> · Start at one brass pin and finish at another. The line stays pinned.<br><br><b>Drop</b> · Draw a closed shape for a solid weight, or an open line for a falling beam. Blue switches open blue doors.<br><br><b>Roll</b> · Starts the ball. Tap <b>Nudge</b> if it needs a little push.</div><p>Collect three little stars. Keep ink below the page budget without a hint for the third medal. Undo and retry are free.</p><div class="row"><button id="helpback" class="primary">Got it</button></div><div class="fine">Mouse / touch to draw · Space roll · Z undo · R revise<br>Keyboard drawing: arrows move pen, D starts, Enter finishes</div>','help')}
function pause(){if(!['edit','run'].includes(mode))return;modal('<div class="eyebrow">THE INK CAN WAIT</div><h2>A little pause</h2><div class="row"><button id="go" class="primary">Continue</button><button id="bookModal">Sketchbook</button><button id="help">How to draw</button></div>','paused')}
function nextPage(i){s=E.make(i);w=null;ghost=false;fx=[];trail=[];mode='edit';tool='bridge';draft=null;gesture=null;keyboard=false;cursor=E.levels[i].pins[0]?.slice()||[150,240];$('toast').textContent='';$('overlay').classList.add('hide');gate();ui();save();dirty=true}
function download(){const a=document.createElement('a');a.href=art.capture();a.download='Crayon-Courier-page-'+(s.level+1)+'.png';a.click()}
function dispatch(b){audioInit();let id=b.id;if(id==='go'||id==='back'){resume();return}if(id==='helpback'){if(returnMode==='intro')intro();else if(returnMode==='book')book();else if(returnMode==='failed')failure();else resume();return}if(id==='sound'){p.mute=!p.mute;gate();ui();save();return}if(id==='pause'){pause();return}if(id==='help'){help();return}if(id==='book'||id==='bookModal'){book();return}if(id==='roll'){roll();return}if(id==='edit'||id==='revise'){revise();return}if(id==='bridge'||id==='drop'){if(mode==='edit'){tool=id;draft=null;ui();dirty=true}return}if(id==='undo'){if(E.undo(s)){w=null;mode='edit';fx=[];trail=[];draft=null;note(220,.1);ui();save();dirty=true}return}if(id==='hint'){hint();return}if(id==='next'){s.level===11?book():nextPage(s.level+1);return}if(id==='download'){download();return}if(id.startsWith('color')){if(E.buy(p,+id.slice(5))){book();save();dirty=true}else $('panel').querySelector('h2').textContent='A few more pencils…';return}if(id.startsWith('page')){let i=+id.slice(4);modal('<div class="eyebrow">A FRESH SHEET OF PAPER</div><h2>'+E.levels[i].name+'</h2><p>Your medals and pencils stay in the book.</p><div class="row"><button id="yes" data-page="'+i+'" class="primary">Open page</button><button id="bookModal">Back</button></div>','confirm');return}if(id==='yes'){nextPage(+b.dataset.page);return}}
document.addEventListener('pointerup',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;e.preventDefault();lastButton=performance.now();dispatch(b)});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(e.isTrusted&&performance.now()-lastButton<650){e.preventDefault();return}dispatch(b)});
canvas.addEventListener('pointerdown',e=>{if(mode!=='edit')return;e.preventDefault();audioInit();if(gesture){gesture=null;draft=null;dirty=true;return}gesture=e.pointerId;keyboard=false;draft=[tool==='bridge'?magnet(art.point(e.clientX,e.clientY)):art.point(e.clientX,e.clientY)];canvas.setPointerCapture(e.pointerId);dirty=true});canvas.addEventListener('pointermove',e=>{if(gesture!==e.pointerId||!draft)return;e.preventDefault();let q=art.point(e.clientX,e.clientY);if(E.dist(q,draft.at(-1))>3&&draft.length<350)draft.push(q);dirty=true});canvas.addEventListener('pointerup',e=>{if(gesture!==e.pointerId||!draft)return;e.preventDefault();draft.push(tool==='bridge'?magnet(art.point(e.clientX,e.clientY)):art.point(e.clientX,e.clientY));commit()});canvas.addEventListener('pointercancel',()=>{gesture=null;draft=null;dirty=true});canvas.addEventListener('lostpointercapture',()=>{gesture=null;if(!keyboard)draft=null;dirty=true});
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;let k=e.key.toLowerCase();if(k==='escape'||k==='p'){e.preventDefault();['edit','run'].includes(mode)?pause():resume();return}if(!['edit','run'].includes(mode)){if(k==='enter')$('go')?.click();return}if(k===' '){e.preventDefault();audioInit();roll();return}if(k==='z'){dispatch($('undo'));return}if(k==='r'){revise();return}if(k==='h'){hint();return}if(k==='b'){book();return}if(mode!=='edit')return;if(k==='1'||k==='2'){tool=k==='1'?'bridge':'drop';ui();return}if(k==='d'){keyboard=true;draft=[cursor.slice()];dirty=true;return}if(k==='enter'&&keyboard){commit();return}let a={ArrowUp:[0,-1],ArrowRight:[1,0],ArrowDown:[0,1],ArrowLeft:[-1,0]}[e.key];if(a){e.preventDefault();let d=e.shiftKey?2:10;cursor=[Math.max(12,Math.min(468,cursor[0]+a[0]*d)),Math.max(16,Math.min(446,cursor[1]+a[1]*d))];if(keyboard)draft.push(cursor.slice());dirty=true}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('pagehide',save);window.addEventListener('resize',fit);
function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(mode==='run'){acc+=dt;while(acc>=1/60&&mode==='run'){acc-=1/60;w.tick();for(let f of w.events){fx.push({...f,time:s.time});if(f.type==='chip'){note([440,554,659][s.mask.toString(2).split('1').length-2]||660,.18);ui()}if(f.type==='impact')note(145,.055,'triangle');if(f.type==='bounce')note(280,.2,'triangle');if(f.type==='gate')note(530,.18);if(f.type==='win'){finish();break}if(f.type==='fail'){failure();break}}if(s.time>3&&w.ball.speed<.3&&mode==='run')$('roll').classList.add('active');else $('roll').classList.remove('active')}trail.push([w.ball.position.x,w.ball.position.y]);if(trail.length>55)trail.shift();fx=fx.filter(f=>s.time-f.time<1.2).slice(-10);saveAt+=dt;if(saveAt>1.5)save();dirty=true}if(toastUntil&&t>toastUntil){$('toast').textContent='';toastUntil=0}if(dirty&&t-renderAt>=1000/30){art.draw(s,w,p,draft,tool,ghost,fx,trail);renderAt=t;dirty=false}requestAnimationFrame(frame)}
Object.defineProperty(window,'__crayon',{value:Object.freeze({get state(){return E.clone(s)},get profile(){return E.clone(p)},get mode(){return mode},get world(){return w?w.snapshot():null},get audioGain(){return master?.gain.value||0},get bodies(){return w?Matter.Composite.allBodies(w.engine.world).length:0},screen:(x,y)=>art.screen(x,y)})});
fit();ui();intro();requestAnimationFrame(frame);
})();
</script></body></html>
