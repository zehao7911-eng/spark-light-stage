<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111c25"><title>Crown of Mist</title><link rel="stylesheet" href="style.css?v=1"></head>
<body><canvas id="world" aria-label="A pixel kingdom beside a misty lake"></canvas>
<header><div class="identity"><span class="crown">♛</span><div>CROWN OF MIST<small id="chapter">THE FIRST LIGHT</small></div></div><div class="tools"><button id="sound" aria-label="Toggle sound">♪</button><button id="pause" aria-label="Pause game">Ⅱ</button></div></header>
<div id="hud" hidden><div class="purse"><span>◈</span><b id="gold">24</b><small id="army">2 ♜</small></div><div class="clock"><span id="day">DAY I</span><div class="track"><i id="time"></i></div><small id="season">Prepare your kingdom</small></div><button id="night">☾<small>Begin night</small></button></div>
<div id="message" aria-live="polite"></div><div id="context" hidden><span id="verb"></span><small id="detail"></small></div>
<nav id="controls" hidden><div class="move"><button id="left" aria-label="Ride left">‹</button><button id="right" aria-label="Ride right">›</button></div><button id="rally" aria-label="Rally nearby archers">⚑<small>Rally</small></button><button id="pay" aria-label="Use nearest building">◈<small id="cost">Pay</small></button></nav>
<section id="panel"><div class="sheet"><small id="eyebrow">A KINGDOM BY THE WATER</small><h1 id="title">Crown<br>of Mist</h1><p id="subtitle">A coin. A wall. One more sunrise.</p><div id="choices"></div><button class="primary" id="start">Raise your banner <span>→</span></button><button class="secondary" id="fresh" hidden>New kingdom</button><div id="instructions"><span>‹ › &nbsp; Ride</span><span>◈ &nbsp; Build & recruit</span><span>⚑ &nbsp; Rally</span></div></div></section>
<footer id="hint">Eight nights to save the valley.</footer><script src="game.js?v=1"></script></body></html>
