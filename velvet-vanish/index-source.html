<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202b42"><meta name="description" content="Keep your eye on a little secret. A one-finger 3D magic show."><meta property="og:title" content="Velvet Vanish"><meta property="og:image" content="https://zehao7911-eng.github.io/spark-light-stage/velvet-vanish/assets/cover.jpg"><title>Velvet Vanish — Keep your eye on it.</title><link rel="icon" href="./assets/icon.svg"><link rel="stylesheet" href="./style.css"></head><body><main id="app"><canvas id="view" aria-label="An original human magician and three cups on a velvet stage. Watch the glowing keepsake, then choose a cup."></canvas><div id="vignette"></div><div id="flash"></div>
<header><button id="home" aria-label="Velvet Vanish home"><img src="./assets/icon.svg" width="38" height="38" alt=""><span>VELVET<br>VANISH</span></button><span id="stars">✦ 0</span><button id="pause" aria-label="Pause and settings">Ⅱ</button></header>
<section id="title"><div class="headline"><small>NOTHING UP OUR SLEEVES.</small><h1>Now you<br><i>see it.</i></h1><p>Watch it vanish.<br>Find it again.</p></div><div class="title-actions"><button id="play" class="big gold">LET THE SHOW BEGIN <span>↗</span></button><div class="row"><button id="shows">SIX LITTLE SHOWS</button><button id="collection">THE GREEN ROOM</button></div></div></section>
<section id="hud" hidden><div><small id="showLabel"></small><h1 id="showName"></h1><div id="pips" aria-label="Trick results"></div></div><b id="score">0</b></section>
<div id="echo" hidden aria-live="polite"><b id="reaction"></b><small id="cue"></small></div>
<div id="cupTargets" aria-label="Choose a cup" hidden><button aria-label="Left cup" data-slot="0">1</button><button aria-label="Middle cup" data-slot="1">2</button><button aria-label="Right cup" data-slot="2">3</button></div>
<section id="dock" hidden><div class="instruction"><b id="instruction">Keep your eye on the light.</b><small id="subInstruction">Three cups. One little secret.</small></div><button id="action" class="big gold">SHOW ME <span>✦</span></button><button id="rewatch" hidden>WATCH AGAIN ↻</button></section>
<section id="overlay" role="dialog" aria-modal="true" aria-labelledby="panelTitle" hidden><div id="sheet"><small id="panelTag"></small><h2 id="panelTitle"></h2><div id="panelBody"></div><div id="actions"></div></div></section>
<section id="error" hidden><div><h2>The curtain got stuck.</h2><p>This 3D show needs WebGL. Please enable it and reload.</p><button id="reload" class="big gold">RELOAD</button></div></section></main><script src="./vendor/three.min.js"></script><script type="module" src="./game.mjs"></script></body></html>
