</script><script>(()=>{
'use strict';
const E=OddEngine,A=OddArt,$=id=>document.getElementById(id),canvas=$('toy'),ctx=canvas.getContext('2d'),KEY='pocket-oddities-v1';
let s=E.make(0),profile=E.profile(),mode='intro',view={w:0,h:0,x:0,y:0,z:1},openAmount=0,fx=null,drag=null,tip=null,pointer=null,preview=null,selectedFood=null,selectedKey=0,toastUntil=0,playback=null,dirty=true,saveClock=0,lastStamp=0,lastDraw=0,pointerState=null,audio=null,gain=null,lastButton=0;
try{const d=JSON.parse(localStorage.getItem(KEY));if(d?.version===1&&d.state.level>=0&&d.state.level<6){s=d.state;profile={...profile,...d.profile};openAmount=s.open?1:0;if(s.done)E.award(s,profile)}}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,state:s,profile}))}catch{}saveClock=0}
function soundInit(){if(!audio)try{audio=new(window.AudioContext||window.webkitAudioContext)();gain=audio.createGain();gain.connect(audio.destination)}catch{}if(audio?.state==='suspended')audio.resume().catch(()=>{});audioGate()}
function audioGate(){if(gain)gain.gain.setValueAtTime(profile.mute||mode!=='play'?0:.24,audio.currentTime)}
function tone(freq=300,duration=.18,type='sine',delay=0){if(!audio||profile.mute||mode!=='play')return;let o=audio.createOscillator(),g=audio.createGain(),at=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(freq*.72,at+duration);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.34,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(g);g.connect(gain);o.start(at);o.stop(at+duration+.04);o.onended=()=>{o.disconnect();g.disconnect()}}
function effect(e){fx={...e,age:0};dirty=true;const f={latch:320,open:180,turn:240,match:540,food:420,wrong:130,slide:330,switch:220,power:390,note:440,phrase:660,boop:190,play:220};if(e.note!=null)tone([262,330,392,523][e.note],.3,'triangle');else tone(f[e.type]||280,e.type==='wrong'?.2:.16,e.type==='wrong'?'triangle':'sine');if(e.type==='open'){tone(260,.3,'triangle',.12);tone(350,.3,'triangle',.24)}if(e.type==='match')tone(720,.22,'sine',.09);if(e.type==='complete'){const pay=E.award(s,profile);for(let i=0;i<5;i++)tone([262,330,392,523,660][i],.45,'triangle',i*.13);toast(pay?'AWAKE!  +'+pay+' little gears':'AWAKE!');save();ui()}}
function act(id,arg){if(mode!=='play')return;tip=null;effect(E.action(s,id,arg));if(id==='power'&&!E.ready(s)&&!s.done)toast('The little mechanisms need a nudge.');if(fx.type==='wrong'&&s.level===1)toast('Follow the ingredient strip.');if(fx.type==='wrong'&&s.level===4)toast('Try that phrase again.');ui();save()}
function toast(t){$('toast').textContent=t;toastUntil=s.time+3}
function ui(){ $('name').textContent=E.NAMES[s.level].toUpperCase();$('counter').textContent=String(s.level+1).padStart(2,'0')+' / 06';$('sound').textContent=profile.mute?'♫×':'♫';$('dots').innerHTML=profile.stars.map((a,i)=>'<i class="'+(i===s.level?'now ': '')+(a?'done':'')+'"></i>').join('');let t='Release both clasps';if(s.done)t='A little world, wide awake';else if(s.open)t=[E.ready(s)?'Pull to make it rain':'Match the little seed plaques',s.food<3?'Drag ingredients · follow the strip':'Turn the oven crank',E.ready(s)?'Pump the water':'Turn the pipes · join the spout',E.ready(s)?'Peek through the telescope':'Slide stars onto their outlines','Play the symbols · one happy phrase',E.ready(s)?'Ring the station bell':'Light all four windows'][s.level];$('step').textContent=t}
function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);let z=Math.min((r.width-12)/760,(r.height-35)/740);view={w:r.width,h:r.height,z,x:(r.width-760*z)/2,y:(r.height-740*z)/2+12};dirty=true}
function world(x,y){let b=canvas.getBoundingClientRect();return{x:(x-b.left-view.x)/view.z,y:(y-b.top-view.y)/view.z}}
function project(x,y){let b=canvas.getBoundingClientRect();return{x:b.left+view.x+x*view.z,y:b.top+view.y+y*view.z}}
function hit(q){const zones=A.controls(s),rad=22/view.z;let h=zones.filter(z=>Math.hypot(q.x-z.x,q.y-z.y)<=Math.max(rad,z.r)).sort((a,b)=>Math.hypot(q.x-a.x,q.y-a.y)-Math.hypot(q.x-b.x,q.y-b.y))[0];if(s.open&&s.level===3&&!s.done){let i=Math.round((q.y-330)/105);if(i>=0&&i<3&&Math.abs(q.y-(330+i*105))<Math.max(rad,28)&&q.x>=180&&q.x<=580)h=zones.find(z=>z.id==='slide'+i)}if(s.level===1&&selectedFood!==null&&Math.hypot((q.x-380)/1.4,q.y-410)<78)h={id:'bowl',x:380,y:410,r:85};return h}
function release(){pointerState=null;drag=null;preview=null;dirty=true}
canvas.addEventListener('pointerdown',e=>{if(mode!=='play')return;e.preventDefault();soundInit();if(pointerState){release();return}const q=world(e.clientX,e.clientY),z=hit(q);pointer=q;canvas.setPointerCapture(e.pointerId);if(!z){selectedFood=null;dirty=true;return}pointerState={pointer:e.pointerId,id:z.id,x:q.x,y:q.y,startX:e.clientX,startY:e.clientY,z,moved:false,turns:0};fx={type:'boop',id:z.id,age:0};if(z.drag){drag={id:z.id,x:q.x,y:q.y};selectedFood=null}else if(z.slider){preview=E.clone(s);preview.values[+z.id.slice(5)]=Math.max(0,Math.min(4,Math.round((q.x-210)/85)))}dirty=true});
canvas.addEventListener('pointermove',e=>{const q=world(e.clientX,e.clientY);pointer=q;if(!pointerState||pointerState.pointer!==e.pointerId)return;e.preventDefault();let ps=pointerState;ps.moved ||=Math.hypot(e.clientX-ps.startX,e.clientY-ps.startY)>7;if(drag){drag.x=q.x;drag.y=q.y}else if(ps.z.slider){preview.values[+ps.id.slice(5)]=Math.max(0,Math.min(4,Math.round((q.x-210)/85)))}else if(ps.id.startsWith('dial')){let n=Math.floor(Math.hypot(q.x-ps.x,q.y-ps.y)/70);while(n>ps.turns&&ps.turns<3){act(ps.id);ps.turns++}}dirty=true});
canvas.addEventListener('pointerup',e=>{if(!pointerState||pointerState.pointer!==e.pointerId)return;e.preventDefault();let ps=pointerState,q=world(e.clientX,e.clientY);if(drag){if(ps.moved){if(Math.abs(q.x-380)<135&&Math.abs(q.y-408)<90)act(ps.id);else tone(145,.13,'triangle')}else{selectedFood=+ps.id.slice(4);tip={id:ps.id,until:s.time+3};toast('Now tap the bowl.')}}else if(ps.id==='bowl'){act('food'+selectedFood);selectedFood=null}else if(ps.z.slider)act(ps.id,preview.values[+ps.id.slice(5)]);else if(ps.id==='listen'){listen()}else if(ps.id.startsWith('eye')){effect({type:s.done?'play':'boop',id:ps.id});toast(s.done?'Hello, friend!':'Boop!')}else if(!ps.id.startsWith('dial')||ps.turns===0)act(ps.id);release()});
canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',()=>{if(pointerState)release()});
function listen(){if(s.level!==4)return;const notes=s.melodies[Math.min(1,s.phrase)];playback={notes:notes.slice(),index:0,next:s.time};toast('Listen · then play')}
function start(){mode='play';$('overlay').classList.add('hide');release();soundInit();ui();dirty=true;if(s.done&&s.completeTime>=0)showResult()}
function modal(html,newMode){mode=newMode;release();playback=null;tip=null;$('card').innerHTML=html;$('overlay').classList.remove('hide');audioGate();dirty=true;save()}
function intro(){modal('<div class="eyebrow">A TINY TOY WORKSHOP</div><canvas class="logo" id="logo" width="220" height="130"></canvas><h1>Pocket Oddities</h1><p>Unclip. Tinker. Wake a little world.</p><div class="hintbadge">Tap · turn · slide · drag</div><br><button class="primary" id="go">'+(s.moves?'Continue':'Let’s play')+'</button><p class="fine">Six toys. No timer. Made to be touched.</p>','intro');A.thumbnail($('logo').getContext('2d'),s.level,false)}
function pause(){if(mode!=='play')return;modal('<div class="eyebrow">TAKE YOUR TIME</div><div class="big">☾</div><h2>Workshop paused</h2><div class="row"><button id="go" class="primary">Continue</button><button id="shelfModal">Collection</button></div>','pause')}
function showResult(){modal('<div class="eyebrow">A LITTLE WORLD IS AWAKE</div><canvas class="logo" id="logo" width="220" height="130"></canvas><h2>'+E.NAMES[s.level]+'</h2><div class="stats">'+'★'.repeat(profile.stars[s.level])+'☆'.repeat(3-profile.stars[s.level])+'</div><div class="row"><button id="next" class="primary">'+(s.level<5?'Next toy':'Collection')+'</button><button id="admire">Play with it</button></div><p class="fine">'+s.moves+' touches · '+profile.coins+' little gears</p>','result');A.thumbnail($('logo').getContext('2d'),s.level)}
function shelf(){modal('<div class="eyebrow">THE WORKSHOP SHELF</div><h2>Little worlds</h2><div class="shelfgrid">'+E.NAMES.map((n,i)=>'<button id="toy'+i+'" '+(i>profile.unlocked?'disabled':'')+'><canvas id="mini'+i+'" width="148" height="116"></canvas><small>'+n+'</small><em>'+(profile.stars[i]?'★'.repeat(profile.stars[i]):i>profile.unlocked?'⌑':'· · ·')+'</em></button>').join('')+'</div><div>'+profile.coins+' little gears</div><div class="skins">'+['Midnight','Plum · 16','Dusk · 24'].map((n,i)=>'<button id="skin'+i+'" class="'+(profile.skin===i?'selected':'')+'">'+(profile.owned.includes(i)?['Midnight','Plum','Dusk'][i]:n)+'</button>').join('')+'</div><div class="row"><button id="back" class="primary">Back</button>'+(profile.stars.every(Boolean)?'<button id="remix">Remix day</button>':'')+'</div>','shelf');for(let i=0;i<6;i++)A.thumbnail($('mini'+i).getContext('2d'),i,!!profile.stars[i])}
function confirm(id){const target=+id;modal('<div class="eyebrow">'+(id==='remix'?'NEW LITTLE SURPRISES':'START THIS TOY AGAIN')+'</div><h2>'+(id==='remix'?'Remix the workshop?':E.NAMES[target]||E.NAMES[s.level])+'</h2><p>Your collection and little gears stay safe.</p><div class="row"><button id="yes" class="primary" data-target="'+id+'">Let’s go</button><button id="back">Back</button></div>','confirm')}
function newToy(n,day=profile.day){s=E.make(n,day);openAmount=0;fx=null;preview=null;drag=null;selectedFood=null;toastUntil=0;$('toast').textContent='';mode='play';$('overlay').classList.add('hide');audioGate();dirty=true;ui();save()}
function dispatch(b){let id=b.id;soundInit();if(id==='sound'){profile.mute=!profile.mute;audioGate();ui();save();return}if(id==='go'){start();return}if(id==='pause'){pause();return}if(id==='shelf'||id==='shelfModal'){shelf();return}if(id==='hint'){if(mode==='play'&&!s.done){let h=E.hint(s);s.hints++;tip={...h,until:s.time+7};toast(h.text);tone(620);save();dirty=true}return}if(id==='reset'){confirm(String(s.level));return}if(id==='back'){start();return}if(id==='next'){if(s.level<5)newToy(s.level+1);else shelf();return}if(id==='admire'){mode='play';$('overlay').classList.add('hide');s.completeTime=-100;audioGate();dirty=true;save();return}if(id.startsWith('toy')){confirm(id.slice(3));return}if(id.startsWith('skin')){if(!E.buy(profile,+id.slice(4))){$('card').querySelector('h2').textContent='A few more gears…';tone(140);return}save();shelf();return}if(id==='remix'){confirm('remix');return}if(id==='yes'){let t=b.dataset.target;if(t==='remix'){profile.day++;newToy(0)}else newToy(+t);return}}
document.addEventListener('pointerup',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;e.preventDefault();lastButton=performance.now();dispatch(b)});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(e.isTrusted&&performance.now()-lastButton<650){e.preventDefault();return}dispatch(b)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();mode==='play'?pause():start();return}if(e.target.tagName==='BUTTON')return;if(mode!=='play'){if(e.key==='Enter'){e.preventDefault();$('go')?.click()}return}let a=A.controls(s).filter(z=>!z.id.startsWith('eye'));if(e.key==='ArrowRight'||e.key==='ArrowDown'){selectedKey=(selectedKey+1)%a.length;e.preventDefault()}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){selectedKey=(selectedKey+a.length-1)%a.length;e.preventDefault()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();const z=a[selectedKey%a.length];soundInit();if(z.id==='listen')listen();else if(z.slider)act(z.id,(s.values[+z.id.slice(5)]+1)%5);else if(z.drag)act(z.id);else act(z.id)}else if(e.key.toLowerCase()==='h'){dispatch($('hint'))}else return;tip={id:a[selectedKey%a.length]?.id,until:s.time+4};dirty=true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});window.addEventListener('pagehide',save);window.addEventListener('resize',resize);
function loop(now){const dt=Math.min(.05,(now-lastStamp)/1000||0);lastStamp=now;if(mode==='play'){s.time+=dt;saveClock+=dt;if(fx)fx.age+=dt;if(s.open)openAmount=Math.min(1,openAmount+dt*2.6);if(playback&&s.time>=playback.next){let n=playback.notes[playback.index++];effect({type:'note',id:'pad'+n,note:n});playback.next=s.time+.48;if(playback.index>=playback.notes.length)playback=null}if(s.done&&s.completeTime>=0&&s.time-s.completeTime>2.6)showResult();if(toastUntil&&s.time>toastUntil){$('toast').textContent='';toastUntil=0}if(saveClock>2)save();dirty=true}if(dirty&&now-lastDraw>1000/30){A.draw(ctx,preview||s,view,s.time,openAmount,fx,drag,pointer,tip,profile.skin);lastDraw=now;dirty=false}requestAnimationFrame(loop)}
Object.defineProperty(window,'__odd',{value:Object.freeze({get state(){return E.clone(s)},get profile(){return E.clone(profile)},get mode(){return mode},get view(){return{...view}},get controls(){return A.controls(s)},get audioGain(){return gain?.gain.value||0},project})});
resize();ui();intro();requestAnimationFrame(loop);
})();
</script></body></html>
