<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c30"><meta name="description" content="Capture. Transform. Clear. A small, luminous world of shape-changing chess puzzles."><title>CROWNGLASS · Capture. Transform. Clear.</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="scene" aria-label="A sculpted marble chessboard in a celestial observatory"></canvas><div class="vignette"></div>
