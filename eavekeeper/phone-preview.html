<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EAVEKEEPER — Responsive QA</title><style>body{margin:0;background:#c8beb0;font:12px Arial;color:#423a43;display:grid;place-items:center}nav{height:48px;display:flex;align-items:center;gap:10px}button{padding:8px;border:1px solid #817463;background:#f4ecde}#wrap{position:relative}iframe{border:0;transform-origin:0 0;position:absolute;left:0;top:0;box-shadow:0 0 0 2px #6d6154}</style><nav>RESPONSIVE QA · ACTUAL GAME <button data-w="390" data-h="844">390 × 844</button><button data-w="320" data-h="568">320 × 568</button><button data-w="844" data-h="390">844 × 390</button></nav><div id="wrap"><iframe title="Phone game" src="index.html" allow="autoplay"></iframe></div><script>let w=390,h=844,f=document.querySelector('iframe'),wrap=document.getElementById('wrap');function fit(){let k=Math.min(1,(innerHeight-65)/h,(innerWidth-30)/w);f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+k+')';wrap.style.width=w*k+'px';wrap.style.height=h*k+'px'}for(let b of document.querySelectorAll('button'))b.onclick=()=>{w=+b.dataset.w;h=+b.dataset.h;fit()};onresize=fit;fit()</script></html>
