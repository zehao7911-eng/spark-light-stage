<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132d3b"><link rel="icon" href="icon.svg"><title>AEROLITH · Touch the sky</title><style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#132d3b;overflow:hidden;color:#ecf3ed;font:15px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;background:#132d3b;display:flex;align-items:center;justify-content:center;z-index:5}#loading[hidden]{display:none}.card{width:300px;text-align:center}.mark{width:100px;height:100px;border:2px solid #26384b;border-radius:50%;margin:0 auto 35px;position:relative}.mark:before,.mark:after{content:'';position:absolute;inset:13px;border:3px solid #e6c589;border-right-color:transparent;border-bottom-color:transparent;border-radius:50%;animation:spin 2s linear infinite}.mark:after{inset:28px;border-color:#ac8ae6 transparent #ac8ae6 #ac8ae6;animation-direction:reverse;animation-duration:3s}h1{font-size:22px;letter-spacing:4px;font-weight:500}h1 span{color:#e6c589}p{color:#a7c8c9;font-size:13px;line-height:1.6}#track{height:3px;background:#1d3042;margin:25px 0}#progress{height:100%;width:0;background:#e6c589;transition:width .2s}button{background:#1e3545;border:1px solid #4d7783;border-radius:12px;color:#d6eee5;padding:14px 28px;min-height:48px;cursor:pointer}#retry[hidden]{display:none}.sr{position:fixed;left:-10000px;top:0;width:1px;height:1px;overflow:hidden}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><canvas id="canvas" tabindex="0" aria-label="Aerolith 3D hover racing. Slide to steer or use arrow keys. Tap Boost or press Space. Escape pauses."></canvas><div id="loading"><div class="card"><div class="mark"></div><h1>AERO<span>LITH</span></h1><p id="load-text">Preparing the sky circuit…</p><div id="track"><div id="progress"></div></div><p id="load-size">Loading Godot · First visit may take a moment</p><button id="retry" hidden>Retry</button></div></div><output id="aero-state" hidden></output><div id="live-status" class="sr" role="status" aria-live="polite"></div><script src="index.js"></script><script>
const GODOT_CONFIG={"args": [], "canvasResizePolicy": 2, "emscriptenPoolSize": 8, "ensureCrossOriginIsolationHeaders": false, "executable": "index", "experimentalVK": false, "fileSizes": {"index.pck": 60876, "index.wasm": 39514754, "flight-6625b1db07dd.pck": 60876}, "focusCanvas": true, "gdextensionLibs": [], "godotPoolSize": 4, "mainPack": "flight-6625b1db07dd.pck"};const engine=new Engine(GODOT_CONFIG);let ready=false;
window.aeroInsets=()=>{const s=getComputedStyle(document.documentElement);return ['--sal','--sat','--sar','--sab'].map(k=>parseFloat(s.getPropertyValue(k))||0)};
window.aeroReady=()=>{ready=true;document.querySelector('#loading').hidden=true;};
window.aeroSnapshot=s=>{document.querySelector('#aero-state').textContent=JSON.stringify(s);};
document.addEventListener('visibilitychange',()=>{if(window.aeroLifecycle)window.aeroLifecycle(document.hidden?'away':'back');});
window.addEventListener('pagehide',()=>{if(window.aeroLifecycle)window.aeroLifecycle('save');});
engine.startGame({onProgress:(c,t)=>{document.querySelector('#progress').style.width=(t?Math.min(95,c/t*95):10)+'%';if(t)document.querySelector('#load-size').textContent=Math.round(c/1048576)+' / '+Math.round(t/1048576)+' MB';}}).catch(e=>{document.querySelector('#load-text').textContent='The engine could not start.';document.querySelector('#load-size').textContent=String(e.message||e);document.querySelector('#retry').hidden=false;});
document.querySelector('#retry').onclick=()=>location.reload();setTimeout(()=>{if(!ready){document.querySelector('#load-text').textContent='Still unpacking the engine…';document.querySelector('#retry').hidden=false;}},45000);
</script></body></html>
