globalThis.CounterWater = (() => {
  const costs = {installCost:16, sourceCost:7, gravityCost:3, polishCost:5};
  const samples = [
    {contaminant:'Hull grit',clarity:32,color:'#bd986b',recommended:'gravity',
      text:'Heavy bronze grains settle at the bottom. Use the gravity bed.'},
    {contaminant:'Halo pigment',clarity:68,color:'#bb82bc',recommended:'polish',
      text:'A violet film follows the light. Use the polishing cartridge.'},
    {contaminant:'Dock silt',clarity:44,color:'#97a572',recommended:'gravity',
      text:'Soft green flecks sink when the vial stops spinning. Use the gravity bed.'},
    {contaminant:'Comet tint',clarity:74,color:'#e0ac77',recommended:'polish',
      text:'Amber rings stay suspended in the sample. Use the polishing cartridge.'}

  const unavailable=message=>({ok:false,message});
  const success=(message,extra={})=>({ok:true,message,...extra});
  const available=s=>Number.isInteger(s?.day)&&(s.day>=2||s.kit==='water')&&!['ready','failed','owned'].includes(s.phase);

  function status(s){

globalThis.CounterEconomy = (() => {
  const number = (value, fallback) => Number.isFinite(value) ? value : fallback;
  const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
  const credits = value => Math.max(0, Math.round(number(value, 0)));

  function market(day, district = 0, article = 0) {
    return 1 + Math.sin(day * 1.7 + district * 3 + article * 2.3) * .23;
  }

  function resale(base, gradeMultiplier = 1, demand = 1) {
    const grade = clamp(number(gradeMultiplier, 1), .1, 2.5);
    return Math.max(1, Math.round(credits(base) * grade * clamp(number(demand, 1), .25, 3)));
  }

  function quote(base, gradeMultiplier = 1, demand = 1) {
    return Math.max(1, Math.round(resale(base, gradeMultiplier, demand) * .72));
  }

  function offer(ask, minimum, playerBid, patience) {
    const floor = Math.max(1, credits(minimum));
    const wanted = Math.max(floor, credits(ask));
    const bid = credits(playerBid);
    const chances = credits(patience);
    if (!chances) return {status: 'walked', price: 0, patience: 0};
    if (bid >= floor) return {status: 'accepted', price: Math.min(bid, wanted), patience: chances};
    if (chances === 1) return {status: 'walked', price: 0, patience: 0};
    // Close offers draw larger concessions. Even a poor bid moves the seller.
    const concession = Math.max(1, Math.ceil((wanted - floor) * (.28 + .42 * bid / floor)));
    return {status: 'counter', price: Math.max(floor, wanted - concession), patience: chances - 1};
  }

  function closeDay(balance, rent) {
    const cash = credits(balance);
    const due = credits(rent);
    const paid = Math.min(cash, due);
    return {balance: cash - paid, paid, shortfall: due - paid};
  }

  return Object.freeze({market, resale, quote, offer, closeDay});
})();

 const a=[tray.left+tray.width/2,tray.top+tray.height/2],b=[drawer.left+drawer.width*.44,drawer.top+18];
 const from=buy?a:b,to=buy?b:a,c=document.createElement('canvas');c.className='travelling';drawIcon(c,item);document.body.append(c);c.style.left=(from[0]-18)+'px';c.style.top=(from[1]-18)+'px';
 const dx=to[0]-from[0],dy=to[1]-from[1];const animation=c.animate([{transform:'translate(0,0) scale(.8)',opacity:0},{offset:.18,transform:'translate(0,-11px) scale(1.1)',opacity:1},{offset:.85,opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale(.64)',opacity:0}],{duration:560,easing:'cubic-bezier(.26,.5,.65,1)'});animation.onfinish=()=>c.remove();
}

}

function renderDrawer(){
 const d=$('#drawer'),s=run();d.replaceChildren();
 for(let i=0;i<Math.max(5,Math.min(s.stock.length,6));i++){
  const l=s.stock[i],b=document.createElement(l?'button':'div');b.className='bin';
  if(l){b.innerHTML=goodsIcon(l.item)+'<span>'+money(l.cost)+'</span>';b.title=GOODS[l.item][0];b.setAttribute('aria-label','View '+b.title);
   const buyer=s.phase==='trade'&&s.patron.buyer;
   const choose=()=>{if(s.patron.lot.id!==l.id){hostStart();assignSale(s,s.patron,l);CounterSound.play('tap');save();render();}};
   if(buyer)handleLift(b,l,choose);
   b.onclick=()=>{if(b.dataset.dragged==='true')return;if(buyer)choose();else showModal('shelf');};}
  d.append(b);
 }icons(d);
}
function handleLift(b,l,choose){
 let down=null,ghost=null;b.style.touchAction='none';b.title='Show '+GOODS[l.item][0]+' to this buyer';
 b.onpointerdown=e=>{down=[e.clientX,e.clientY];b.dataset.dragged='';b.setPointerCapture(e.pointerId);};
 b.onpointermove=e=>{if(!down)return;if(!ghost&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<7)return;
   if(!ghost){ghost=document.createElement('canvas');ghost.className='lifted';drawIcon(ghost,l.item);document.body.append(ghost);$('#world').classList.add('dropzone');}
   ghost.style.left=(e.clientX-24)+'px';ghost.style.top=(e.clientY-38)+'px';};
 function end(e,drop){if(ghost){ghost.remove();ghost=null;b.dataset.dragged='true';$('#world').classList.remove('dropzone');
   const r=$('#world').getBoundingClientRect(),lot=$('.lot')?.getBoundingClientRect();const inside=q=>q&&e.clientX>=q.left&&e.clientX<=q.right&&e.clientY>=q.top&&e.clientY<=q.bottom;
   if(drop&&(inside(r)||inside(lot))){choose();if(e.pointerType==='touch')drawerReleaseUntil=performance.now()+1800;}}down=null;}
 b.onpointerup=e=>end(e,true);b.onpointercancel=e=>end(e,false);b.onlostpointercapture=e=>end(e,false);
}

 if(k==='charter')body.querySelectorAll('[data-crew]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.crew);if(s.charter!=null||s.day<2||s.reps[i]<4)return;s.charter=i;logTrade(s,CREWS[i]+' charter');save();CounterSound.play('stamp');render();});
 if(k==='restart')$('#newLease').onclick=()=>{if(session){sdk?.end();session=false;}profile.run=makeRun(seed());save();modal.close();render();};
 if((k==='shelf'||k==='bench')&&CounterWater.status(s).available){let b=document.createElement('button');b.textContent='Water plant';b.id='water';b.onclick=()=>showModal('water');body.prepend(b);}
 if(k==='water'){paintPlant(performance.now());body.querySelectorAll('[data-plant]').forEach(b=>b.onclick=()=>{const a=b.dataset.plant;if(s.phase==='trade'||s.phase==='receipt')hostStart();
   const result=(a==='gravity'||a==='polish')?CounterWater.filter(s,a):CounterWater[a](s);
   if(result.ok){CounterSound.play(a==='sample'?'scan':a==='bottle'?'stamp':'upgrade');save();}render();
  });}
 body.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
  const act=b.dataset.act;
  if(act==='report'&&s.phase==='trade'&&v&&!v.buyer&&v.scanned&&v.lot.sealRead&&v.lot.tag){hostStart();pass(s,true);modal.close();CounterSound.play('stamp');}
  else if(s.phase==='night'&&k==='bench'){
   const r=s.recap;
   if(act==='reader'&&s.cash>=32&&!s.gear.includes('reader')){s.cash-=32;s.gear.push('reader');logTrade(s,'Assay reader fitted',-32);}
   else if(act==='repair'&&!r.worked&&s.cash>=4){const l=s.stock.find(q=>q.grade<2&&!q.fake);if(!l)return;s.cash-=4;l.cost+=4;l.grade++;r.worked=true;logTrade(s,'Restored '+GOODS[l.item][0],-4);}
   else if(act==='craft'&&!r.worked){const a=s.stock.find(l=>l.item===0),b=s.stock.find(l=>l.item===1);if(!a||!b)return;s.stock=s.stock.filter(l=>l!==a&&l!==b);s.stock.push({id:++s.nonce,item:8,cost:a.cost+b.cost,grade:2,fake:false,tag:a.tag||b.tag});r.worked=true;logTrade(s,'Built a micro drone');}
   else if(act==='supply'&&!r.worked&&s.cash>=44&&s.stock.length<=5){s.cash-=44;for(const item of [0,1])s.stock.push({id:++s.nonce,item,cost:22,grade:1,fake:false,tag:false});r.worked=true;logTrade(s,'Parts crate',-44);}
   else return;CounterSound.play('upgrade');
  }else return;
  save();render();
 });
}
// A lens swipe can suppress the next synthesized mouse click on some touch
// browsers. Complete a deliberate tap on release and consume that tap's
// compatibility click even if closing the dialog exposes another button.
let lastModalTouch=null,modalPress=null,drawerReleaseUntil=0;
document.addEventListener('pointerdown',e=>{
 lastModalTouch=null;modalPress=null;
 if(e.pointerType!=='touch'||!e.isPrimary)return;
 const drawerSale=!modal.open&&run().phase==='trade'&&run().patron?.buyer&&performance.now()<drawerReleaseUntil;
 const button=modal.open?e.target.closest?.('#dismiss,[data-act="report"]'):drawerSale?e.target.closest?.('#primary'):null;
 if(button&&!button.disabled)modalPress={button,id:e.pointerId,x:e.clientX,y:e.clientY,dialog:modal.open};
},true);
document.addEventListener('pointercancel',()=>{modalPress=null;},true);
document.addEventListener('pointermove',e=>{
 if(modalPress?.id===e.pointerId&&Math.hypot(e.clientX-modalPress.x,e.clientY-modalPress.y)>8)modalPress=null;
},true);
document.addEventListener('pointerup',e=>{
 const p=modalPress;if(!p||p.id!==e.pointerId)return;modalPress=null;
 if(p.dialog!==modal.open||!p.button.isConnected||!p.button.contains(document.elementFromPoint(e.clientX,e.clientY)))return;
 if(!p.dialog)drawerReleaseUntil=0;
 lastModalTouch={x:e.clientX,y:e.clientY,time:performance.now()};
 e.preventDefault();p.button.click();
},true);
document.addEventListener('click',e=>{
 const p=lastModalTouch;
 if(p&&e.detail>0&&performance.now()-p.time<750&&Math.hypot(e.clientX-p.x,e.clientY-p.y)<20){
  e.preventDefault();e.stopImmediatePropagation();lastModalTouch=null;
 }
},true);
$('#dismiss').onclick=()=>modal.close();modal.addEventListener('close',()=>{modalKind='';});
$('#shelf').onclick=()=>showModal('shelf');$('#ledger').onclick=()=>showModal('ledger');
$('#sound').onclick=()=>{profile.mute=!profile.mute;CounterSound.mute(profile.mute);if(!profile.mute){CounterSound.wake();CounterSound.play('tap');}save();render();};
function hostSize(){const v=sdk?.viewport();for(const [key,val] of [['--hostw',v?.width],['--hosth',v?.height]])if(val)document.documentElement.style.setProperty(key,val+'px');else document.documentElement.style.removeProperty(key);}
function draw(ts){
 const s=run(),v=s.patron;const t=matchMedia('(prefers-reduced-motion: reduce)').matches?0:ts/1000;
 const id=(v?s.day+'/'+s.turn:'')+(!v?s.phase:'');if(id!==visitorKey){visitorKey=id;approachAt=ts;}
 const arrive=v&&t?Math.min(1,(ts-approachAt)/420):1;
 CounterArt.draw($('#shopArt'),{time:t,approach:arrive,patron:s.phase==='audit'?2:v?v.person:0,item:s.phase==='audit'?10:v?v.lot.item:1,mood:s.phase==='audit'?'angry':v?v.mood:'idle',day:s.day,stock:s.stock.map(l=>l.item),scan:ts<scanUntil,scene:['night','owned','failed'].includes(s.phase)?'closed':'shop'});
 if(ts>pulseUntil)$('#delta').classList.remove('show');
}
function paintPlant(ts){const c=$('#plantFace');if(!c)return;const w=CounterWater.status(run());
 WaterArt.machine(c,{time:ts/1000,fill:['raw','sampled','filtered'].includes(w.phase)?.83:0,quality:w.quality===2?1:w.clarity/100||.2,stage:({raw:'testing',sampled:'testing',filtered:'ready',bottled:'ready'})[w.phase]||'empty'});}
function animate(ts){if(!document.hidden&&ts-lastDraw>=65){lastDraw=ts;draw(ts);if(modal.open&&modalKind==='water')paintPlant(ts);}requestAnimationFrame(animate);}
CounterSound.mute(profile.mute);
sdk=bridge({read:()=>profile,write:(d,rem)=>{merge(d,rem);persist();},changed:e=>{
 if(e.type==='reward'){profile.revision=Math.max(Date.now(),profile.revision+1);persist();delta(e.kind==='like'?'GOLD PLATE':'VIOLET INK');}
 if(e.type==='support'||e.type==='reward'||e.type==='cloud'){render();}if(e.type==='connected')hostSize();
}});
document.addEventListener('pointerdown',hostSize,{passive:true});window.addEventListener('resize',hostSize);
window.addEventListener('pagehide',e=>{if(!e.persisted)sdk?.stop();});
hostSize();render();requestAnimationFrame(animate);
