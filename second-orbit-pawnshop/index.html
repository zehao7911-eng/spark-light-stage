    {contaminant:'Comet tint',clarity:74,color:'#e0ac77',recommended:'polish',

 s.turn++;s.phase='trade';s.intel=null;
 const first=s.day===1&&s.turn===1, second=s.day===1&&s.turn===2;

 const buyer=!appraisalCase&&s.stock.length>0&&(s.turn%2===0||s.stock.length>=5||s.cash<16);

   visitor.pairOrder=s.day>=3&&s.turn%4===0&&s.stock.length>=2;
   const coil=s.deskVersion===2&&second?s.stock.find(l=>l.id===s.firstCoil&&l.item===1):null;

   const fits=s.stock.filter(l=>GOODS[l.item][2]===visitor.wants);
   assignSale(s,visitor,coil||featured||fits[0]);
 }else{
   const item=first?1:appraisalCase?2:s.charter===1&&s.turn===1?9+(s.day%3):Math.floor(dice(s)*catalogSize(s.day));
   const grade=first?2:Math.floor(dice(s)*3),fake=appraisalCase?dice(s)<.5:!first&&s.day>=2&&dice(s)<.21,tag=!first&&s.day>=2&&dice(s)<.26;
   const l={id:++s.nonce,item,grade,fake,tag,cost:0};visitor.lot=l;
   const v=lotValue(l,demand(s,item));
   visitor.floor=Math.max(5,Math.round(v*(tag?.40:.51)+dice(s)*5-s.reps[PEOPLE[person][2]]*.4));
   visitor.ask=Math.max(visitor.floor+3,Math.round(GOODS[item][1]*demand(s,item)*(tag?.60:.77+dice(s)*.24)));
   if(first&&s.deskVersion===2){visitor.ask=22;visitor.floor=22;}
   if(appraisalCase){visitor.trainingCase=true;visitor.ask=34;visitor.floor=Math.min(visitor.floor,34);}
   visitor.offer=visitor.ask;visitor.opening=visitor.ask;
   if(s.day>=2&&s.stock.length<6&&(s.turn===1||dice(s)<.30)){
     const i=(item+1+Math.floor(dice(s)*(catalogSize(s.day)-1)))%catalogSize(s.day);
     visitor.sideLot={id:++s.nonce,item:i,grade:Math.floor(dice(s)*3),fake:false,tag:dice(s)<.15,cost:0};
     visitor.sideAsk=Math.max(3,Math.round(lotValue(visitor.sideLot,demand(s,i))*(visitor.sideLot.tag?.48:.65)));

function buyerLimit(s,v,l){
 const favored=GOODS[l.item][2]===v.wants,rep=s.reps[PEOPLE[v.person][2]];
 const retail=favored?(s.deskVersion===2?1.17:1.02):.75;
 return Math.max(4,Math.round(lotValue(l,demand(s,l.item))*retail*(1+Math.min(6,rep)*.014)*(s.charter===2&&favored?1.15:1)));
}
function assignSale(s,v,l,extra=null){
 if(v.lessonCoil&&l.id!==v.lessonCoil)return false;
 const different=v.lot?.id!==l.id;
 v.lot=l;v.extra=v.pairOrder&&extra&&l.id!==extra.id&&s.stock.some(q=>q.id===extra.id)?extra:null;
 v.max=v.extra?Math.round((buyerLimit(s,v,l)+buyerLimit(s,v,v.extra))*1.12):buyerLimit(s,v,l);
 v.ask=Math.max(2,Math.round(v.max*.82));
 if(v.lessonCoil){v.extra=null;v.max=38;v.ask=38;}
 v.opening=v.ask;v.offer=v.ask;if(different){v.scanned=false;s.intel=null;}v.lastBid=null;v.replyPrice=null;v.response='';return true;
}
const trayReady=v=>!!v&&v.staged!==false;
function stageLot(s,id,position='primary'){
 const v=s.patron;if(s.phase!=='trade'||!v)return false;
 if(!v.buyer){if(id!==v.lot.id||position!=='primary')return false;v.staged=true;return true;}
 const lot=s.stock.find(l=>l.id===id);
 if(!lot||v.lessonCoil&&id!==v.lessonCoil)return false;
 if(position==='extra'){
   if(!v.pairOrder||!trayReady(v)||id===v.lot.id)return false;
   assignSale(s,v,v.lot,lot);
 }else if(position==='primary'){
   if(!trayReady(v)||id!==v.lot.id)assignSale(s,v,lot,v.extra);
 }else return false;
 v.staged=true;return true;
}
function toggleSide(s){
 const v=s.patron;if(s.phase!=='trade'||!v||v.buyer||!v.sideLot||!trayReady(v))return false;
 const delta=v.includeSide?-v.sideAsk:v.sideAsk;v.includeSide=!v.includeSide;
 v.lastBid=null;v.replyPrice=null;v.response='';v.ask+=delta;v.offer=Math.max(1,v.offer+delta);v.opening+=delta;v.floor+=delta;return true;
}
function unstageLot(s,position='primary'){
 const v=s.patron;if(s.phase!=='trade'||!trayReady(v))return false;
 if(position==='extra'){
   if(v.buyer&&v.extra)return assignSale(s,v,v.lot,null);
   if(!v.buyer&&v.includeSide)return toggleSide(s);
   return false;
 }
 if(position!=='primary')return false;
 if(v.includeSide)toggleSide(s);
 if(v.extra)assignSale(s,v,v.lot);
 v.staged=false;return true;
}
function inspectLot(s){
 const v=s.patron;if(s.phase!=='trade'||!v||v.buyer||v.scanned||s.scans<1)return false;

}

function canShowProof(s){
 const v=s.patron,l=v?.lot;

}
function showProof(s){

 // A substantiated replica is negotiated on its resale value. A side lot keeps its own price.
 const value=lotValue(v.lot,demand(s,v.lot.item));
 const old=v.ask;

 v.ask=side+Math.max(v.floor-side,Math.min(old-side,Math.round(value*.69)));

}
function trade(s){

 const bound=v.buyer?v.max:v.floor;

   }

   noteReaction(v,insult?'insult':'uneasy',insult?Math.min(1,.6+miss*.45):Math.max(.32,miss),n,reply);
   v.ask=reply;v.offer=reply;v.negotiating=false;v.response='“'+[
     'Make it '+money(v.ask)+' and I can catch my lift.',money(v.ask)+'. My crew has to eat.',
     'Revised valuation: '+money(v.ask)+'.',money(v.ask)+'. I keep very good records.',
     'My star says '+money(v.ask)+'.','I can work with '+money(v.ask)+'.',
     'Fuel is not free. '+money(v.ask)+'.',money(v.ask)+'. A most civil compromise.'][v.person]+'”';return 'counter';
 }
 if(v.buyer){
   const batch=v.extra?[l,v.extra]:[l];if(!batch.every(a=>s.stock.some(b=>b.id===a.id)))return false;
   if(typeof CounterWindow==='object')CounterWindow.recordSale(s,batch.map(a=>a.id));

   for(const a of batch){s.served.push(a.item);if(!s.serials.includes(a.item))s.serials.push(a.item);}
   logTrade(s,'Sold '+batch.map(a=>GOODS[a.item][0]).join(' + '),n);
 }else{
   const side=v.includeSide?v.sideLot:null;if(side&&n<=v.sideAsk)return false;

   logTrade(s,'Bought '+batch.map(a=>GOODS[a.item][0]).join(' + '),-n);
 }

 if(!s.serials.includes(l.item))s.serials.push(l.item);
 s.deals++;s.reps[crew]=Math.min(9,s.reps[crew]+1);
 CounterContracts.record(s,{type:v.buyer?'sell':'buy',lot:l,amount:n,scanned:v.scanned||l.assayed===true,lotCount:v.extra||v.includeSide?2:1,crew});
 const margin=n-l.cost-(v.extra?.cost||0);
 const msg=v.buyer?(v.extra?'Two-lot shipment · ':'')+'Margin '+(margin>=0?'+':'')+money(margin)+' · '+CREWS[crew]+' standing +1':'Added to your shelf. Buyers can now bid on it.';
 noteReaction(v,'relief',v.patience<3?.92:.54,n,n);
 receipt(s,v.buyer?'SOLD':'PURCHASED',msg,v.buyer?n:-n,'happy');return v.buyer?'sell':'buy';
}

}

function closeShift(s){

Second Orbit's customer characters, station artwork, merchandise sprites, water plant, dialogue, music and cases were made for this browser game. It is an independent fan-made interpretation of the space-station shopkeeping premise. Probably Stolen is the separate commercial game by Questing Goose Studio and tinyBuild.

AT THE COUNTER
Raise the shutters and ring the bell. Place Pip's relay coil on the tray, check its stamped serial, and buy it. Brack comes for that same coil. The receipt shows what you paid and what you earned. The ? button opens the handbook and a separate practice till for anyone returning to a saved shop.

At the next independent deal, compare the maker's stamp with the handbook. The UV lamp shows the item's band and customs status. For a confirmed copy, show both marks to the seller. Haggle to name your price. Your offer is sent only when you press Offer.
