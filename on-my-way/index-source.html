<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#233849"><meta name="description" content="One thumb. A whole city. Hold to walk and let go to wait in an original little street-crossing adventure."><title>On My Way — One More Block</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body>
