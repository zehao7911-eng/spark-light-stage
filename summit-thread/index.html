const ghost=rec().ghost;if(data.ghost&&ghost?.length&&phase==='play'){let lo=0,hi=ghost.length-1;while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(ghost[mid].t<=elapsed)lo=mid;else hi=mid-1}const g=ghost[lo];if(g&&elapsed<=ghost.at(-1).t)Pixel.character(wc,{...p,...g,hair:[],ground:false,wall:0},clock,data.outfit,.22)}for(let t of trails)Pixel.character(wc,{...p,...t,ground:false,wall:0},clock,data.outfit,t.life/t.max*.25);if(!p.dead)Pixel.character(wc,p,clock,data.outfit);for(let f of particles){wc.globalAlpha=Math.min(1,f.life*3);Pixel.rect(wc,f.x,f.y,2,2,f.col)}wc.globalAlpha=1;

function frame(now){const dt=Math.min(.075,(now-last)/1000||0);last=now;acc+=dt;let n=0;while(acc>=1/60&&n<5){step(1/60);acc-=1/60;n++}render();requestAnimationFrame(frame)}
function keySource(source,key,on){if(on)sources.set(source,key);else sources.delete(source);keys={};for(let k of sources.values())keys[k]=true}function act(k){unlock();if(phase!=='play')return;if(k==='jump')jumpQueued=true;if(k==='dash')dashQueued=true}
const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',' ':'jump',z:'jump',x:'dash',c:'dash',Shift:'dash'};addEventListener('keydown',e=>{if(e.key==='Escape'){phase==='play'?pause():phase==='pause'?play():null;return}const k=map[e.key];if(!k)return;e.preventDefault();if(phase!=='play')return;const source='key:'+e.code,fresh=!sources.has(source);keySource(source,k,true);if(fresh)act(k)});addEventListener('keyup',e=>{if(map[e.key]){keySource('key:'+e.code,map[e.key],false);e.preventDefault()}});
