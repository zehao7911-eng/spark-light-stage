const PETS=[['Ant',1,2,1,'Faint: give a friend +2 Attack / +1 Health.'],['Fish',2,3,1,'Level up: give all friends +1 / +1.'],['Otter',1,3,1,'Buy: give another friend +1 Health.'],['Beaver',2,2,1,'Sell: give two friends +1 Health.'],['Cricket',1,2,1,'Faint: summon a small Cricket.'],['Swan',2,3,2,'New shop: earn +1 gold.'],['Hedgehog',3,2,2,'Faint: deal 2 damage to every pet.'],['Peacock',2,5,2,'Hurt and survive: gain +2 Attack.'],['Kangaroo',1,3,2,'Friend ahead attacks: gain +2 / +1.'],['Rabbit',3,2,3,'Any friend eats: give it +1 Health.'],['Dog',3,3,3,'Friend summoned: gain +1 / +1.'],['Turtle',1,5,3,'Faint: give the next friend a Melon shield.'],['Deer',1,1,4,'Faint: summon a 5 / 5 Bus with splash damage.'],['Penguin',1,4,4,'Before battle: give up to 3 level 2+ friends +1 / +1.'],['Lion',4,5,4,'Battle start: if no other tier 4 friend, gain +4 / +4.'],['Bee',1,1,0,'A tiny Honey companion.'],['Bus',5,5,0,'Attack: also deal 2 damage to the second enemy.']];

let album={seen:[0],wins:0,champions:0,best:0};try{album={...album,...JSON.parse(localStorage.getItem(KEY+'-album')||'{}')}}catch{}function remember(k){if(k<15&&!album.seen.includes(k))album.seen.push(k);try{localStorage.setItem(KEY+'-album',JSON.stringify(album))}catch{}}

const canvas=$('#scene'),g=canvas.getContext('2d'),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function random(){S.seed=(S.seed+0x6D2B79F5)>>>0;let t=S.seed;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}function pick(a){return a[Math.floor(random()*a.length)]}function tier(){return Math.min(4,1+Math.floor((S.round-1)/3))}function unit(k,a=PETS[k][1],h=PETS[k][2],l=1){return{id:S.nextId++,k,a,h,l,xp:1,equip:null}}function sound(kind='tap',n=0){if(muted)return;try{audio ||=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.type=kind==='hit'?'triangle':'sine';const hz=kind==='win'?500:kind==='merge'?740:kind==='hit'?160:kind==='coin'?650:kind==='lose'?180:360;o.frequency.setValueAtTime(hz+n*30,audio.currentTime);o.frequency.exponentialRampToValueAtTime(kind==='lose'?80:hz*1.4,audio.currentTime+.12);v.gain.setValueAtTime(.06,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+.21)}catch{}}
function toast(text){$('#toast').textContent=text;$('#toast').style.opacity=1;toastTimer=2}function modal(html){paused=true;drag=null;$('#modal').innerHTML=html;$('#overlay').hidden=false}function close(){paused=false;$('#overlay').hidden=true}function bind(s,fn){$(s).onclick=fn}function save(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+'-mute',muted?'1':'0')}catch{}}function buff(u,a,h){if(u){u.a=Math.min(60,u.a+a);u.h=Math.min(60,u.h+h)}}
function roll(first=false){if(!first){if(S.gold<1)return;S.gold--;sound('coin')}const pool=PETS.map((p,k)=>({k,t:p[3]})).filter(p=>p.t>0&&p.t<=tier());for(let i=0;i<5;i++){if(S.shop[i]?.frozen)continue;const food=i>=3,k=food?pick(FOODS.map((f,k)=>({k,t:f[1]})).filter(f=>f.t<=tier())).k:pick(pool).k;S.shop[i]={food,k,frozen:false}}selection=null;hud();save()}
function newRun(){S={version:1,seed:Date.now()>>>0,nextId:1,phase:'shop',round:1,wins:0,lives:4,gold:10,team:[null,null,null,null,null],shop:[],kills:0,best:0,streak:0};S.team[0]=unit(0);selection=null;frames=[];current=null;close();roll(true);hud();save()}
function card(u,i,shop=false){if(!u)return shop?`<button class="petcard empty" disabled aria-label="Sold shop slot">·</button>`:`<button class="petcard empty" data-team="${i}" aria-label="Empty team slot ${i+1}">+</button>`;const food=shop&&u.food,pet=food?null:shop?{k:u.k,a:PETS[u.k][1],h:PETS[u.k][2],l:1}:u,selected=selection?.type===(shop?'shop':'team')&&selection.i===i;return `<button class="petcard${selected?' selected':''}${u.frozen?' frozen':''}${food?' food':''}" data-${shop?'shop':'team'}="${i}" aria-label="${food?FOODS[u.k][0]:PETS[u.k][0]}">${shop?'<span class="price">● 3</span>':`<span class="level">${'★'.repeat(u.l)} ${u.l<3?u.xp+'/'+(u.l===1?3:6):''}</span>`}${u.equip?`<span class="equip">${u.equip==='honey'?'✿':u.equip==='garlic'?'◆':'◒'}</span>`:''}${food?PalArt.food(u.k):PalArt.pet(u.k)}<span class="name">${food?FOODS[u.k][0]:PETS[u.k][0]}</span>${food?'<span class="stats">FOOD</span>':`<span class="stats"><b class="attack">⚔ ${pet.a}</b><b class="health">♥ ${pet.h}</b></span>`}</button>`}
function hud(){document.body.classList.toggle('battling',S.phase==='battle');$('#round').textContent='ROUND '+S.round;$('#score').textContent='🏆 '+S.wins+' / 10 · ♥ '+S.lives;$('#gold').textContent='● '+S.gold;$('#tier').textContent='TIER '+tier();$('#team').innerHTML=S.team.map((u,i)=>card(u,i)).join('');$('#shop').innerHTML=S.shop.map((u,i)=>card(u,i,true)).join('');document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>selectShop(+b.dataset.shop));document.querySelectorAll('[data-team]').forEach(b=>{b.onclick=()=>selectTeam(+b.dataset.team);b.onpointerdown=e=>{if(S.phase==='shop'&&S.team[+b.dataset.team])drag={i:+b.dataset.team,x:e.clientX,y:e.clientY}};b.onpointerup=e=>{if(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>15){const source=drag.i,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-team]');drag=null;if(target){selection={type:'team',i:source};selectTeam(+target.dataset.team)}}else drag=null}});$('#roll').disabled=S.gold<1||S.phase!=='shop';$('#fight').disabled=!S.team.some(Boolean)||S.phase!=='shop';$('#sell').disabled=selection?.type!=='team'||!S.team[selection.i];$('#freeze').disabled=selection?.type!=='shop'||!S.shop[selection.i];$('#sell small').textContent='● '+(selection?.type==='team'?S.team[selection.i]?.l||1:1);$('#freeze').textContent=selection?.type==='shop'&&S.shop[selection.i]?.frozen?'☀ Thaw':'❄ Freeze';detail();bg=null}
function detail(){if(!selection){$('#detail').innerHTML='<b>Pick a pet from the shop.</b><span>Then tap a team slot to buy. Same pet? Merge it!</span>';return}const u=selection.type==='shop'?S.shop[selection.i]:S.team[selection.i];if(!u)return;const food=selection.type==='shop'&&u.food,info=food?FOODS[u.k]:PETS[u.k];$('#detail').innerHTML=`<b>${info[0]}${!food&&u.l?' · Level '+u.l:''} ${selection.type==='shop'?'· ● 3':''}</b><span>${food?info[2]:info[4]} ${selection.type==='shop'?'Tap a team slot.':'Tap another slot to swap or merge.'}</span>`}
function selectShop(i){if(S.phase!=='shop'||!S.shop[i])return;selection={type:'shop',i};hud();sound()}
function selectTeam(i){if(S.phase!=='shop')return;if(selection?.type==='shop'){purchase(i);return}if(selection?.type==='team'&&selection.i!==i){const from=selection.i,a=S.team[from],b=S.team[i];if(a&&b&&a.k===b.k&&b.l<3){merge(b,a);S.team[from]=null;toast(PETS[b.k][0]+' grew stronger!')}else [S.team[from],S.team[i]]=[b,a];selection={type:'team',i};sound('merge');hud();save();return}selection=S.team[i]?{type:'team',i}:null;hud();sound()}
function merge(to,from){const old=to.l;to.a=Math.min(60,Math.max(to.a,from.a)+1);to.h=Math.min(60,Math.max(to.h,from.h)+1);to.xp=Math.min(6,to.xp+from.xp);to.l=to.xp>=6?3:to.xp>=3?2:1;if(to.l>old){if(to.k===1)S.team.filter(u=>u&&u.id!==to.id).forEach(u=>buff(u,to.l,to.l));toast('LEVEL '+to.l+'! Ability upgraded.');sound('merge');confetti(W/2,H*.7,18)} }
function purchase(i){const offer=S.shop[selection.i];if(!offer)return;if(S.gold<3){toast('Need 3 gold.');return}const target=S.team[i];if(offer.food){if(!target){toast('Food needs a pet.');return}feed(target,offer.k)}else{if(target&&(target.k!==offer.k||target.l===3)){toast(target.l===3&&target.k===offer.k?'This pet is fully upgraded.':'Choose an empty slot or matching pet.');return}const u=unit(offer.k);remember(offer.k);if(target)merge(target,u);else S.team[i]=u;if(u.k===2){const others=S.team.filter(t=>t&&t.id!==(target?.id||u.id));if(others.length)buff(pick(others),0,1)}}S.gold-=3;S.shop[selection.i]=null;selection={type:'team',i};sound('coin');hud();save()}
function feed(u,k){if(k===0)buff(u,1,1);if(k===1)u.equip='honey';if(k===2)u.equip='garlic';if(k===3)buff(u,3,0);if(k===4)buff(u,2,2);if(k===5)u.equip='melon';S.team.filter(t=>t&&t.k===9).forEach(t=>buff(u,0,t.l));confetti(W/2,H*.65,7)}
function sell(){if(selection?.type!=='team')return;const u=S.team[selection.i];if(!u)return;S.gold+=u.l;S.team[selection.i]=null;if(u.k===3){const others=S.team.filter(Boolean).sort(()=>random()-.5).slice(0,2);others.forEach(t=>buff(t,0,u.l))}selection=null;sound('coin');hud();save()}
function generateEnemy(){const n=Math.min(5,2+Math.ceil(S.round/2)),pool=PETS.map((p,k)=>({k,t:p[3]})).filter(p=>p.t>0&&p.t<=tier()),b=Math.floor((S.round-1)*.55),team=[];for(let i=0;i<n;i++){const k=pick(pool).k,l=S.round>7&&random()<.35?2:1,u=unit(k,PETS[k][1]+b,PETS[k][2]+b,l);u.xp=l===2?3:1;if(S.round>5&&random()<.28)u.equip=pick(['honey','garlic']);team.push(u)}if(S.round%5===0){buff(team[0],2,3);team[0].equip='melon'}return team}
// Resolve an entire deterministic battle first; then replay its event snapshots.
function simulate(left,right){let A=clone(left),B=clone(right),out=[],killed=0,triggerGuard=0;const snap=(type,label='',source=null,target=null,n=0)=>{if(out.length<360)out.push({type,label,source,target,n,A:clone(A),B:clone(B)})},all=()=>[...A,...B];function battleBuff(u,a,h,label){buff(u,a,h);snap('buff',label,u.id,u.id,a)}function hit(u,n,source=null){if(!u||u.h<=0)return;let actual=n;if(u.equip==='garlic')actual=Math.max(1,actual-2);if(u.equip==='melon'){actual=Math.max(0,actual-20);u.equip=null;snap('shield','MELON BLOCK!',u.id,u.id)}u.h-=actual;snap('hit',actual?'−'+actual:'BLOCK!',source,u.id,actual);if(u.h>0&&u.k===7&&!u.token)battleBuff(u,2*u.l,0,'PEACOCK +'+2*u.l)}function summon(side,i,u){if(side.length>=5)return;side.splice(Math.min(i,side.length),0,u);snap('summon',PETS[u.k][0]+' joins!',u.id,u.id);side.filter(t=>t.k===10&&!t.token&&t.h>0).forEach(t=>battleBuff(t,t.l,t.l,'DOG +'+t.l+' / +'+t.l))}function clean(){let loops=0;while(all().some(u=>u.h<=0)&&loops++<30){for(const side of[A,B]){const i=side.findIndex(u=>u.h<=0);if(i<0)continue;const dead=side.splice(i,1)[0];if(side===B)killed++;snap('faint',PETS[dead.k][0]+' fainted',dead.id,dead.id);if(!dead.token){if(dead.k===0){const friends=side.filter(u=>u.h>0);if(friends.length)battleBuff(pick(friends),2*dead.l,dead.l,'ANT GIFT')}if(dead.k===4){const baby=unit(4,dead.l,dead.l);baby.token=true;summon(side,i,baby)}if(dead.k===6){snap('blast','HEDGEHOG BURST',dead.id);for(const target of [...all()])hit(target,2*dead.l,dead.id)}if(dead.k===11){side.filter(u=>u.h>0).slice(i,i+dead.l).forEach(u=>{u.equip='melon';snap('shield','TURTLE SHIELD',dead.id,u.id)})}if(dead.k===12){const bus=unit(16,5*dead.l,5*dead.l);bus.token=true;summon(side,i,bus)}}if(dead.equip==='honey'){const bee=unit(15);bee.token=true;summon(side,i,bee)}if(++triggerGuard>120)return}}}
snap('ready','READY?');for(const side of[A,B])for(const u of side){if(u.k===14&&side.filter(t=>PETS[t.k][3]===4&&t.id!==u.id).length===0)battleBuff(u,4*u.l,4*u.l,'LION ROAR!')}snap('start','TUSSLE!');for(let turn=0;A.length&&B.length&&turn<65;turn++){const a=A[0],b=B[0];for(const side of[A,B])if(side[1]?.k===8&&!side[1].token)battleBuff(side[1],2*side[1].l,side[1].l,'KANGAROO GROWS');snap('attack','',a.id,b.id);const aa=a.a,ba=b.a;hit(b,aa,a.id);hit(a,ba,b.id);if(a.k===16)hit(B[1],2,a.id);if(b.k===16)hit(A[1],2,b.id);clean();if(triggerGuard>120)break}const result=A.length&&!B.length?'win':B.length&&!A.length?'lose':'draw';snap('end',result==='win'?'VICTORY!':result==='lose'?'TRY AGAIN!':'A DRAW!');return{frames:out,result,killed}}
function fight(){if(S.phase!=='shop'||!S.team.some(Boolean))return;selection=null;for(const penguin of S.team.filter(u=>u&&u.k===13)){S.team.filter(u=>u&&u.l>=2&&u.id!==penguin.id).slice(0,2+penguin.l).forEach(u=>buff(u,penguin.l,penguin.l))}const enemy=generateEnemy(),battle=simulate(S.team.filter(Boolean),enemy);S.pending={result:battle.result,killed:battle.killed,enemy:clone(enemy)};S.phase='battle';frames=battle.frames;frameIndex=0;frameTimer=0;current=frames[0];previous=null;replaySpeed=1;$('#speed').textContent='1×';$('#battleTools').hidden=false;$('#banner').textContent='';hud();save();sound('merge')}
function settle(){if(S.phase!=='battle'||!S.pending)return;const result=S.pending.result;S.kills+=S.pending.killed;S.lastResult=result;if(result==='win'){S.wins++;album.wins++;album.best=Math.max(album.best,S.wins);if(S.wins===10)album.champions++;remember(0);S.streak++;S.best=Math.max(S.best,S.streak);sound('win');confetti(W/2,H*.4,36)}else if(result==='lose'){S.lives--;S.streak=0;sound('lose')}S.pending=null;S.phase=S.lives<=0?'lost':S.wins>=10&&!S.endless?'won':'result';$('#battleTools').hidden=true;hud();save();resultScreen()}
function resultScreen(){const won=S.phase==='won',lost=S.phase==='lost';modal(`<div class="eyebrow">${won?'TEN TROPHIES':lost?'ONE MORE TEAM?':'ROUND '+S.round}</div><h1>${won?'A tiny champion!':lost?'Every team has a story':S.lastResult==='win'?'What a combo!':S.lastResult==='draw'?'Perfectly matched!':'Try a new lineup'}</h1><div class="bigPets">${S.team.filter(Boolean).slice(0,3).map(u=>PalArt.pet(u.k)).join('')}</div><div class="champStats"><b>🏆 ${S.wins}</b><b>♥ ${S.lives}</b><b>Streak ${S.best}</b></div><p>${lost?'Merge matching pets, feed your front fighter, and protect a Kangaroo behind it.':won?'Your squad earned ten trophies. Keep the build alive in endless rounds.':S.lastResult==='win'?'Your team keeps all upgrades. A fresh shop is waiting.':S.lastResult==='draw'?'No heart lost. Rearrange your team and try again.':'One heart lost. Your pets keep their upgrades.'}</p><div class="buttons">${won?'<button class="gold" id="endless">Endless →</button>':lost?'':'<button class="gold" id="next">Next shop →</button>'}<button ${lost||won?'class="gold"':''} id="restart">New team</button></div>`);if($('#next'))bind('#next',nextRound);if($('#endless'))bind('#endless',()=>{S.endless=true;nextRound()});bind('#restart',()=>{if(lost||won)newRun();else confirmNew()})}
function nextRound(){const interest=Math.min(3,Math.floor(S.gold/3));S.round++;S.gold=10+interest+S.team.filter(u=>u&&u.k===5).reduce((n,u)=>n+u.l,0);S.phase='shop';current=null;previous=null;frames=[];selection=null;close();roll(true);$('#banner').textContent='A new round. A new combo.';save()}
function confirmNew(){modal('<h1>Start a new team?</h1><p>This replaces your current run.</p><div class="buttons"><button class="gold" id="confirm">Start over</button><button id="back">Back</button></div>');bind('#confirm',newRun);bind('#back',()=>S.phase==='shop'?menu():resultScreen())}
function help(){modal(`<div class="eyebrow">PETAL PALS</div><h1>Small pets. Big combos.</h1><div class="bigPets">${PalArt.pet(9)+PalArt.pet(8)+PalArt.pet(11)}</div><div class="help"><div><b>1. Shop</b><p>Pick a pet, then tap an empty slot. Pets and food cost 3 gold.</p></div><div><b>2. Merge</b><p>Buy a matching pet onto your pet. 3 copies reach level 2; 6 reach level 3.</p></div><div><b>3. Arrange</b><p>Left slot fights first. Select a pet, then another slot to swap. Kangaroo likes a strong friend ahead.</p></div><div><b>4. Tussle</b><p>Pets attack automatically. Faint and Hurt skills create combos. Win 10 trophies before losing 4 hearts.</p></div></div><p>Freeze keeps an offer for the next roll or shop. Garlic reduces every hit; Melon blocks one hit.<br>Food and shop buffs are permanent. Battle buffs are temporary.</p><div class="buttons"><button class="gold" id="gotIt">Let's play</button></div>`);bind('#gotIt',()=>{close();hud()})}
function menu(){if(S.phase==='battle'){paused=true;modal('<h1>Take a breather</h1><div class="buttons"><button class="gold" id="continue">Continue</button><button id="mute">Sound '+(muted?'off':'on')+'</button></div>');bind('#continue',close);bind('#mute',toggleSound);return}modal(`<h1>Petal Pals</h1><p>Round ${S.round} · ${S.kills} rival pets defeated<br>${album.seen.length} / 15 pets collected · ${album.wins} lifetime wins · ${album.champions} champion teams</p><div class="buttons"><button class="gold" id="continue">Continue</button><button id="book">Pet guide</button><button id="help">How to play</button><button id="mute">Sound ${muted?'off':'on'}</button><button class="red" id="new">New team</button></div><p>Inspired by Super Auto Pets. Redrawn art, local AI rivals and a compact roster.</p>`);bind('#continue',()=>{close();hud()});bind('#help',help);bind('#mute',toggleSound);bind('#new',confirmNew);bind('#book',()=>{modal(`<h1>Meet your pals</h1><p>${album.seen.length} / 15 collected · Collection survives new runs.</p><div class="codex">${PETS.slice(0,15).map((p,k)=>`<div>${PalArt.pet(k)}<br><b>${p[0]} ${album.seen.includes(k)?'✦':''}</b><p>Tier ${p[3]} · ⚔ ${p[1]} / ♥ ${p[2]}<br>${p[4]}<br>Ability scales with level.</p></div>`).join('')}</div><div class="buttons"><button id="back">Back</button></div>`);bind('#back',menu)})}
function toggleSound(){muted=!muted;save();$('#mute').textContent='Sound '+(muted?'off':'on');sound()}
function confetti(x,y,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:-30-Math.random()*130,life:.6+Math.random()*.5,c:['#efc878','#d49b8b','#b6c798','#83b9ac'][i%4]});if(particles.length>100)particles.splice(0,particles.length-100)}
function step(dt){time+=dt;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').style.opacity=0}for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt}particles=particles.filter(p=>p.life>0);if(paused||document.hidden||S.phase!=='battle')return;frameTimer+=dt*replaySpeed;const duration=current?.type==='ready'?.8:current?.type==='end'?.8:current?.type==='attack'?.42:current?.type==='hit'?.2:.26;if(frameTimer>=duration){frameTimer=0;previous=current;frameIndex++;if(frameIndex>=frames.length){settle();return}current=frames[frameIndex];$('#banner').textContent=current.label;if(current.type==='attack')sound('hit');if(['buff','summon','shield'].includes(current.type))sound('merge');if(current.type==='faint')confetti(W/2,H/2,6)}}
function background(){bg=document.createElement('canvas');bg.width=W;bg.height=H;const c=bg.getContext('2d'),sky=c.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#b5d9ca');sky.addColorStop(.45,'#dae6c4');sky.addColorStop(1,'#99bc8c');c.fillStyle=sky;c.fillRect(0,0,W,H);c.fillStyle='#f6edc5';c.beginPath();c.arc(W*.77,H*.18,Math.min(30,H*.12),0,7);c.fill();for(let i=0;i<6;i++){const x=(i*.22-.1)*W,y=H*.18+(i%3)*8;c.fillStyle='#eff1dccc';c.beginPath();c.ellipse(x,y,35,10,0,0,7);c.ellipse(x+24,y-4,25,12,0,0,7);c.fill()}c.fillStyle='#91b49a';c.beginPath();c.moveTo(0,H*.51);c.bezierCurveTo(W*.15,H*.22,W*.35,H*.4,W*.5,H*.53);c.bezierCurveTo(W*.7,H*.25,W*.95,H*.3,W,H*.42);c.lineTo(W,H);c.lineTo(0,H);c.fill();c.fillStyle='#aac592';c.beginPath();c.moveTo(0,H*.66);c.bezierCurveTo(W*.2,H*.42,W*.3,H*.66,W*.5,H*.58);c.bezierCurveTo(W*.8,H*.4,W*.9,H*.55,W,H*.65);c.lineTo(W,H);c.lineTo(0,H);c.fill();c.fillStyle='#cdd9a3';c.beginPath();c.ellipse(W*.5,H*.87,W*.53,H*.22,0,0,7);c.fill();c.fillStyle='#d6c79e';c.beginPath();c.ellipse(W*.52,H*.88,W*.34,H*.13,0,0,7);c.fill();c.strokeStyle='#8d9f78';c.lineWidth=3;for(const x of[W*.06,W*.94]){c.fillStyle='#b8aa83';c.beginPath();c.roundRect(x-6,H*.4,12,H*.3,4);c.fill();c.stroke();c.fillStyle='#648d72';for(let j=0;j<3;j++){c.beginPath();c.arc(x+(j-1)*12,H*.38+(j%2)*11,22,0,7);c.fill();c.stroke()}c.strokeStyle='#8b9b76'}for(let i=0;i<28;i++){const x=(i*83+22)%W,y=H*.66+((i*37)%Math.max(1,H*.31));c.strokeStyle='#79986e66';c.lineWidth=2;c.beginPath();c.moveTo(x,y);c.lineTo(x-3,y-6);c.moveTo(x,y);c.lineTo(x+4,y-5);c.stroke();if(i%4===0){c.fillStyle=['#e6be8f','#f1dfbe','#d6a5a3'][i%3];for(let j=0;j<5;j++){c.beginPath();c.arc(x+Math.cos(j*1.26)*3,y-8+Math.sin(j*1.26)*3,2.5,0,7);c.fill()}c.fillStyle='#b99f57';c.beginPath();c.arc(x,y-8,2,0,7);c.fill()}}c.strokeStyle='#9da777';c.lineWidth=3;c.beginPath();c.moveTo(0,H*.7);c.lineTo(W*.17,H*.7);c.moveTo(W*.83,H*.7);c.lineTo(W,H*.7);c.stroke();for(const x of[W*.02,W*.12,W*.87,W*.98]){c.fillStyle='#bba77a';c.fillRect(x,H*.63,5,H*.13)}}
function drawPet(u,x,y,size,flip=false,attack=0,fade=1){g.save();g.globalAlpha=fade;g.fillStyle='#4f735030';g.beginPath();g.ellipse(x,y+size*.34,size*.38,size*.1,0,0,7);g.fill();g.translate(x,y+Math.sin(time*2+u.id)*2);g.rotate(Math.sin(attack*Math.PI)*.15*(flip?-1:1));g.scale(flip?-1:1,1);const im=PalArt.image(u.k);if(im.complete)g.drawImage(im,-size/2,-size*.55,size,size);g.restore();g.globalAlpha=fade;g.font='bold '+Math.max(10,size*.17)+'px Trebuchet MS';g.textAlign='center';g.lineWidth=3;g.strokeStyle='#edf0d4';const a='⚔ '+u.a,h='♥ '+Math.max(0,u.h);g.strokeText(a,x-size*.22,y+size*.57);g.strokeText(h,x+size*.22,y+size*.57);g.fillStyle='#946b29';g.fillText(a,x-size*.22,y+size*.57);g.fillStyle='#b96d66';g.fillText(h,x+size*.22,y+size*.57);if(u.equip){g.fillStyle='#4f715e';g.font='bold '+Math.max(10,size*.14)+'px Trebuchet MS';g.fillText(u.equip==='honey'?'✿':u.equip==='garlic'?'◆':'◒',x+size*.34,y-size*.43)}g.globalAlpha=1}
function draw(){if(!bg)background();g.drawImage(bg,0,0,W,H);if(S.phase==='battle'&&current){const mobile=W<600,size=Math.min(mobile?70:90,W*.15,H*.18),A=current.A,B=current.B;function pose(side,i){return mobile?{x:W*.12+i*W*.18,y:side===0?H*.72:H*.28}:{x:side===0?W*.43-i*W*.085:W*.57+i*W*.085,y:H*.6}}const q=clamp(frameTimer/(current.type==='attack'?.42:.26),0,1);for(const [side,team]of[[0,A],[1,B]])team.forEach((u,i)=>{const pos=pose(side,side===1&&mobile?4-i:i);let motion=0;if(current.type==='attack'&&(u.id===current.source||u.id===current.target)){motion=Math.sin(q*Math.PI);if(mobile){pos.x+=(W*.5-pos.x)*motion*.75;pos.y+=(H*.5-pos.y)*motion*.8}else pos.x+=(side===0?1:-1)*motion*size*.55}if(current.target===u.id&&['buff','shield','summon'].includes(current.type)){g.fillStyle=current.type==='shield'?'#a1cfc966':'#ead69066';g.beginPath();g.arc(pos.x,pos.y,size*.65,0,7);g.fill()}const us=size*(i===0?1.24:1);drawPet(u,pos.x,pos.y,us,side===1,motion);if(current.target===u.id&&['buff','summon','shield'].includes(current.type)){g.strokeStyle=current.type==='shield'?'#6ea9a6':'#d5b05b';g.lineWidth=3;g.globalAlpha=1-q;g.beginPath();g.arc(pos.x,pos.y,us*(.48+q*.22),0,7);g.stroke();g.globalAlpha=1}if(current.type==='attack'&&motion>.5&&(u.id===current.source||u.id===current.target)){g.strokeStyle='#f7e8b9';g.lineWidth=3;for(let j=0;j<5;j++){const angle=j*1.256+time,rad=us*.6;g.beginPath();g.moveTo(pos.x+Math.cos(angle)*rad,pos.y+Math.sin(angle)*rad);g.lineTo(pos.x+Math.cos(angle)*(rad+12),pos.y+Math.sin(angle)*(rad+12));g.stroke()}}if(current.target===u.id&&current.type==='hit'){g.fillStyle='#c77969';g.font='900 23px Trebuchet MS';g.strokeStyle='#fff0d7';g.lineWidth=4;g.strokeText(current.label,pos.x,pos.y-size*.65-q*12);g.fillText(current.label,pos.x,pos.y-size*.65-q*12)}});g.fillStyle='#617c5c';g.font='bold 11px Trebuchet MS';g.textAlign='center';g.fillText('YOUR PALS',W*.2,H*.9);g.fillText('RIVAL PALS',W*.8,H*.12)}else{const team=S.team.filter(Boolean),size=Math.min(82,W/6,H*.43);if(team.length)team.forEach((u,i)=>drawPet(u,W/2+(i-(team.length-1)/2)*(size*.94),H*.62,size,false,0));g.textAlign='center';g.font='bold 11px Trebuchet MS';g.fillStyle='#577b63';g.fillText('PETAL MEADOW',W/2,H*.23);g.strokeStyle='#749675';g.lineWidth=1;g.beginPath();g.moveTo(W*.3,H*.28);g.lineTo(W*.7,H*.28);g.stroke()}for(const p of particles){g.fillStyle=p.c;g.globalAlpha=Math.min(1,p.life*2);g.save();g.translate(p.x,p.y);g.rotate(p.life*4);g.fillRect(-3,-3,6,6);g.restore()}g.globalAlpha=1}
function resize(){const r=canvas.getBoundingClientRect();W=Math.round(r.width);H=Math.round(r.height);const dpr=Math.min(devicePixelRatio,1.5);canvas.width=W*dpr;canvas.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);bg=null;draw()}
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.05,(now-last)/1000||0);last=now;if(document.hidden)return;acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60}draw()}
bind('#roll',()=>{if(S.phase==='shop')roll()});bind('#sell',sell);bind('#fight',fight);bind('#freeze',()=>{if(selection?.type!=='shop'||S.phase!=='shop')return;const u=S.shop[selection.i];u.frozen=!u.frozen;sound();hud();save()});bind('#menu',menu);bind('#speed',()=>{replaySpeed=replaySpeed===1?2:1;$('#speed').textContent=replaySpeed+'×'});bind('#finish',settle);window.addEventListener('keydown',e=>{if(e.code==='Escape')menu();if(e.code==='Space'&&S.phase==='shop'&&!paused){e.preventDefault();fight()}});document.addEventListener('visibilitychange',()=>{drag=null;last=performance.now();if(document.hidden)save()});new ResizeObserver(resize).observe($('#field'));
try{S=JSON.parse(localStorage.getItem(KEY));muted=localStorage.getItem(KEY+'-mute')==='1';if(S?.version!==1)S=null}catch{}if(!S){newRun();help()}else if(S.phase==='battle'){settle()}else{hud();if(['result','lost','won'].includes(S.phase))resultScreen()}resize();requestAnimationFrame(tick);window.PetalPals={state:()=>clone(S),step:t=>{for(let i=0;i<Math.ceil(t*60);i++)step(1/60);draw()},battle:()=>({index:frameIndex,total:frames.length,current:clone(current)}),simulate:(a,b)=>simulate(a,b)};
})();
</script></body></html>
