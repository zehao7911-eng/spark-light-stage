<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f0e6"><meta name="description" content="Carry a little paper light through watercolour skies. A one-finger lantern journey."><meta property="og:title" content="WHISPERWAKE"><meta property="og:image" content="cover.jpg"><title>WHISPERWAKE</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><div class="brand"><img src="icon.svg" alt="" width="30" height="38"><div><small>A WATERCOLOUR JOURNEY</small><h1>WHISPERWAKE</h1></div></div><nav><button id="book" aria-label="Open journeys">☷</button><button id="pause" aria-label="Pause">Ⅱ</button></nav></header><section id="stage"><canvas id="world" tabindex="0" aria-label="Drag or tap to guide the paper lantern left and right. Follow warm lights, avoid dark ink, and enter the lighthouse arch."></canvas><div id="hud"><div><small id="place"></small><h2 id="name"></h2></div><div class="flight"><b id="score">0</b><div id="flames" aria-label="Three flames remaining"></div></div></div><div id="altitude"><span></span></div><div id="flow" aria-label="Five lights activate an ink shield"></div><div id="toast" role="status" hidden></div><section id="panel" hidden></section></section><footer><section id="playbar"><button id="left" aria-label="Steer left">←</button><div class="middle"><small id="cue">FOLLOW THE LIGHT</small><div id="fragments" aria-label="Three optional colour fragments"><span>◇</span><span>❧</span><span>✧</span></div></div><button id="right" aria-label="Steer right">→</button></section><section id="result" hidden><div><strong id="stars"></strong><span id="record"></span></div><small id="resultNote"></small><div class="actions"><button id="again">FLY AGAIN</button><button id="next" class="primary">NEXT JOURNEY →</button></div></section></footer><noscript>JavaScript is required to play.</noscript></main><script type="module" src="app.js?v=4"></script></body></html>
