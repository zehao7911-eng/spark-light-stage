<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9dcc0"><title>Pastel Rally</title><link rel="stylesheet" href="style.css"></head><body>
<main id="game"><canvas id="view" aria-label="Rally race through a miniature forest"></canvas><canvas id="map" width="160" height="160" aria-label="Course map"></canvas>
<header><div class="brand">PASTEL <b>RALLY</b><span id="course">BIRCH VALLEY</span></div><div class="top"><button id="sound" aria-label="Toggle sound">♪</button><button id="pause" aria-label="Pause">Ⅱ</button></div></header>
<div class="stats"><span id="lap">LAP 1 / 2</span><strong id="clock">00.0</strong><span id="best">BEST —</span></div><div id="flash" aria-live="polite"></div><div id="speed">0 <small>KM/H</small></div>
<footer><div class="tools"><button id="rescue">↺ <span>RESCUE</span></button><button id="ghost">◇ <span>GHOST</span></button><button id="book">☷ <span>COURSES</span></button></div><div class="controls"><div id="steer" role="slider" tabindex="0" aria-label="Steering" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"><span>‹</span><div class="groove"><i id="knob"></i></div><span>›</span><small>DRAG TO STEER</small></div><button id="brake">BRAKE<br><small>HOLD TO DRIFT</small></button></div></footer>
<section id="overlay"><div class="panel" id="panel"></div></section></main>
<script src="three.min.js"></script><script src="engine.js"></script><script src="art.js"></script><script src="app.js"></script></body></html>
