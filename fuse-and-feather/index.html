function help(){show(`<h2>A chicken can’t jump.</h2><p>Hold <b>STACK</b> to build a bomb tower.<br>Walk off before the fuses run out.<br><b>KICK</b> sends a bomb where you’re facing.<br>Blast wooden crates and round wall switches.<br>Find the little chick, then reach the green door.</p><div class="steps"><span><b>★</b>Escape</span><span><b>◆</b>All 3 gems</span><span><b>♡</b>No tumbles</span></div><p class="tiny">A / D or ← / → · Space stacks · X kicks · Esc pauses<br>Getting hit returns you to safety. Collected items stay yours.</p>${btn('back','Got it','primary')}`);on('back',pause);}
function book(){paused=true;clearInput();silence();save();let total=s.profile.best.reduce((a,b)=>a+b,0);show(`<div class="eyebrow">THE EGGWORKS</div><h2>Little escapes</h2><p>${total} / 24 badges</p><div class="rooms">${E.names.map((n,i)=>`<button data-room="${i}" ${i>s.profile.unlocked?'disabled':''}>${i>s.profile.unlocked?'⌑':String(i+1).padStart(2,'0')}<small>${'★'.repeat(s.profile.best[i])||'· · ·'}</small><small>${s.profile.times?.[i]?Math.round(s.profile.times[i])+'s':''}</small></button>`).join('')}</div><div class="row">${[0,1,2].map((c,i)=>`<button data-coat="${i}" ${total<[0,8,18][i]?'disabled':''} aria-label="${['Cream','Biscuit','Mint'][i]} feathers">${['Cream','Biscuit','Mint'][i]} ${s.profile.coat===i?'✓':''}<small>${[0,8,18][i]? [0,8,18][i]+' ★':''}</small></button>`).join('')}</div>${btn('back','Back','primary')}`);document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{let n=+b.dataset.room;if(n===s.n&&s.mode==='play')resume();else load(n);});document.querySelectorAll('[data-coat]').forEach(b=>b.onclick=()=>{s.profile.coat=+b.dataset.coat;save();book();});on('back',()=>s.mode==='win'?win():resume());}
function win(){paused=true;clearInput();silence();save();winShown=true;let final=s.n===7;show(`<div class="eyebrow">${final?'THE GREAT ESCAPE':'CHICK DELIVERED'}</div><div class="hero">🐣</div><h2>${final?'Home, at last.':'Safe & sound!'}</h2><div class="medals">${'★'.repeat(s.medal)}${'☆'.repeat(3-s.medal)}</div><p>${s.level.gems.filter(g=>g.taken).length} / 3 gems · ${s.deaths} tumbles · ${Math.round(s.time)}s<br>Best: ${Math.round(s.profile.times[s.n])}s</p>${btn('next',final?'Play again':'Next room','primary')}<div class="row">${btn('rooms','Room book')}${btn('cardSave','Save postcard')}</div><p class="tiny">${final?'Replay rooms for all 24 badges and new feather colors.':'One badge each: escape · all gems · no tumbles'}</p>`);on('next',()=>load(final?0:s.n+1));on('rooms',book);on('cardSave',postcard);}
function postcard(){let cv=document.createElement('canvas');cv.width=900;cv.height=650;let cx=cv.getContext('2d');cx.fillStyle='#18283c';cx.fillRect(0,0,900,650);cx.imageSmoothingEnabled=false;cx.drawImage($('#world'),0,60,900,490);cx.fillStyle='#ffdea1';cx.font='bold 30px monospace';cx.fillText('FUSE & FEATHER',32,43);cx.font='20px monospace';cx.fillText(E.names[s.n].toUpperCase()+'   '+s.medal+'/3 BADGES',32,596);cx.fillStyle='#9acbb7';cx.font='15px monospace';cx.fillText('A LITTLE CHICKEN. A BIG ESCAPE.',32,627);cv.toBlob(b=>{if(!b)return;let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fuse-feather-room-'+(s.n+1)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});}
function load(n){let profile=s.profile;s=E.fresh(n,profile);fx=[];winShown=false;ui='';A.reset();resume();toast(['Hold STACK, then walk onto the ledge','Wood breaks. Stone stays.','Kick a bomb at the round wall switch','One fuse can start a chain','The belt moves bombs too','Stack high. Leave before the bang!','Find the chick above the crates','One last escape'][n]);}
for(let [id,k]of[['left','left'],['right','right'],['lay','lay'],['kick','kick']]){let b=$('#'+id);b.addEventListener('pointerdown',e=>{if(paused||!started)return;e.preventDefault();b.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{k,b});input[k]=true;b.classList.add('held');});let up=e=>{let a=pointers.get(e.pointerId);if(!a)return;pointers.delete(e.pointerId);input[a.k]=[...pointers.values()].some(v=>v.k===a.k);a.b.classList.remove('held');save();};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);}
const keys={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',' ':'lay',x:'kick',X:'kick'};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!paused)pause();else if(started&&s.mode==='play')resume();return;}if(keys[e.key]){e.preventDefault();if(!paused&&started)input[keys[e.key]]=true;}});document.addEventListener('keyup',e=>{if(keys[e.key])input[keys[e.key]]=false;});on('pause',pause);on('book',()=>{started=true;book();});window.addEventListener('blur',()=>{if(started&&!paused)pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!paused)pause();});window.addEventListener('pagehide',save);
function event(ev){let type=ev.type,x=ev.x,y=ev.y;sound(type);if(type==='gem')toast('GEM +100');if(type==='chick')toast('Little friend found!');if(type==='switch')toast(s.level.gates.every(g=>g.open)?'Doorway unlocked':'One more switch!');if(type==='hurt')toast('Shake it off. Try again!');let col=type==='gem'?'#a5f4cb':type==='chick'?'#ffe8a5':type==='crate'?'#bc9367':'#ffd08a';let count=type==='boom'?30:type==='crate'?8:type==='enemy'?13:5;for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,v=type==='boom'?40+Math.random()*220:30+Math.random()*90,life=.3+Math.random()*.5;fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life,max:life,size:type==='boom'?3+Math.random()*5:2+Math.random()*4,color:i%3===0?'#fff1bf':col,kind:'chip'});}if(type==='boom'){fx.push({x,y,vx:0,vy:0,life:.35,max:.35,size:5,color:'#ffe6aa',kind:'ring'});for(let i=0;i<5;i++)fx.push({x:x+Math.random()*30-15,y:y+Math.random()*25-12,vx:Math.random()*40-20,vy:-30,life:.7,max:.7,size:7+Math.random()*8,color:'#879495',kind:'smoke'});}if(type==='gem')fx.push({x,y,vx:0,vy:-45,life:.8,max:.8,text:'+100',color:'#b4f2cb',kind:'text'});fx=fx.slice(-180);}
function hud(){let value=[s.n,s.level.gems.filter(g=>g.taken).length,s.level.chick.saved,s.bestCombo,s.combo,s.deaths].join(',');if(value===ui)return;ui=value;$('#room').textContent=String(s.n+1).padStart(2,'0')+' / '+E.names[s.n].toUpperCase();$('#loot').textContent=s.level.gems.map(g=>g.taken?'◆':'◇').join(' ');$('#loot').setAttribute('aria-label',s.level.gems.filter(g=>g.taken).length+' of 3 gems');$('#chickStatus').innerHTML=s.level.chick.saved?'♧ <span>BRING YOUR FRIEND HOME →</span>':'♧ <span>FIND THE CHICK</span>';$('#hint').textContent=s.n===0?'Hold STACK to climb':s.level.switches.some(o=>!o.on)?'Kick a bomb at the round switch':'STACK up · KICK through';$('#combo').textContent=s.combo>=3?s.combo+' CHAIN!':'';}
function frame(ts){let dt=Math.min(.05,(ts-last)/1000||0);last=ts;acc+=dt;if(!started||paused){acc=0;}else{while(acc>=1/60){E.step(s,1/60,input);for(let e of s.events)event(e);s.events=[];for(let f of fx){f.life-=1/60;f.x+=f.vx/60;f.y+=f.vy/60;if(f.kind==='chip')f.vy+=320/60;}fx=fx.filter(f=>f.life>0);acc-=1/60;toastTime=Math.max(0,toastTime-1/60);if(!toastTime)$('#toast').textContent='';if(s.mode==='win')break;}savedTime+=dt;if(savedTime>1){savedTime=0;save();}if(s.mode==='win'&&!winShown){hud();A.draw(s,fx,dt);win();}}hud();A.draw(s,fx,paused?0:dt);requestAnimationFrame(frame);}
window.FuseDebug={snapshot:()=>JSON.parse(JSON.stringify(s)),view:()=>A.view(),stats:()=>({paused,started,input:{...input},pointers:pointers.size,voices:voices.size,fx:fx.length}),};intro();requestAnimationFrame(frame);
})();
</script></body></html>
