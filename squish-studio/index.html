<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5ede2"><title>Squish Studio — soft little things</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="mark">s</span><div><h1>Squish Studio</h1><small>SOFT LITTLE THINGS</small></div></div><div class="top"><button id="sound" aria-label="Sound">♫</button><button id="pause" aria-label="Pause">Ⅱ</button><button id="menu" aria-label="Studio settings">☰</button></div></header>
<main id="stage"><div class="tag"><span id="sceneName">BONBONS</span><i>01 / PLAY ROOM</i></div><div id="canvasHost"></div><div id="hint">Pull a little. Let it go.</div><div id="toast" role="status"></div></main>
<footer><div class="tools"><button aria-label="Pull" data-tool="Pull" class="active"><span>↗</span>Pull</button><button aria-label="Squish" data-tool="Squish"><span>◉</span>Squish</button><button aria-label="Split" data-tool="Split"><span>✂</span>Split</button><button aria-label="Drop" data-tool="Drop"><span>＋</span>Drop</button><button id="bounce" aria-label="Bounce"><span>⌁</span>Bounce</button></div><div class="lower"><div id="colors"></div><button id="undo" aria-label="Undo">↶</button><button id="trays">Trays <span>⌄</span></button></div></footer>
<section id="panel" hidden><div class="sheet"><div class="sheetHead"><h2 id="panelTitle">Studio</h2><button id="close" aria-label="Close">×</button></div><div id="settings"><button id="gravity">Gravity · On</button><label>Softness<input id="softness" type="range" min="0" max="100" value="50"></label><button id="book">Bookmark tray</button><button id="restore">Restore bookmark</button><button id="export">Save postcard</button><p>Two fingers, one jelly: stretch it.<br>Split makes two smaller friends.</p></div><div id="presets" hidden></div></div></section>
<script src="p5.min.js"></script><script src="engine.js"></script><script src="app.js"></script></body></html>
