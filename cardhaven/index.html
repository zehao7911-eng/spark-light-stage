let felt;function makeFelt(){felt=document.createElement('canvas');felt.width=250;felt.height=250;let c=felt.getContext('2d');c.fillStyle='#bbc39d';c.fillRect(0,0,250,250);for(let i=0;i<1400;i++){c.fillStyle=i%2?'#85996f12':'#e6e8c416';c.fillRect(Math.random()*250,Math.random()*250,Math.random()*2+1,1);}c.strokeStyle='#9cac8340';c.lineWidth=.5;for(let x=0;x<250;x+=25){c.beginPath();c.moveTo(x,0);c.lineTo(x,250);c.stroke();c.beginPath();c.moveTo(0,x);c.lineTo(250,x);c.stroke();}}
function resize(){let r=canvas.getBoundingClientRect();w=r.width;h=r.height;scale=w<600?w/420:Math.min(1,w/940);W=w/scale;H=h/scale;let d=Math.min(devicePixelRatio||1,1.7);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);for(let g of S.groups)g.x=clamp(g.x,0,W-CW);resolveLayout();pan=clamp(pan,0,maxPan());}new ResizeObserver(resize).observe(canvas);
function card(g,dragged=false){const n=g.cards.length,base=g.cards[0].id;let offsets=Math.min(5,n-1);let y=g.y;ctx.save();ctx.translate(g.x,y);if(g.pop)ctx.translate(0,-Math.sin((g.pop/.5)*Math.PI)*4);if(dragged)ctx.rotate(Math.sin(elapsed*3)*.025);ctx.shadowColor='#38452c35';ctx.shadowBlur=dragged?14:5;ctx.shadowOffsetY=dragged?9:3;for(let i=0;i<=offsets;i++){const id=g.cards[Math.min(i,n-1)].id;ctx.fillStyle='#f0ead0';ctx.strokeStyle=hover===g?'#bd9853':selected===g.uid?'#708a54':'#697156';ctx.lineWidth=hover===g?3:1.6;ctx.beginPath();ctx.roundRect(0,i*STEP,CW,CH,5);ctx.fill();ctx.stroke();}ctx.shadowBlur=0;ctx.shadowOffsetY=0;const top=g.cards[n-1].id,ty=offsets*STEP;ctx.fillStyle=COLORS[TYPES[top][1]];ctx.beginPath();ctx.roundRect(5,ty+24,CW-10,CH-47,3);ctx.fill();if(ART[top].complete&&ART[top].naturalWidth){ctx.save();ctx.translate(CW/2,ty+54);if(g.job)ctx.rotate(Math.sin(elapsed*7)*.055);ctx.drawImage(ART[top],-CW/2+8,-30,CW-16,CH-45);ctx.restore();}ctx.textAlign='center';ctx.fillStyle='#444e39';ctx.font='bold 10.5px Georgia';ctx.fillText(TYPES[top][0],CW/2,ty+15,CW-8);ctx.font='9px Georgia';const j=jobFor(g);if(j&&!j.hint){ctx.fillStyle='#d4d5b1';ctx.fillRect(6,ty+CH-18,CW-12,6);ctx.fillStyle=j.kind==='work'&&j.node==='goblin'?'#b57b69':'#8ca16c';ctx.fillRect(6,ty+CH-18,(CW-12)*clamp((g.progress||0)/j.duration,0,1),6);ctx.fillStyle='#65704d';ctx.font='7px Arial';ctx.fillText(j.label,CW/2,ty+CH-4,CW-8);}else{ctx.fillStyle='#9b997b';ctx.font='9px Georgia';ctx.fillText(isWorker(top)?'♥ · '+(top==='guard'?'Ranger':'Villager'):TYPES[top][2]+' ●',CW/2,ty+CH-8);}if(n>1){ctx.fillStyle='#697956';ctx.beginPath();ctx.arc(CW-5,ty+3,9,0,6.29);ctx.fill();ctx.fillStyle='#fff3cf';ctx.font='bold 9px Arial';ctx.fillText(n,CW-5,ty+6);for(let i=0;i<Math.min(offsets,n-1);i++){let id=g.cards[i].id;ctx.fillStyle='#72795b';ctx.textAlign='left';ctx.font='9px Georgia';ctx.fillText(TYPES[id][0],5,i*STEP+12,CW-12);}}ctx.restore();}
function draw(){ctx.clearRect(0,0,w,h);ctx.save();ctx.scale(scale,scale);ctx.fillStyle=ctx.createPattern(felt,'repeat');ctx.fillRect(0,0,W,H);let gradient=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,Math.max(W,H)*.7);gradient.addColorStop(0,'#f3edc300');gradient.addColorStop(1,'#75845c25');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);ctx.translate(0,-pan);for(let g of S.groups)if(g.y-pan<H+50&&g.y+CH+Math.min(5,g.cards.length)*STEP>pan-50)card(g);if(drag)card(drag.g,true);for(let p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r);}for(let n of notes){ctx.globalAlpha=Math.min(1,n.life);ctx.textAlign='center';ctx.fillStyle='#a27831';ctx.font='bold 20px Georgia';ctx.fillText(n.text,n.x,n.y);}ctx.globalAlpha=1;ctx.restore();let max=maxPan();if(max>0){ctx.fillStyle='#f0ebc7aa';ctx.fillRect(w-6,10,3,h-20);ctx.fillStyle='#75875c';ctx.fillRect(w-6,10+(h-55)*(pan/max),3,35);}if(!loaded&&S.quest===0&&!drag){let a=S.groups.find(g=>g.cards.some(c=>c.id==='worker')),b=S.groups.find(g=>g.cards.some(c=>c.id==='bush'));if(a&&b){ctx.save();ctx.scale(scale,scale);ctx.translate(0,-pan);let p=(Math.sin(elapsed*2)+1)/2;ctx.strokeStyle='#f8f3d6';ctx.lineWidth=3;ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(a.x+CW/2,a.y+CH+9);ctx.quadraticCurveTo((a.x+b.x)/2+CW/2,Math.max(a.y,b.y)+CH+55,b.x+CW/2,b.y+CH+9);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#f7e6a4';ctx.beginPath();ctx.arc(a.x+(b.x-a.x)*p+CW/2,a.y+CH+18+Math.sin(p*Math.PI)*30,5,0,6.29);ctx.fill();ctx.restore();}}}
function frame(ts){let dt=Math.min(.05,(ts-last)/1000);last=ts;if(!paused){acc+=dt*speed;while(acc>=1/60){tick(1/60);acc-=1/60;}}draw();requestAnimationFrame(frame);}makeFelt();resize();if(!loaded){spawn('worker',1,null,false);spawn('bush',1,null,false);spawn('tree',1,null,false);spawn('rock',1,null,false);spawn('berry',2,null,false);arrange();}updateUI();requestAnimationFrame(frame);
window.__cards={state:()=>JSON.parse(JSON.stringify({S,paused,W,H,pan,speed,drag:drag?.g})),advance:s=>{for(let i=0;i<s*60;i++)if(!paused)tick(1/60);draw();},coords:uid=>{let g=get(uid);if(!g)return null;let r=canvas.getBoundingClientRect();return {x:r.left+(g.x+CW/2)*scale,y:r.top+(g.y+Math.min(5,g.cards.length-1)*STEP+CH/2-pan)*scale};}};
</script></body></html>
