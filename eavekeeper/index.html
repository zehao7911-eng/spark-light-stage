function schedule(n){let l=levels[n],seed=9031+n*2017,r=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};let out=[];l.emit.forEach((e,j)=>{for(let k=0;k<e.n;k++)out.push({at:.45+e.delay+k*.23,id:j*100+k,x:e.x+(r()-.5)*e.spread*2,y:e.y+(r()-.5)*8,vx:e.vx+(r()-.5)*12,vy:e.vy+(r()-.5)*8,r:l.heavy&&k%4===0?7:5,heavy:!!l.heavy&&k%4===0})});return out.sort((a,b)=>a.at-b.at||a.id-b.id)}

function segments(s){let a=[];for(let st of s.strokes)for(let i=1;i<st.length;i++)a.push([st[i-1],st[i]]);return a}

class Audio{constructor(){this.ctx=null;this.voices=new Set();this.last=0;this.clock=0;this.note=0}unlock(){if(!p.sound)return;try{if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state!=='running')this.ctx.resume().catch(()=>{})}catch(_){}}tone(f,d=.12,v=.025,type='sine',offset=0,end=0){let c=this.ctx;if(!p.sound||!c||c.state!=='running'||this.voices.size>=16)return;try{let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+offset;o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03);this.voices.add(o);o.onended=()=>{o.disconnect();g.disconnect();this.voices.delete(o)}}catch(_){}}stroke(){this.tone(480,.08,.018,'triangle',0,760)}rain(){this.tone(480,.2,.018,'sine',0,200)}event(e){let c=this.ctx;if(!c)return;if(e.t==='bounce'&&c.currentTime-this.last>.065){this.last=c.currentTime;this.tone([523,587,659,784,880][Math.floor(e.x/84)%5],.1,.012,'sine',0,1100)}if(e.t==='absorb'&&c.currentTime-this.last>.08){this.last=c.currentTime;this.tone(240,.13,.018,'triangle',0,480)}if(e.t==='hit'){this.tone(160,.2,.035,'triangle',0,80)}if(e.t==='bell'){this.tone(1046,.8,.025);this.tone(1568,.5,.012)}if(e.t==='won'){[523,659,784,1046].forEach((f,i)=>this.tone(f,.65,.023,'sine',i*.1))}}step(dt){this.clock+=dt;if(this.clock>1.7){this.clock=0;this.tone([261,329,392,440,329,293,349,392][this.note++%8],1.2,.004)}}stop(){for(let o of this.voices)try{o.stop()}catch(_){}this.voices.clear()}}
const audio=new Audio();
function save(){try{localStorage.setItem(KEY,JSON.stringify({profile:p,draft:{level:s.level,pen:s.pen,phase:s.phase,strokes:s.strokes,elapsed:s.elapsed,hinted:s.hinted}}))}catch(_){}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');toastLife=3}
function cancel(){draft=null;pointer=null;tapStart=null}
function pens(){let count=p.cleared>=8?3:p.cleared>=4?2:1,names=['Ribbon roof','Spring roof','Sponge roof'],icons=['⌒','≋','▰'];$('pens').innerHTML=names.map((n,i)=>'<button data-pen="'+i+'" aria-label="'+n+(i>=count?'; unlocks after '+(i===1?4:8)+' roofs':'')+'" aria-pressed="'+(s.pen===i)+'" '+(i>=count?'disabled':'')+'>'+icons[i]+'</button>').join('');for(let b of $('pens').children)b.addEventListener('click',()=>{if(paused||s.phase!=='draw')return;audio.unlock();s.pen=p.pen=+b.dataset.pen;pens();save();updateHUD();toast(names[s.pen]+'. '+['Smooth, gentle deflection.','Big, lively ricochets.','Soaks up small raindrops. Hail still bounces.'][s.pen])})}
function updateHUD(){let l=M.levels[s.level],used=M.length(s.strokes)+(draft&&draft.length>1?M.length([draft]):0),sig=[s.level,s.phase,s.pen,s.health,s.spawned,s.deflects,s.absorbed,Math.round(used),s.strokes.length,p.best.join(''),p.sound,paused].join('|');if(hud===sig)return;hud=sig;$('number').textContent=String(s.level+1).padStart(2,'0')+' / 12';$('levelName').textContent=l.name;$('hearts').textContent='♥ '.repeat(s.health)+'♡ '.repeat(3-s.health);$('hearts').setAttribute('aria-label',s.health+' dry hearts');$('district').textContent=districts[Math.floor(s.level/4)];$('instruction').textContent=s.phase==='draw'?'DRAW A ROOF. KEEP THEM DRY.':s.phase==='rain'?'LOOK AT THAT LITTLE ROOF GO.':s.phase==='won'?'ANOTHER CORNER OF THE CITY, LIT.':'A NEW ROOF. ANOTHER TRY.';$('caption').style.color=s.level>=8?'#f2dfbe':'#254c58';$('inklabel').textContent=s.phase==='rain'?'RAIN TEST':'ROOF INK';let plan=M.schedule(s.level),fraction=s.phase==='rain'?s.spawned/plan.length:Math.max(0,1-used/l.ink);$('inkfill').style.width=(fraction*100)+'%';$('inkfill').style.background=s.pen===1?'#a78be4':s.pen===2?'#e5b963':'#df647e';$('parmark').style.left=((1-l.par/l.ink)*100)+'%';$('parmark').hidden=s.phase!=='draw';$('inkcount').textContent=s.phase==='rain'?s.spawned+' / '+plan.length+' DROPS · '+s.deflects+' DEFLECTIONS':Math.round(Math.max(0,l.ink-used))+' LEFT · GOLD MARK = BONUS';$('tally').textContent='✦ '+p.best.reduce((a,b)=>a+b,0);$('undo').disabled=paused||s.phase!=='draw'||!s.history.length;$('clear').disabled=paused||s.phase!=='draw'||!s.strokes.length;$('hint').disabled=paused||s.phase!=='draw';$('go').disabled=paused||s.phase!=='draw'||!s.strokes.length;$('go').innerHTML=s.phase==='rain'?'RAINING…<span>'+s.health+' DRY HEARTS</span>':'LET IT RAIN<span>'+(s.strokes.length?'TEST YOUR SHELTER':'DRAW FIRST')+'</span>';for(let b of $('pens').children)b.disabled=paused||s.phase!=='draw'||+b.dataset.pen>=(p.cleared>=8?3:p.cleared>=4?2:1);$('sound').setAttribute('aria-label',p.sound?'Mute sound':'Enable sound');$('sound').textContent=p.sound?'♪':'♩';}
function bind(id,fn){$(id)?.addEventListener('click',()=>{audio.unlock();fn()})}
function panel(html){$('overlay').innerHTML='<div class="panel">'+html+'</div>';$('overlay').hidden=false;paused=true;cancel();audio.stop();updateHUD()}
function close(){view='play';paused=false;last=0;acc=0;$('overlay').hidden=true;$('overlay').innerHTML='';pens();updateHUD()}
function begin(n){if(!Number.isInteger(n)||n<0||n>Math.min(11,p.cleared))return;s=M.make(n,p.pen);art.fx=[];art.reacts=[];art.hitFlash=0;awarded=false;pendingReward=null;guide=n===0;close();save();toast(n===0?'Drag across the dotted roof. Then let it rain.':'Draw above the little travellers. The rain is waiting.')}
function retry(){let old=s;s=M.make(s.level,s.pen);s.strokes=old.strokes.map(a=>a.map(q=>({...q})));s.hinted=old.hinted;s.history=[];awarded=false;pendingReward=null;close();save();toast('Same roof, fresh rain. Edit it any way you like.')}
function go(){if(paused)return;cancel();if(M.start(s)){guide=false;audio.rain();awarded=false;save();updateHUD()}}
function pause(){if(view!=='play')return;view='pause';save();panel('<span class="eyebrow">THE WEATHER CAN WAIT</span><h2>Take a little pause.</h2><button class="primary full" id="resume">BACK TO THE ROOF</button><button class="full" id="gentle">'+(p.gentle?'✓':'○')+' Gentle motion</button><button class="full" id="how">HOW TO PLAY</button><button class="full" id="mapPause">CITY MAP</button>');bind('resume',close);bind('gentle',()=>{p.gentle=!p.gentle;save();$('gentle').textContent=(p.gentle?'✓':'○')+' Gentle motion';resize()});bind('how',help);bind('mapPause',map)}
function help(){view='help';panel('<span class="eyebrow">A TINY SKY ARCHITECT</span><h2>Draw. Rain. Smile.</h2><p>Drag to draw a roof, or tap its two ends.<br>Keep your lines away from the travellers.<br>Press <b>LET IT RAIN</b> and watch it bounce.</p><p>✦ Shelter the street<br>✦ Keep all three hearts<br>✦ Finish above the gold ink mark, without a roof idea</p><p>Undo and retry are always free.<br>The little bells are optional ricochet treats.</p><button id="helpBack" class="primary full">BACK TO THE ROOF</button>');bind('helpBack',close)}
function reward(){view='reward';let n=M.stars(s),r=pendingReward;panel('<span class="eyebrow">ROOF '+String(s.level+1).padStart(2,'0')+' · WEATHER PASSED</span><h2>'+(['A little shelter.','Safe and sound.','Perfect little roof.'][n-1])+'</h2><div class="stars" aria-label="'+n+' stars">'+'✦'.repeat(n)+'<span style="opacity:.18">'+'✦'.repeat(3-n)+'</span></div><div class="stats"><span>'+s.deflects+' DEFLECTIONS</span><span>'+s.health+' DRY HEARTS</span><span>'+Math.round(M.length(s.strokes))+' INK</span></div>'+(r?.newPen!==null&&r?.newPen!==undefined?'<div class="note">'+(r.newPen===1?'≋ SPRING ROOF UNLOCKED<br>Bigger, brighter ricochets.':'▰ SPONGE ROOF UNLOCKED<br>Soaks up little raindrops.')+'</div>':'')+'<div class="seal">⌂</div><p>'+(['A window lights up on the city map.','A new neighbour is waiting out the rain.','The little city is brighter because of you.'][s.level%3])+'</p><button id="next" class="primary full">'+(s.level===11?'SEE THE LITTLE CITY':'NEXT ROOF →')+'</button><div class="row"><button id="edit">EDIT THIS ROOF</button><button id="openmap">CITY MAP</button></div>');bind('next',()=>s.level===11?map():begin(s.level+1));bind('edit',retry);bind('openmap',map)}
function failed(){view='retry';panel('<span class="eyebrow">A LITTLE LEAK</span><h2>One more roof?</h2><p>Nothing lost. Your ink is back.<br>Sideways rain may need a little wall.</p><button id="edit" class="primary full">EDIT THIS ROOF</button><button id="retryclear" class="full">START A FRESH ROOF</button><button id="openmap" class="full">CITY MAP</button>');bind('edit',retry);bind('retryclear',()=>begin(s.level));bind('openmap',map)}
function map(){view='map';save();let total=p.best.reduce((a,b)=>a+b,0);panel('<span class="eyebrow">TWELVE LITTLE CORNERS</span><h2>The city you shelter.</h2><p>'+p.cleared+' / 12 roofs lit · '+total+' / 36 stars</p><div id="citygrid"></div><div id="skins"></div><button id="mapBack" class="primary full">BACK TO THE ROOF</button>');for(let i=0;i<12;i++){let b=document.createElement('button');b.className='mapcard';b.disabled=i>p.cleared;b.setAttribute('aria-label',(p.best[i]?'Replay ':'Open ')+M.levels[i].name+(i>p.cleared?'; locked':''));b.setAttribute('aria-current',i===s.level?'true':'false');b.innerHTML='<span class="num">'+(p.best[i]?'⌂':String(i+1).padStart(2,'0'))+'</span><span class="tiny">'+M.levels[i].name+'</span><span class="marks">'+'✦'.repeat(p.best[i])+('·'.repeat(3-p.best[i]))+'</span>';b.addEventListener('click',()=>{audio.unlock();begin(i)});$('citygrid').append(b)}let count=total>=18?3:total>=6?2:1;for(let i=0;i<3;i++){let b=document.createElement('button');b.innerHTML=['◆','◆','◆'][i];b.style.color=['#ef839a','#89ccb8','#e7b65b'][i];b.disabled=i>=count;b.setAttribute('aria-label',['Rose raincoats','Mint raincoats','Honey raincoats'][i]+(i>=count?'; unlocks at '+(i===1?6:18)+' stars':''));b.setAttribute('aria-pressed',p.skin===i?'true':'false');b.addEventListener('click',()=>{p.skin=i;save();map()});$('skins').append(b)}bind('mapBack',()=>{if(s.phase==='won'||s.phase==='retry')retry();else close()})}
function commit(points){if(M.add(s,points)){audio.stroke();save();toast('A little roof, made by you.')}else toast(s.strokes.length>=4?'Four strokes. Undo a line to make room.':'Not quite: stay in the sky, with a little space around the travellers.');updateHUD()}
let can=$('scene');
can.addEventListener('pointerdown',e=>{if(paused||s.phase!=='draw'||pointer!==null)return;let r=can.getBoundingClientRect(),q=art.point(e.clientX-r.x,e.clientY-r.y);if(q.x<18||q.x>402||q.y<130||q.y>430){toast('Draw in the sky above the travellers.');return}audio.unlock();pointer=e.pointerId;draft=[q];can.setPointerCapture(e.pointerId)});
can.addEventListener('pointermove',e=>{if(pointer!==e.pointerId||!draft)return;let r=can.getBoundingClientRect(),q=art.point(e.clientX-r.x,e.clientY-r.y);q.x=Math.max(18,Math.min(402,q.x));q.y=Math.max(130,Math.min(430,q.y));let prev=draft[draft.length-1];if(Math.hypot(q.x-prev.x,q.y-prev.y)>3&&draft.length<240){if(M.length(s.strokes)+M.length([draft])+Math.hypot(q.x-prev.x,q.y-prev.y)<=M.levels[s.level].ink)draft.push(q);else toast('Ink used up. Undo a stroke to try another shape.')}updateHUD()});
can.addEventListener('pointerup',e=>{if(pointer!==e.pointerId||!draft)return;let q=draft[0],drawn=draft;pointer=null;draft=null;if(drawn.length>1){tapStart=null;commit(drawn)}else if(tapStart){let st=[tapStart,q];tapStart=null;commit(st)}else{tapStart=q;toast('Tap the other end, or drag a new line.')}updateHUD()});can.addEventListener('pointercancel',()=>{cancel();updateHUD()});can.addEventListener('lostpointercapture',()=>{if(pointer!==null){cancel();updateHUD()}});
can.addEventListener('keydown',e=>{if(paused||s.phase!=='draw')return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();kcursor.x=Math.max(18,Math.min(402,kcursor.x+(e.key==='ArrowRight'?10:e.key==='ArrowLeft'?-10:0)));kcursor.y=Math.max(130,Math.min(430,kcursor.y+(e.key==='ArrowDown'?10:e.key==='ArrowUp'?-10:0)));if(draft)draft.push({...kcursor});updateHUD()}if(e.key==='Enter'){e.preventDefault();if(draft){let a=draft;draft=null;commit(a)}else draft=[{...kcursor}]}if(e.key==='Escape'){cancel();updateHUD()}});
bind('go',go);bind('undo',()=>{if(!paused&&M.undo(s)){cancel();save();updateHUD();toast('One stroke back.')}});bind('clear',()=>{if(!paused&&M.clear(s)){cancel();save();updateHUD();toast('A fresh little sky.')}});bind('hint',()=>{if(paused||s.phase!=='draw')return;guide=!guide;if(guide)s.hinted=true;save();toast(guide?'A roof idea. Trace it, or make your own.':'Your sky, your own idea.')});bind('book',map);bind('pause',()=>view==='pause'?close():pause());bind('sound',()=>{p.sound=!p.sound;if(p.sound)audio.unlock();else audio.stop();save();hud='';updateHUD()});
document.addEventListener('keydown',e=>{if(e.target?.tagName==='BUTTON'&&e.key===' ')return;if(e.code==='KeyR'&&view==='play'){e.preventDefault();go()}if(e.code==='KeyZ'&&view==='play'&&!paused){e.preventDefault();$('undo').click()}if(e.code==='KeyH'&&view==='play'&&!paused){e.preventDefault();$('hint').click()}if(e.code==='KeyP'||e.key==='Escape'&&e.target!==can){e.preventDefault();view==='pause'?close():pause()}});
function interrupt(){cancel();if(view==='play')pause();else audio.stop();save()}
window.addEventListener('blur',interrupt);document.addEventListener('visibilitychange',()=>{if(document.hidden)interrupt()});window.addEventListener('pagehide',save);
function resize(){let r=can.getBoundingClientRect();art.resize(r.width,r.height,Math.min(devicePixelRatio||1,p.gentle?1:1.6));art.draw(s,p,draft||tapStart&&[tapStart],guide)}
window.addEventListener('resize',()=>{cancel();if(view==='play')pause();resize()});
function frame(now){requestAnimationFrame(frame);if(!last){last=now;return}let dt=Math.min(.1,(now-last)/1000);last=now;if(paused)return;acc+=dt;let advanced=0;while(acc>=1/120&&advanced++<18){if(s.phase==='rain'){M.step(s,1/120);art.addEvents(s.events,p.gentle);for(let ev of s.events)audio.event(ev);if(s.phase==='won'&&!awarded){pendingReward=M.award(p,s);awarded=true;revealAt=now+650;save()}if(s.phase==='retry'){save();failed();break}}acc-=1/120;}if(s.phase==='won'&&awarded&&now>=revealAt){reward();return}art.update(p.gentle?dt*.5:dt);if(now-lastDraw>33){art.draw(s,p,draft||tapStart&&[tapStart],guide);lastDraw=now}audio.step(dt);if(toastLife>0){toastLife-=dt;if(toastLife<=0)$('toast').classList.remove('on')}updateHUD();if(s.phase==='rain'&&Math.floor(s.elapsed*2)!==s._savedTick){s._savedTick=Math.floor(s.elapsed*2);save()}}
guide=s.level===0;pens();updateHUD();resize();if(raw.draft&&s.phase==='rain')pause();else toast(p.cleared?'Your saved little sky is ready.':'Drag across the dotted roof. Then let it rain.');requestAnimationFrame(frame);
})();
</script></body></html>
