function download(){let a=document.createElement('a');a.href=art.capture();a.download='Daydream-Club-'+(s.level+1)+'.png';a.click()}
function dispatch(b){audio.init();const id=b.id;if(id==='go'){play();return}if(id==='sound'){p.mute=!p.mute;audio.setMute(p.mute);ui();save();return}if(id==='pause'){pause();return}if(id==='help'||id==='helpModal'){help();return}if(id==='helpback'){if(returnMode==='intro')intro();else if(returnMode==='book')book();else if(returnMode==='result')result(0);else play();return}if(id==='book'||id==='bookModal'){book();return}if(id==='gentle'){confirm(s.level,true);return}if(id==='restart'||id==='again'){confirm(s.level,s.easy);return}if(id==='yes'){take(+b.dataset.level,!!+b.dataset.easy);return}if(id==='next'){s.level<5?take(s.level+1,s.easy):book();return}if(id==='download'){download();return}if(id==='minus'||id==='plus'){p.offset=Math.max(-120,Math.min(120,p.offset+(id==='plus'?20:-20)));$('offset').textContent=p.offset+' ms';save();return}if(id.startsWith('dream')){confirm(+id.slice(5),false);return}if(id.startsWith('coat')){if(E.buy(p,+id.slice(4))){book();save();dirty=true}else $('panel').querySelector('h2').textContent='A few more pearls…';return}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();hit()});$('tap').addEventListener('pointerdown',e=>{e.preventDefault();hit()});document.addEventListener('pointerup',e=>{let b=e.target.closest('button');if(!b||b.disabled||b.id==='tap')return;e.preventDefault();lastButton=performance.now();dispatch(b)});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.id==='tap'){if(e.detail===0)hit();return}if(e.isTrusted&&performance.now()-lastButton<650){e.preventDefault();return}dispatch(b)});
document.addEventListener('keydown',e=>{if(e.repeat)return;let k=e.key.toLowerCase();if(k===' '){e.preventDefault();mode==='play'?hit():$('go')?.click();return}if(e.target.tagName==='BUTTON')return;if(k==='enter'){e.preventDefault();mode==='play'?hit():$('go')?.click()}if(k==='p'||k==='escape'){e.preventDefault();mode==='play'?pause():play()}if(k==='r')confirm(s.level,s.easy);if(k==='b')book()});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('pagehide',save);window.addEventListener('resize',fit);
function frame(t){if(mode==='play'){sync();audio.pump(s);ui();if(s.done)finish();else if(t-saveAt>1800)save()}if(dirty&&t-renderAt>=1000/45){art.draw(s,p);dirty=false;renderAt=t}requestAnimationFrame(frame)}
Object.defineProperty(window,'__dream',{value:Object.freeze({get state(){return E.clone(s)},get profile(){return E.clone(p)},get mode(){return mode},get clock(){return mode==='play'?Math.max(0,audio.clock()):s.time},get audio(){return audio.info}})});fit();ui();intro();requestAnimationFrame(frame);
})();
