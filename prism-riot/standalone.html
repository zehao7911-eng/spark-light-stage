function newSet(id,remix=0){sound.stop();releaseUI();g=new PR.Session(id,remix,p.wide);close();art.fx=[];judgeLeft=0;$('#judge').textContent='';$('#liveStatus').textContent='';shownCount='';$('#count').textContent='';$('#judge').style.opacity=0;update();save();}
async function begin(){if(g.phase!=='ready'&&g.phase!=='paused')return;close();await sound.wake();if(!g.begin())return;sound.start();anchor=g.t;perfAnchor=performance.now()/1000;save();update();}
function results(){sound.stop();releaseUI();let before=p.best.reduce((a,b)=>a+b,0);PR.award(p,g);let after=p.best.reduce((a,b)=>a+b,0),newRig=[4,9,14].find(v=>before<v&&after>=v),next=g.id+1;save();let heading=g.stars===3?'PURE ELECTRIC':g.stars===2?'IN THE GROOVE':g.stars===1?'ROOM ALIVE':'ONE MORE TAKE';show(top('SET COMPLETE',PR.TRACKS[g.id].name.toUpperCase())+'<p class="resultTitle">'+heading+'</p><div class="bigscore">'+g.score.toLocaleString('en')+'</div><div class="stars">'+'★'.repeat(g.stars)+'☆'.repeat(3-g.stars)+'</div><div class="stats"><div><strong>'+Math.round(g.accuracy*100)+'%</strong><span>ACCURACY</span></div><div><strong>'+g.maxCombo+'</strong><span>BEST COMBO</span></div><div><strong>'+g.perfect+'</strong><span>PERFECT</span></div></div>'+(newRig?'<div class="badge">✦ NEW LIGHT RIG UNLOCKED</div>':'')+(g.stars&&next<6&&!g.remix?'<button class="primary" data-next="'+next+'">▶ NEXT · '+PR.TRACKS[next].name.toUpperCase()+'</button>':'<button class="primary" data-act="retry">↺ '+(g.stars?'PLAY AGAIN':'TRY AGAIN')+'</button>')+(g.stars&&g.id===5&&!g.remix?'<div class="badge">ALL SIX SETS. YOUR NAME IN LIGHTS.<br>Remix Lab is waiting in the collection.</div>':'')+(g.stars===0?'<p class="mini">Aim for 35% to open the next set. Only tap when a shape reaches its line.</p>':'')+'<button class="secondary" data-act="retry">↺ REPLAY SET</button><button class="secondary" data-act="book">▦ TRACK COLLECTION</button>','result');$('#liveStatus').textContent='Set complete. '+g.stars+' stars. '+Math.round(g.accuracy*100)+' percent accuracy.';}
function releaseUI(){pointerLanes.clear();keys.clear();document.querySelectorAll('.pad').forEach(b=>b.classList.remove('active'));}
function padDown(lane){if(!veil.hidden)return;sound.wake();document.querySelector('[data-lane="'+lane+'"]').classList.add('active');if(g.phase==='ready'){sound.hit(lane);art.trigger(lane,.7);return;}if(g.phase!=='playing')return;syncClock();let hit=g.press(lane,p.offset);if(!hit){sound.hit(lane,.4);art.pulses[lane]=.5;}events();update();}
function padUp(lane){document.querySelector('[data-lane="'+lane+'"]').classList.remove('active');if(g.phase==='playing'){syncClock();g.release(lane);events();update();}}
function syncClock(){if(g.phase!=='playing')return;let now=sound.ctx&&sound.ctx.state==='running'?sound.ctx.currentTime-sound.origin:anchor+performance.now()/1000-perfAnchor;g.advance(now);}
function events(){for(let e of g.drain()){if(['hit','hold'].includes(e.type)){sound.hit(e.lane,e.q);art.trigger(e.lane,e.q,e.combo);let text=e.type==='hold'?'HOLD':e.q===1?'PERFECT':e.q===.78?'GROOVE':'CLOSE';if(e.q!==1&&e.type==='hit')text+=' · '+(e.delta<0?'EARLY':'LATE');if(e.combo&&e.combo%8===0)text='×'+e.combo+' · '+text;$('#judge').textContent=text;$('#judge').style.color=PR_PALETTES[p.skin][e.lane];judgeLeft=.55;if(navigator.vibrate&&e.q===1&&!p.reduced)navigator.vibrate(9);}else if(e.type==='miss'||e.type==='break'){judgeLeft=.3;$('#judge').textContent=e.type==='break'?'KEEP HOLDING':'NEXT BEAT';$('#judge').style.color='#8392b1';}else if(e.type==='finish')results();}}
document.querySelectorAll('.pad').forEach((b,lane)=>{b.addEventListener('pointerdown',e=>{e.preventDefault();if(pointerLanes.has(e.pointerId))return;pointerLanes.set(e.pointerId,lane);b.setPointerCapture(e.pointerId);padDown(lane);});const up=e=>{let l=pointerLanes.get(e.pointerId);if(l===undefined)return;pointerLanes.delete(e.pointerId);if(![...pointerLanes.values()].includes(l))padUp(l);};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);});
const keyMap={a:0,s:1,d:2,ArrowLeft:0,ArrowDown:1,ArrowRight:2};window.addEventListener('keydown',e=>{if(e.target.matches('input'))return;let k=e.key.length===1?e.key.toLowerCase():e.key;if(k in keyMap){e.preventDefault();if(e.repeat||keys.has(k)||!veil.hidden)return;keys.add(k);padDown(keyMap[k]);}else if(k==='Escape'||k==='p'){e.preventDefault();if(!veil.hidden){if(screen==='settings'&&g.phase==='paused')begin();else if(screen==='result')book();else close();}else pause();}else if(k===' '&&g.phase==='ready'&&veil.hidden){e.preventDefault();begin();}if(!veil.hidden&&k==='Tab'){let els=[...sheet.querySelectorAll('button:not(:disabled),input')],first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});window.addEventListener('keyup',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;if(keys.has(k)){keys.delete(k);padUp(keyMap[k]);}});
$('#launch').onclick=begin;$('#pause').onclick=pause;$('#book').onclick=book;$('.brand').onclick=e=>{e.preventDefault();book();};$('#sound').onclick=()=>{p.sound=!p.sound;sound.wake();sound.gain();setTheme();save();};
sheet.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.track!==undefined){let id=+b.dataset.track;if(g.phase==='paused'&&g.t>0){show(top('CHANGE SET?')+'<p class="mini">This restarts the current take. Your best records stay safe.</p><button class="primary" data-next="'+id+'">PLAY '+PR.TRACKS[id].name.toUpperCase()+'</button><button class="secondary" data-act="book">BACK</button>','confirm');}else newSet(id);return;}if(b.dataset.next!==undefined){newSet(+b.dataset.next);begin();return;}if(b.dataset.skin!==undefined){p.skin=+b.dataset.skin;setTheme();save();settings();return;}switch(b.dataset.act){case'close':if(screen==='result'){book();return;}close();if(g.phase==='paused')settings();break;case'resume':if(g.phase==='paused')begin();else close();break;case'mute':p.sound=!p.sound;sound.wake();sound.gain();setTheme();save();settings();break;case'motion':p.reduced=!p.reduced;save();settings();break;case'timing':p.wide=!p.wide;g.wide=p.wide;save();settings();break;case'book':book();break;case'help':help();break;case'retry':newSet(g.id,g.remix);begin();break;case'remix':if(p.best.filter(v=>v>0).length>=3){let id=p.best.reduce((a,v,i)=>v?i:a,0);newSet(id,Math.floor(Date.now()/1000)%99999+1);}break;case'restartAsk':show(top('RESTART THIS SET?')+'<p class="mini">Restart the song from the count-in.</p><button class="primary" data-act="retry">↺ RESTART</button><button class="secondary" data-act="settings">BACK</button>','confirm');break;case'settings':settings();}});
sheet.addEventListener('input',e=>{if(e.target.id==='offset'){p.offset=+e.target.value/1000;$('#offsetValue').textContent=Math.round(p.offset*1000)+' ms';save();}});
function backgroundPause(){if(g.phase==='playing'){g.pause();sound.stop();releaseUI();save();settings();update();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)backgroundPause();});window.addEventListener('blur',backgroundPause);window.addEventListener('pagehide',()=>{backgroundPause();save();});window.addEventListener('resize',()=>{art.resize();update();});
function frame(ms){let dt=Math.min(.05,(ms-lastTime)/1000||0);lastTime=ms;if(!document.hidden){syncClock();events();if(g.phase==='playing'){sound.schedule();uiTime+=dt;if(uiTime>.04){update();uiTime=0;}saveTime+=dt;if(saveTime>.5){saveTime=0;save();}}let current=g.phase==='playing'?g.t:g.t,remain=g.notes[0].at-current;if(g.phase==='playing'&&remain>.1){let count=String(Math.ceil(remain/(60/PR.TRACKS[g.id].bpm)));$('#count').textContent=count;}else $('#count').textContent='';if(g.phase==='playing')judgeLeft=Math.max(0,judgeLeft-dt);$('#judge').style.opacity=String(Math.min(1,judgeLeft*4));if(g.phase==='playing'||g.phase==='ready'||art.dirty||prevPhase!==g.phase){art.draw(g,p,g.phase==='playing'||g.phase==='ready'?dt:0);art.dirty=false;prevPhase=g.phase;}}requestAnimationFrame(frame);}
setTheme();update();if(g.phase==='paused')settings();else if(g.phase==='result')results();requestAnimationFrame(frame);
})();


</script></body></html>
