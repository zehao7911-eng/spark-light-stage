<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202923"><title>LAST CASSETTE · A summer on the road</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app"><header><div class="wordmark">LAST CASSETTE <span>A SUMMER ON THE ROAD</span></div><nav><button id="journal" aria-label="Travel journal">Journal</button><button id="sound" aria-label="Toggle sound">Sound off</button><button id="pause" aria-label="Pause game">Ⅱ</button></nav></header>
<section class="view"><canvas id="scene" width="720" height="360" aria-label="Animated pixel art road and car"></canvas><div class="scene-label"><small id="region">PINEWATER / HOME</small><h1 id="place">The long way home.</h1><p id="caption">One old car. A whole summer ahead.</p></div><div id="roadNote"></div><button id="skip" hidden>Skip to next stop →</button><div class="grain"></div></section>
<section class="dash"><div class="meters"><div><small>ENERGY</small><div id="energy" class="bars"></div></div><div><small>CAR</small><div id="car" class="bars blue"></div></div><div><small>CASH</small><strong id="cash">$68</strong></div><div class="fuel"><small>FUEL</small><div id="gauge"><i></i></div><b id="fuel">82</b></div></div><button id="radio" class="radio"><small id="date">DAY 1 · 09:00</small><b id="track">SIDE A / OPEN WINDOWS</b><span>▸▸ &nbsp; TAP TO CHANGE TAPE</span></button><div id="crew" class="crew"></div></section>
<section class="console"><div class="statusline"><span id="status">Pinewater · Stop 0 / 6</span><span id="odometer">000 KM</span></div><div id="controls"></div></section><div id="toast" role="status"></div>
</main><div id="overlay" hidden><section id="panel" role="dialog" aria-modal="true" aria-label="Trip options"></section></div>
<script src="engine.js"></script><script src="art.js"></script><script src="game.js"></script></body></html>
