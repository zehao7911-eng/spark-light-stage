<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee4d5"><title>Velvet Stitch</title><link rel="stylesheet" href="style.css"></head><body><header><div><small>A LITTLE THREAD THERAPY</small><h1>Velvet Stitch <em>✳</em></h1></div><button id="sound" aria-label="Toggle sound">♪</button></header><main><section id="studio"><div class="top"><span id="piece"></span><span id="phase"></span></div><div id="canvas"></div><div id="hint"></div></section><aside><div class="card"><small>ON THE HOOP</small><h2 id="name"></h2><canvas id="sample" width="180" height="180"></canvas><div class="progress"><i id="fill"></i></div><span id="percent"></span></div><div id="swatches"></div><div id="finishes"></div><button id="action" class="primary" hidden>Next hoop →</button><div class="row"><button id="undo">Undo</button><button id="book">Album</button><button id="pause" aria-label="Pause">Ⅱ</button></div><p id="note"></p></aside></main><dialog id="modal"><button id="close" aria-label="Close">×</button><small>SMALL THINGS, MADE SLOWLY</small><h2 id="modal-title">Your thread album</h2><div id="album"></div></dialog><script src="p5.min.js"></script><script src="app.js"></script></body></html>
