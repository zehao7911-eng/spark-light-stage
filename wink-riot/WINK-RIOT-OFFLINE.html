function easyPop(){if(s.won){result();return}if(paused)return;audioInit();let e=s.eyes.find(x=>!x.popped);if(!e)return;hover={x:e.x,y:e.y};for(let i=0;i<(e.kind==='puff'?3:1)&&!e.popped;i++)M.stroke(s,p,hover,hover);process();save()}
$('easy').onclick=easyPop;$('stamp').onclick=()=>{audioInit();if(M.stamp(s,p)){process();save()}};$('choir').onclick=()=>{audioInit();if(M.choir(s,p)){process();save()}};
function show(kind,html){release();paused=true;silence();modalKind=kind;$('modal').innerHTML=html;$('overlay').hidden=false;label();draw();}
function close(){paused=false;modalKind='';$('overlay').hidden=true;audioInit();last=0;save();kick();}
const actions=`<button class="main" id="resume">BACK TO POPPING</button>`;
function result(){let u=M.unlocked(p),unlock=(s.stage===1?'INK STAMP UNLOCKED · Charge it with 8 pops.':s.stage===4?'EYE CHOIR UNLOCKED · A free chorus every portrait.':s.stage===8?'ENCORES UNLOCKED · New arrangements. Familiar oddballs.':'');show('result',`<div class="overline">PRINT ${String(s.stage+1).padStart(2,'0')} · COLLECTED</div><canvas id="resultArt" width="300" height="220" aria-label="Your collected portrait"></canvas><h3 id="modalTitle">A very<br>good pop.</h3><div class="stars">${'★'.repeat(s.stars)}${'☆'.repeat(3-s.stars)}</div><div class="stats"><div><strong>${s.pops}</strong><small>EYES POPPED</small></div><div><strong>${s.best}×</strong><small>BEST CHAIN</small></div><div><strong>+${s.earned}</strong><small>INK TOKENS</small></div></div>${unlock?`<div class="toolnote">${unlock}</div>`:''}<button class="main" id="next">${s.stage>=8?'PLAY AN ENCORE':'NEXT ODDBALL'} →</button><div class="secondary"><button id="replay">POP AGAIN</button><button id="collection">COLLECTION</button><button id="depot">STUDIO</button></div>`);let c=$('resultArt').getContext('2d');c.save();c.translate(66,-10);c.scale(.36,.36);A.character(c,s,view.t,null,true);for(let e of s.eyes)A.eye(c,e,view.t+1,null,A.palettes[s.stage%9]);c.restore();$('next').onclick=()=>start(Math.min(999,s.stage+1),s.stage>=8?s.seed+1:0);$('replay').onclick=()=>start(s.stage,s.seed);$('collection').onclick=album;$('depot').onclick=shop;}
function pause(){show('pause',`<div class="overline">TAKE A BREATHER</div><h3 id="modalTitle">The eyes<br>can wait.</h3><p>Your pops are saved. No timer. No pressure.</p><button class="main" id="resume">KEEP POPPING</button><div class="secondary"><button id="replay">FRESH PRINT</button><button id="collection">COLLECTION</button></div><div class="toggle"><button id="gentle">GENTLE FX · ${p.gentle?'ON':'OFF'}</button><button id="sound">SOUND · ${p.mute?'OFF':'ON'}</button></div>`);$('resume').onclick=close;$('replay').onclick=()=>start(s.stage,s.seed);$('collection').onclick=album;$('gentle').onclick=()=>{p.gentle=!p.gentle;save();resize();pause()};$('sound').onclick=()=>{p.mute=!p.mute;save();pause()};}
function album(){show('album',`<div class="overline">THE ODD LITTLE EXHIBITION · ${M.stars(p)} / 27 ★</div><h3 id="modalTitle">Beautifully<br>unbothered.</h3><div class="albumGrid">${M.names.map((n,i)=>`<button data-stage="${i}" ${i>M.unlocked(p)?'disabled':''}><canvas class="portraitThumb" data-portrait="${i}" width="150" height="150" aria-hidden="true"></canvas><span class="portraitSymbol">${['✹','▣','♛','☀','☁','▣','✧','♛','✹'][i]}</span>${i>M.unlocked(p)?'LOCKED':n}<small>${p.records[i]?'★'.repeat(p.records[i].stars):i===M.unlocked(p)?'READY TO POP':'—'}</small></button>`).join('')}</div>${M.unlocked(p)>=9?'<button class="main" id="encore">PLAY AN ENCORE →</button>':''}${actions}`);document.querySelectorAll('[data-portrait]').forEach(el=>{let z=M.create(+el.dataset.portrait),c=el.getContext('2d');c.fillStyle=A.palettes[z.stage][0];c.fillRect(0,0,150,150);c.translate(17,-5);c.scale(.24,.24);A.character(c,z,0,null,true);for(let e of z.eyes)A.eye(c,e,0,null,A.palettes[z.stage]);});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>start(+b.dataset.stage));$('resume').onclick=()=>s.won?result():close();if($('encore'))$('encore').onclick=()=>start(Math.max(9,s.stage),s.seed+1);}
function shop(){show('shop',`<div class="overline">THE PRINT STUDIO · ${p.coins} INK TOKENS</div><h3 id="modalTitle">Little tools.<br>Big feelings.</h3>${[['reach','◎','BIGGER TOUCH','A wider touch and a bigger stamp.'],['echo','✺','GOLDEN ECHO','Gold eyes reach farther with every chain.']].map(([k,i,t,d])=>`<div class="upgrade"><span class="symbol">${i}</span><div><b>${t}</b><small>${d}<br>LEVEL ${p.upgrades[k]} / 3</small></div><button data-buy="${k}" ${p.coins<M.cost(p,k)?'disabled':''}>${Number.isFinite(M.cost(p,k))?M.cost(p,k)+' ✹':'MAX'}</button></div>`).join('')}<p>2 portraits → Ink Stamp.<br>5 portraits → Eye Choir.<br>9 portraits → Endless Encores.</p>${actions}`);document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{audioInit();if(M.buy(p,b.dataset.buy)){voice(520,.2);save();shop()}});$('resume').onclick=()=>s.won?result():close();}
function help(){show('help',`<div class="overline">THE VERY SHORT VERSION</div><h3 id="modalTitle">See eye.<br>Make pop.</h3><p><b>TAP OR SWIPE</b> through the eyes.<br><b>STRIPED PINK</b> eyes: hold briefly or tap 3×.<br><b>GOLD</b> eyes pop their neighbours.<br>Clear the portrait to collect your print.</p><p>Keep a chain going for bonus stars and tokens.<br>8 pops charge the Ink Stamp once unlocked.<br>Keyboard: Space = pop, S = stamp, C = choir, Esc = pause.<br>No timer. No lives. Your progress saves here.</p>${actions}<button class="reset" id="reset">START A FRESH COLLECTION</button>`);$('resume').onclick=()=>s.won?result():close();resetArmed=false;$('reset').onclick=()=>{if(!resetArmed){resetArmed=true;$('reset').textContent='TAP AGAIN TO RESET THIS COLLECTION';return}p=M.profile();start(0);};}
$('pause').onclick=()=>s.won?result():pause();$('album').onclick=album;$('shop').onclick=shop;$('help').onclick=help;$('audio').onclick=()=>{p.mute=!p.mute;if(p.mute)silence();else audioInit();label();save()};
document.addEventListener('keydown',e=>{if(['Space','Escape','KeyS','KeyC'].includes(e.code)&&!(e.code==='Space'&&e.target.tagName==='BUTTON')){e.preventDefault();if(e.repeat)return;if(e.code==='Escape'){paused?close():pause()}else if(!paused){if(e.code==='Space')easyPop();if(e.code==='KeyS')$('stamp').click();if(e.code==='KeyC')$('choir').click()}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){release();save();if(!paused&&!s.won)pause();else silence()}});window.addEventListener('pagehide',()=>{release();save();silence()});
function frame(now){raf=0;if(paused)return;if(!last)last=now;let dt=Math.min(.05,(now-last)/1000);last=now;accum+=dt;let changed=false;while(accum>=1/60){if(!s.won){M.step(s,p,1/60,down?pointer:null);view.t=s.time;process()}else view.t+=1/60;accum-=1/60;changed=true;}if(changed){fx=fx.filter(f=>view.t-f.t<f.life);if(view.t>toastUntil)$('toast').textContent='';saveClock+=dt;if(saveClock>1){saveClock=0;save()}if(resultAt>0&&view.t>resultAt){resultAt=-1;result();return}if(!p.mute&&soundReady&&view.t-beat>2.5&&!s.won){beat=view.t;voice(110*Math.pow(2,[0,7,4,9][Math.floor(view.t/2.5)%4]/12),.35,.006)}}if(now-lastPaint>1000/(p.gentle?30:40)){if(s.combo<2&&$('combo').textContent)$('combo').textContent='';draw();lastPaint=now}kick();}
function kick(){if(!raf&&!paused)raf=requestAnimationFrame(frame)}
label();resize();if(restored){if(s.won)result();else{show('resume',`<div class="overline">YOUR PRINT IS RIGHT HERE</div><h3 id="modalTitle">One more<br>good pop?</h3><p>${s.pops} / ${s.eyes.length} eyes popped. Nothing lost.</p><button class="main" id="resume">KEEP POPPING</button>`);$('resume').onclick=close;}}else kick();
})();






</script></body></html>
