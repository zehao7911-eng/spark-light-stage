<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reef Tycoon</title><style>*{box-sizing:border-box}body{margin:0;background:#83dfff;color:white;font:900 16px system-ui;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 2px #17263c}header,footer,#wallet,#panel,#hint,#meter,#spark{position:absolute}header{top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}button{pointer-events:auto;cursor:pointer;font:900 15px system-ui;color:white;background:linear-gradient(#00c8ed,#087cc6);border:3px solid #162941;border-radius:8px;padding:9px 13px;box-shadow:0 3px #142238;text-shadow:0 1px 2px #15243b}button:active{transform:translateY(2px)}#hint{top:15%;left:4%;width:92%;text-align:center;font-size:clamp(19px,4vw,30px);-webkit-text-stroke:3px #20243a;paint-order:stroke fill}#wallet{top:42%;left:10px;color:#bdff58;background:#182d4780;border-radius:8px;padding:6px}footer{bottom:max(17px,env(safe-area-inset-bottom));width:100%;display:flex;justify-content:center;gap:6px}#act{background:linear-gradient(#bdff31,#3daa03);min-width:128px}#meter{bottom:21%;left:50%;transform:translateX(-50%);width:145px;height:75px;overflow:hidden;border-radius:90px 90px 0 0;background:conic-gradient(from 270deg at 50% 100%,#bcef29,#ffdc31 95deg,#ff512b 180deg,transparent 181deg);border:4px solid #222b40}#needle{position:absolute;bottom:0;left:49%;height:58px;width:5px;background:#29203d;transform-origin:bottom}#panel{pointer-events:auto;inset:17% 5% auto;max-width:650px;margin:auto;background:#203048f5;border:4px solid #142139;border-radius:10px;padding:12px;max-height:65%;overflow:auto}h2{background:#099bd1;margin:-12px -12px 12px;padding:10px}#panel button{margin:4px}#close{float:right;background:#fd4853;padding:0 8px}.card{display:inline-block;background:#374f6b;padding:8px;border:2px solid #182941;border-radius:5px;margin:3px}#spark{top:33%;width:100%;text-align:center;font-size:25px;color:#fcf39a}#panel:has(.shopCard) h2{background:linear-gradient(#ffd887,#c48a41)}.shopCard,.fishCard{vertical-align:top;display:inline-flex;flex-direction:column;align-items:center;justify-content:space-between;width:28%;min-height:104px;border:3px solid #172638;border-radius:4px;margin:2px;color:white;background:linear-gradient(145deg,#f0c879,#997044)}.fishCard{width:29%;background:#344a5d;font-size:12px}.fishCard img{width:100%;height:65px;object-fit:contain}.fishCard small,.shopCard strong{color:#bfff55}.shopCard{font-size:12px;padding:5px}.tool{position:relative;display:block;margin:14px;width:40px;height:8px;transform:rotate(35deg);background:#43435b;box-shadow:0 2px #171c31}.tool0:before,.tool0:after{content:'';position:absolute;top:-8px;width:10px;height:24px;background:#c4a1dd;border:2px solid #23253c}.tool0:before{left:0}.tool0:after{right:0}.tool1{height:3px;background:#e2b374;transform:rotate(-45deg)}.tool2{background:#43c9cb;border-radius:60%;height:16px}.shopCard strong{background:#308b19;width:100%;padding:3px}</style><body><div id="hud"><header><b>REEF TYCOON</b><button id="daily">Daily gift</button><button id="index">Fish Index</button></header><div id="hint"></div><div id="wallet"></div><div id="spark"></div><button id="stands" hidden style="position:absolute;bottom:76px;right:10px">Fish stands</button><div id="meter" hidden><i id="needle"></i></div><footer><button id="shop">Shop</button><button id="act">Cast line</button><button id="base">My Base</button></footer><section id="panel" hidden></section></div><script src="three.min.js"></script><script src="sdk.js"></script><script src="game.js"></script>
