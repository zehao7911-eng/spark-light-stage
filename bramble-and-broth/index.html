function enemy(c,e,time){const x=Math.round(e.x),y=Math.round(e.y),col=e.kind===0?'#8fac85':e.kind===1?'#ad9689':'#aca3cd';ell(c,x,y+2,12,4,'#10182b90');const bob=Math.sin(time*6)*2;if(e.kind===0){ell(c,x,y-9+bob,14,11,'#24373c');ell(c,x,y-9+bob,12,9,e.flash>0?'#fff1ca':col);r(c,x-8,y-15+bob,9,3,'#bed1a3');r(c,x-6,y-11+bob,3,3,'#2d3538');r(c,x+4,y-11+bob,3,3,'#2d3538');r(c,x-2,y-5+bob,5,1,'#536850')}if(e.kind===1){r(c,x-12,y-26,24,26,'#293037');r(c,x-10,y-24,20,23,e.flash>0?'#fff1ca':col);r(c,x-8,y-23,16,5,'#c4b29a');r(c,x-8,y-14,16,4,'#46414b');r(c,x-6,y-13,4,2,'#e7ad75');r(c,x+3,y-13,4,2,'#e7ad75');r(c,x-8,y-1,6,4,'#47494b');r(c,x+3,y-1,6,4,'#47494b');r(c,x-16,y-13,6,13,'#897b76');r(c,x+12,y-13,6,13,'#897b76')}if(e.kind===2){const flap=Math.sin(time*12)*5;poly(c,[[x-5,y-12],[x-24,y-23-flap],[x-19,y-3],[x-5,y-6]],'#70698f');poly(c,[[x+5,y-12],[x+24,y-23-flap],[x+19,y-3],[x+5,y-6]],'#70698f');ell(c,x,y-11,8,11,e.flash>0?'#fff1ca':col);r(c,x-4,y-13,3,3,'#f3d497');r(c,x+2,y-13,3,3,'#f3d497')}if(e.hp<e.max){r(c,x-13,y-34,26,3,'#29313b');r(c,x-13,y-34,26*e.hp/e.max,3,'#da9b7d')}}
