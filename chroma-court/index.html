<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081e2b"><title>Chroma Court</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="world" aria-label="Chroma Court fluid paddle game"></canvas>
<header><a id="brand" href="#">CHROMA<span>COURT</span><i>✦</i></a><div><button id="sound" aria-label="Toggle sound">♫ OFF</button><button id="help" aria-label="How to play">?</button><button id="pause" aria-label="Pause match">Ⅱ</button></div></header>
<div id="hud" hidden><div class="playerscore"><small>YOU</small><b id="yourScore">0</b><span id="yourDots"></span></div><div class="aiscore"><small id="rival">MICA</small><b id="theirScore">0</b><span id="theirDots"></span></div><div class="round"><small id="courtlabel">NEON REEF · 01</small><span id="goal">FIRST TO 3</span></div><div id="callout"></div><div id="rallylabel"></div></div>
<section id="menu" class="panel"><div class="eyebrow">A SMALL SPORT. A LITTLE MAGIC.</div><h1>Meet your <br><em>afterglow.</em></h1><p>Slide. Return. Make waves.</p><div id="courts"></div><div class="trim"><span id="medalcount">0 / 12 STARS</span><div id="trails"></div></div><button id="start" class="primary">PLAY NEON REEF <span>↗</span></button><button id="continue" hidden>CONTINUE MATCH</button><a class="credits" href="credits.html" target="_blank">Built with open-source Fluid Table Tennis</a></section>
<section id="overlay" class="panel modal" hidden><div class="eyebrow" id="tag">TAKE YOUR TIME</div><h2 id="title">Paused</h2><p id="copy"></p><div id="stats"></div><button id="resume" class="primary">BACK TO THE COURT</button><button id="next" hidden>NEXT COURT ↗</button><button id="retry">REMATCH</button><button id="home">COURT SELECT</button></section>
<nav id="controls" hidden aria-label="Match controls"><div class="tip" id="tip">SLIDE LEFT / RIGHT TO RETURN</div><button id="surge" aria-label="Activate flow surge"><span id="charge">0%</span><b>FLOW SURGE</b><em>✦</em></button></nav>
<script type="module" src="game.js"></script></body></html>
