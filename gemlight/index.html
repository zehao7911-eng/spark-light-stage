<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172634"><title>Gemlight Atelier</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e8dbc9;background:#17232f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#405261,#17232f 80%)}main{max-width:1060px;padding:18px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}header>div{display:flex;align-items:center;gap:10px}.logo{font:25px Georgia;letter-spacing:3px;color:#edc189}.logo>span{font-size:21px}.logo small{display:block;font:9px monospace;letter-spacing:2px;color:#c0cdd0;margin-top:5px}.gold,#money{color:#f0c88c}button{font:inherit;color:inherit;padding:12px 16px;cursor:pointer;border:1px solid #768994;background:#354654;border-radius:7px;touch-action:none}button:disabled{opacity:.4;cursor:default}header button{padding:0;width:32px;height:32px;border-radius:50%;font-size:20px}.strip{display:flex;justify-content:space-between;background:#2b3f4c;border:1px solid #7a8c92;padding:10px 14px;font:10px monospace;letter-spacing:1px;border-radius:10px 10px 0 0}#scene{position:relative;overflow:hidden;border:1px solid #7a8c92;border-top:0;border-radius:0 0 10px 10px}canvas{width:100%;height:clamp(360px,62dvh,620px);display:block;image-rendering:pixelated;touch-action:none}#notice{position:absolute;top:14px;left:16px;font:10px monospace;letter-spacing:1px;color:#fff1cb;text-shadow:1px 2px #142533;pointer-events:none}#move{position:absolute;bottom:18px;left:15px;text-align:center}#move button{width:46px;height:43px;margin:2px;padding:0;font:22px monospace;background:#273f4bc9;border-color:#b8c9c480}#move>button{display:block;margin:2px auto}#scan{position:absolute;bottom:22px;right:20px;width:63px;height:63px;border-radius:50%;padding:0;background:#957b8bc9;font-size:27px}#scan small{display:bl n:absolute;left:42%;width:16%;height:100%;background:#ebc786}#track b{position:absolute;width:3px;top:-4px;bottom:-4px;background:#fffcdf;box-shadow:0 0 9px #fff8b3}#facet{margin-top:12px;background:#cd9e84;color:#22313a;font-weight:bold;width:100%}@media(max-width:600px){main{padding:10px}.logo{font-size:19px;letter-spacing:2px}.logo>span{font-size:16px}.logo small{font-size:7px;letter-spacing:1px}header>div{gap:5px}canvas{height:57dvh;min-height:300px}.strip{font-size:8px;padding:9px}#notice{font-size:8px;left:10px}#inventory{gap:10px;padding:9px;font-size:10px}footer{gap:5px}footer button{padding:12px 4px;font-size:10px}#hint{font-size:9px}#move{left:7px;bottom:13px}#move button{width:40px;height:39px}#scan{right:12px;bottom:19px;width:57px;height:57px}#cut{left:7%;width:86%}dialog{padding:24px 14px}}@media(max-height:500px) and (min-width:600px){main{display:grid;grid-template-columns:190px 1fr;gap:8px 12px;padding:6px 12px}header{grid-column:1/3;margin:0;height:36px}.logo small{display:none}.strip{grid-column:1;flex-wrap:wrap;gap:8px;border-radius:7px;align-self:start}#scene{grid-column:2;grid-row:2/6;border-top:1px solid #7a8c92}canvas{height:288px;min-height:0}#inventory{grid-column:1;align-self:start;padding:0;gap:6px}footer{grid-column:1;flex-wrap:wrap;align-self:start}footer button{flex:1 0 45%;font-size:10px}#hint{grid-column:1;margin:0;font-size:9px}#move button{height:32px;width:34px}#cut{bottom:10px;padding:9px}}
</style></head><body><main><header><div class="logo">◆ <span>GEMLIGHT<small>THE LITTLE GEM ATELIER</small></span></div><div><b id="money">0</b> <span class="gold">✦</span><button id="sound" aria-label="Toggle sound">♪</button><button id="help" aria-label="How to play">?</button></div></header><div class="strip"><span id="location"></span><span id="status"></span></div><section id="scene"><canvas id="game" aria-label="Pixel gem workshop and underground mining"></canvas><div id="notice"></div><div id="move"><button data-dir="0,-1" aria-label="Move up">↑</button><div><button data-dir="-1,0" aria-label="Move left">←</button><button data-dir="0,1" aria-label="Move down">↓</button><button data-dir="1,0" aria-label="Move right">→</button></div></div><button id="scan" aria-label="Scan hidden gems">◈<small>SCAN</small></button><div id="cut" hidden><div id="cutlabel">Tap when the light crosses gold</div><div id="track"><i></i><b></b></div><button id="facet">CUT ◆</button></div></section><div id="inventory"></div><footer><button id="home">↑ Bring home</button><button id="orders">◇ Orders</button><button id="gear">↑ Tools</button><button id="dig" class="primary">Go mining ↓</button></footer><p id="hint"></p><dialog id="modal"><button id="close" aria-label="Close">×</button><div id="content"></div></dialog><div id="toast" role="status"></div></main><script>'use strict';
const $=s=>document.querySelector(s),cv=$('#game'),c=cv.getContext('2d'),cols=17,rows=64,T=24,W=408;
const gems=[{name:'Amber',col:'#e6b66e',value:14},{name:'Jade',col:'#84bca2',value:22},{name:'Amethyst',col:'#bca2d4',value:35},{name:'Aquamarine',col:'#91d5de',value:48},{name:'Ruby',col:'#e990a1',value:70},{name:'Starstone',col:'#e6ddb4',value:95}];
let book={coins:0,day:1,drill:0,pack:0,scanner:0,bench:0,stash:Array(6).fill(0),collection:Array(6).fill(0),crafted:0,best:0,sound:true},mode='home',grid=[],p={x:8,y:1},cargo=Array(6).fill(0),energy=80,sector=0,seed=0,target=null,held=null,keys=new Set(),cool=0,cam={x:0,y:0},Vw=408,Vh=360,time=0,last=0,fx=[],floats=[],shake=0,scanTime=0,scanCooldown=0,craft=null,combo=0,ac,toastId;
try{book={...book,...JSON.parse(localStorage.getItem('gemlight-v1')||'{}')}}catch{}
const count=()=>cargo.reduce((a,b)=>a+b,0),capacity=()=>12+book.pack*6,maxEnergy=()=>80+book.drill*18;
function save(){book.pending=craft;try{localStorage.setItem('gemlight-v1',JSON.stringify(book));localStorage.setItem('gemlight-run',JSON.stringify(mode==='mine'?{grid,p,cargo,energy,sector,seed}:null))}catch{}}
function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function ellipse(x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(Math.round(x),Math.round(y),rx,ry,0,0,7);c.fill()}
function txt(s,x,y,col='#ead9b4',size=8,align='left'){c.font='bold '+size+'px monospace';c.textAlign=align;c.fillStyle='#1b2538';c.fillText(s,x+1,y+1);c.fillStyle=col;c.fillText(s,x,y)}
function gem(ctx,id,x,y,size=14){const co=gems[id].col;ctx.fillStyle='#253345';ctx.beginPath();ctx.moveTo(x,y-size*.6);ctx.lineTo(x+size*.55,y-size*.15);ctx.lineTo(x+size*.35,y+size*.4);ctx.lineTo(x,y+size*.65);ctx.lineTo(x-size*.5,y+size*.15);ctx.lineTo(x-size*.4,y-size*.3);ctx.fill();ctx.fillStyle=co;ctx.beginPath();ctx.moveTo(x,y-size*.45);ctx.lineTo(x+size*.4,y-size*.1);ctx.lineTo(x+size*.22,y+size*.35);ctx.lineTo(x,y+size*.48);ctx.lineTo(x-size*.36,y+size*.07);ctx.lineTo(x-size*.27,y-size*.2);ctx.fill();ctx.fillStyle='#fff0d3';ctx.fillRect(Math.round(x-2),Math.round(y-size*.25),2,3);ctx.fillStyle='#ffffff45';ctx.beginPath();ctx.moveTo(x,y-size*.45);ctx.lineTo(x-2,y+size*.2);ctx.lineTo(x+size*.4,y-size*.1);ctx.fill()}
const icons=gems.map((_,id)=>{const v=document.createElement('canvas');v.width=v.height=28;gem(v.getContext('2d'),id,14,13,20);return v.toDataURL()});
function sound(kind){if(!book.sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();const seq={rock:[100,160],gem:[650,950,1250],scan:[300,600],cut:[700,1100],perfect:[700,900,1400],cash:[900,1200,1500],door:[250,400]}[kind]||[400];seq.forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.055;o.type=kind==='rock'?'triangle':'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+.12);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.15)})}catch{}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('on');clearTimeout(toastId);toastId=setTimeout(()=>$('#toast').classList.remove('on'),2200)}
function burst(x,y,col,n=14){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*100,vy:-Math.random()*90,life:.3+Math.random()*.6,col});if(fx.length>350)fx.splice(0,fx.length-350)}function label(s,x,y,col='#f7d08c'){floats.push({s,x,y,col,life:1.3})}
function ui(){$('#money').textContent=book.coins;$('#location').textContent=mode==='mine'?['COPPER ROOTS','VIOLET HOLLOW','STARLIGHT DEPTHS'][Math.min(2,Math.floor(sector/2))]+' · SECTOR '+(sector+1):'GEMLIGHT ATELIER · DAY '+book.day;$('#status').textContent=mode==='mine'?'POWER '+Math.ceil(energy)+' · BAG '+count()+'/'+capacity():'COLLECTION '+book.collection.filter(n=>n>0).length+'/6';$('#notice').textContent=mode==='mine'?'HOLD A DIRECTION TO DRILL · '+Math.max(0,p.y-3)+'m':craft?'THREE CUTS. ONE LITTLE MASTERPIECE.':'FIND SOMETHING. MAKE IT SHINE.';$('#move').hidden=mode!=='mine';$('#scan').hidden=mode!=='mine';$('#scan').disabled=scanCooldown>0;$('#home').hidden=mode!=='mine';$('#dig').hidden=mode==='mine';$('#orders').disabled=mode==='mine'||!!craft;$('#gear').disabled=mode==='mine'||!!craft;$('#dig').disabled=!!craft;$('#inventory').innerHTML=gems.map((g,id)=>'<span><img src="'+icons[id]+'" alt="'+g.name+'">'+(mode==='mine'?cargo[id]:book.stash[id])+'</span>').join('');$('#hint').textContent=mode==='mine'?'Connected gems burst together. Tap nearby rock, or use arrows.':'Mine → cut gems → fill commissions → upgrade your tools.';$('#cut').hidden=!craft}
function random(s){let n=s;return()=>{n=(Math.imul(n,1664525)+1013904223)|0;return(n>>>0)/4294967296}}
function makeMine(){seed=book.day*7243+sector*1999;const r=random(seed);grid=Array.from({length:rows},(_,y)=>Array.from({length:cols},(_,x)=>{if(y<4)return null;let id=-1;if(r()<.17)id=Math.min(5,Math.floor((y/18)+sector/2+r()*2));return{hp:1+Math.floor(y/20)+Math.floor(sector/3),max:1+Math.floor(y/20)+Math.floor(sector/3),id,noise:Math.floor(r()*9)}}));for(let y=5;y<rows-2;y+=8){const x=2+Math.floor(r()*12),id=Math.min(5,Math.floor((y/22)+sector/2));for(const [dx,dy]of[[0,0],[1,0],[0,1],[1,1]])grid[y+dy][x+dx].id=id}for(let j=0;j<7;j++){const cx=2+Math.floor(r()*12),cy=12+j*7;for(let dy=-1;dy<=1;dy++)for(let dx=-2;dx<=2;dx++)if(dx*dx/4+dy*dy<=1&&grid[cy+dy]?.[cx+dx])grid[cy+dy][cx+dx]=null}grid[4][8].id=0;grid[5][8].id=0;grid[5][9].id=0;p={x:8,y:2};energy=maxEnergy();cargo=Array(6).fill(0);target=null;cool=0;scanCooldown=0;scanTime=0;save()}
function start(){mode='mine';makeMine();sound('door');toast('Hold ↓ to drill. Follow a gem vein!');ui()}
function cluster(x,y,id,seen=new Set()){const k=y*cols+x;if(x<0||x>=cols||y<0||y>=rows||seen.has(k)||grid[y][x]?.id!==id)return seen;seen.add(k);if(seen.size<18)for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])cluster(x+dx,y+dy,id,seen);return seen}
function step(dx,dy){if(mode!=='mine'||$('#modal').open||craft||cool>0)return;const x=p.x+dx,y=p.y+dy;if(x<0||x>=cols||y<1||y>=rows)return;const cell=grid[y][x];cool=.16;if(cell){if(energy<=0){toast('Power empty. Bring your finds home.');return}if(cell.id>=0&&count()>=capacity()){toast('Bag full. Bring it home!');return}energy=Math.max(0,energy-1);cell.hp-=1+book.drill*.6;shake=1.5;sound('rock');burst(x*T+12,y*T+12,cell.id>=0?gems[cell.id].col:'#8e7a73',9);if(cell.hp<=0){if(cell.id>=0){const ids=[...cluster(x,y,cell.id)].slice(0,capacity()-count());for(const k of ids){const xx=k%cols,yy=Math.floor(k/cols);grid[yy][xx]=null;cargo[cell.id]++;burst(xx*T+12,yy*T+12,gems[cell.id].col,10)}sound('gem');label((ids.length>1?'VEIN! ':'')+'+'+ids.length+' '+gems[cell.id].name,x*T+12,y*T,gems[cell.id].col);navigator.vibrate?.(12)}else grid[y][x]=null;p={x,y};book.best=Math.max(book.best,y+sector*64);save()}}else{p={x,y};save()}if(p.y===rows-1){const carried=cargo.slice(),power=energy;sector++;makeMine();cargo=carried;energy=power;save();toast('A deeper seam. Rarer gems await.')}ui()}
function scan(){if(mode!=='mine'||scanCooldown>0)return;scanTime=4+book.scanner*2;scanCooldown=12-book.scanner*2;sound('scan');toast('Nearby veins revealed');burst(p.x*T+12,p.y*T+12,'#bee2d6',25)}
function home(){if(mode!=='mine')return;const haul=cargo.slice(),n=count();for(let i=0;i<6;i++){book.stash[i]+=cargo[i];book.collection[i]+=cargo[i]}mode='home';cargo=Array(6).fill(0);book.day++;target=null;held=null;keys.clear();fx=[];floats=[];save();sound('door');ui();show('<div class="summary"><div class="eyebrow">A POCKET FULL OF SPARKLES</div><h1>Back in the warm light.</h1><div class="big">'+n+' gems</div><p>'+haul.map((n,i)=>n?gems[i].name+' ×'+n:'').filter(Boolean).join(' · ')+'</p><button id="work-now" class="primary">Make something beautiful →</button></div>');$('#work-now').onclick=orders}
const designs=[{name:'Sunbeam brooch',ids:[0,0],price:55,shape:0},{name:'Fern pendant',ids:[0,1],price:85,shape:1},{name:'Moon drop',ids:[1,2],price:135,shape:2},{name:'Ocean charm',ids:[2,3],price:190,shape:1},{name:'Rose crown',ids:[3,4,4],price:320,shape:3},{name:'Starlight tiara',ids:[4,5,5],price:450,shape:3}];
const canMake=d=>d.ids.every(id=>book.stash[id]>=d.ids.filter(n=>n===id).length);function show(h){keys.clear();held=null;target=null;$('#content').innerHTML=h;if(!$('#modal').open)$('#modal').showModal()}
function orders(){show('<div class="eyebrow">LITTLE GIFTS. REAL GEMSTONES.</div><h1>Commissions</h1><div class="cards">'+designs.map((d,i)=>'<div class="card"><img src="'+icons[d.ids.at(-1)]+'" alt=""><b>'+d.name+'</b><small>'+[...new Set(d.ids)].map(id=>gems[id].name+' ×'+d.ids.filter(n=>n===id).length).join(' + ')+'</small><small>'+d.price+' coins · perfect cuts earn more</small><button data-make="'+i+'" '+(!canMake(d)?'disabled':'')+'>Craft ◆</button></div>').join('')+'</div><p>Tap CUT as the light crosses the gold strip. Three cuts shape each piece.</p>');document.querySelectorAll('[data-make]').forEach(b=>b.onclick=()=>beginCraft(+b.dataset.make))}
function beginCraft(id){const d=designs[id];if(!canMake(d)||craft)return;for(const i of d.ids)book.stash[i]--;craft={id,cut:0,score:0,phase:0,glow:0};$('#modal').close();combo=0;save();ui();sound('door')}
function cut(){if(!craft||craft.glow>0)return;const pos=(Math.sin(craft.phase)+1)/2,perfect=pos>=.42&&pos<=.58;craft.score+=perfect?1:0;craft.cut++;craft.glow=.4;combo=perfect?combo+1:0;sound(perfect?'perfect':'cut');burst(204,167,perfect?'#fff0bd':gems[designs[craft.id].ids.at(-1)].col,perfect?38:18);shake=perfect?2:1;label(perfect?'PERFECT ◆':'FACET '+craft.cut,204,124,perfect?'#ffe3a0':'#adcdd0');navigator.vibrate?.(perfect?20:8);if(craft.cut>=3){const d=designs[craft.id],score=craft.score,value=Math.round(d.price*(1+score*.2));book.coins+=value;book.crafted++;craft=null;save();ui();sound('cash');show('<div class="summary"><div class="eyebrow">HANDMADE IN GEMLIGHT</div><h1>'+d.name+'</h1><div class="big">+'+value+' coins</div><p>'+['A charming little piece.','One sparkling facet.','Two beautiful facets!','Flawless! Every facet catches the light.'][score]+'</p><button id="again" class="primary">Next commission</button><button id="tools-now">Upgrade tools</button></div>');$('#again').onclick=orders;$('#tools-now').onclick=gear}else save()}
const upgrades=[{key:'drill',name:'Diamond drill',base:75,max:5,desc:()=> 'Faster rock breaking + more power'},{key:'pack',name:'Velvet gem bag',base:60,max:4,desc:()=>capacity()+' → '+(capacity()+6)+' gems'},{key:'scanner',name:'Vein scanner',base:100,max:3,desc:()=> 'Reveal more gems, scan more often'},{key:'bench',name:'Steady cutting wheel',base:100,max:3,desc:()=> 'A slower light for precise cuts'}];

function artisan(x,y,t=0){ellipse(x,y,10,3,'#18243770');rect(x-7,y-19,14,17,'#708a9e');rect(x-4,y-17,8,13,'#dbb998');rect(x-6,y-3,4,4,'#34435a');rect(x+2,y-3,4,4,'#34435a');rect(x-7,y-32,14,13,'#d7a484');rect(x-8,y-33,16,6,'#545368');rect(x-4,y-26,2,2,'#263347');rect(x+3,y-26,2,2,'#263347');rect(x-9,y-35,18,4,'#bfa081');rect(x-6,y-38,12,4,'#e1bc86');rect(x-10,y-15+Math.sin(t*8),4,8,'#d7a484');rect(x+7,y-15-Math.sin(t*8),4,8,'#d7a484')}

function mine(){const y0=Math.max(0,Math.floor(cam.y/T)-1),y1=Math.min(rows,Math.ceil((cam.y+Vh)/T)+1);rect(0,0,W,rows*T,'#233342');for(let y=y0;y<y1;y++)for(let x=0;x<cols;x++){const cell=grid[y][x],xx=x*T,yy=y*T;if(cell){const palette=y<22?['#796562','#8c7770','#a58b7c']:y<43?['#626477','#77758b','#9791a6']:['#536c75','#6a8690','#8dacaf'];rect(xx,yy,T,T,palette[0]);rect(xx+1,yy+1,T-2,T-2,palette[1]);rect(xx+3,yy+3,12+cell.noise,2,palette[2]);rect(xx+16,yy+14,5,2,palette[0]);rect(xx+4,yy+18,8,1,palette[0]);if(cell.noise%3===0){rect(xx+8,yy+6,1,5,palette[0]);rect(xx+8,yy+10,5,1,palette[0]);rect(xx+12,yy+11,1,4,palette[0])}if(cell.noise%2){rect(xx+18,yy+6,2,2,palette[2]);rect(xx+5,yy+13,3,2,palette[2])}const dist=Math.hypot(x-p.x,y-p.y),visible=dist<3.4||scanTime>0&&dist<6+book.scanner*3;if(cell.id>=0&&visible){gem(c,cell.id,xx+12,yy+12,12);if(scanTime>0)rect(xx+3,yy+3,2,2,'#f3edcf')}if(cell.hp<cell.max){rect(xx+11,yy+5,1,9,'#323341');rect(xx+7,yy+12,5,1,'#323341');rect(xx+12,yy+14,6,1,'#323341')}}else{rect(xx,yy,T,T,(x+y)%3?'#253c4a':'#2a414d');if(y>=4){if(grid[y-1]?.[x]){rect(xx,yy,24,3,'#182c3c');rect(xx+3,yy,4,5,'#182c3c')}if(grid[y]?.[x-1])rect(xx,yy,2,24,'#172b3a');if((x+y*3)%17===0&&y>6){rect(xx+12,yy+7,1,12,'#698a87');ellipse(xx+9,yy+9,4,2,'#718f8b');ellipse(xx+15,yy+13,4,2,'#718f8b')}if((x*7+y*9)%13===0){rect(xx+6,yy+18,3,2,'#52656a');rect(xx+14,yy+8,2,1,'#496367')}}}}if(cam.y<100){rect(163,37,82,4,'#c2a995');rect(175,37,4,43,'#99868b');rect(228,37,4,43,'#99868b');rect(183,39,36,9,'#e4c8a2');txt('LIFT',201,46,'#675563',6,'center');for(let y=81;y<154;y+=15)rect(197,y,15,2,'#b3a192')}const xx=p.x*T+12,yy=p.y*T+21;artisan(xx,yy,time);const grad=c.createRadialGradient(xx,yy-17,12,xx,yy-17,90);grad.addColorStop(0,'#fce3a944');grad.addColorStop(1,'#fce3a900');c.fillStyle=grad;c.fillRect(xx-90,yy-107,180,180);if(scanTime>0){c.strokeStyle='#b8dfc988';c.lineWidth=1;c.beginPath();c.arc(xx,yy-12,(time*65)%130,0,7);c.stroke()}if(target){rect(target.x*T+3,target.y*T+3,18,1,'#edc792');rect(target.x*T+3,target.y*T+20,18,1,'#edc792')}}
function render(){cam.x=Vw>W?-(Vw-W)/2:Math.max(0,Math.min(W-Vw,p.x*T-Vw/2));cam.y=mode==='mine'?Math.max(0,Math.min(rows*T-Vh,p.y*T-Vh*.45)):Vh>360?-(Vh-360)/2:0;c.fillStyle='#1b2938';c.fillRect(0,0,Vw,Vh);c.save();c.translate(-Math.round(mode==='mine'?cam.x:(Vw-W)/-2)+(Math.random()-.5)*shake,-Math.round(cam.y));if(mode==='mine')mine();else workshop();for(const a of fx){c.globalAlpha=Math.min(1,a.life*2);rect(a.x,a.y,2,2,a.col)}for(const f of floats){c.globalAlpha=Math.min(1,f.life);txt(f.s,f.x,f.y,f.col,8,'center')}c.globalAlpha=1;c.restore();const g=c.createRadialGradient(Vw/2,Vh/2,80,Vw/2,Vh/2,Math.max(Vw,Vh)*.65);g.addColorStop(0,'#11253700');g.addColorStop(1,'#11253770');c.fillStyle=g;c.fillRect(0,0,Vw,Vh);if(craft)$('#track b').style.left=((Math.sin(craft.phase)+1)*50)+'%'}
function tick(dt){time+=dt;cool=Math.max(0,cool-dt);scanTime=Math.max(0,scanTime-dt);scanCooldown=Math.max(0,scanCooldown-dt);shake=Math.max(0,shake-dt*15);if(craft){craft.phase+=dt*(2.4-book.bench*.35);craft.glow=Math.max(0,craft.glow-dt)}if(mode==='mine'){let d=held;if(keys.has('ArrowUp')||keys.has('w'))d=[0,-1];else if(keys.has('ArrowDown')||keys.has('s'))d=[0,1];else if(keys.has('ArrowLeft')||keys.has('a'))d=[-1,0];else if(keys.has('ArrowRight')||keys.has('d'))d=[1,0];else if(target){const dx=target.x-p.x,dy=target.y-p.y;if(!dx&&!dy)target=null;else d=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]}if(d)step(...d)}for(const q of fx){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=180*dt}fx=fx.filter(q=>q.life>0);for(const f of floats){f.life-=dt;f.y-=12*dt}floats=floats.filter(f=>f.life>0)}

document.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held=b.dataset.dir.split(',').map(Number);target=null;sound('rock');step(...held)};b.onpointerup=b.onpointercancel=()=>held=null});cv.onpointerdown=e=>{if(mode!=='mine'||$('#modal').open)return;const r=cv.getBoundingClientRect(),x=Math.floor(((e.clientX-r.left)*Vw/r.width+cam.x)/T),y=Math.floor(((e.clientY-r.top)*Vh/r.height+cam.y)/T);if(x>=0&&x<cols&&y>0&&y<rows){target={x,y};held=null}};
window.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();if($('#modal').open)return;keys.add(e.key);if(!e.repeat&&e.key===' ')craft?cut():scan();if(!e.repeat&&e.key==='r')home()});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>{held=null;target=null;keys.clear()});document.addEventListener('visibilitychange',()=>{held=null;target=null;keys.clear();save()});
function resize(){const r=cv.getBoundingClientRect();Vw=Math.max(320,Math.round(r.width/r.height*360));Vh=Math.round(Vw*r.height/r.width);cv.width=Vw;cv.height=Vh;c.imageSmoothingEnabled=false;render()}window.addEventListener('resize',resize);

try{const run=JSON.parse(localStorage.getItem('gemlight-run')||'null');if(run?.grid?.length===rows){({grid,p,cargo,energy,sector,seed}=run);mode='mine'}}catch{}ui();resize();let uiClock=0;function frame(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(!document.hidden&&!$('#modal').open){tick(dt);uiClock+=dt;if(uiClock>.2){uiClock=0;ui()}render()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
