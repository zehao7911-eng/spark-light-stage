<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#061b28">
  <title>Reef Revival</title>
  <style>
    :root{color-scheme:dark;font-family:Trebuchet MS,Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061b28}button{font:inherit}#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 42%,#0016239e 100%)}#grain{position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E")}
    .top{position:fixed;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}.brand{padding:11px 15px;background:#031823c9;border:1px solid #a8eff24f;box-shadow:0 8px 30px #0017209c,inset 0 0 24px #6df9ef12;border-radius:14px;backdrop-filter:blur(10px)}.brand b{display:block;letter-spacing:.17em;font-size:18px;color:#f8f1d9;text-shadow:0 2px 12px #4aeee9}.brand span{display:block;color:#7fcbcf;letter-spacing:.2em;font-size:9px;margin-top:2px}.stats{display:flex;gap:8px}.pill{background:#031823d9;border:1px solid #a8eff24a;border-radius:13px;padding:10px 12px;min-width:70px;box-shadow:0 8px 30px #0017208c;backdrop-filter:blur(10px)}.pill small{display:block;color:#85c8cf;font-size:9px;letter-spacing:.16em}.pill strong{display:block;color:#fff0ba;font-size:17px;margin-top:1px}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:min(620px,calc(100% - 28px));pointer-events:none}.barbox{background:#031823db;border:1px solid #c2fcf36a;border-radius:16px;padding:12px 14px;box-shadow:0 12px 35px #00131db0,inset 0 0 25px #65dfe70d;backdrop-filter:blur(12px)}.line{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;color:#dcfcf8;font-size:11px;letter-spacing:.14em;font-weight:bold}.line b{font-size:14px;color:#ffde94}.bar{height:10px;border-radius:20px;background:#1c4254;overflow:hidden;box-shadow:inset 0 1px 3px #00111c}.fill{height:100%;width:0;background:linear-gradient(90deg,#36c9c9,#9df6da,#fff2b4);border-radius:20px;box-shadow:0 0 14px #9fffe0;transition:width .15s}.hint{text-align:center;font-size:10px;letter-spacing:.12em;color:#b1d8d5;margin-top:8px;text-shadow:0 2px 8px #001820}.sound{pointer-events:auto;position:fixed;right:max(17px,env(safe-area-inset-right));top:76px;background:#031823d8;border:1px solid #b9f9e55a;color:#d9f9ec;border-radius:11px;padding:8px 10px;cursor:pointer;font-size:12px;box-shadow:0 8px 20px #0019208a}.sound:focus-visible,.card:focus-visible,.primary:focus-visible{outline:2px solid #fff2bc;outline-offset:3px}
    .modal{position:fixed;inset:0;z-index:5;background:#02131caa;backdrop-filter:blur(9px);display:flex;justify-content:center;align-items:center;padding:24px;transition:opacity .25s}.modal.hidden{opacity:0;pointer-events:none}.panel{width:min(490px,100%);border-radius:24px;border:1px solid #bdfbec75;background:linear-gradient(155deg,#0a3644f2,#071d30f5 70%);padding:30px 28px;text-align:center;box-shadow:0 30px 90px #000b,0 0 60px #5cffdb1a,inset 0 1px #ffffff33}.eyebrow{color:#82e8e1;letter-spacing:.25em;font-size:11px;font-weight:bold}.panel h1{font-size:clamp(32px,7vw,54px);line-height:1.02;margin:15px 0 9px;color:#fff4d4;text-shadow:0 3px 0 #1c6771,0 0 30px #70ffdf66;letter-spacing:.07em}.panel p{color:#c5e2e0;line-height:1.55;font-size:14px;margin:10px auto 22px;max-width:330px}.primary{border:0;border-radius:13px;background:linear-gradient(180deg,#ffedb7,#ffbb72);box-shadow:0 6px 0 #a95f4b,0 10px 25px #ffa9684a;color:#163b49;font-size:14px;font-weight:900;letter-spacing:.13em;padding:15px 26px;cursor:pointer;min-width:190px}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #a95f4b}.mini{font-size:10px;color:#8ebdbd;margin-top:20px;letter-spacing:.15em}.choices{display:grid;gap:10px;text-align:left;margin:18px 0 23px}.card{display:flex;align-items:center;gap:12px;border:1px solid #9be6dc77;border-radius:14px;background:#154658ab;color:#eafcf0;padding:12px;text-align:left;cursor:pointer;width:100%;transition:transform .15s,background .15s}.card:hover{transform:translateY(-2px);background:#246073}.card:disabled{opacity:.5;cursor:default}.ico{font-size:28px;line-height:1;width:35px;text-align:center}.copy{flex:1}.copy b{display:block;font-size:13px;letter-spacing:.08em}.copy small{display:block;color:#a7d1d0;font-size:11px;margin-top:3px}.cost{color:#ffe2a1;font-size:12px;font-weight:900}.trophy{font-size:37px;margin:4px 0}.toast{position:fixed;z-index:4;left:50%;top:22%;transform:translate(-50%,-10px);opacity:0;pointer-events:none;padding:12px 19px;border:1px solid #e7ffd0ad;border-radius:12px;background:#0b4c59e8;color:#fff7c6;box-shadow:0 8px 30px #012b3c;font-weight:900;letter-spacing:.08em;text-align:center;transition:all .25s;max-width:80vw}.toast.on{opacity:1;transform:translate(-50%,0)}
    @media(max-width:600px){.brand{padding:9px 10px}.brand b{font-size:13px}.brand span{font-size:7px}.pill{padding:8px;min-width:53px}.pill strong{font-size:13px}.pill small{font-size:7px}.top{gap:5px}.stats{gap:5px}.panel{padding:24px 20px}.sound{top:62px}.bottom{bottom:max(10px,env(safe-area-inset-bottom))}.barbox{padding:10px 12px}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="Interactive underwater reef. Drag to clean the algae."></canvas><div id="vignette"></div><div id="grain"></div>
  <div class="top"><div class="brand"><b>REEF REVIVAL</b><span>A LITTLE OCEAN OF CALM</span></div><div class="stats"><div class="pill"><small>REEF</small><strong id="level">01</strong></div><div class="pill"><small>PEARLS</small><strong id="pearls">0</strong></div></div></div>
  <button id="sound" class="sound" aria-label="Toggle sound">♫ ON</button>
  <div class="bottom"><div class="barbox"><div class="line"><span id="zone">CORAL GARDEN</span><b id="percent">0%</b></div><div class="bar"><div id="fill" class="fill"></div></div><div class="hint" id="hint">DRAG TO WASH THE REEF · FIND HIDDEN PEARLS</div></div></div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal"><div class="panel"><div class="eyebrow" id="eyebrow">A TINY UNDERWATER ESCAPE</div><div class="trophy" id="trophy">🪸</div><h1 id="title">REEF<br>REVIVAL</h1><p id="description">Wash away the algae. Watch the colors come alive. Take your time.</p><div id="choices" class="choices" hidden></div><button id="action" class="primary">DIVE IN</button><div id="mini" class="mini">DRAG OR SWIPE TO CLEAN · SOUND ON</div></div></div>
  <script src="reef-revival.js"></script>
</body>
</html>
