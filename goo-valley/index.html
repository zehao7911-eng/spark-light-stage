</style></head><body><main><header><div><small>A LITTLE STRETCH GOES A LONG WAY</small><h1>Goo Valley</h1></div><div class="top"><button id="levels" aria-label="Choose level">☷</button><button id="sound" aria-label="Toggle sound">♫</button><button id="pause" aria-label="Pause">Ⅱ</button></div></header><section class="ribbon"><span id="name"></span><span id="goal"></span></section><section id="stage"><canvas id="world" aria-label="Drag a goo ball into the valley. Connect it to two other balls to build."></canvas><div id="toast"></div><div id="tip">Drag a ball. Stretch toward the pipe.</div><div id="wind"></div></section><footer><div class="tools"><button id="undo" aria-label="Undo last ball">↶ Undo</button><button id="hint" aria-label="Show placement hint">✧ Hint</button></div><button id="goo" aria-label="Drag a goo ball to build"><svg viewBox="0 0 80 65" aria-hidden="true"><path d="M7 47C1 18 13 6 38 5s39 16 36 37S35 69 7 47" fill="#253532"/><ellipse cx="28" cy="26" rx="10" ry="12" fill="#f9f1d3"/><ellipse cx="51" cy="24" rx="10" ry="12" fill="#f9f1d3"/><circle cx="30" cy="28" r="4" fill="#253532"/><circle cx="53" cy="26" r="4" fill="#253532"/></svg><span id="supply">18</span><small>DRAG ME</small></button><div class="tools right"><span id="stars">☆☆☆</span><button id="retry">Restart</button></div></footer></main><div id="overlay" hidden><article><small id="eyebrow">GOO VALLEY</small><h2 id="title"></h2><div id="medals"></div><p id="message"></p><div class="actions"><button id="continue">Keep going</button><button id="again">Play again</button></div></article></div><dialog id="atlas"><div class="atlashead"><div><small>THE LONG WAY HOME</small><h2>A curious little world</h2></div><button id="close" aria-label="Close level selection">×</button></div><div id="grid"></div><button id="endless">Endless Valley</button></dialog><script>'use strict';
const LEVELS=[

{name:'Across the blue',base:[150,555],goal:[335,270],via:[],rocks:[],wind:10,theme:0},

{name:'The crooked bridge',base:[80,555],goal:[400,305],via:[[135,265]],rocks:[[205,365,80,195]],wind:-22,theme:1},
{name:'Between giants',base:[105,555],goal:[390,125],via:[[105,215],[275,175]],rocks:[[165,300,110,205],[320,230,85,115]],wind:18,theme:1},
{name:'Beyond the ledge',base:[100,555],goal:[395,210],via:[[110,245],[355,210]],rocks:[[185,325,80,180]],wind:-30,theme:2},
{name:'A very low ceiling',base:[85,550],goal:[405,425],via:[[110,510],[345,510]],rocks:[[205,150,95,305]],wind:5,theme:2},
{name:'The long way round',base:[240,565],goal:[90,120],via:[[380,430],[380,220],[150,205]],rocks:[[170,285,145,100]],wind:25,theme:2},
{name:'Ribbon road',base:[90,555],goal:[400,135],via:[[125,250],[400,240]],rocks:[[195,315,130,215]],wind:-35,theme:3},
{name:'Whistling peaks',base:[385,555],goal:[85,110],via:[[350,300],[240,215],[200,115]],rocks:[[180,365,105,195],[95,255,80,70]],wind:42,theme:3},

];
const THEMES=[{sky:['#e3e5b7','#8cbaae'],far:'#93b4a0',mid:'#638f84',rock:'#294f4a',moss:'#a4be82',goo:'#203d38',eye:'#f6edca',glow:'#fff1a3',name:'Meadow'}, {sky:['#efe1b5','#d3a684'],far:'#c5aa88',mid:'#9c8d77',rock:'#4c5550',moss:'#b8ad7d',goo:'#3e4741',eye:'#fff1cc',glow:'#ffe59a',name:'Amber'}, {sky:['#b6d2d2','#678ea3'],far:'#7da4af',mid:'#587e8b',rock:'#263f54',moss:'#8cb4ad',goo:'#293c50',eye:'#d9ecde',glow:'#b2f4df',name:'Moonwater'}, {sky:['#dacbd6','#aa9dba'],far:'#afa1bb',mid:'#807795',rock:'#3b4057',moss:'#b6b59b',goo:'#333950',eye:'#ecebcf',glow:'#f3d4b5',name:'Twilight'}];
function routeFor(l){let vertices=[l.base,...l.via,l.goal],route=[];for(let k=0;k<vertices.length-1;k++){let a=vertices[k],b=vertices[k+1],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),n=Math.ceil(len/43);for(let j=1;j<=n;j++){let t=j/n,side=route.length%2?1:-1,offset=j===n?0:20;route.push({x:a[0]+dx*t-dy/len*side*offset,y:a[1]+dy*t+dx/len*side*offset});}}return route;}
function makeLevel(i){let l=JSON.parse(JSON.stringify(LEVELS[i%12]));l.variant=i;if(i>=12&&Math.floor(i/12)%2){l.base[0]=480-l.base[0];l.goal[0]=480-l.goal[0];l.via=l.via.map(([x,y])=>[480-x,y]);l.rocks=l.rocks.map(([x,y,w,h])=>[480-x-w,y,w,h]);l.wind=-l.wind;}if(i>=12){l.name='Endless Valley '+(i-11);l.wind+=(i%2?1:-1)*Math.min(15,Math.floor(i/12)*3);l.theme=(i+Math.floor(i/12))%4;}l.route=routeFor(l);l.need=3;l.stock=l.route.length+6;l.gold=l.stock-[3,5,10,7,9,11,10,5,12,10,10,11][i%12];l.fireflies=l.route.filter((_,i)=>i%4===2).slice(0,4).map((p,i)=>({x:p.x+(i%2?12:-12),y:p.y-15,taken:false}));return l;}
function sceneBackground(l){const c=document.createElement('canvas');c.width=720;c.height=975;const g=c.getContext('2d');let t=THEMES[l.theme],gr=g.createLinearGradient(0,0,0,975);gr.addColorStop(0,t.sky[0]);gr.addColorStop(1,t.sky[1]);g.fillStyle=gr;g.fillRect(0,0,720,975);let seed=100+l.theme*117+(l.variant||0)*37;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};g.fillStyle=l.theme===2?'#d5e3ce80':'#fff0c169';g.beginPath();g.arc(l.theme%2?560:180,185,95,0,6.29);g.fill();for(let layer=0;layer<3;layer++){g.fillStyle=[t.far,t.mid,t.rock][layer];g.globalAlpha=[.45,.3,.1][layer];g.beginPath();g.moveTo(-20,975);for(let x=-20;x<=760;x+=35)g.lineTo(x,450+layer*130-Math.sin(x*.006+layer)*80-rand()*70);g.lineTo(760,975);g.fill();}g.globalAlpha=.14;g.fillStyle=t.rock;for(let i=0;i<18;i++){let x=i*46-20,y=655+rand()*70,hh=50+rand()*140;g.beginPath();g.moveTo(x,y-hh);g.lineTo(x-30,y);g.lineTo(x+30,y);g.fill();g.fillRect(x-3,y,6,50);}g.globalAlpha=1;for(let i=0;i<12000;i++){g.fillStyle=i%2?'#324a3910':'#ffffef12';g.fillRect(rand()*720,rand()*975,1+rand()*2,1);}return c;}
</script><script>'use strict';
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d'),MAX=140;let save={unlocked:0,stars:[],collected:0,checkpoint:null,sound:true};try{let d=JSON.parse(localStorage.getItem('goo-valley-v1'));if(d&&Number.isInteger(d.unlocked))save={...save,...d};}catch{}
let index=save.checkpoint?.index??save.unlocked,l,nodes=[],edges=[],stock=0,history=[],spent=0,flies=[],phase='play',paused=false,drag=null,ptr=null,hintPoint=null,background,particles=[],flow=[],collected=0,flowTimer=0,time=0,playtime=0,toastTime=0,shake=0,pipeNode=null,path=[],nextUID=1,w=480,h=650,sx=1,sy=1,unit=1,last=0,acc=0,AC;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),node=id=>nodes.find(n=>n.id===id);
function tone(f=300,d=.15,type='triangle',vol=.04){if(!save.sound)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume();let o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f*.7,AC.currentTime+d);g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch{}}
function snapshot(){return JSON.parse(JSON.stringify({nodes,edges,stock,spent,flies,nextUID,playtime}));}
function persist(){try{if(phase==='play')save.checkpoint={index,...snapshot(),history};else if(phase==='win')save.checkpoint=null;localStorage.setItem('goo-valley-v1',JSON.stringify(save));}catch{}}
function restore(s){nodes=s.nodes;edges=s.edges;stock=s.stock;spent=s.spent;flies=s.flies;nextUID=s.nextUID;playtime=s.playtime||0;}
function begin(i,recovery=null){index=i;l=makeLevel(i);phase='play';paused=false;drag=ptr=null;time=0;playtime=0;particles=[];flow=[];collected=0;flowTimer=0;pipeNode=null;path=[];hintPoint=null;nextUID=1;history=[];spent=0;stock=l.stock;flies=JSON.parse(JSON.stringify(l.fireflies));nodes=l.base.map?[-32,32].map(dx=>({id:nextUID++,x:l.base[0]+dx,y:l.base[1],px:l.base[0]+dx,py:l.base[1],fixed:true,r:16,seed:Math.random()*20})):[];edges=[{a:1,b:2,len:64}];if(recovery){restore(recovery);history=recovery.history||[];}background=sceneBackground(l);$('overlay').hidden=true;$('atlas').close();$('tip').textContent=index===0?'Drag a ball. Stretch toward the pipe.':'Two friends make a strong connection.';$('tip').style.opacity=spent?0:1;update();persist();}
function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;toastTime=2.6;}
function burst(x,y,n=14,color=THEMES[l.theme].glow){for(let i=0;i<n&&particles.length<250;i++)particles.push({x,y,vx:rnd(-70,70),vy:rnd(-100,0),life:rnd(.5,1.3),r:rnd(2,5),color});}
function segmentBlocked(a,b){return l.rocks.some(([x,y,rw,rh])=>{let t0=0,t1=1,dx=b.x-a.x,dy=b.y-a.y;const p=[-dx,dx,-dy,dy],q=[a.x-x,x+rw-a.x,a.y-y,y+rh-a.y];for(let i=0;i<4;i++){if(Math.abs(p[i])<1e-8){if(q[i]<0)return false;}else{let r=q[i]/p[i];if(p[i]<0)t0=Math.max(t0,r);else t1=Math.min(t1,r);if(t0>t1)return false;}}return true;});}
function valid(p){if(p.x<18||p.x>462||p.y<40||p.y>l.base[1]+7)return {ok:false,reason:'Build above the ground',near:[]};if(l.rocks.some(([x,y,rw,rh])=>p.x>x-10&&p.x<x+rw+10&&p.y>y-10&&p.y<y+rh+10))return {ok:false,reason:'Go around the rock',near:[]};if(nodes.some(n=>dist(p,n)<28))return {ok:false,reason:'Give them a little space',near:[]};let near=nodes.filter(n=>dist(p,n)<=MAX&&!segmentBlocked(p,n)).sort((a,b)=>dist(p,a)-dist(p,b)).slice(0,3);if(near.length<2)return {ok:false,reason:'Move closer to two friends',near};let area=Math.abs((near[1].x-near[0].x)*(p.y-near[0].y)-(near[1].y-near[0].y)*(p.x-near[0].x));if(area<150)return {ok:false,reason:'A triangle is stronger',near};return {ok:true,near};}
function place(p){if(phase!=='play'||paused)return false;if(stock<=l.need){toast('Save '+l.need+' for the pipe · use Undo');tone(100,.1);return false;}let v=valid(p);if(!v.ok){toast(v.reason);tone(120,.08);return false;}history.push(snapshot());if(history.length>50)history.shift();let n={id:nextUID++,x:p.x,y:p.y,px:p.x,py:p.y,fixed:false,r:14,seed:Math.random()*20,pop:.5};nodes.push(n);for(let other of v.near)edges.push({a:n.id,b:other.id,len:dist(n,other)});stock--;spent++;hintPoint=null;burst(n.x,n.y);tone(250+spent*15,.1,'sine');for(let f of flies)if(!f.taken&&dist(f,n)<43){f.taken=true;stock++;burst(f.x,f.y,25);tone(880,.18);toast('A little light · +1 goo');}if(navigator.vibrate)try{navigator.vibrate(10);}catch{};$('tip').style.opacity=0;update();persist();checkPipe();return true;}
function undo(){if(paused||phase!=='play'||!history.length)return;restore(history.pop());hintPoint=null;burst(nodes.at(-1).x,nodes.at(-1).y,8);tone(180,.09);update();persist();}
$('undo').onclick=undo;$('retry').onclick=()=>{begin(index);tone(200,.12);};$('sound').onclick=()=>{save.sound=!save.sound;update();persist();tone();};
function hint(){if(paused||phase!=='play')return;let points=l.route.filter(p=>valid(p).ok).sort((a,b)=>Math.hypot(a.x-l.goal[0],a.y-l.goal[1])-Math.hypot(b.x-l.goal[0],b.y-l.goal[1]));hintPoint=points[0]||null;if(hintPoint)toast('Try this spot');else toast('Undo a step to open a new route');tone(550,.15);}
$('hint').onclick=hint;
function update(){ $('name').textContent=(index<12?String(index+1).padStart(2,'0')+' · ':'')+l.name;$('goal').textContent=phase==='flow'?collected+' collected':'Save '+l.gold+' for ★★★';$('supply').textContent=stock;$('goo').disabled=paused||phase!=='play'||stock<=l.need;$('undo').disabled=paused||phase!=='play'||!history.length;$('hint').disabled=paused||phase!=='play';$('stars').textContent='★'.repeat(save.stars[index]||0)+'☆'.repeat(3-(save.stars[index]||0));$('sound').style.opacity=save.sound?1:.5;$('wind').textContent=Math.abs(l.wind)>15?(l.wind>0?'→':'←')+'  Windy skies':'';}
function getPoint(e){let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/sx,y:(e.clientY-r.top)/sy};}
function start(e){if(paused||phase!=='play')return;e.preventDefault();if(stock<=l.need){toast('Keep '+l.need+' goo for the pipe');return;}tone(140,.035,'sine',.02);let p=getPoint(e);ptr=e.pointerId;drag={...p};try{e.currentTarget.setPointerCapture(e.pointerId);}catch{}}
$('goo').onpointerdown=start;canvas.onpointerdown=start;window.addEventListener('pointermove',e=>{if(ptr!==e.pointerId||!drag)return;e.preventDefault();drag=getPoint(e);},{passive:false});window.addEventListener('pointerup',e=>{if(ptr!==e.pointerId||!drag)return;let p=getPoint(e);drag=null;ptr=null;let r=canvas.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)place(p);});window.addEventListener('pointercancel',()=>{drag=null;ptr=null;});
function pause(v){paused=v;drag=ptr=null;update();if(v){$('eyebrow').textContent='GOO VALLEY';$('title').textContent='A little breather.';$('medals').textContent='';$('message').textContent='Your wobbly little world will wait.';$('continue').textContent='Keep building';$('again').textContent='Restart';$('overlay').hidden=false;}else $('overlay').hidden=true;persist();}
$('pause').onclick=()=>{if(phase!=='win')pause(true);};$('continue').onclick=()=>{if(phase==='win')begin(index+1);else pause(false);};$('again').onclick=()=>begin(index);document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase!=='win')pause(true);});
$('levels').onclick=()=>{paused=true;drag=ptr=null;update();$('grid').innerHTML=LEVELS.map((r,i)=>`<button data-level="${i}" ${i>save.unlocked?'disabled':''}><strong>${i>save.unlocked?'⌑':String(i+1).padStart(2,'0')}</strong><span>${r.name}</span><small>${'★'.repeat(save.stars[i]||0)}${'☆'.repeat(3-(save.stars[i]||0))}</small></button>`).join('');$('grid').querySelectorAll('button').forEach(b=>b.onclick=()=>begin(+b.dataset.level));$('endless').disabled=save.unlocked<12;$('endless').textContent=save.unlocked>=12?'Endless Valley · Keep exploring':'Finish the journey to unlock Endless Valley';$('atlas').showModal();};$('close').onclick=()=>{$('atlas').close();paused=false;update();};$('atlas').onclose=()=>{paused=false;update();};$('endless').onclick=()=>begin(Math.max(12,save.unlocked));
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('atlas').open&&phase!=='win'){pause(!paused);return;}if(paused||phase!=='play')return;if(e.key.toLowerCase()==='z')undo();if(e.key.toLowerCase()==='h')hint();if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();drag=drag||hintPoint||{x:l.base[0],y:l.base[1]-60};drag={x:drag.x+(e.key==='ArrowLeft'?-10:e.key==='ArrowRight'?10:0),y:drag.y+(e.key==='ArrowUp'?-10:e.key==='ArrowDown'?10:0)};}if(e.key===' '&&drag){e.preventDefault();let p=drag;drag=null;place(p);}});
function checkPipe(){if(phase!=='play')return;let target={x:l.goal[0],y:l.goal[1]},n=nodes.find(n=>!n.fixed&&dist(n,target)<37&&!segmentBlocked(n,target));if(!n||stock<l.need)return;phase='flow';pipeNode=n.id;n.fixed=true;let queue=[nodes[0].id],prev=new Map([[nodes[0].id,null]]);while(queue.length){let id=queue.shift();if(id===n.id)break;for(let e of edges){let next=e.a===id?e.b:e.b===id?e.a:null;if(next&&!prev.has(next)){prev.set(next,id);queue.push(next);}}}path=[];let id=n.id;while(id!==null&&id!==undefined){path.unshift(id);id=prev.get(id);}flowTimer=0;burst(n.x,n.y,35);tone(600,.35);toast('Everybody in!');update();}
function win(){phase='win';let stars=collected>=l.gold?3:collected>=Math.max(l.need,l.gold-3)?2:1;save.stars[index]=Math.max(stars,save.stars[index]||0);save.unlocked=Math.max(save.unlocked,index+1);save.collected+=collected;persist();$('eyebrow').textContent=index>=12?'ENDLESS VALLEY':'THE LONG WAY HOME';$('title').textContent=['What a little marvel!','A lovely bit of teamwork.','You did the impossible.'][Math.min(2,stars-1)];$('medals').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);$('message').textContent=collected+' goo saved · '+spent+' used'+(index===11?'\nEndless Valley is now open.':'');$('continue').textContent=index===11?'Explore forever':'Next valley';$('again').textContent='Try for more';$('overlay').hidden=false;update();for(let i=0;i<3;i++)setTimeout(()=>tone([440,550,660][i],.3),i*130);if(navigator.vibrate)try{navigator.vibrate([15,35,20]);}catch{};}
function physics(dt){const lookup=new Map(nodes.map(n=>[n.id,n]));for(let n of nodes){n.pop=Math.max(0,(n.pop||0)-dt);if(n.fixed)continue;let vx=(n.x-n.px)*.982,vy=(n.y-n.py)*.982;n.px=n.x;n.py=n.y;n.x+=vx+(l.wind*(1+.35*Math.sin(time*.8+n.y*.02)))*dt*dt;n.y+=vy+85*dt*dt;}
for(let k=0;k<18;k++){for(let e of edges){let a=lookup.get(e.a),b=lookup.get(e.b),dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,wa=a.fixed?0:1,wb=b.fixed?0:1,sum=wa+wb;if(!sum)continue;let f=(d-e.len)/d*.92/sum;if(wa){a.x+=dx*f*wa;a.y+=dy*f*wa;}if(wb){b.x-=dx*f*wb;b.y-=dy*f*wb;}}
for(let n of nodes){if(n.fixed)continue;n.x=clamp(n.x,14,466);n.y=clamp(n.y,34,615);if(n.x>l.base[0]-82&&n.x<l.base[0]+82&&n.y>l.base[1]+3)n.y=l.base[1]+3;for(let [x,y,rw,rh] of l.rocks){if(n.x>x-12&&n.x<x+rw+12&&n.y>y-12&&n.y<y+rh+12){let candidates=[{d:n.x-x+12,x:x-12,y:n.y},{d:x+rw+12-n.x,x:x+rw+12,y:n.y},{d:n.y-y+12,x:n.x,y:y-12},{d:y+rh+12-n.y,x:n.x,y:y+rh+12}].sort((a,b)=>a.d-b.d);n.x=candidates[0].x;n.y=candidates[0].y;}}}}
}
function step(dt){time+=dt;if(phase==='play')playtime+=dt;toastTime-=dt;if(toastTime<0)$('toast').style.opacity=0;shake=Math.max(0,shake-dt*10);if(phase!=='win')physics(dt);if(phase==='play')checkPipe();if(phase==='flow'){flowTimer+=dt;if(flowTimer>.22&&stock>0){flowTimer=0;stock--;flow.push({t:0,seed:Math.random()*10});tone(320+(stock%5)*75,.06,'sine',.018);update();}for(let f of flow){f.t+=dt*1.5;if(f.t>=path.length){f.done=true;collected++;burst(l.goal[0],l.goal[1],6);tone(900,.06,'sine',.015);update();}}flow=flow.filter(f=>!f.done);if(stock===0&&flow.length===0)win();}for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=70*dt;}particles=particles.filter(p=>p.life>0);}
function resize(){let r=canvas.getBoundingClientRect();w=r.width;h=r.height;sx=w/480;sy=h/650;unit=Math.sqrt(sx*sy);let d=Math.min(devicePixelRatio||1,1.7);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);}new ResizeObserver(resize).observe(canvas);
function ball(x,y,r,seed=0,ghost=false){let t=THEMES[l.theme];x*=sx;y*=sy;r*=unit;let look=drag?Math.atan2(drag.y-y/sy,drag.x-x/sx):-1.3,blink=Math.sin(time*1.9+seed)> .992,stretch=1+Math.sin(time*3+seed)*.035;ctx.save();ctx.translate(x,y);ctx.scale(stretch,1/stretch);ctx.fillStyle=ghost?t.goo+'c0':t.goo;ctx.beginPath();ctx.moveTo(-r,0);ctx.bezierCurveTo(-r*1.1,-r*.7,-r*.5,-r*1.1,0,-r);ctx.bezierCurveTo(r*.9,-r*1.1,r*1.12,-r*.2,r*.9,r*.5);ctx.bezierCurveTo(r*.6,r*1.14,-r*.85,r*1.1,-r,0);ctx.fill();ctx.fillStyle=t.eye;for(let ex of [-.38,.34]){ctx.beginPath();ctx.ellipse(ex*r,-r*.25,r*.33,blink?r*.08:r*.42,ex*.3,0,6.29);ctx.fill();if(!blink){ctx.fillStyle=t.goo;ctx.beginPath();ctx.arc(ex*r+Math.cos(look)*r*.08,-r*.2+Math.sin(look)*r*.08,r*.145,0,6.29);ctx.fill();ctx.fillStyle=t.eye;}}ctx.fillStyle='#ffffff12';ctx.beginPath();ctx.ellipse(-r*.5,-r*.57,r*.22,r*.08,-.6,0,6.29);ctx.fill();ctx.restore();}
function line(a,b,color,width=4){ctx.strokeStyle=color;ctx.lineWidth=width*unit;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x*sx,a.y*sy);let bend=Math.sin(time*2+(a.id||0))*.8;ctx.quadraticCurveTo((a.x+b.x)/2*sx+bend,(a.y+b.y)/2*sy+bend,b.x*sx,b.y*sy);ctx.stroke();}
function terrain(){let t=THEMES[l.theme];ctx.save();ctx.scale(sx,sy);for(let [x,y,rw,rh] of l.rocks){ctx.fillStyle=t.rock;ctx.beginPath();ctx.moveTo(x,y+18);ctx.lineTo(x+12,y);ctx.lineTo(x+rw-13,y+7);ctx.lineTo(x+rw,y+rh*.3);ctx.lineTo(x+rw-3,y+rh);ctx.lineTo(x+9,y+rh-9);ctx.closePath();ctx.fill();ctx.fillStyle='#ffffff09';ctx.beginPath();ctx.moveTo(x+14,y+15);ctx.lineTo(x+rw*.47,y+31);ctx.lineTo(x+rw*.31,y+rh-14);ctx.lineTo(x+9,y+rh-9);ctx.fill();ctx.strokeStyle='#102d3020';ctx.lineWidth=3;for(let j=0;j<5;j++){ctx.beginPath();ctx.moveTo(x+rw*(j%3)*.3+8,y+rh*(j+1)/6);ctx.lineTo(x+rw*(j%3)*.3+25,y+rh*(j+1)/6+16);ctx.stroke();}ctx.fillStyle=t.moss;ctx.beginPath();ctx.moveTo(x+5,y+12);ctx.lineTo(x+14,y-3);ctx.lineTo(x+rw-13,y+3);ctx.lineTo(x+rw-3,y+13);ctx.closePath();ctx.fill();}
let bx=l.base[0],by=l.base[1]+18;ctx.fillStyle=t.rock;ctx.beginPath();ctx.moveTo(bx-83,by);ctx.lineTo(bx+84,by);ctx.lineTo(bx+70,by+42);ctx.lineTo(bx+50,by+90);ctx.lineTo(bx+22,650);ctx.lineTo(bx-72,650);ctx.lineTo(bx-80,by+50);ctx.closePath();ctx.fill();ctx.fillStyle='#ffffff09';ctx.beginPath();ctx.moveTo(bx-68,by+8);ctx.lineTo(bx-12,by+32);ctx.lineTo(bx-42,650);ctx.lineTo(bx-72,650);ctx.fill();ctx.fillStyle=t.moss;ctx.beginPath();ctx.ellipse(bx,by,85,9,0,0,6.29);ctx.fill();for(let i=0;i<34;i++){let x=bx-78+i*4.5;ctx.strokeStyle=i%2?'#d4dca1':t.moss;ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x,by-3);ctx.lineTo(x+Math.sin(time*.7+i)*2,by-8-(i%3)*3);ctx.stroke();}ctx.restore();}
function pipe(){let t=THEMES[l.theme],x=l.goal[0]*sx,y=l.goal[1]*sy,r=23*unit;ctx.save();ctx.strokeStyle=t.rock;ctx.lineWidth=26*unit;ctx.beginPath();ctx.moveTo(x,-30);ctx.lineTo(x,y-r*.9);ctx.stroke();ctx.strokeStyle='#ffffff0d';ctx.lineWidth=4*unit;ctx.beginPath();ctx.moveTo(x-6*unit,-20);ctx.lineTo(x-6*unit,y-r);ctx.stroke();for(let yy=35;yy<y-r;yy+=48*unit){ctx.strokeStyle='#172e354d';ctx.lineWidth=4*unit;ctx.beginPath();ctx.moveTo(x-13*unit,yy);ctx.lineTo(x+13*unit,yy);ctx.stroke();}ctx.fillStyle=t.rock;ctx.beginPath();ctx.ellipse(x,y,r*1.25,r*.53,0,0,6.29);ctx.fill();ctx.fillStyle='#0e2834';ctx.beginPath();ctx.ellipse(x,y,r,r*.35,0,0,6.29);ctx.fill();ctx.strokeStyle=t.moss;ctx.lineWidth=4*unit;ctx.beginPath();ctx.ellipse(x,y,r*1.21,r*.53,0,0,6.29);ctx.stroke();if(phase==='flow'){ctx.strokeStyle=t.glow;ctx.globalAlpha=.6;for(let i=0;i<3;i++){let rr=(time*2+i/3)%1;ctx.beginPath();ctx.ellipse(x,y+rr*35*unit,r*(1.2+rr),r*.5*(1+rr),0,0,6.29);ctx.stroke();}}else{ctx.textAlign='center';ctx.fillStyle=t.rock;ctx.font=`bold ${Math.max(11,12*unit)}px Georgia`;ctx.fillText(l.need+' ↓',x,y+34*unit);}ctx.restore();}
function draw(){ctx.clearRect(0,0,w,h);ctx.drawImage(background,0,0,w,h);let t=THEMES[l.theme];ctx.save();for(let i=0;i<4;i++){let x=((time*5*(i%2?1:-1)+i*130+480)%580-50)*sx,y=(110+i*45)*sy;ctx.fillStyle='#f5edd135';ctx.beginPath();ctx.ellipse(x,y,(30+i*5)*sx,8*sy,0,0,6.29);ctx.fill();}terrain();pipe();for(let f of flies){if(f.taken)continue;let x=(f.x+Math.sin(time*2+f.x)*4)*sx,y=(f.y+Math.cos(time*2+f.x)*4)*sy;let r=(6+Math.sin(time*3)*1.5)*unit,g=ctx.createRadialGradient(x,y,0,x,y,r*3);g.addColorStop(0,t.glow);g.addColorStop(.25,t.glow+'99');g.addColorStop(1,t.glow+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3,0,6.29);ctx.fill();}
for(let e of edges){let a=node(e.a),b=node(e.b),ratio=dist(a,b)/e.len;line(a,b,ratio>1.08?'#b6755b':t.goo,5);line(a,b,'#ffffff09',1.4);}for(let n of nodes)ball(n.x,n.y,n.r+(n.pop?Math.sin(n.pop/.5*Math.PI)*2:0),n.seed);
if(hintPoint&&phase==='play'){ctx.save();ctx.setLineDash([4*unit,6*unit]);let v=valid(hintPoint);for(let n of v.near)line(hintPoint,n,t.glow,2);ctx.strokeStyle=t.glow;ctx.lineWidth=2*unit;ctx.beginPath();ctx.arc(hintPoint.x*sx,hintPoint.y*sy,18*unit,0,6.29);ctx.stroke();ctx.restore();}
if(index===0&&spent===0&&!drag&&!hintPoint){let p=l.route[0];ctx.globalAlpha=.3+Math.sin(time*2)*.1;ctx.strokeStyle=t.goo;ctx.lineWidth=2*unit;ctx.setLineDash([3,5]);ctx.beginPath();ctx.arc(p.x*sx,p.y*sy,17*unit,0,6.29);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;}
if(drag){let v=valid(drag);ctx.save();ctx.setLineDash([5*unit,4*unit]);for(let n of v.near)line(drag,n,v.ok?t.glow:'#bb8070',3);ctx.restore();ball(drag.x,drag.y,19,time,true);ctx.strokeStyle=v.ok?t.glow:'#ba7663';ctx.lineWidth=2*unit;ctx.beginPath();ctx.arc(drag.x*sx,drag.y*sy,24*unit,0,6.29);ctx.stroke();}
for(let f of flow){let k=Math.floor(f.t),tween=f.t-k,a=node(path[Math.min(k,path.length-1)]),b=k+1<path.length?node(path[k+1]):{x:l.goal[0],y:l.goal[1]-15};if(a&&b)ball(a.x+(b.x-a.x)*tween,a.y+(b.y-a.y)*tween-3*Math.sin(tween*Math.PI),8,f.seed);}
for(let p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x*sx,p.y*sy,p.r*unit,0,6.29);ctx.fill();}ctx.restore();}
let rendered=0;function frame(ts){let dt=Math.min(.05,(ts-last)/1000);last=ts;if(!paused){acc+=dt;while(acc>=1/90){step(1/90);acc-=1/90;}}if(ts-rendered>30){draw();rendered=ts;}requestAnimationFrame(frame);}let recovery=save.checkpoint;begin(index,recovery);resize();requestAnimationFrame(frame);
window.__goo={state:()=>JSON.parse(JSON.stringify({index,l,nodes,edges,stock,spent,phase,paused,collected,flies,save,playtime,hintPoint})),advance:s=>{for(let i=0;i<s*90;i++)if(!paused)step(1/90);draw();},coords:p=>{let r=canvas.getBoundingClientRect();return {x:r.left+p.x*sx,y:r.top+p.y*sy};}};
