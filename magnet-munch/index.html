<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eae7ce"><title>Magnet Munch · Tiny things, big pull</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><div class="brand"><span>∩</span><div>MAGNET MUNCH<small>TINY THINGS. BIG PULL.</small></div></div><nav><button id="sound" aria-label="Toggle sound">♪</button><button id="collection" aria-label="Lost toy collection">✧</button><button id="menu" aria-label="Menu">☰</button></nav></header><div class="hud"><div class="power"><span class="stat-icon">ϟ</span><div><b id="power">PULL 1</b><small id="power-hint">SMALL STUFF</small><div class="meter"><i id="power-bar"></i></div></div></div><div class="cargo"><span class="stat-icon">▣</span><div><b id="cargo">0 / 14</b><small id="cargo-hint">CARGO</small><div class="meter"><i id="cargo-bar"></i></div></div></div><div class="coins"><span class="stat-icon">✦</span><b id="coins">0</b><small>COINS</small></div></div><div class="district-bar"><span id="district">TIN CAN TERRACE · 1</span><div class="clean-meter"><i id="clean-bar"></i></div><b id="clean">0%</b></div><section id="world-wrap"><canvas id="world" aria-label="Move your magnet around the miniature town. Collect loose objects and bring them to the green recycler."></canvas><div id="hero-tip">Drag anywhere to guide your magnet</div><div id="pickup-label"></div><div class="side-note"><span>NO RUSH.</span><small>JUST ONE MORE LITTLE THING.</small></div><div class="view-tools"><button id="zoom" aria-label="Zoom view">⌕</button><button id="fit" aria-label="Reset view">⌖</button></div></section><div id="celebration" aria-live="polite"></div><div id="toast" role="status"></div><footer><div class="gus-card"><canvas id="gus-icon" width="120" height="120" aria-hidden="true"></canvas><div><b id="gus-title">Gus is hungry.</b><small id="gus-line
