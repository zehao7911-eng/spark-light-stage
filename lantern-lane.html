<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#252841"><title>Lantern Lane · A little trail of light</title><link rel="stylesheet" href="lantern-lane.css"></head><body>
<canvas id="world" aria-hidden="true"></canvas><div class="shell"><header><div class="brand"><span>✦</span><div>LANTERN LANE<small>A LITTLE TRAIL OF LIGHT</small></div></div><button id="sound" aria-label="Toggle sound" aria-pressed="true">♪</button></header>
<div class="hud"><div><small>NIGHT</small><b id="level">01</b></div><div id="lights" aria-label="Lantern progress"></div><div class="stars" id="stars" aria-label="Stars on this route">☆ ☆ ☆</div></div><p id="tip">Draw one trail. Light every lantern.</p><div id="field" role="group" aria-label="Draw a route from the fox to the house. Retrace the last step to undo." tabindex="0"><div id="nodes"></div></div>
<footer><div class="tools"><button id="undo" aria-label="Undo last step">↩<small>UNDO</small></button><button id="hint" aria-label="Show the next useful step">✦<small>HINT</small></button><button id="reset" aria-label="Clear the trail">↶<small>RESET</small></button></div><button id="village"><span>⌂</span><div><small>YOUR LITTLE VILLAGE</small><b><span id="total">0</span> <i>★</i></b><div class="meter"><em id="meter"></em></div></div><span>↗</span></button></footer></div>
<div id="toast" role="status"></div><section id="win" hidden role="dialog" aria-modal="true" aria-labelledby="wintitle"><div class="winpanel"><small>A WARM WINDOW. A HAPPY FOX.</small><h1 id="wintitle">Let there be light.</h1><div id="winstars">★ ★ ★</div><p id="reward"></p><button id="next">ONE MORE NIGHT <span>→</span></button></div></section>
<section id="collection" hidden role="dialog" aria-modal="true" aria-labelledby="villageTitle"><div class="album"><button id="close" aria-label="Close village collection">×</button><small>SMALL WINS. A GLOWING WORLD.</small><h2 id="villageTitle">A place to call home.</h2><p id="albumtip">Earn stars. Bring the village to life.</p><div id="cards"></div></div></section>
<script src="lantern-lane-engine.js"></script><script src="lantern-lane-levels.js"></script><script src="lantern-lane.js"></script></body></html>
