<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082944"><title>BLUE HOUR - Scratch & Discover</title><meta name="description" content="A tactile little pixel scratch-ticket game. Reveal treasures, fill your shelf and improve your counter."><link rel="stylesheet" href="game.css"></head><body><header><div><h1>BLUE HOUR</h1><small>THE LITTLE COUNTER</small></div><div class="wallet"><span id="wallet">0</span> GOLD</div><button id="sound" class="square" aria-label="Mute sound">&#9834;</button><button id="help" class="square" aria-label="How to play">?</button></header><main><div class="ticketbar"><span id="pack-name">CORNER SHOP</span><span id="ticket-count">TICKET 01</span><span id="progress">0 / 6</span></div><p id="loading" role="status">Setting the counter...</p><div id="stage" hidden><canvas id="desk" width="1536" height="1024" aria-label="Blue scratch ticket on a wooden counter"></canvas><div id="targets"></div></div><div id="message" role="status">Drag across the white panels.</div><nav aria-label="Counter controls"><button id="next" class="primary" disabled>NEXT TICKET</button><button id="sweep" disabled>SWEEP</button><button id="shop">WORKSHOP</button><button id="album">COLLECTION</button><button id="phone">PHONE <span id="call-dot"></span></button></nav><p id="save-note">Saved on this device</p></main><dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close" class="square" aria-label="Close panel">&times;</button></div><div id="dialog-body"></div><div id="dialog-actions"></div></dialog><script src="rules.js"></script><script src="game.js"></script></body></html>
